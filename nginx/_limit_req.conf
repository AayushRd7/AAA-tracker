# Edge rate-limit zones (audit P1.10).
#
# HTTP-CONTEXT ONLY: limit_req_zone is valid in the `http` block and nowhere
# else, so this file cannot live in a server or location block. Every server
# level config (default.conf, nginx.prod.conf, nginx.dev.conf, nginx.nossl.conf)
# includes it at the top, next to the realip snippet — that include point IS the
# http context, because those files are loaded from /etc/nginx/conf.d/*.conf.
#
#   login    — brute-force guard for /backend/api/login. 60 requests/minute per
#              IP with burst 30: blocks a sustained script, but tolerates an
#              office / test run behind one NAT IP (the app additionally limits
#              to 5 failed attempts per IP+username per minute).
#   postback — coarse flood guard for /pb. 1000 requests/second per IP with
#              burst 500, so a normal high-volume ad-network egress IP is never
#              clipped while a flood still trips it.
# Applied by _site_locations.conf.
limit_req_zone $binary_remote_addr zone=login:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=postback:10m rate=1000r/s;
limit_req_status 429;
