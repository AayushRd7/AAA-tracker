# HTTP — serves directly without a redirect
server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /clickhouse/ {
        return 404;
    }

    location = /backend {
        return 301 /backend/;
    }

    location /backend/ {
        # Resolve the upstream through Docker's DNS on every request so a recreated
        # container (new IP) can never leave nginx proxying a stale address -- that is
        # what makes every /backend/ request return 502 while the container is healthy.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream "tracker_backend:8501";
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        # heavy analytics queries can exceed the 60s default
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /l/ {
        alias /var/www/landings/;
        index index.html index.php;

        location ~ ^/l/(.*)\.php$ {
            root /var/www;
            fastcgi_pass tracker_php:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/landings/$1.php;
            include fastcgi_params;
        }
    }

    # Bare host/IP: send visitors to the dashboard instead of a tracking 404.
    location = / {
        return 302 /backend/;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $frontend_upstream "tracker_frontend:8000";
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

# HTTPS — serves in parallel without a redirect
server {
    listen 443 ssl;
    server_name _;

    client_max_body_size 50M;

    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /clickhouse/ {
        return 404;
    }

    location = /backend {
        return 301 /backend/;
    }

    location /backend/ {
        # Resolve the upstream through Docker's DNS on every request so a recreated
