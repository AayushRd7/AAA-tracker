# ============================================================
# aaatracker.website — public marketing site + application routes
#
# Included from default.conf (http context). The site is static files served
# from /var/www/site; the application stays on /backend/ and the tracking
# endpoints stay proxied to the frontend exactly as on the default vhost.
#
# Both :80 and :443 serve the same content: the deployment sits behind a CDN /
# TLS terminator, and a redirect here would loop when the edge talks HTTP.
# ============================================================

server {
    listen 80;
    server_name aaatracker.website www.aaatracker.website;

    client_max_body_size 50M;

    include /var/www/nginx/_site_locations.conf;
}

server {
    listen 443 ssl;
    server_name aaatracker.website www.aaatracker.website;

    client_max_body_size 50M;

    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /var/www/nginx/_site_locations.conf;
}