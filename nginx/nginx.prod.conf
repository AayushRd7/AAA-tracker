# Real visitor IP when the request arrives through Cloudflare (see the snippet)
include /var/www/nginx/_realip_cloudflare.conf;

# HTTP: used for the HTTPS redirect and for Certbot
server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

#     location / {
#         return 301 https://$host$request_uri;
#     }


}

# HTTPS: main traffic
server {
    listen 443 ssl http2;
    server_name _;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /clickhouse/ {
        return 404;
    }

    location = /backend {
        return 301 /backend/;
    }

    location /backend/ {
        # Resolve the upstream through Docker's DNS on every request so a recreated
        # container (new IP) can never leave nginx proxying a stale address -- that is
        # what makes every /backend/ request return 502 while the container is healthy.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream "tracker_backend:8501";
        # Visitor location comes from Cloudflare's CF-* headers, which a direct
        # client must not be able to forge. $realip_remote_addr is the peer
        # *before* real_ip substitution, so it differs from $remote_addr exactly
        # when the request arrived from a trusted Cloudflare range; only then do
        # we copy the headers through. Otherwise nginx sends empty values.
        set $client_country "";
        set $client_region "";
        set $client_city "";
        if ($realip_remote_addr != $remote_addr) {
            set $client_country $http_cf_ipcountry;
            set $client_region  $http_cf_region;
            set $client_city    $http_cf_ipcity;
        }
        proxy_set_header CF-IPCountry $client_country;
        proxy_set_header CF-Region    $client_region;
        proxy_set_header CF-IPCity    $client_city;
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        # heavy analytics queries can exceed the 60s default
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /l/ {
        alias /var/www/landings/;
        index index.html index.php;

        location ~ ^/l/(.*)\.php$ {
            root /var/www;
            fastcgi_pass tracker_php:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/landings/$1.php;
            include fastcgi_params;
        }
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $frontend_upstream "tracker_frontend:8000";
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
# Include all .conf files from the per-domain folder
include /var/www/nginx/domains/*.conf;
# Public marketing site + application routes for the main domain
include /var/www/nginx/aaatracker.website.conf;
