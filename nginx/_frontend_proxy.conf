# What is sent to the frontend (tracking plane + the landings/editor API).
# Included inside a location block on the public site vhost.

resolver 127.0.0.11 valid=10s ipv6=off;
set $frontend_upstream "tracker_frontend:8000";
proxy_pass http://$frontend_upstream;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;

# A location that sets any add_header stops inheriting the server-level ones, so
# pull the baseline security headers in here for every proxied API/tracking path.
include /var/www/nginx/_security_headers.conf;