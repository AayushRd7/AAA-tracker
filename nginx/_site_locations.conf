# Shared locations for the public marketing site and the application routes.
# Included by the aaatracker.website server blocks (see aaatracker.website.conf).
#
# The dashboard is served from /backend/, but two parts of the product answer on
# ROOT paths of the same host:
#   * the tracking plane (click routing, postbacks, impressions, Click API), and
#   * the landings / landing-editor / domain API, which the dashboard fetches at
#     /landings, /landing/…, /landings_editor/… and /domain_update_ssl.
# Both are proxied to the frontend exactly as on the default vhost, so taking
# the root for the marketing site does not break them.

# ---- ACME / Let's Encrypt ----
location /.well-known/acme-challenge/ {
    root /var/www/certbot;
}

# ---- never expose the analytics store ----
location /clickhouse/ {
    return 404;
}

# ---- the application (dashboard) ----
location = /backend {
    return 301 /backend/;
}

location /backend/ {
    # Resolve the upstream through Docker's DNS on every request so a recreated
    # container (new IP) can never leave nginx proxying a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream "tracker_backend:8501";
    rewrite ^/backend/(.*)$ /$1 break;
    proxy_pass http://$backend_upstream;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # The product is not public content.
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# ---- landing pages served from disk ----
location /l/ {
    alias /var/www/landings/;
    index index.html index.php;

    location ~ ^/l/(.*)\.php$ {
        root /var/www;
        fastcgi_pass tracker_php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/landings/$1.php;
        include fastcgi_params;
    }
}

# ---- tracking plane: never crawled ----
location = /pb  { add_header X-Robots-Tag "noindex, nofollow" always; include /var/www/nginx/_frontend_proxy.conf; }
location /pb/   { add_header X-Robots-Tag "noindex, nofollow" always; include /var/www/nginx/_frontend_proxy.conf; }
location /i/    { add_header X-Robots-Tag "noindex, nofollow" always; include /var/www/nginx/_frontend_proxy.conf; }
location /p/    { add_header X-Robots-Tag "noindex, nofollow" always; include /var/www/nginx/_frontend_proxy.conf; }
location /c/    { add_header X-Robots-Tag "noindex, nofollow" always; include /var/www/nginx/_frontend_proxy.conf; }
location /t/    { add_header X-Robots-Tag "noindex, nofollow" always; include /var/www/nginx/_frontend_proxy.conf; }
location = /t.js { add_header X-Robots-Tag "noindex, nofollow" always; include /var/www/nginx/_frontend_proxy.conf; }
location = /optout { add_header X-Robots-Tag "noindex, nofollow" always; include /var/www/nginx/_frontend_proxy.conf; }
location /click-api/ { add_header X-Robots-Tag "noindex, nofollow" always; include /var/www/nginx/_frontend_proxy.conf; }
location /simulate/ { add_header X-Robots-Tag "noindex, nofollow" always; include /var/www/nginx/_frontend_proxy.conf; }
location /meta-capi/ { add_header X-Robots-Tag "noindex, nofollow" always; include /var/www/nginx/_frontend_proxy.conf; }
location = /__hide_referrer { add_header X-Robots-Tag "noindex, nofollow" always; include /var/www/nginx/_frontend_proxy.conf; }

# ---- landings & landing-editor API (called by the dashboard) ----
location = /landings { add_header X-Robots-Tag "noindex, nofollow" always; include /var/www/nginx/_frontend_proxy.conf; }
location = /landing { add_header X-Robots-Tag "noindex, nofollow" always; include /var/www/nginx/_frontend_proxy.conf; }
location /landing/ { add_header X-Robots-Tag "noindex, nofollow" always; include /var/www/nginx/_frontend_proxy.conf; }
location /landings_editor/ { add_header X-Robots-Tag "noindex, nofollow" always; include /var/www/nginx/_frontend_proxy.conf; }

# ---- domain helpers (dashboard + the per-domain SSL flow) ----
location = /domain_ping { include /var/www/nginx/_frontend_proxy.conf; }
location = /domain_update_ssl { add_header X-Robots-Tag "noindex, nofollow" always; include /var/www/nginx/_frontend_proxy.conf; }

# ---- static assets (cacheable) ----
location /assets/ {
    root /var/www/site;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff" always;
}

# ---- SEO files ----
location = /robots.txt {
    root /var/www/site;
    add_header Cache-Control "public, max-age=3600";
}
location = /sitemap.xml {
    root /var/www/site;
    add_header Cache-Control "public, max-age=3600";
    types { } default_type application/xml;
}
location = /site.webmanifest {
    root /var/www/site;
    types { } default_type application/manifest+json;
}

# ---- marketing pages (clean URLs: /features -> features.html) ----
location = / {
    root /var/www/site;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    try_files /index.html =404;
}

location / {
    root /var/www/site;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri.html $uri/index.html =404;
}

error_page 404 /404.html;
location = /404.html {
    internal;
    root /var/www/site;
}