# Baseline security response headers (audit P1.10).
#
# Included at server level on every vhost and — because a location that declares
# any add_header stops inheriting the server-level ones — also inside the few
# locations that set their own (dashboard, login, marketing pages, proxied API
# paths). Including it in a location replaces the inherited set rather than
# duplicating it, so at most one of each header is ever sent.
#
# HSTS lives here (not inline on the 443 blocks) so it is still emitted on
# locations that set their own add_header — which would otherwise suppress a
# server-level HSTS. A browser ignores HSTS over plain HTTP, so the :80 vhosts
# sending it too is harmless.
#
# The CSP keeps 'unsafe-inline'/'unsafe-eval' and cdn.jsdelivr.net on purpose:
# the SPA ships inline scripts/handlers and loads assets from jsdelivr. Tighten
# it only after checking the dashboard console for CSP violations — this is the
# header most likely to need tuning.
#
# connect-src includes jsdelivr for the same reason the other directives do.
# With DevTools open the browser also fetches the *.map source maps that the
# CDN's bundles point at, and those are XHRs — so `connect-src 'self'` blocked
# four of them and filled the console with violations. This is not a new trust
# boundary: script-src already lets jsdelivr execute arbitrary script in this
# origin, which makes what it may fetch moot. It is the CDN dependency itself
# that is worth removing — vendoring the SPA's libraries under the theme would
# let every one of these directives drop back to 'self'.
#
# cloudflareinsights.com is Cloudflare's own Web Analytics (RUM). The edge
# injects beacon.min.js into HTML responses when Web Analytics is on, so the
# beacon is a first-party-ish asset of the proxy we already sit behind; the
# script tag needs script-src and the beacon's XHR needs connect-src. Without
# these the console logs two CSP violations per page view.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://cdn.jsdelivr.net https://cloudflareinsights.com; frame-src 'self' https:; font-src 'self' data: https://cdn.jsdelivr.net" always;
