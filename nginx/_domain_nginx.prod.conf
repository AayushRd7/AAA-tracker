# HTTP: used for the HTTPS redirect and for Certbot
server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: main traffic
server {
    listen 443 ssl http2;
    server_name _;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # Baseline TLS parameters. OCSP stapling needs a valid chain plus a reachable
    # responder and can break a fresh cert at renewal time, so it is left off.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /var/www/nginx/_security_headers.conf;
    include /var/www/nginx/_login_location.conf;

    location /clickhouse/ {
        return 404;
    }

    location = /backend {
        return 301 /backend/;
    }

    location /backend/ {
        # Resolve the upstream through Docker's DNS on every request so a recreated
        # container (new IP) can never leave nginx proxying a stale address -- that is
        # what makes every /backend/ request return 502 while the container is healthy.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream "tracker_backend:8501";
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        # heavy analytics queries can exceed the 60s default
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /l/ {
        alias /var/www/landings/;
        index index.html index.php;

        location ~ ^/l/(.*)\.php$ {
            root /var/www;
            fastcgi_pass tracker_php:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/landings/$1.php;
            include fastcgi_params;
        }
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $frontend_upstream "tracker_frontend:8000";
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
# must not be enabled - this file is used as a copy template !!! include /var/www/nginx/domains/*.conf;