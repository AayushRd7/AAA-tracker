# Dedicated, exactly-matching location for the dashboard login endpoint so the
# edge can rate-limit it (audit P1.10) WITHOUT throttling the rest of the
# dashboard API, which stays on the prefix location /backend/.
#
# `location = /backend/api/login` wins over /backend/ by exact-match precedence.
# The proxy body mirrors the /backend/ block (Docker DNS resolution + the
# Cloudflare visitor headers) so login behaviour and audit IPs are unchanged.
#
# Included at server context by default.conf, nginx.prod.conf, nginx.dev.conf,
# nginx.nossl.conf and _site_locations.conf.
location = /backend/api/login {
    limit_req zone=login burst=30 nodelay;

    include /var/www/nginx/_security_headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream "tracker_backend:8501";
    # Copy Cloudflare's CF-* headers only when the peer really is a trusted
    # Cloudflare address (see _realip_cloudflare.conf), so a direct client
    # cannot forge them.
    set $client_country "";
    set $client_region "";
    set $client_city "";
    if ($realip_remote_addr != $remote_addr) {
        set $client_country $http_cf_ipcountry;
        set $client_region  $http_cf_region;
        set $client_city    $http_cf_ipcity;
    }
    proxy_set_header CF-IPCountry $client_country;
    proxy_set_header CF-Region    $client_region;
    proxy_set_header CF-IPCity    $client_city;
    rewrite ^/backend/(.*)$ /$1 break;
    proxy_pass http://$backend_upstream;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
}
