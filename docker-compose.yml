services:
  docker-socket-proxy:
    image: wollomatic/socket-proxy:1
    container_name: tracker_socket_proxy
    restart: always
    # run as nobody + host docker group so the socket is reachable but the
    # process is not root inside the container
    user: "65534:991"
    environment:
      # wollomatic/socket-proxy uses SP_* env vars; allowlists are regexes per HTTP method.
      # Minimum for `docker exec <container> nginx -s reload`:
      #   GET  /_ping (CLI handshake), /version (API negotiation),
      #        /containers/... (inspect), /exec/<id>/json (exit code)
      #   POST /containers/<name>/exec (create), /exec/<id>/start|resize
      # Everything else (containers create/start/stop/delete, images, build,
      # volumes, networks, swarm...) stays denied by default.
      - SP_LISTENIP=0.0.0.0
      - 'SP_ALLOW_GET=/(_ping|version)|/v1\..{1,2}/(version|containers/.+|exec/.+/json)'
      - 'SP_ALLOW_POST=/v1\..{1,2}/(containers/.+/exec|exec/.+/(start|resize))'
      # only the frontend container (by hostname) may connect — this image has
      # no password auth; hostname + IP allowlist is its access control
      - SP_ALLOWFROM=frontend
      - SP_LOGLEVEL=info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:15
    container_name: tracker_postgres
    restart: always
    env_file: .env
    # host port binding removed: DBs are reached via the internal docker network only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: tracker_clickhouse
    restart: always
    # host port binding removed: DBs are reached via the internal docker network only
    env_file: .env
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.xml:ro
      - ./clickhouse/clickhouse-users.xml:/etc/clickhouse-server/users.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 3s
      retries: 60

  frontend:
    build:
      context: ./frontend
    container_name: tracker_frontend
    restart: always
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    env_file: .env
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes:
      - ./frontend:/app
      - ./certbot-var:/var/www/certbot
      - ./letsencrypt:/etc/letsencrypt
      - ./nginx:/var/www/nginx
    command: [
      "uvicorn",
      "app:app",
      "--host", "0.0.0.0",
      "--port", "8000",
      "--reload"
    ]

  backend:
    build:
      context: ./backend
    container_name: tracker_backend
    restart: always
    expose:
      - "8501"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./backend:/app
      - ./certbot-var:/var/www/certbot
      - ./letsencrypt:/etc/letsencrypt
      - ./nginx:/var/www/nginx
    command: [
      "uvicorn",
      "app:app",
      "--host", "0.0.0.0",
      "--port", "8501",
      "--reload"
    ]

  php:
    image: php:8.1-fpm
    container_name: tracker_php
    restart: always
    expose:
      - "9000"
    volumes:
      - ./frontend/landings:/var/www/landings

  nginx:
    build:
      context: ./nginx
    container_name: tracker_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl
      - ./certbot-var:/var/www/certbot
      - ./letsencrypt:/etc/letsencrypt
      - ./frontend/landings:/var/www/landings
      - ./nginx:/var/www/nginx
    depends_on:
      - frontend
      - backend
      - php
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
    name: aaa-tracker_postgres_data
  clickhouse_data:
    name: aaa-tracker_clickhouse_data
