# Production overrides — run with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Dev defaults (uvicorn --reload, no memory caps) stay untouched in docker-compose.yml.
services:
  frontend:
    command: [
      "uvicorn",
      "app:app",
      "--host", "0.0.0.0",
      "--port", "8000",
      "--workers", "2"
    ]

  backend:
    command: [
      "uvicorn",
      "app:app",
      "--host", "0.0.0.0",
      "--port", "8501",
      "--workers", "2"
    ]

  clickhouse:
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 4g
