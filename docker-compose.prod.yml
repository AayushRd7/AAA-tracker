# Production overrides — run with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Dev defaults (uvicorn --reload, no memory caps) stay untouched in docker-compose.yml.
services:
  frontend:
    command: [
      "uvicorn",
      "app:app",
      "--host", "0.0.0.0",
      "--port", "8000",
      "--workers", "2"
    ]

  backend:
    command: [
      "uvicorn",
      "app:app",
      "--host", "0.0.0.0",
      "--port", "8501",
      "--workers", "2",
      # honor X-Forwarded-For from the nginx proxy so rate-limit keys and
      # audit rows carry the real client IP
      "--proxy-headers", "--forwarded-allow-ips", "*"
    ]
    environment:
      # Ad-platform OAuth "Connect" apps (see .env.example): app credentials and
      # the token-encryption key come from the environment.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      SNAPCHAT_CLIENT_ID: ${SNAPCHAT_CLIENT_ID:-}
      SNAPCHAT_CLIENT_SECRET: ${SNAPCHAT_CLIENT_SECRET:-}
      TIKTOK_APP_ID: ${TIKTOK_APP_ID:-}
      TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET:-}
      PINTEREST_APP_ID: ${PINTEREST_APP_ID:-}
      PINTEREST_APP_SECRET: ${PINTEREST_APP_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}

  clickhouse:
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 4g
