; Hardening for the PHP-FPM interpreter that evaluates tenant-supplied landing
; pages. Mounted read-only at /usr/local/etc/php/conf.d/zz-security.ini so it
; loads after the image defaults and overrides them.
;
; NOTE: open_basedir confines PHP to the landings root, but every tenant's
; landing lives under that same root, so a malicious landing script can still
; read sibling tenants' files until landing storage is tenant-prefixed.

open_basedir = /var/www/landings:/tmp

disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,curl_exec,curl_multi_exec,fsockopen,pfsockopen,socket_create,mail,putenv,ini_set,dl,symlink,link

expose_php = Off
allow_url_fopen = Off
allow_url_include = Off

memory_limit = 128M
max_execution_time = 30
max_input_time = 30
post_max_size = 8M
upload_max_filesize = 8M
