{% raw %}
<script type="text/x-template" id="copilot-template">
    <v-container fluid>
        <div class="d-flex align-center justify-space-between mb-4 flex-wrap">
            <div>
                <div class="page-title">Copilot</div>
                <div class="page-subtitle">Chat with your account's own numbers</div>
            </div>
            <v-chip v-if="status && status.configured" small outlined color="primary">
                <v-icon small left>mdi-robot-outline</v-icon>Ready
            </v-chip>
        </div>

        <v-alert v-if="status && !status.configured" type="info" dense outlined class="mb-4"
                 id="copilot-not-configured">
            <strong>Copilot is not available here.</strong>
            {{ status.message || 'Copilot is not configured for this deployment.' }}
            Ask an administrator to enable Copilot for this workspace.
        </v-alert>

        <v-card class="pa-4 mb-4" id="copilot-filters-card">
            <div class="filter-bar align-center">
                <v-menu v-model="dateMenu" :close-on-content-click="false" transition="scale-transition" offset-y min-width="auto">
                    <template v-slot:activator="{ on, attrs }">
                        <v-text-field
                                v-model="dateRangeText"
                                label="Window"
                                prepend-icon="mdi-calendar"
                                readonly
                                v-bind="attrs"
                                v-on="on"
                                outlined
                                dense
                                hide-details
                                class="range-field"
                        ></v-text-field>
                    </template>
                    <v-date-picker v-model="dateRange" range @input="dateMenu = false"></v-date-picker>
                </v-menu>
                <v-chip v-for="preset in datePresets" :key="preset.label"
                        small label outlined
                        :color="activePreset === preset.label ? 'primary' : 'grey'"
                        :class="activePreset === preset.label ? 'primary--text' : 'grey--text text--darken-2'"
                        class="mr-1"
                        @click="applyPreset(preset)">
                    {{ preset.label }}
                </v-chip>
            </div>
            <div class="caption grey--text mt-3">
                Copilot reads only aggregate metrics for the window you pick — totals and the leading
                campaigns. No visitor, click or contact data is ever sent.
            </div>
        </v-card>

        <v-card class="pa-4 mb-4" id="copilot-chat-card">
            <v-card-title class="d-flex align-center px-0">
                <v-icon color="primary" class="mr-2">mdi-comment-question-outline</v-icon>
                Chat
                <v-spacer></v-spacer>
                <v-btn text small :disabled="!history.length" @click="clearChat">
                    <v-icon small class="mr-1">mdi-broom</v-icon>Clear
                </v-btn>
            </v-card-title>
            <v-card-text class="px-0">
                <div class="copilot-chat-shell">
                    <div class="copilot-thread" id="copilot-thread" ref="thread">
                        <div v-if="!history.length" class="empty-state">
                            <v-icon>mdi-robot-outline</v-icon>
                            <div class="mt-2 mb-3">
                                Ask me about this account's numbers — or just say hello and I'll point
                                you the right way.
                            </div>
                            <div class="d-flex flex-wrap justify-center">
                                <v-chip v-for="s in suggestions" :key="s" small outlined class="ma-1"
                                        :disabled="!canRun" @click="useSuggestion(s)">{{ s }}</v-chip>
                            </div>
                        </div>
                        <div v-for="(m, i) in history" :key="i"
                             class="chat-row"
                             :class="m.role === 'user' ? 'chat-row-user' : 'chat-row-assistant'">
                            <div class="chat-bubble"
                                 :class="[m.role === 'user' ? 'chat-bubble-user' : 'chat-bubble-assistant',
                                          m.error ? 'chat-bubble-error' : '']">
                                <div v-for="(para, j) in paragraphs(m.text)" :key="j">{{ para }}</div>
                            </div>
                        </div>
                        <div v-if="askLoading" class="chat-row chat-row-assistant">
                            <div class="chat-bubble chat-bubble-assistant chat-thinking">
                                <div class="thinking-head">
                                    <v-icon small class="mr-1">mdi-robot-outline</v-icon>
                                    <span>Copilot is thinking<span class="thinking-dots"><i>.</i><i>.</i><i>.</i></span></span>
                                </div>
                                <div class="shimmer-line"></div>
                                <div class="shimmer-line short"></div>
                            </div>
                        </div>
                    </div>

                    <v-alert v-if="askError" type="warning" dense outlined class="mt-3" id="copilot-ask-error">
                        {{ askError }}
                    </v-alert>

                    <div class="copilot-composer mt-3" id="copilot-composer">
                        <v-textarea
                                v-model="question"
                                label="Your question"
                                placeholder="e.g. Which campaigns lost money this week, and by how much?"
                                outlined
                                dense
                                rows="1"
                                auto-grow
                                hide-details
                                :disabled="!canRun"
                                @keydown.enter.exact.prevent="askQuestion"
                                @keydown.ctrl.enter="askQuestion"
                        ></v-textarea>
                        <v-btn color="primary" elevation="0" class="ml-2" :loading="askLoading"
                               :disabled="!canRun || !question.trim()" @click="askQuestion">
                            <v-icon>mdi-send</v-icon>
                        </v-btn>
                    </div>
                    <div class="d-flex align-center mt-2 flex-wrap">
                        <div class="caption grey--text">
                            Enter to send · Shift+Enter for a new line · answers are not saved and vanish
                            when you leave the page.
                        </div>
                        <v-spacer></v-spacer>
                        <v-btn text small color="primary" :disabled="!canRun" @click="summariseAccount">
                            <v-icon small class="mr-1">mdi-text-box-search-outline</v-icon>Summarise my account
                        </v-btn>
                    </div>
                </div>
                <div class="copilot-ask-help caption grey--text mt-3">
                    <strong>Getting a good answer:</strong> the window above is already applied. Name the
                    metric you care about (ROAS, CPA, profit…) and how many campaigns you want ("top 5").
                    This view carries window totals and the leading campaigns — not yet breakdowns by day,
                    geo, device or source.
                </div>
            </v-card-text>
        </v-card>

        <v-card class="pa-4" id="copilot-card">
            <v-card-title class="d-flex align-center flex-wrap px-0">
                <v-icon color="primary" class="mr-2">mdi-text-box-search-outline</v-icon>
                Account summary
                <v-spacer></v-spacer>
                <v-btn color="primary" elevation="0" :loading="summaryLoading"
                       :disabled="!canRun" @click="summariseAccount">
                    <v-icon small class="mr-1">mdi-play</v-icon>Summarise my account
                </v-btn>
            </v-card-title>
            <v-card-text class="px-0">
                <div v-if="summaryLoading" class="caption grey--text">
                    Reading the account's numbers…
                </div>
                <v-alert v-else-if="summaryError" type="warning" dense outlined id="copilot-summary-error">
                    {{ summaryError }}
                </v-alert>
                <div v-else-if="summary" class="copilot-answer" id="copilot-summary-text">
                    <div v-for="(para, i) in paragraphs(summary)" :key="i">{{ para }}</div>
                </div>
                <div v-else class="empty-state">
                    <v-icon>mdi-robot-outline</v-icon>
                    <div class="mt-2">
                        Run a summary to get a short read on what stands out and what moved in this window.
                    </div>
                </div>

                <div v-if="snapshotTotals" class="mt-3">
                    <div class="caption grey--text mb-1">What Copilot saw</div>
                    <v-chip v-for="t in snapshotTiles" :key="t.label" small outlined class="mr-1 mb-1">
                        <span class="grey--text">{{ t.label }}</span>&nbsp;<strong>{{ t.value }}</strong>
                    </v-chip>
                </div>
            </v-card-text>
        </v-card>
    </v-container>
</script>

<script type="application/javascript">
    Vue.component('copilot-component', {
        template: '#copilot-template',
        data() {
            return {
                status: null,
                summary: '',
                summaryLoading: false,
                summaryError: '',
                snapshotTotals: null,
                windowInfo: null,
                question: '',
                askLoading: false,
                askError: '',
                history: [],
                suggestions: [
                    'What stood out this window?',
                    'Which campaigns made the most profit?',
                    'Which campaigns lost money?',
                    "What's my ROAS and CPA?",
                    'Compare spend and revenue by campaign',
                ],
                dateMenu: false,
                activePreset: 'Last 7 days',
                datePresets: [
                    { label: 'Today', days: 0 },
                    { label: 'Yesterday', days: 1 },
                    { label: 'Last 7 days', days: 6 },
                    { label: 'Last 30 days', days: 29 },
                ],
                dateRange: [
                    new Date(new Date().setDate(new Date().getDate() - 6)).toISOString().split('T')[0],
                    new Date().toISOString().split('T')[0]
                ],
            };
        },
        computed: {
            dateRangeText() {
                return this.dateRange.join(' ~ ');
            },
            canRun() {
                return !!(this.status && this.status.configured);
            },
            snapshotTiles() {
                const t = this.snapshotTotals || {};
                return [
                    { label: 'Visits', value: this.$fmtNum(Number(t.visits || 0)) },
                    { label: 'Clicks', value: this.$fmtNum(Number(t.clicks || 0)) },
                    { label: 'Conversions', value: this.$fmtNum(Number(t.conversions || 0)) },
                    { label: 'Cost', value: '$' + this.$fmtNum(Number(t.cost || 0), 'money') },
                    { label: 'Revenue', value: '$' + this.$fmtNum(Number(t.revenue || 0), 'money') },
                    { label: 'Profit', value: '$' + this.$fmtNum(Number(t.profit || 0), 'money') },
                    { label: 'ROAS', value: t.roas == null ? '—' : Number(t.roas).toFixed(2) + 'x' },
                ];
            },
        },
        mounted() {
            this.$vuetify.theme.dark = (document.documentElement.dataset.theme === 'dark');
            this.loadStatus();
            this.$root.$on('load-copilot', this.loadStatus);
        },
        beforeDestroy() {
            this.$root.$off('load-copilot', this.loadStatus);
        },
        methods: {
            loadStatus() {
                fetch('/backend/api/copilot/status', {credentials: 'include'})
                    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
                    .then(data => { this.status = data; })
                    .catch(() => { this.status = {configured: false, message: 'Copilot is not configured for this deployment.'}; });
            },
            windowPayload() {
                return {date_from: this.dateRange[0], date_to: this.dateRange[1]};
            },
            applyPreset(preset) {
                this.activePreset = preset.label;
                const to = new Date();
                let from = new Date();
                if (preset.label === 'Yesterday') {
                    from = new Date(to);
                    from.setDate(from.getDate() - 1);
                    to.setDate(to.getDate() - 1);
                } else if (preset.days > 0) {
                    from.setDate(from.getDate() - preset.days);
                }
                this.dateRange = [from.toISOString().split('T')[0], to.toISOString().split('T')[0]];
            },
            paragraphs(text) {
                return String(text || '').split(/\n+/).map(s => s.trim()).filter(Boolean);
            },
            scrollThread() {
                this.$nextTick(() => {
                    const el = this.$refs.thread;
                    if (el) el.scrollTop = el.scrollHeight;
                });
            },
            clearChat() {
                this.history = [];
                this.askError = '';
            },
            useSuggestion(text) {
                this.question = text;
                this.askQuestion();
            },
            post(url, body) {
                return fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify(body),
                }).then(async r => ({ok: r.ok, status: r.status,
                    data: await window.fetchJsonFromResponse(r).catch(e => ({detail: e.message}))}));
            },
            summariseAccount() {
                this.summaryLoading = true;
                this.summaryError = '';
                return this.post('/backend/api/copilot/summary', this.windowPayload())
                    .then(res => {
                        if (res.data && res.data.configured === false) {
                            this.status = {configured: false, message: res.data.message};
                            this.summaryError = res.data.message;
                            return;
                        }
                        if (!res.ok) throw new Error((res.data && res.data.detail) || 'HTTP ' + res.status);
                        if (res.data.error) { this.summaryError = res.data.error; return; }
                        this.summary = res.data.summary || '';
                        this.windowInfo = res.data.window || null;
                        this.snapshotTotals = (res.data.snapshot && res.data.snapshot.totals) || null;
                    })
                    .catch(err => {
                        this.summaryError = 'Could not run the summary: ' + sanitizeToastMessage(err.message);
                    })
                    .finally(() => { this.summaryLoading = false; });
            },
            askQuestion() {
                const q = this.question.trim();
                if (!q || !this.canRun || this.askLoading) return;
                // The thread so far gives a follow-up its context (bounded
                // server-side); error bubbles are left out of the model's view.
                const priorHistory = this.history
                    .filter(m => !m.error)
                    .slice(-6)
                    .map(m => ({role: m.role, text: m.text}));
                this.history.push({role: 'user', text: q});
                this.question = '';
                this.askLoading = true;
                this.askError = '';
                this.scrollThread();
                return this.post('/backend/api/copilot/ask',
                                 Object.assign({question: q, history: priorHistory}, this.windowPayload()))
                    .then(res => {
                        if (res.data && res.data.configured === false) {
                            this.status = {configured: false, message: res.data.message};
                            this.askError = res.data.message;
                            this.history.push({role: 'assistant', text: res.data.message, error: true});
                            return;
                        }
                        if (!res.ok) throw new Error((res.data && res.data.detail) || 'HTTP ' + res.status);
                        if (res.data.error) {
                            this.askError = res.data.error;
                            this.history.push({role: 'assistant', text: res.data.error, error: true});
                            return;
                        }
                        this.history.push({role: 'assistant', text: res.data.answer || ''});
                    })
                    .catch(err => {
                        const msg = 'Could not get an answer: ' + sanitizeToastMessage(err.message);
                        this.askError = msg;
                        this.history.push({role: 'assistant', text: msg, error: true});
                    })
                    .finally(() => { this.askLoading = false; this.scrollThread(); });
            },
        },
    });
</script>

<style>
    /* Keep the conversation readable: a bounded column so bubbles never span the
       whole viewport on a wide screen. */
    .copilot-chat-shell {
        max-width: 780px;
    }
    .copilot-thread {
        max-height: 46vh;
        overflow-y: auto;
        padding: 2px;
    }
    .chat-row {
        display: flex;
        margin-bottom: 0.5rem;
    }
    .chat-row-user {
        justify-content: flex-end;
    }
    .chat-row-assistant {
        justify-content: flex-start;
    }
    .chat-bubble {
        max-width: 86%;
        padding: 0.5rem 0.75rem;
        border-radius: 12px;
        white-space: pre-line;
        line-height: 1.5;
        animation: copilot-bubble-in 0.16s ease-out;
    }
    .chat-bubble > div + div {
        margin-top: 0.4rem;
    }
    .chat-bubble-user {
        background: rgba(25, 118, 210, 0.14);
        border-bottom-right-radius: 3px;
    }
    .chat-bubble-assistant {
        background: rgba(0, 0, 0, 0.05);
        border-bottom-left-radius: 3px;
    }
    .theme--dark .chat-bubble-assistant {
        background: rgba(255, 255, 255, 0.09);
    }
    .chat-bubble-error {
        background: rgba(255, 152, 0, 0.16);
    }
    @keyframes copilot-bubble-in {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
    }
    /* Thinking state: a labelled bubble with a shimmering placeholder, so the
       wait reads as work being done rather than an empty pause. */
    .chat-thinking {
        min-width: 190px;
    }
    .thinking-head {
        display: flex;
        align-items: center;
        font-weight: 600;
        opacity: 0.75;
    }
    .thinking-dots i {
        font-style: normal;
        opacity: 0.3;
        animation: copilot-dot 1.2s infinite both;
    }
    .thinking-dots i:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots i:nth-child(3) { animation-delay: 0.4s; }
    @keyframes copilot-dot {
        0%, 80%, 100% { opacity: 0.2; }
        40% { opacity: 0.95; }
    }
    .shimmer-line {
        height: 8px;
        margin-top: 8px;
        border-radius: 4px;
        background: linear-gradient(90deg,
            rgba(128, 128, 128, 0.16) 25%,
            rgba(128, 128, 128, 0.34) 37%,
            rgba(128, 128, 128, 0.16) 63%);
        background-size: 320px 100%;
        animation: copilot-shimmer 1.25s ease-in-out infinite;
    }
    .shimmer-line.short {
        width: 58%;
    }
    @keyframes copilot-shimmer {
        from { background-position: -160px 0; }
        to { background-position: 260px 0; }
    }
    .copilot-composer {
        display: flex;
        align-items: flex-start;
    }
    .copilot-answer {
        white-space: pre-line;
        line-height: 1.55;
    }
    .copilot-answer > div + div {
        margin-top: 0.4rem;
    }
</style>
{% endraw %}
