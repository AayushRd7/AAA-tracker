{% raw %}
<script type="text/x-template" id="logs-template">
    <v-container fluid>
        <div class="d-flex align-center justify-space-between mb-4 flex-wrap">
            <div>
                <div class="page-title">{{ pageTitleText }}</div>
                <div class="page-subtitle">{{ pageSubtitle }}</div>
            </div>
            <div class="d-flex align-center flex-wrap">
                <v-text-field
                        v-model="dateFrom"
                        label="From"
                        type="date"
                        outlined dense hide-details clearable
                        class="log-date-field mr-2"
                        @change="reload"
                ></v-text-field>
                <v-text-field
                        v-model="dateTo"
                        label="To"
                        type="date"
                        outlined dense hide-details clearable
                        class="log-date-field mr-2"
                        @change="reload"
                ></v-text-field>
                <v-btn color="primary" elevation="0" :loading="loading" @click="reload">
                    <v-icon small class="mr-1">mdi-refresh</v-icon>Refresh
                </v-btn>
            </div>
        </div>

        <v-card class="pa-4 mb-4">
            <div class="filter-bar align-center">
                <v-text-field
                        v-for="f in currentFilters"
                        :key="activeTab + '-' + f.key"
                        v-model="filterState[activeTab][f.key]"
                        :label="f.label"
                        outlined dense hide-details clearable
                        class="log-filter-sm"
                        @keyup.enter="reload"
                ></v-text-field>
                <v-btn color="primary" elevation="0" :loading="loading" @click="reload">
                    <v-icon small class="mr-1">mdi-magnify</v-icon>Search
                </v-btn>
                <v-select
                        :items="presets"
                        v-model="selectedPreset"
                        label="Preset"
                        item-text="name"
                        item-value="id"
                        outlined dense hide-details clearable
                        class="log-filter-sm ml-2"
                        @change="applyPreset"
                ></v-select>
                <v-btn text small color="primary" class="ml-1" @click="savePreset">
                    <v-icon small class="mr-1">mdi-content-save-outline</v-icon>Save filters
                </v-btn>
                <v-btn text small color="error" :disabled="!selectedPreset" @click="deletePreset">
                    <v-icon small>mdi-delete</v-icon>
                </v-btn>
            </div>
        </v-card>

        <div class="d-flex align-center justify-space-between mb-2">
            <div class="caption grey--text">{{ total }} record(s)</div>
            <div class="d-flex align-center">
                <v-menu offset-y left :close-on-content-click="false">
                    <template v-slot:activator="{ on, attrs }">
                        <v-btn text small color="primary" class="mr-2" v-bind="attrs" v-on="on">
                            <v-icon small class="mr-1">mdi-view-column-outline</v-icon>Columns
                        </v-btn>
                    </template>
                    <v-card class="pa-2 column-menu-card">
                        <div class="caption grey--text px-2 pt-1">Show columns</div>
                        <v-checkbox
                                v-for="h in currentHeadersAll"
                                :key="activeTab + '-col-' + h.value"
                                :input-value="isColumnVisible(h.value)"
                                @change="toggleColumn(h.value)"
                                :label="h.text"
                                dense hide-details
                                class="mt-0 column-menu-check"
                        ></v-checkbox>
                        <v-divider class="my-2"></v-divider>
                        <div class="caption grey--text px-2">Templates</div>
                        <div class="px-2 mt-1">
                            <v-btn small text color="primary" @click="saveColumnTemplate">
                                <v-icon small class="mr-1">mdi-content-save-outline</v-icon>Save as template
                            </v-btn>
                        </div>
                        <v-list dense class="py-0">
                            <v-list-item v-for="t in columnTemplates" :key="t.name" link
                                         @click="applyColumnTemplate(t)">
                                <v-list-item-title>{{ t.name }}</v-list-item-title>
                                <v-list-item-icon>
                                    <v-icon small @click.stop="deleteColumnTemplate(t)">mdi-delete</v-icon>
                                </v-list-item-icon>
                            </v-list-item>
                            <div v-if="!columnTemplates.length" class="caption grey--text px-2 py-1">
                                No saved templates
                            </div>
                        </v-list>
                        <v-divider class="my-2"></v-divider>
                        <div class="px-2">
                            <v-btn small text color="primary" @click="saveDefaultColumns">
                                <v-icon small class="mr-1">mdi-pin-outline</v-icon>Use as default
                            </v-btn>
                        </div>
                    </v-card>
                </v-menu>
                <v-btn text small color="primary" :disabled="!items.length" @click="exportCsv">
                    <v-icon small class="mr-1">mdi-download</v-icon>Export CSV
                </v-btn>
            </div>
        </div>

        <v-card>
            <v-data-table
                    :headers="currentHeaders"
                    :items="items"
                    dense
                    :server-items-length="total"
                    :page="page"
                    @update:page="onPage"
                    :items-per-page="pageSize"
                    :footer-props="{ 'items-per-page-options': [pageSize] }"
                    :loading="loading"
                    :item-class="logRowClass"
            >
                <template v-slot:item.result="{ item }">
                    <span class="status-chip" :class="resultChipClass(item.result)">{{ item.result }}</span>
                </template>
                <template v-slot:item.status="{ item }">
                    <span class="status-chip" :class="resultChipClass(item.status)">{{ item.status }}</span>
                </template>
                <!-- Wave 19A: workspace number formatting on numeric cells -->
                <template v-slot:item.payout="{ item }"><span>{{ $fmtNum(item.payout, 'money') }}</span></template>
                <template v-slot:item.revenue="{ item }"><span>{{ $fmtNum(item.revenue, 'money') }}</span></template>
                <template v-slot:item.cost="{ item }"><span>{{ $fmtNum(item.cost, 'money') }}</span></template>
                <template v-slot:item.updated_rows="{ item }"><span>{{ $fmtNum(item.updated_rows) }}</span></template>
                <template v-slot:item.attempts="{ item }"><span>{{ $fmtNum(item.attempts) }}</span></template>
                <template v-slot:item.flow_index="{ item }"><span>{{ $fmtNum(item.flow_index) }}</span></template>
                <!-- Long free-text cells (raw postback URL, CAPI response body)
                     are clipped to keep rows readable; the full value stays in
                     the title tooltip. -->
                <template v-slot:item.url="{ item }">
                    <span :title="item.url">{{ (item.url || '—').slice(0, 60) }}</span>
                </template>
                <template v-slot:item.response_snippet="{ item }">
                    <span :title="item.response_snippet">{{ (item.response_snippet || '—').slice(0, 48) }}</span>
                </template>
                <template v-slot:no-data>
                    <div class="empty-state">
                        <v-icon>mdi-inbox-outline</v-icon>
                        <div class="mt-2">No records in this range</div>
                    </div>
                </template>
            </v-data-table>
        </v-card>
    </v-container>
</script>

<script type="application/javascript">
    Vue.component('logs-component', {
        template: '#logs-template',
        props: {
            // Which log this page is pinned to. The six Logs sidebar entries
            // each render this one component with a fixed section, so the
            // query/filter/export code is shared, never duplicated.
            section: {type: String, default: 'logs-clicks'},
        },
        data() {
            return {
                activeTab: this.tabForSection(this.section),
                loading: false,
                items: [],
                total: 0,
                page: 1,
                pageSize: 50,
                dateFrom: '',
                dateTo: '',
                presets: [],
                selectedPreset: null,
                // Wave 19A: per-tab visible-column selection and saved templates
                selectedColumnsByTab: {},
                columnTemplates: [],
                tabs: [
                    {key: 'clicks', title: 'Clicks',
                     subtitle: 'Every click the tracker received, with country, device and status'},
                    {key: 'conversions', title: 'Conversions',
                     subtitle: 'Inbound conversion records and their payout and revenue'},
                    {key: 'postbacks', title: 'S2S postbacks',
                     subtitle: 'Inbound server-to-server postbacks, including rejections'},
                    {key: 'api-postbacks', title: 'Internal postbacks',
                     subtitle: 'Outbound delivery attempts this tracker sent'},
                    {key: 'click-forwarding', title: 'Click forwarding',
                     subtitle: 'Every redirect decision a click went through'},
                    {key: 'cost-updates', title: 'Cost updates',
                     subtitle: 'Retroactive cost changes applied from Reports'},
                ],
                filterState: {
                    clicks: {country: '', device_type: '', os: '', status: '', search: ''},
                    conversions: {status: '', click_id: '', campaign_id: ''},
                    postbacks: {click_id: '', status: '', result: '', search: ''},
                    'api-postbacks': {click_id: '', event_name: '', status: '', outcome: ''},
                    'click-forwarding': {click_id: '', campaign_id: '', status: '', search: ''},
                    'cost-updates': {username: '', campaign_id: ''},
                },
                filterDefs: {
                    clicks: [
                        {key: 'country', label: 'Country'},
                        {key: 'device_type', label: 'Device'},
                        {key: 'os', label: 'OS'},
                        {key: 'status', label: 'Status'},
                        {key: 'search', label: 'Search (url, ip, visitor id)'},
                    ],
                    conversions: [
                        {key: 'status', label: 'Status'},
                        {key: 'click_id', label: 'Click id'},
                        {key: 'campaign_id', label: 'Campaign id'},
                    ],
                    postbacks: [
                        {key: 'click_id', label: 'Click id'},
                        {key: 'status', label: 'Status'},
                        {key: 'result', label: 'Result'},
                        {key: 'search', label: 'Search (url, reason, ip)'},
                    ],
                    'api-postbacks': [
                        {key: 'click_id', label: 'Click id'},
                        {key: 'event_name', label: 'Event'},
                        {key: 'status', label: 'Conversion status'},
                        {key: 'outcome', label: 'Outcome'},
                    ],
                    'click-forwarding': [
                        {key: 'click_id', label: 'Click id'},
                        {key: 'campaign_id', label: 'Campaign id'},
                        {key: 'status', label: 'Status'},
                        {key: 'search', label: 'Search (reason, destination)'},
                    ],
                    'cost-updates': [
                        {key: 'username', label: 'Username'},
                        {key: 'campaign_id', label: 'Campaign id'},
                    ],
                },
                headers: {
                    clicks: [
                        {text: 'Time', value: 'received_at'},
                        {text: 'Click id', value: 'visitor_id'},
                        {text: 'IP', value: 'ip'},
                        {text: 'Country', value: 'country'},
                        {text: 'Device', value: 'device_type'},
                        {text: 'Status', value: 'status'},
                        {text: 'URL', value: 'url'},
                        {text: 'Bot', value: 'is_bot'},
                    ],
                    conversions: [
                        {text: 'Time', value: 'received_at'},
                        {text: 'Click id', value: 'click_id'},
                        {text: 'Status', value: 'status'},
                        {text: 'Campaign', value: 'campaign_id'},
                        {text: 'Offer', value: 'offer_id'},
                        {text: 'Payout', value: 'payout'},
                        {text: 'Revenue', value: 'revenue'},
                        {text: 'Transaction', value: 'transaction_id'},
                    ],
                    postbacks: [
                        {text: 'Time', value: 'received_at'},
                        {text: 'Click id', value: 'click_id'},
                        {text: 'Status', value: 'status'},
                        {text: 'Result', value: 'result'},
                        {text: 'Payout', value: 'payout'},
                        {text: 'Transaction', value: 'transaction_id'},
                        {text: 'Source IP', value: 'source_ip'},
                        {text: 'Reason', value: 'reason'},
                        {text: 'Raw URL', value: 'url'},
                    ],
                    'api-postbacks': [
                        {text: 'Time', value: 'created_at'},
                        {text: 'Click id', value: 'click_id'},
                        {text: 'Platform', value: 'platform'},
                        {text: 'Pixel', value: 'pixel_id'},
                        {text: 'Event', value: 'event_name'},
                        {text: 'Status', value: 'status'},
                        {text: 'HTTP', value: 'http_status'},
                        {text: 'Outcome', value: 'outcome'},
                        {text: 'Attempts', value: 'attempts'},
                        {text: 'Response', value: 'response_snippet'},
                    ],
                    'click-forwarding': [
                        {text: 'Time', value: 'created_at'},
                        {text: 'Click id', value: 'click_id'},
                        {text: 'Campaign', value: 'campaign_id'},
                        {text: 'Flow', value: 'flow_index'},
                        {text: 'Schema', value: 'schema'},
                        {text: 'Offer', value: 'offer_id'},
                        {text: 'Status', value: 'status'},
                        {text: 'Destination', value: 'destination_url'},
                        {text: 'Reason', value: 'reason'},
                    ],
                    'cost-updates': [
                        {text: 'Time', value: 'created_at'},
                        {text: 'Username', value: 'username'},
                        {text: 'Campaign', value: 'campaign_id'},
                        {text: 'From', value: 'date_from'},
                        {text: 'To', value: 'date_to'},
                        {text: 'Cost', value: 'cost'},
                        {text: 'Rows', value: 'updated_rows'},
                    ],
                },
            };
        },
        computed: {
            currentTab() {
                return this.tabs.find(t => t.key === this.activeTab) || this.tabs[0];
            },
            pageTitleText() {
                return this.currentTab.title + ' log';
            },
            pageSubtitle() {
                return this.currentTab.subtitle;
            },
            currentFilters() {
                return this.filterDefs[this.activeTab] || [];
            },
            currentHeadersAll() {
                return this.headers[this.activeTab] || [];
            },
            currentHeaders() {
                const all = this.currentHeadersAll;
                const selected = this.columnsForScope(this.presetScope);
                if (!selected || !selected.length) return all;
                const keep = selected.filter(k => all.some(h => h.value === k));
                return keep.length ? all.filter(h => keep.indexOf(h.value) !== -1) : all;
            },
            isClickLog() {
                return this.activeTab === 'clicks';
            },
            presetScope() {
                return 'logs-' + this.activeTab;
            },
        },
        watch: {
            // The sidebar switches between the six Logs routes without
            // remounting (v-show), so a section change must retarget the tab.
            section(value) {
                if (!value || value.indexOf('logs') !== 0) return;
                const tab = this.tabForSection(value);
                if (tab === this.activeTab) return;
                this.activeTab = tab;
                this.onTabChange();
            },
        },
        mounted() {
            this.applyUrlFilters();
            this.load();
            this.loadPresets();
            this.loadColumnTemplates();
            this.$root.$on('load-logs', this.load);
            this.$root.$on('load-logs', this.loadPresets);
        },
        beforeDestroy() {
            this.$root.$off('load-logs', this.load);
            this.$root.$off('load-logs', this.loadPresets);
        },
        methods: {
            tabForSection(section) {
                const map = {
                    'logs-clicks': 'clicks',
                    'logs-conversions': 'conversions',
                    'logs-postbacks': 'postbacks',
                    'logs-click-forwarding': 'click-forwarding',
                    'logs-internal-postbacks': 'api-postbacks',
                    'logs-costs': 'cost-updates',
                };
                return map[section] || 'clicks';
            },
            onTabChange() {
                this.page = 1;
                this.selectedPreset = null;
                this.loadPresets();
                this.loadColumnTemplates();
                this.load();
            },
            // A deep link (e.g. a Health-centre "last success" row) lands on a
            // Logs route with the row's own filter in the query string; seed the
            // pinned tab's filter state from it so the table opens pre-narrowed.
            applyUrlFilters() {
                const params = new URLSearchParams(window.location.search);
                const filters = this.filterState[this.activeTab];
                if (!filters) return;
                Object.keys(filters).forEach(k => {
                    const v = params.get(k);
                    if (v) filters[k] = v;
                });
            },
            logRowClass(item) {
                return this.$rowClass(item, this.presetScope);
            },
            // Selected keys for a scope: explicit pick, else workspace default,
            // else undefined meaning "show everything".
            columnsForScope(scope) {
                const picked = this.selectedColumnsByTab[scope];
                if (picked && picked.length) return picked;
                const defaults = (this.$workspace && this.$workspace.default_columns) || {};
                const fallback = defaults[scope];
                return Array.isArray(fallback) && fallback.length ? fallback : null;
            },
            isColumnVisible(key) {
                const selected = this.columnsForScope(this.presetScope);
                return !selected || selected.indexOf(key) !== -1;
            },
            toggleColumn(key) {
                const all = this.currentHeadersAll.map(h => h.value);
                const current = this.columnsForScope(this.presetScope) || all.slice();
                const next = current.indexOf(key) === -1
                    ? current.concat([key])
                    : current.filter(k => k !== key);
                // Keep the header order for a stable table.
                const ordered = all.filter(k => next.indexOf(k) !== -1);
                if (!ordered.length) return;
                this.$set(this.selectedColumnsByTab, this.presetScope, ordered);
            },
            saveDefaultColumns() {
                const ws = Object.assign({}, this.$workspace);
                ws.default_columns = Object.assign({}, ws.default_columns);
                ws.default_columns[this.presetScope] =
                    (this.columnsForScope(this.presetScope) || this.currentHeadersAll.map(h => h.value)).slice();
                fetch('/backend/api/settings/', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({settings: {workspace: ws},
                                          _base_rev: this.$workspaceRev}),
                })
                    .then(r => r.json().catch(() => ({})).then(data => {
                        if (!r.ok) throw new Error(data.detail || ('HTTP ' + r.status));
                        return data;
                    }))
                    .then(() => {
                        if (this.$loadWorkspace) this.$loadWorkspace();
                        this.$root.$emit('show-message', {type: 'success', text: 'Default columns saved'});
                    })
                    .catch(err => this.$root.$emit('show-message',
                        {type: 'error', text: 'Save failed: ' + sanitizeToastMessage(err.message)}));
            },
            loadColumnTemplates() {
                fetch('/backend/api/settings/column-templates?scope=' + encodeURIComponent(this.presetScope),
                      {credentials: 'include'})
                    .then(r => r.ok ? r.json() : {templates: []})
                    .then(data => { this.columnTemplates = data.templates || []; })
                    .catch(() => { this.columnTemplates = []; });
            },
            saveColumnTemplate() {
                const name = (window.prompt('Template name') || '').trim();
                if (!name) return;
                const columns = (this.columnsForScope(this.presetScope)
                    || this.currentHeadersAll.map(h => h.value)).slice();
                fetch('/backend/api/settings/column-templates', {
                    method: 'PUT',
                    credentials: 'include',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({scope: this.presetScope, name: name, columns: columns}),
                })
                    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
                    .then(data => {
                        this.columnTemplates = data.templates || [];
                        this.$root.$emit('show-message', {type: 'success', text: 'Template saved'});
                    })
                    .catch(err => this.$root.$emit('show-message',
                        {type: 'error', text: 'Template save failed: ' + sanitizeToastMessage(err.message)}));
            },
            applyColumnTemplate(template) {
                if (!template || !Array.isArray(template.columns)) return;
                this.$set(this.selectedColumnsByTab, this.presetScope, template.columns.slice());
            },
            deleteColumnTemplate(template) {
                if (!template) return;
                fetch('/backend/api/settings/column-templates?scope='
                        + encodeURIComponent(this.presetScope)
                        + '&name=' + encodeURIComponent(template.name),
                      {method: 'DELETE', credentials: 'include'})
                    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
                    .then(() => {
                        this.columnTemplates = this.columnTemplates.filter(t => t.name !== template.name);
                        this.$root.$emit('show-message', {type: 'success', text: 'Template deleted'});
                    })
                    .catch(err => this.$root.$emit('show-message',
                        {type: 'error', text: 'Template delete failed: ' + sanitizeToastMessage(err.message)}));
            },
            loadPresets() {
                fetch('/backend/api/filter-presets/?scope=' + encodeURIComponent(this.presetScope),
                      {credentials: 'include'})
                    .then(r => r.ok ? r.json() : {presets: []})
                    .then(data => { this.presets = data.presets || []; })
                    .catch(() => { this.presets = []; });
            },
            applyPreset(id) {
                if (!id) return;
                const preset = this.presets.find(p => p.id === id);
                if (!preset) return;
                const filters = Object.assign({}, preset.filters || {});
                const keys = Object.keys(this.filterState[this.activeTab] || {});
                const next = {};
                keys.forEach(k => { next[k] = filters[k] !== undefined ? filters[k] : ''; });
                this.filterState[this.activeTab] = next;
                this.reload();
            },
            savePreset() {
                const name = (window.prompt('Preset name') || '').trim();
                if (!name) return;
                const filters = this.baseParams();
                fetch('/backend/api/filter-presets/', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name: name, scope: this.presetScope, filters: filters}),
                })
                    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
                    .then(data => {
                        this.presets.push(data.preset);
                        this.selectedPreset = data.preset.id;
                        this.$root.$emit('show-message', {type: 'success', text: 'Preset saved'});
                    })
                    .catch(err => this.$root.$emit('show-message', {type: 'error', text: 'Preset save failed: ' + sanitizeToastMessage(err.message)}));
            },
            deletePreset() {
                if (!this.selectedPreset) return;
                fetch('/backend/api/filter-presets/' + this.selectedPreset,
                      {method: 'DELETE', credentials: 'include'})
                    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
                    .then(() => {
                        this.presets = this.presets.filter(p => p.id !== this.selectedPreset);
                        this.selectedPreset = null;
                        this.$root.$emit('show-message', {type: 'success', text: 'Preset deleted'});
                    })
                    .catch(err => this.$root.$emit('show-message', {type: 'error', text: 'Preset delete failed: ' + sanitizeToastMessage(err.message)}));
            },
            reload() {
                this.page = 1;
                this.load();
            },
            onPage(p) {
                if (p === this.page) return;
                this.page = p;
                this.load();
            },
            baseParams() {
                const f = Object.assign({}, this.filterState[this.activeTab] || {});
                Object.keys(f).forEach(k => { if (f[k] === '' || f[k] === null) delete f[k]; });
                if (this.dateFrom) f.date_from = this.dateFrom;
                if (this.dateTo) f.date_to = this.dateTo;
                return f;
            },
            load() {
                this.loading = true;
                const offset = (this.page - 1) * this.pageSize;
                let url, options;
                if (this.isClickLog) {
                    url = '/backend/api/dashboard/click-log';
                    options = {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        credentials: 'include',
                        body: JSON.stringify(Object.assign(this.baseParams(),
                            {limit: this.pageSize, offset: offset})),
                    };
                } else if (this.activeTab === 'conversions') {
                    url = this.withQuery('/backend/api/reports/',
                        Object.assign(this.baseParams(), {limit: this.pageSize, offset: offset}));
                    options = {credentials: 'include'};
                } else {
                    url = this.withQuery('/backend/api/logs/' + this.activeTab,
                        Object.assign(this.baseParams(), {limit: this.pageSize, offset: offset}));
                    options = {credentials: 'include'};
                }
                fetch(url, options)
                    .then(res => res.ok ? res.json() : Promise.reject(new Error('HTTP ' + res.status)))
                    .then(data => {
                        if (Array.isArray(data)) {
                            this.items = data;
                            this.total = data.length;
                        } else {
                            this.items = data.items || [];
                            this.total = data.total || 0;
                        }
                        this.loading = false;
                    })
                    .catch(err => {
                        this.loading = false;
                        this.$root.$emit('show-message', {type: 'error', text: 'Logs failed: ' + sanitizeToastMessage(err.message)});
                    });
            },
            withQuery(url, params) {
                const parts = [];
                Object.keys(params || {}).forEach(k => {
                    const v = params[k];
                    if (v !== '' && v !== null && v !== undefined) {
                        parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
                    }
                });
                if (!parts.length) return url;
                return url + (url.indexOf('?') === -1 ? '?' : '&') + parts.join('&');
            },
            async exportCsv() {
                try {
                    let res;
                    if (this.isClickLog) {
                        res = await fetch('/backend/api/dashboard/click-log/export', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            credentials: 'include',
                            body: JSON.stringify(this.baseParams()),
                        });
                    } else if (this.activeTab === 'conversions') {
                        res = await fetch(this.withQuery('/backend/api/reports/export', this.baseParams()),
                            {credentials: 'include'});
                    } else {
                        res = await fetch(this.withQuery('/backend/api/logs/' + this.activeTab,
                            Object.assign(this.baseParams(), {format: 'csv'})), {credentials: 'include'});
                    }
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    this.saveBlob(await res.blob(), this.activeTab + '.csv');
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error', text: 'Logs export failed: ' + sanitizeToastMessage(err.message)});
                }
            },
            saveBlob(blob, filename) {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                a.click();
                URL.revokeObjectURL(a.href);
                this.$root.$emit('show-message', {type: 'success', text: 'CSV exported'});
            },
            resultChipClass(value) {
                const s = String(value || '').toLowerCase();
                if (['accepted', 'redirected'].indexOf(s) !== -1) return 'status-chip--success';
                if (['duplicate'].indexOf(s) !== -1) return 'status-chip--warning';
                if (['rejected', 'rule_rejected', 'blocked', 'not_found'].indexOf(s) !== -1) return 'status-chip--danger';
                if (['fallback', 'capped', 'scheduled_out', 'paused'].indexOf(s) !== -1) return 'status-chip--neutral';
                if (['sale', 'upsale'].indexOf(s) !== -1) return 'status-chip--success';
                if (['lead'].indexOf(s) !== -1) return 'status-chip--info';
                return 'status-chip--neutral';
            },
        },
    });
</script>
