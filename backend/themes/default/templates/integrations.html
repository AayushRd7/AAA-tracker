{% raw %}
<script type="text/x-template" id="integrations-template">
    <v-container fluid>
        <div class="d-flex align-center justify-space-between mb-4 flex-wrap">
            <div>
                <div class="page-title">Integrations</div>
                <div class="page-subtitle">Connect an ad platform once, then pick its accounts, datasets and campaigns instead of pasting ids by hand</div>
            </div>
        </div>

        <v-row>
            <v-col cols="12">
                <v-card class="pa-4" id="integrations-card">
                    <v-card-title class="d-flex align-center">
                        <v-icon color="primary" class="mr-2">mdi-connection</v-icon>
                        Integrations
                        <v-spacer></v-spacer>
                        <v-chip v-if="integrationsConnectedCount" x-small color="green" dark>
                            {{ integrationsConnectedCount }} connected
                        </v-chip>
                    </v-card-title>
                    <v-card-text>
                        <div class="caption grey--text mb-2">
                            Connect an ad platform so its ad accounts, datasets and
                            campaigns can be picked here instead of pasted by hand. Meta is
                            available now; the other platforms are placeholders.
                        </div>
                        <!-- A failed load used to leave the card looking empty with no
                             explanation; say why instead. -->
                        <v-alert v-if="integrationsData && integrationsData.error"
                                 type="warning" text dense class="mb-3">
                            {{ integrationsData.error }}
                        </v-alert>
                        <div v-for="row in integrationRows" :key="row.platform"
                             class="integration-row py-3"
                             :id="'integration-row-' + row.platform">
                            <div class="d-flex align-center mb-2">
                                <strong>{{ row.label }}</strong>
                                <v-chip x-small class="ml-2" dark
                                        :color="row.connected ? 'green' : (row.connect_available ? 'blue-grey' : 'grey')">
                                    {{ row.connected ? 'connected'
                                       : (!row.implemented ? 'coming soon'
                                          : (!row.configured ? 'not configured by this deployment'
                                             : 'not connected')) }}
                                </v-chip>
                            </div>
                            <div class="d-flex align-center flex-wrap mb-2">
                                <v-btn small color="primary" class="mr-2"
                                       :disabled="!row.connect_available"
                                       @click="connectIntegration(row.platform)">
                                    <v-icon small class="mr-1">mdi-link-variant</v-icon>Connect
                                </v-btn>
                                <v-btn small outlined color="error"
                                       v-if="row.connection && row.connection.has_token"
                                       @click="disconnectIntegration(row.platform)">
                                    <v-icon small class="mr-1">mdi-link-variant-off</v-icon>Disconnect
                                </v-btn>
                            </div>
                            <div v-if="row.connected" class="caption mt-2" :id="'integration-status-' + row.platform">
                                <span class="green--text">Connected as {{ row.connection.account_label || row.label }}</span>
                                <span v-if="integrationAssets[row.platform]">
                                    · {{ integrationAssets[row.platform].counts.ad_accounts }} ad accounts
                                    · {{ integrationAssets[row.platform].counts.datasets }} datasets
                                </span>
                                <span v-if="row.connection.expires_at">
                                    · expires {{ row.connection.expires_at.slice(0, 10) }}
                                </span>
                            </div>
                            <div v-else-if="row.connection && row.connection.reconnect_needed"
                                 class="caption mt-2" :id="'integration-reconnect-' + row.platform">
                                <span class="red--text">
                                    Needs reconnect — the stored token cannot be read or has expired.
                                </span>
                            </div>
                            <div v-if="integrationAssets[row.platform]" class="caption grey--text mt-1">
                                <span v-if="integrationAssets[row.platform].ad_accounts.length
                                             && !(row.platform === 'meta' && row.connected)">
                                    Accounts:
                                    {{ integrationAssets[row.platform].ad_accounts.map(a => a.name || a.id).join(', ') }}
                                </span>
                                <span v-if="integrationAssets[row.platform].error" class="red--text">
                                    — {{ integrationAssets[row.platform].error }}
                                </span>
                            </div>
                            <!-- The ONE place accounts are chosen: a connected Meta account
                                 feeds this picker from its discovered ad accounts. -->
                            <div v-if="row.platform === 'meta' && row.connected"
                                 class="mt-3" :id="'integration-accounts-' + row.platform">
                                <v-select
                                        v-model="metaAdsAccountSelection"
                                        :items="metaAdsAccountOptions"
                                        label="Ad accounts for cost sync"
                                        multiple chips small-chips deletable-chips
                                        outlined dense
                                        hint="Spend for these accounts is read by the Meta Ads cost sync."
                                        persistent-hint
                                ></v-select>
                                <v-btn small color="primary" :loading="metaAdsAccountsSaving"
                                       @click="saveMetaAdAccounts">
                                    <v-icon small class="mr-1">mdi-content-save</v-icon>Save accounts
                                </v-btn>
                            </div>
                        </div>
                    </v-card-text>
                </v-card>
            </v-col>
        </v-row>
    </v-container>
</script>

<script type="application/javascript">
    Vue.component('integrations-component', {
        template: '#integrations-template',
        data() {
            return {
                // Integrations (ad-platform OAuth Connect) card state
                integrationsData: null,
                integrationAssets: {},
                integrationRows: [],
                // Ad accounts chosen here (numeric ids, persisted by
                // POST /api/meta-ads/accounts).
                metaAdsAccountSelection: [],
                metaAdsAccountsSaving: false,
            };
        },
        mounted() {
            this.loadIntegrations();
            this.handleIntegrationRedirect();
            this.$root.$on('load-integrations', this.loadIntegrations);
        },
        beforeDestroy() {
            this.$root.$off('load-integrations', this.loadIntegrations);
        },
        computed: {
            integrationsConnectedCount() {
                return this.integrationRows.filter(r => r.connected).length;
            },
            // Discovered Meta ad accounts feed the ad-account picker.
            metaAdsAccountOptions() {
                const assets = this.integrationAssets.meta;
                if (!assets) { return []; }
                return (assets.ad_accounts || []).map(a => {
                    const num = String(a.id || '').replace(/^act_/, '') || a.account_id;
                    const label = a.name ? `${a.name} (${num})` : num;
                    return {text: label, value: String(num)};
                });
            },
        },
        methods: {
            loadIntegrations() {
                fetch("/backend/api/integrations", {credentials: "include"})
                    .then(r => {
                        // A 401/500 body parses as JSON ({detail: ...}) and used to leave
                        // the card looking empty with no explanation — surface it instead.
                        if (!r.ok) throw new Error("HTTP " + r.status);
                        return r.json();
                    })
                    .then(data => {
                        this.integrationsData = data;
                        const src = data.platforms || {};
                        // Rows are read-only views of the server's platform list
                        // (credentials live in the deployment environment, not here).
                        this.integrationRows = ['meta', 'snapchat', 'tiktok',
                            'pinterest', 'google']
                            .filter(p => src[p])
                            .map(p => Object.assign({platform: p}, src[p]));
                        if (!Object.keys(src).length) {
                            this.integrationsData = {error:
                                "The server returned no platform list — reload the page, " +
                                "and if it stays empty the session may need a fresh login."};
                        }
                        Object.keys(src).forEach(p => {
                            if (src[p].connected) this.loadIntegrationAssets(p);
                        });
                        this.loadMetaAdsStatus();
                    })
                    .catch(err => {
                        this.integrationRows = [];
                        this.integrationsData = {error:
                            "Could not load the platform list: " + (err && err.message) +
                            ". The Connect buttons appear once it loads."};
                    });
            },
            loadIntegrationAssets(platform) {
                fetch("/backend/api/integrations/" + platform + "/assets",
                      {credentials: "include"})
                    .then(r => r.json())
                    .then(data => {
                        if (data && data.counts) {
                            Vue.set(this.integrationAssets, platform, data);
                        }
                    })
                    .catch(() => { /* assets are optional */ });
            },
            loadMetaAdsStatus() {
                // Source of truth for the picker: the same settings document the
                // cost sync (Settings) reads.
                fetch("/backend/api/meta-ads/status", {credentials: "include"})
                    .then(r => r.json())
                    .then(data => {
                        this.metaAdsAccountSelection =
                            (data.ad_account_ids || []).map(String);
                    })
                    .catch(() => { /* status is advisory — the picker is seeded below */ });
            },
            connectIntegration(platform) {
                // Full-page redirect: the backend 302s the browser to the provider.
                window.location.href = "/backend/api/integrations/" + platform + "/oauth/start";
            },
            disconnectIntegration(platform) {
                fetch("/backend/api/integrations/" + platform + "/connection",
                      {method: 'DELETE', credentials: 'include'})
                    .then(r => r.json())
                    .then(() => {
                        this.$root.$emit("show-message", {type: "success",
                            text: "Disconnected"});
                        Vue.delete(this.integrationAssets, platform);
                        this.loadIntegrations();
                    })
                    .catch(e => this.$root.$emit("show-message", {type: "error",
                        text: sanitizeToastMessage(e.message)}));
            },
            async saveMetaAdAccounts() {
                // The single writer of meta_ads.ad_account_ids: normalises server-side
                // and reflects the saved list back into the picker + the Settings
                // cost-sync summary (via the load-settings refresh).
                this.metaAdsAccountsSaving = true;
                try {
                    const res = await fetch("/backend/api/meta-ads/accounts", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        credentials: "include",
                        body: JSON.stringify(
                            {ad_account_ids: this.metaAdsAccountSelection})
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        throw new Error(data.detail || ("HTTP " + res.status));
                    }
                    this.metaAdsAccountSelection = (data.ad_account_ids || []).map(String);
                    this.$root.$emit("show-message", {type: "success",
                        text: "Ad accounts saved (" + (data.count || 0) + ")"});
                    this.$root.$emit("load-settings");
                } catch (e) {
                    this.$root.$emit("show-message", {type: "error",
                        text: "Could not save ad accounts: " +
                              sanitizeToastMessage(e.message)});
                } finally {
                    this.metaAdsAccountsSaving = false;
                }
            },
            handleIntegrationRedirect() {
                // The OAuth callback 302s back to /backend/integrations?integration=…&status=…
                const q = new URLSearchParams(window.location.search);
                const platform = q.get('integration');
                if (!platform) { return; }
                const status = q.get('status');
                const message = sanitizeToastMessage(q.get('message') || '');
                if (status === 'ok') {
                    const counts = [];
                    if (q.get('accounts') !== null) counts.push(q.get('accounts') + ' ad accounts');
                    if (q.get('datasets') !== null) counts.push(q.get('datasets') + ' datasets');
                    this.$root.$emit("show-message", {type: "success",
                        text: (message || ("Connected " + platform)) +
                              (counts.length ? ' — ' + counts.join(', ') : '')});
                } else {
                    this.$root.$emit("show-message", {type: "error",
                        text: "Connect failed: " + (message || "unknown error")});
                }
                window.history.replaceState({}, '', window.location.pathname);
            },
        },
    });
</script>
{% endraw %}
