{% raw %}
<script type="text/x-template" id="landing-form-fields-template">
    <div>
        <v-text-field
                label="Folder name"
                v-model="form.folder"
                :disabled="disabled"
                outlined
                dense
                hint="Lowercase letters, numbers and underscores only — max 250 chars"
                persistent-hint
        ></v-text-field>

        <v-text-field
                label="Name"
                v-model="form.name"
                outlined
                dense
                hint="Internal dashboard name — max 250 chars"
                persistent-hint
        ></v-text-field>

        <v-text-field
                label="Tags"
                v-model="form.tags"
                outlined
                dense
                hint="Comma separated, e.g. #main, #test — max 250 chars"
                persistent-hint
        ></v-text-field>

        <v-text-field
                label="Link"
                v-model="form.link"
                outlined
                dense
                hint="Landing URL if redirect or mirroring — max 250 chars"
                persistent-hint
        ></v-text-field>

        <v-select
                label="Landing type"
                :items="['link', 'mirror', 'file']"
                v-model="form.type"
                outlined
                dense
        ></v-select>

        <v-file-input
                label="Landing file (.zip, .php, .html)"
                v-model="form.file"
                accept=".zip,.php,.html"
                outlined
                dense
                :show-size="true"
                truncate-length="25"
                prepend-icon="mdi-upload"
        ></v-file-input>
    </div>
</script>

<script type="text/x-template" id="landings-template">
    <v-container fluid>
        <v-row align="center" class="mb-4">
            <v-col>
                <div class="page-title">Landing Pages</div>
                <div class="page-subtitle">Manage your landing pages</div>
            </v-col>
            <v-col class="d-flex justify-end align-center" cols="auto">
                <v-text-field
                        v-model="landingSearch"
                        label="Search landings"
                        prepend-inner-icon="mdi-magnify"
                        outlined
                        dense
                        hide-details
                        clearable
                        class="mr-3 landing-search"
                ></v-text-field>
                <v-btn color="primary" elevation="0" @click="openCreate">
                    <v-icon small class="mr-1">mdi-plus</v-icon>
                    Create landing
                </v-btn>
            </v-col>
        </v-row>

        <v-dialog v-model="dialog" persistent>
            <v-card class="dialog-md dialog-flex">
                <v-card-title>
                    <span class="text-h6">{{ isEdit ? 'Edit landing' : 'Create landing' }}</span>
                </v-card-title>

                <v-card-text>
                    <template v-if="!isEdit">
                        <v-tabs v-model="createTab" class="mb-4">
                            <v-tab><v-icon small left>mdi-upload</v-icon>Upload file</v-tab>
                            <v-tab><v-icon small left>mdi-earth</v-icon>Grab from URL</v-tab>
                        </v-tabs>
                        <v-tabs-items v-model="createTab">
                            <v-tab-item>
                                <landing-form-fields :form="form"></landing-form-fields>
                            </v-tab-item>
                            <v-tab-item>
                                <v-text-field
                                        label="Page URL"
                                        v-model="grab.url"
                                        outlined
                                        dense
                                        placeholder="https://example.com/lander"
                                        hint="The page is fetched server-side and stored as a local landing"
                                        persistent-hint
                                ></v-text-field>
                                <v-text-field
                                        label="Folder name"
                                        v-model="grab.folder"
                                        outlined
                                        dense
                                        hint="Lowercase letters, numbers and underscores only"
                                        persistent-hint
                                ></v-text-field>
                                <v-checkbox
                                        v-model="grab.allowPrivate"
                                        dense hide-details
                                        label="Allow internal/private address (own infrastructure)"
                                ></v-checkbox>
                                <v-alert v-if="grabError" type="error" dense text class="mt-3">{{ grabError }}</v-alert>
                                <v-btn color="primary" elevation="0" class="mt-2"
                                       :loading="grabLoading" :disabled="grabLoading" @click="grabLanding">
                                    <v-icon small class="mr-1">mdi-download</v-icon>Grab
                                </v-btn>
                            </v-tab-item>
                        </v-tabs-items>
                    </template>
                    <template v-else>
                        <landing-form-fields :form="form"></landing-form-fields>
                    </template>
                </v-card-text>

                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="close">Cancel</v-btn>
                    <v-btn v-if="isEdit || createTab === 0" color="primary" elevation="0" @click="save">Save</v-btn>
                </v-card-actions>

            </v-card>
        </v-dialog>

        <v-row dense class="mt-4">
            <v-col>
                <v-card>
                    <v-data-table v-col-resize:landings="headers"
                            :headers="headers"
                            :items="filteredLandings"
                            dense
                            :items-per-page="10"
                            :footer-props="{ 'items-per-page-options': [10, 25, 50] }"
                            loading-text="Loading... Please wait"
                            :loading=loadingLandings
                    >

                        <template v-slot:item.created_at="{ item }">
                            {{ $formatDate(item.created_at) }}
                        </template>
                        <template v-slot:item.folder="{ item }">
                            <a v-if="item.folder" :href="'/l/' + item.folder" target="_blank" rel="noopener">
                                {{ item.folder }}
                            </a>
                        </template>
                        <template v-slot:item.link="{ item }">

                            <a v-if="item.link" :href="item.link" target="_blank" rel="noopener">
                                {{ item.link }}
                            </a>
                        </template>
                        <template v-slot:item.actions="{ item }">
                            <v-tooltip bottom>
                                <template v-slot:activator="{ on, attrs }">
                                    <v-btn icon small color="primary" v-bind="attrs" v-on="on" @click="openEdit(item)"
                                           :aria-label="'Edit ' + item.name">
                                        <v-icon small>mdi-pencil-outline</v-icon>
                                    </v-btn>
                                </template>
                                <span>Edit</span>
                            </v-tooltip>
                            <v-tooltip bottom v-if="item.type === 'local_file'">
                                <template v-slot:activator="{ on, attrs }">
                                    <a :href="'/backend/editor?landing='+item.id" target="_blank" rel="noopener">
                                        <v-btn icon small color="info" v-bind="attrs" v-on="on"
                                               :aria-label="'Open code editor for ' + item.name">
                                            <v-icon small>mdi-code-tags</v-icon>
                                        </v-btn>
                                    </a>
                                </template>
                                <span>Code editor</span>
                            </v-tooltip>
                            <v-tooltip bottom>
                                <template v-slot:activator="{ on, attrs }">
                                    <v-btn icon small color="red" v-bind="attrs" v-on="on" @click="confirmDeleteLanding(item)"
                                           :aria-label="'Delete ' + item.name">
                                        <v-icon small>mdi-trash-can-outline</v-icon>
                                    </v-btn>
                                </template>
                                <span>Delete</span>
                            </v-tooltip>
                        </template>

                        <template v-slot:no-data>
                            <div class="empty-state" v-if="landingSearch && landings.length">
                                <v-icon>mdi-filter-off-outline</v-icon>
                                <div class="mt-2">No landings match your search</div>
                                <v-btn small text color="primary" class="mt-2" @click="landingSearch = ''">Clear search</v-btn>
                            </div>
                            <div class="empty-state" v-else>
                                <v-icon>mdi-lan</v-icon>
                                <div class="mt-2">No landing pages yet — create your first one</div>
                                <v-btn small color="primary" elevation="0" class="mt-3" @click="openCreate">
                                    <v-icon small class="mr-1">mdi-plus</v-icon>Create landing
                                </v-btn>
                            </div>
                        </template>

                    </v-data-table>
                </v-card>
            </v-col>
        </v-row>

        <confirm-dialog-component ref="confirm" />
    </v-container>
</script>

<script type="application/javascript">
    // Shared create/edit form fields (used by both the Upload and Grab tabs).
    Vue.component('landing-form-fields', {
        template: '#landing-form-fields-template',
        props: {
            form: {type: Object, required: true},
            disabled: {type: Boolean, default: false},
        },
    });

    Vue.component('landings-component', {
        template: '#landings-template',
        data() {
            return {
                loadingLandings: false,
                headers: [
                    {text: 'Name', value: 'name'},
                    {text: 'Folder', value: 'folder'},
                    {text: 'Type', value: 'type'},
                    {text: 'Link', value: 'link'},
                    {text: 'Date Created', value: 'created_at'},
                    {text: 'Clicks', value: 'clicks'},
                    {text: 'Conversions', value: 'conversions'},
                    {text: 'Cost', value: 'cost'},
                    {text: 'Revenue', value: 'revenue'},
                    {text: 'ROI', value: 'roi'},
                    {text: 'Actions', value: 'actions', sortable: false}
                ],
                landings: [],
                landingSearch: '',

                dialog: false,
                isEdit: false,
                createTab: 0,
                grab: {url: '', folder: '', allowPrivate: false},
                grabLoading: false,
                grabError: '',
                form: {
                    folder: '',
                    name: '',
                    tags: '',
                }
            }
        },
        computed: {
            dateRangeText() {
                return this.date_range.join(' ~ ')
            },
            filteredLandings() {
                const q = (this.landingSearch || '').trim().toLowerCase();
                if (!q) return this.landings;
                return this.landings.filter(l =>
                    (l.name || '').toLowerCase().includes(q)
                    || (l.folder || '').toLowerCase().includes(q)
                    || (Array.isArray(l.tags) ? l.tags : String(l.tags || '').split(','))
                        .some(t => String(t).trim().toLowerCase().includes(q)));
            },
        },
        methods: {
            // Global-search hit: pre-fill the list search so this landing is the
            // only row. Clearing the field restores the full list.
            applySearchFocus(focus) {
                this.landingSearch = focus.name || '';
            },
            loadLandings() {
                this.loadingLandings = true;
                fetch('/landings', {
                    method: 'GET',
                    credentials: 'include'
                })
                    .then(async (response) => {
                        const text = await response.text();
                        if (!response.ok) {
                            let message = 'Unknown error loading landings';
                            try {
                                const errorData = JSON.parse(text);
                                if (Array.isArray(errorData.detail)) {
                                    message = errorData.detail.map(d => d.msg).join('; ');
                                } else if (typeof errorData.detail === 'string') {
                                    message = errorData.detail;
                                }
                            } catch (e) {
                                message = text;
                            }
                            throw new Error(message);
                        }

                        let data = [];
                        try {
                            data = JSON.parse(text);
                        } catch (e) {
                            console.warn('Response is not valid JSON:', text);
                        }

                        // Put the fetched landings into the table
                        this.landings = data.map(l => ({
                            ...l,
                            clicks: l.clicks || 0,
                            conversions: l.conversions || 0,
                            cost: l.cost || 0,
                            revenue: l.revenue || 0,
                            roi: l.roi || 0
                        }));

                    })
                    .catch((error) => {
                        this.$root.$emit('show-message', {
                            type: 'error',
                            text: sanitizeToastMessage(error.message)
                        });
                    })
                    .finally(() => {
                        this.loadingLandings = false;
                    });
            },
            openCreate() {
                this.isEdit = false;
                this.createTab = 0;
                this.grab = {url: '', folder: '', allowPrivate: false};
                this.grabError = '';
                this.form = {folder: '', name: '', tags: '', link: '', type: 0, file: null};
                this.dialog = true;
            },
            openEdit(item) {
                this.isEdit = true;
                this.form = {
                    id: item.id,
                    folder: item.folder,
                    name: item.name,
                    tags: Array.isArray(item.tags) ? item.tags.join(',') : item.tags || '',
                    link: item.link || '',
                    type: (item.type === 0 || item.type === 'link') ? 'link' :
                        (item.type === 1 || item.type === 'mirror') ? 'mirror' : 'file',
                    file: null // no new file selected yet
                };
                this.dialog = true; // open the dialog
            },

            save() {
                if (!this.form.folder || !this.form.name) {
                    this.$root.$emit('show-message', {
                        type: 'error',
                        text: 'Folder and name are required.'
                    });
                    return;
                }

                let typeInt = 2;
                if (this.form.type === 'link') typeInt = 0;
                if (this.form.type === 'mirror') typeInt = 1;
                if (this.form.type === 'file' || this.form.type === 'local_file') typeInt = 2;

                if (!this.isEdit && !this.form.file && typeInt === 2) {
                    this.$root.$emit('show-message', {
                        type: 'error',
                        text: 'File is required for local_file landings.'
                    });
                    return;
                }

                const formData = new FormData();
                formData.append('site_folder', this.form.folder);
                formData.append('name', this.form.name);
                formData.append('tags', this.form.tags || '');
                formData.append('link', this.form.link || '');
                formData.append('type', typeInt);

                if (this.form.file) {
                    formData.append('file', this.form.file);
                }

                const url = this.isEdit
                    ? `/landing/${this.form.id}`  // PUT request
                    : `/landing`;                 // POST request

                fetch(url, {
                    method: this.isEdit ? 'PUT' : 'POST',
                    body: formData,
                    credentials: 'include'
                })
                    .then(async (response) => {
                        const text = await response.text();
                        if (!response.ok) {
                            let message = 'Unknown error';
                            try {
                                const errorData = JSON.parse(text);
                                if (Array.isArray(errorData.detail)) {
                                    message = errorData.detail.map(d => d.msg).join('; ');
                                } else if (typeof errorData.detail === 'string') {
                                    message = errorData.detail;
                                }
                            } catch (e) {
                                message = text;
                            }
                            throw new Error(message);
                        }

                        console.log(this.isEdit ? 'Landing updated' : 'Landing created');
                        this.dialog = false;

                        this.$root.$emit('show-message', {
                            type: 'success',
                            text: this.isEdit ? 'Landing updated successfully!' : 'Landing created successfully!'
                        });
                        this.loadLandings(); // Reload the landings list
                    })
                    .catch((error) => {
                        this.$root.$emit('show-message', {
                            type: 'error',
                            text: sanitizeToastMessage(error.message)
                        });
                    });
            },


            close() {
                this.dialog = false;
            },

            // --- G73: grab a remote page as a local landing ---
            grabLanding() {
                if (!this.grab.url || !this.grab.folder) {
                    this.grabError = 'URL and folder name are required.';
                    return;
                }
                this.grabError = '';
                this.grabLoading = true;
                const formData = new FormData();
                formData.append('url', this.grab.url.trim());
                formData.append('folder', this.grab.folder.trim());
                formData.append('allow_private', this.grab.allowPrivate ? 'true' : 'false');
                fetch('/landing/grab', {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                })
                    .then(async (response) => {
                        const text = await response.text();
                        if (!response.ok) {
                            let message = 'Grab failed';
                            try {
                                const errorData = JSON.parse(text);
                                if (typeof errorData.detail === 'string') {
                                    message = errorData.detail;
                                }
                            } catch (e) {
                                message = text;
                            }
                            throw new Error(message);
                        }
                        return JSON.parse(text);
                    })
                    .then((data) => {
                        this.dialog = false;
                        this.$root.$emit('show-message', {
                            type: 'success',
                            text: 'Landing grabbed: ' + (data.name || data.site)
                        });
                        this.loadLandings();
                    })
                    .catch((error) => {
                        this.grabError = error.message || 'Grab failed';
                        this.$root.$emit('show-message', {
                            type: 'error',
                            text: sanitizeToastMessage(error.message)
                        });
                    })
                    .finally(() => {
                        this.grabLoading = false;
                    });
            },
            fileRequiredRule(value) {
                if (!this.isEdit && !value) {
                    return 'File is required.';
                }
                return true;
            },

            async confirmDeleteLanding(item) {
                const ok = await this.$refs.confirm.open('Delete landing', 'Are you sure you want to delete this landing? This cannot be undone.');
                if (!ok) return;
                this.deleteLanding(item);
            },
            deleteLanding(item) {
                fetch(`/landing/${item.id}`, {
                    method: 'DELETE',
                    credentials: 'include'
                })
                    .then(async (response) => {
                        const text = await response.text();
                        if (!response.ok) {
                            let message = 'Unknown error deleting landing';
                            try {
                                const errorData = JSON.parse(text);
                                if (Array.isArray(errorData.detail)) {
                                    message = errorData.detail.map(d => d.msg).join('; ');
                                } else if (typeof errorData.detail === 'string') {
                                    message = errorData.detail;
                                }
                            } catch (e) {
                                message = text;
                            }
                            throw new Error(message);
                        }

                        this.$root.$emit('show-message', {
                            type: 'success',
                            text: 'Landing deleted successfully!'
                        });
                        this.loadLandings(); // Reload the list
                    })
                    .catch((error) => {
                        this.$root.$emit('show-message', {
                            type: 'error',
                            text: sanitizeToastMessage(error.message)
                        });
                    });
            },

        },
        mounted() {
            this.$vuetify.theme.dark = (document.documentElement.dataset.theme === 'dark');
            this.loadLandings();
            this.$root.$on('load-landings', (focus) => {
                if (focus) this.applySearchFocus(focus);
                this.loadLandings();
            });
        },
    });
</script>
{% endraw %}
