<script type="text/x-template" id="offers-template">
    <v-container fluid>
        <v-row align="center" class="mb-4">
            <v-col>
                <div class="page-title">Offers</div>
                <div class="page-subtitle">Manage your offers</div>
            </v-col>
            <v-col class="d-flex justify-end align-center" cols="auto">
                <v-switch
                        v-model="showArchived"
                        label="Show archived"
                        inset
                        dense
                        hide-details
                        class="mr-4 mt-0 archived-switch"
                ></v-switch>
                <v-btn small outlined class="mr-2" @click="exportCsv" :loading="exporting">
                    <v-icon small class="mr-1">mdi-file-download-outline</v-icon>Export
                </v-btn>
                <v-btn small outlined class="mr-2" @click="openImport">
                    <v-icon small class="mr-1">mdi-file-upload-outline</v-icon>Import
                </v-btn>
                <v-btn color="primary" elevation="0" @click="openCreate">
                    <v-icon small class="mr-1">mdi-plus</v-icon>
                    Create Offer
                </v-btn>
            </v-col>
        </v-row>

        <v-dialog v-model="dialog">
            <v-card class="dialog-lg">
                <v-card-title>
                    <span class="text-h6">{{ isEdit ? 'Edit Offer' : 'Add Offer' }}</span>
                </v-card-title>

                <v-card-text>

                    <v-text-field
                            label="Offer Name"
                            v-model="form.name"
                            outlined
                            dense
                    ></v-text-field>

                    <v-text-field
                            label="Target URL"
                            v-model="form.url"
                            outlined
                            dense
                    ></v-text-field>

                    <v-select
                            label="Affiliate Network"
                            :items="affiliateNetworks"
                            item-text="name"
                            item-value="id"
                            v-model="form.affiliate_network_id"
                            append-outer-icon="mdi-plus-circle-outline"
                            @click:append-outer="openNetworkDialog"
                            outlined
                            dense
                            hint="No network? Click + to add one without leaving this form."
                            persistent-hint
                    ></v-select>

                    <!-- Quick create affiliate network, inline from the offer form -->
                    <v-dialog v-model="networkDialog">
                        <v-card class="dialog-sm">
                            <v-card-title class="text-h6">Add Affiliate Network</v-card-title>
                            <v-card-text>
                                <v-text-field label="Name" v-model="networkForm.name" outlined dense></v-text-field>
                                <v-text-field
                                        label="Offer Parameters (query string)"
                                        v-model="networkForm.offer_parameters"
                                        outlined
                                        dense
                                        hint="e.g. sub1={click_id}&sub2={payout}"
                                        persistent-hint
                                ></v-text-field>
                                <v-text-field
                                        label="S2S Postback Template"
                                        v-model="networkForm.s2s_postback"
                                        outlined
                                        dense
                                        hint="e.g. https://your-tracker/pb/{click_id}/{status}/{payout}"
                                        persistent-hint
                                ></v-text-field>
                            </v-card-text>
                            <v-card-actions>
                                <v-spacer></v-spacer>
                                <v-btn text @click="networkDialog = false">Cancel</v-btn>
                                <v-btn color="primary" :loading="networkSaving" @click="createNetwork">Create</v-btn>
                            </v-card-actions>
                        </v-card>
                    </v-dialog>

                    <v-combobox
                            v-model="form.countries"
                            label="Countries"
                            multiple
                            outlined
                            dense
                            :items="countryOptions"
                            item-text="code"
                            item-value="code"
                            :filter="countryFilter"
                            hint="Pick from the list or type to search by name / ISO code (US, CA, …)"
                            persistent-hint
                    ></v-combobox>

                    <v-text-field
                            label="Payout"
                            v-model="form.payout"
                            type="number"
                            step="0.01"
                            outlined
                            dense
                    ></v-text-field>

                    <v-select
                            label="Currency"
                            v-model="form.currency"
                            :items="['USD', 'EUR', 'GBP', 'JPY']"
                            outlined
                            dense
                    ></v-select>

                    <v-select
                            label="Status"
                            v-model="form.status"
                            :items="['active', 'paused', 'archived']"
                            outlined
                            dense
                    ></v-select>

                    <v-text-field
                            label="Daily Conversions Cap"
                            v-model="form.daily_conversions_cap"
                            type="number"
                            min="0"
                            clearable
                            outlined
                            dense
                            hint="Max sale/upsale conversions per day — leave empty for no cap"
                            persistent-hint
                    ></v-text-field>

                    <v-select
                            label="Overflow Offer"
                            v-model="form.overflow_offer_id"
                            :items="overflowOptions"
                            item-text="name"
                            item-value="id"
                            clearable
                            outlined
                            dense
                            hint="Offer used when the daily cap is reached — empty means the flow is skipped"
                            persistent-hint
                    ></v-select>

                    <v-textarea
                            label="Notes"
                            v-model="form.notes"
                            outlined
                            dense
                            rows="2"
                            auto-grow
                    ></v-textarea>

                    <v-combobox
                            v-model="form.tags"
                            label="Tags"
                            multiple
                            outlined
                            dense
                            small-chips
                            hint="Add optional tags like nutra, tier1"
                            persistent-hint
                    ></v-combobox>

                </v-card-text>

                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="close">Cancel</v-btn>
                    <v-btn color="primary" elevation="0" @click="save">Save</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>


        <v-dialog v-model="importDialog" persistent max-width="640px">
            <v-card>
                <v-card-title class="text-h6">Import offers (CSV)</v-card-title>
                <v-card-text>
                    <div class="caption grey--text mb-2">
                        Paste CSV with the export header
                        <code>id,name,url,affiliate_network_id,countries,payout,currency,status,tags,daily_conversions_cap,overflow_offer_id,notes</code> —
                        rows with a matching id or name are updated, the rest are created.
                        Tags and countries are ;-separated.
                    </div>
                    <v-textarea
                            v-model="importText"
                            outlined
                            dense
                            rows="8"
                            :disabled="importLoading"
                    ></v-textarea>
                    <div v-if="importResults.length" class="import-results">
                        <div v-for="r in importResults" :key="r.line" class="caption import-result-line"
                             :class="r.ok ? 'import-ok' : 'import-fail'">
                            <v-icon x-small class="mr-1">{{ r.ok ? 'mdi-check' : 'mdi-close' }}</v-icon>
                            Line {{ r.line }}: {{ r.detail }}
                        </div>
                    </div>
                </v-card-text>
                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="closeImport">Close</v-btn>
                    <v-btn color="primary" elevation="0" :loading="importLoading" :disabled="!importText.trim()"
                           @click="runImport">Import</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>

        <v-dialog v-model="bulkTagDialog" persistent max-width="440px">
            <v-card>
                <v-card-title class="text-h6">Tags — {{ selected.length }} offers</v-card-title>
                <v-card-text>
                    <v-select
                            label="Mode"
                            v-model="bulkTagMode"
                            :items="[{text: 'Add tags', value: 'tags_add'}, {text: 'Remove tags', value: 'tags_remove'}]"
                            outlined
                            dense
                    ></v-select>
                    <v-combobox
                            v-model="bulkTagInput"
                            label="Tags"
                            multiple
                            chips
                            small-chips
                            deletable-chips
                            outlined
                            dense
                            hint="Type a tag and press Enter"
                            persistent-hint
                    ></v-combobox>
                </v-card-text>
                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="bulkTagDialog = false">Cancel</v-btn>
                    <v-btn color="primary" elevation="0" :loading="bulkLoading" @click="applyBulkTags">Apply</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>


        <v-row dense class="mt-4">
            <v-col>
                <v-card>
                    <!-- G67 bulk actions bar -->
                    <div v-if="selected.length" class="d-flex align-center pa-2 pl-4 bulk-bar">
                        <span class="text-body-2 font-weight-medium mr-4">{{ selected.length }} selected</span>
                        <v-btn small color="secondary" elevation="0" class="mr-2" @click="openBulkTags">
                            <v-icon small class="mr-1">mdi-tag-multiple-outline</v-icon>Tags
                        </v-btn>
                        <v-btn small color="secondary" elevation="0" class="mr-2" :loading="bulkLoading" @click="bulkArchive">
                            <v-icon small class="mr-1">mdi-archive-arrow-down-outline</v-icon>Archive
                        </v-btn>
                        <v-btn small color="red" elevation="0" class="mr-2" :loading="bulkLoading" @click="bulkDelete">
                            <v-icon small class="mr-1">mdi-trash-can-outline</v-icon>Delete
                        </v-btn>
                        <v-spacer></v-spacer>
                        <v-btn small text @click="selected = []">Clear selection</v-btn>
                    </div>
                    <v-data-table v-col-resize:offers="headers"
                            v-model="selected"
                            show-select
                            :item-class="rowClass"
                            :headers="headers"
                            :items="filteredOffers"
                            dense
                            :loading="loadingOffers"
                            :items-per-page="10"
                            :footer-props="{ 'items-per-page-options': [10, 25, 50] }"
                    >
                        <template v-slot:item.countries="{ item }">
                            {{ item.countries.map(c => c.code).join(', ') }}
                        </template>

                        <template v-slot:item.tags="{ item }">
                            <v-chip v-for="t in (item.tags || [])" :key="t" x-small outlined class="mr-1 tag-chip">{{ t }}</v-chip>
                            <span v-if="!(item.tags || []).length" class="grey--text">-</span>
                        </template>

                        <template v-slot:item.created_at="{ item }">
                            {{ $formatDate(item.created_at) }}
                        </template>

                        <template v-slot:item.updated_at="{ item }">
                            {{ $formatDate(item.updated_at) }}
                        </template>

                        <template v-slot:item.actions="{ item }">
                            <v-tooltip bottom v-if="isArchived(item)">
                                <template v-slot:activator="{ on, attrs }">
                                    <v-btn icon small color="success" v-bind="attrs" v-on="on" @click="restoreOffer(item)">
                                        <v-icon small>mdi-archive-arrow-up-outline</v-icon>
                                    </v-btn>
                                </template>
                                <span>Restore from archive</span>
                            </v-tooltip>
                            <v-tooltip bottom>
                                <template v-slot:activator="{ on, attrs }">
                                    <v-btn icon small color="primary" v-bind="attrs" v-on="on" @click="openEdit(item)">
                                        <v-icon small>mdi-pencil-outline</v-icon>
                                    </v-btn>
                                </template>
                                <span>Edit</span>
                            </v-tooltip>
                            <v-tooltip bottom>
                                <template v-slot:activator="{ on, attrs }">
                                    <v-btn icon small color="red" v-bind="attrs" v-on="on" @click="deleteOffer(item)">
                                        <v-icon small>mdi-trash-can-outline</v-icon>
                                    </v-btn>
                                </template>
                                <span>Delete</span>
                            </v-tooltip>
                        </template>

                        <template v-slot:no-data>
                            <div class="empty-state">
                                <v-icon>mdi-inbox-outline</v-icon>
                                <div class="mt-2">No data yet</div>
                            </div>
                        </template>

                    </v-data-table>
                </v-card>
            </v-col>
        </v-row>

        <confirm-dialog-component ref="confirm" />
    </v-container>
</script>

                    {code: 'WF', name: 'Wallis and Futuna'}, {code: 'EH', name: 'Western Sahara'}, {code: 'YE', name: 'Yemen'},
                    {code: 'ZM', name: 'Zambia'}, {code: 'ZW', name: 'Zimbabwe'}
                ]
            }
        },
        computed:
            {
                dateRangeText() {
                    return this.date_range.join(' ~ ')
                }
                ,
                overflowOptions() {
                    return this.offers.filter(o => o.id !== this.form.id);
                }
                ,
                filteredOffers() {
                    if (this.showArchived) return this.offers;
                    return this.offers.filter(o => !this.isArchived(o));
                }
                ,
            }
        ,
        mounted() {
            this.$vuetify.theme.dark = (document.documentElement.dataset.theme === 'dark');
            this.loadOffers();
            this.$root.$on('load-offers', this.loadOffers);
        },
        mounted() {
            this.$vuetify.theme.dark = (document.documentElement.dataset.theme === 'dark');
            this.loadOffers();
            this.loadArchivedIds();
            this.$root.$on('load-offers', this.loadOffers);
        },
        methods: {
            isArchived(item) {
                return this.archivedIds.indexOf(item.id) >= 0;
            },
            rowClass(item) {
                return this.isArchived(item) ? 'archived-row' : '';
            },
            async loadArchivedIds() {
                try {
                    const res = await fetch('/backend/api/archive/', {credentials: 'include'});
                    if (!res.ok) return;
                    const data = await res.json();
                    this.archivedIds = data.offers || [];
                } catch (e) { /* non-critical */ }
            },
            async restoreOffer(item) {
                try {
                    const res = await fetch(`/backend/api/archive/offers/${item.id}/restore`, {
                        method: 'POST', credentials: 'include'});
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    this.$root.$emit('show-message', {type: 'success',
                        text: `Offer "${item.name}" restored`});
                    this.loadOffers();
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error',
                        text: 'Restore failed: ' + sanitizeToastMessage(err.message)});
                }
            },
            openBulkTags() {
                this.bulkTagInput = [];
                this.bulkTagMode = 'tags_add';
                this.bulkTagDialog = true;
            },
            async applyBulkTags() {
                const tags = (this.bulkTagInput || []).map(t => String(t).trim()).filter(Boolean);
                if (!tags.length) {
                    this.$root.$emit('show-message', {type: 'error', text: 'Add at least one tag first.'});
                    return;
                }
                this.bulkLoading = true;
                try {
                    const res = await fetch('/backend/api/offers/bulk', {
                        method: 'POST',
                        credentials: 'include',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ids: this.selected.map(o => o.id),
                                              action: this.bulkTagMode, tags})
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    this.bulkTagDialog = false;
                    this.selected = [];
                    this.loadOffers();
                    this.$root.$emit('show-message', {type: 'success', text: 'Tags applied'});
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error',
                        text: 'Bulk tagging failed: ' + sanitizeToastMessage(err.message)});
                } finally {
                    this.bulkLoading = false;
                }
            },
            async bulkArchive() {
                const ok = await this.$refs.confirm.open(
                    'Archive Offers',
                    `Archive ${this.selected.length} offer(s)? They disappear from the lists but can be restored.`,
                    'Archive');
                if (!ok) return;
                await this.runBulk('archive');
            },
            async bulkDelete() {
                const ok = await this.$refs.confirm.open(
                    'Delete Offers',
                    `Permanently delete ${this.selected.length} offer(s)? This cannot be undone.`,
                    'Delete');
                if (!ok) return;
                await this.runBulk('delete');
            },
            async runBulk(action) {
                this.bulkLoading = true;
                try {
                    const res = await fetch('/backend/api/offers/bulk', {
                        method: 'POST',
                        credentials: 'include',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ids: this.selected.map(o => o.id), action})
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    this.selected = [];
                    this.loadOffers();
                    this.$root.$emit('show-message', {type: 'success', text: `Bulk ${action} done`});
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error',
                        text: `Bulk ${action} failed: ` + sanitizeToastMessage(err.message)});
                } finally {
                    this.bulkLoading = false;
                }
            },
            async exportCsv() {
                this.exporting = true;
                try {
                    const res = await fetch('/backend/api/offers/export', {credentials: 'include'});
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const blob = await res.blob();
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'offers.csv';
                    a.click();
                    URL.revokeObjectURL(a.href);
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error',
                        text: 'Export failed: ' + sanitizeToastMessage(err.message)});
                } finally {
                    this.exporting = false;
                }
            },
            openImport() {
                this.importText = '';
                this.importResults = [];
                this.importDialog = true;
            },
            closeImport() {
                if (this.importResults.length) this.loadOffers();
                this.importDialog = false;
            },
            async runImport() {
                this.importLoading = true;
                try {
                    const res = await fetch('/backend/api/offers/import', {
                        method: 'POST',
                        credentials: 'include',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({lines: this.importText})
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'HTTP ' + res.status);
                    this.importResults = data.results || [];
                    this.$root.$emit('show-message', {type: 'success',
                        text: `Import done: ${data.imported} ok, ${data.failed} failed`});
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error',
                        text: 'Import failed: ' + sanitizeToastMessage(err.message)});
                } finally {
                    this.importLoading = false;
                }
            },
            countryFilter(item, queryText) {
                const q = (queryText || '').toLowerCase();
                return item.code.toLowerCase().indexOf(q) > -1 || item.name.toLowerCase().indexOf(q) > -1;
            },
            openNetworkDialog() {
                this.networkForm = {name: '', offer_parameters: '', s2s_postback: ''};
                this.networkDialog = true;
            },
            async createNetwork() {
                if (!this.networkForm.name) {
                    this.$root.$emit("show-message", {type: "error", text: "Network name is required."});
                    return;
                }
                this.networkSaving = true;
                try {
                    const res = await fetch("/backend/api/affiliate-networks/", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        credentials: "include",
                        body: JSON.stringify(this.networkForm)
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || "Failed to create network");
                    this.networkDialog = false;
                    await this.loadAffiliateNetworks();
                    // Select the freshly created network on the offer being edited
                    this.form.affiliate_network_id = data.id;
                    this.$root.$emit("show-message", {type: "success", text: "Affiliate network created"});
                } catch (err) {
                    this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                } finally {
                    this.networkSaving = false;
                }
            },
            loadAffiliateNetworks() {
                fetch("/backend/api/affiliate-networks/", {
                    credentials: "include"
                })
                    .then(res => res.json())
                    .then(data => {
                        this.affiliateNetworks = data;
                    })
                    .catch(err => {
                        console.error(err);
                        this.$root.$emit("show-message", {
                            type: "error",
                            text: "Failed to load affiliate networks"
                        });
                    });
            },
            loadOffers() {
                this.loadAffiliateNetworks();
                this.loadingOffers = true;
                fetch("/backend/api/offers/", {
                    credentials: "include"
                })
                    .then(res => res.json())
                    .then(data => {
                        this.offers = data;
                    })
                    .catch(err => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    })
                    .finally(() => {
                        this.loadingOffers = false;
                    });
            },

            openCreate() {
                this.loadAffiliateNetworks();
                this.isEdit = false;
                this.dialog = true;
                this.form = {
                    id: null,
                    name: '',
                    url: '',
                    affiliate_network_id: null,
                    countries: [],
                    payout: 0,
                    currency: 'USD',
                    status: 'active',
                    tokens: {},
                    notes: '',
                    tags: [],
                    daily_conversions_cap: null,
                    overflow_offer_id: null
                };
            },

            openEdit(offer) {
                this.loadAffiliateNetworks();
                this.isEdit = true;
                this.dialog = true;
                this.form = {
                    id: offer.id,
                    name: offer.name,
                    url: offer.url,
                    affiliate_network_id: offer.affiliate_network_id,
                    countries: offer.countries || [],
                    payout: offer.payout,
                    currency: offer.currency || 'USD',
                    status: offer.status || 'active',
                    tokens: offer.tokens || {},
                    notes: offer.notes || '',
                    tags: offer.tags || [],
                    daily_conversions_cap: offer.daily_conversions_cap || null,
                    overflow_offer_id: offer.overflow_offer_id || null
                };
            },

            save() {
                if (!this.form.name || !this.form.url) {
                    this.$root.$emit("show-message", {
                        type: "error",
                        text: "Name and URL are required."
                    });
                    return;
                }

                const payload = {
                    name: this.form.name,
                    url: this.form.url,
                    affiliate_network_id: this.form.affiliate_network_id,
                    countries: this.form.countries,
                    payout: this.form.payout,
                    currency: this.form.currency,
                    status: this.form.status,
                    tokens: this.form.tokens,
                    notes: this.form.notes,
                    tags: this.form.tags,
                    daily_conversions_cap: this.form.daily_conversions_cap || null,
                    overflow_offer_id: this.form.overflow_offer_id || null
                };

                const method = this.isEdit ? "PATCH" : "POST";
                const url = this.isEdit
                    ? `/backend/api/offers/${this.form.id}`
                    : `/backend/api/offers/`;

                fetch(url, {
                    method,
                    headers: {"Content-Type": "application/json"},
                    credentials: "include",
                    body: JSON.stringify(payload)
                })
                    .then(async res => {
                        const text = await res.text();
                        if (!res.ok) {
                            let message = text;
                            try {
                                const json = JSON.parse(text);
                                message = json.detail || message;
                            } catch {
                            }
                            throw new Error(message);
                        }
                        this.dialog = false;
                        this.$root.$emit("show-message", {
                            type: "success",
                            text: this.isEdit ? "Offer updated" : "Offer created"
                        });
                        this.loadOffers();
                    })
                    .catch(err => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    });
            },

            async deleteOffer(offer) {
                const ok = await this.$refs.confirm.open('Delete Offer', 'Are you sure you want to delete this offer? This cannot be undone.');
                if (!ok) return;

                fetch(`/backend/api/offers/${offer.id}`, {
                    method: "DELETE",
                    credentials: "include"
                })
                    .then(async res => {
                        const text = await res.text();
                        if (!res.ok) {
                            let msg = text;
                            try {
                                const json = JSON.parse(text);
                                msg = json.detail || msg;
                            } catch {
                            }
                            throw new Error(msg);
                        }
                        this.$root.$emit("show-message", {
                            type: "success",
                            text: "Offer deleted"
                        });
                        this.loadOffers();
                    })
                    .catch(err => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    });
            },

            close() {
                this.dialog = false;
            }
        }

    })
    ;
</script>

    }
