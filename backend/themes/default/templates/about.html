<script type="text/x-template" id="about-template">
    <v-container fluid>
        <div class="page-title">Documentation</div>
        <div class="page-subtitle mb-4">About AAA Tracker and its sections</div>

        <v-row class="mt-2">
            <v-col cols="3">
                <v-card flat class="py-2">
                <v-tabs vertical
                v-model="tabAbout">
                    <v-tab><v-icon small left>mdi-text-box-search-outline</v-icon>Logs</v-tab>
                    <v-tab><v-icon small left>mdi-information-outline</v-icon>Overview</v-tab>
                    <v-tab><v-icon small left>mdi-view-dashboard-outline</v-icon>Dashboard</v-tab>
                    <v-tab><v-icon small left>mdi-bullhorn-outline</v-icon>Campaigns</v-tab>
                    <v-tab><v-icon small left>mdi-file-document-outline</v-icon>Landing Pages</v-tab>
                    <v-tab><v-icon small left>mdi-handshake-outline</v-icon>Affiliate Networks</v-tab>
                    <v-tab><v-icon small left>mdi-tag-outline</v-icon>Offers</v-tab>
                    <v-tab><v-icon small left>mdi-share-variant-outline</v-icon>Sources</v-tab>
                    <v-tab><v-icon small left>mdi-chart-box-outline</v-icon>Reports</v-tab>
                    {% if is_authenticated_user_type == 'admin' %}
                    <v-tab><v-icon small left>mdi-earth</v-icon>Domains</v-tab>
                    <v-tab><v-icon small left>mdi-cog-outline</v-icon>Settings</v-tab>
                    <v-tab><v-icon small left>mdi-account-group-outline</v-icon>Users</v-tab>
                    <v-tab><v-icon small left>mdi-pulse</v-icon>System status</v-tab>
                    {% endif %}
                </v-tabs>
                </v-card>
            </v-col>

            <v-col cols="9">
                <v-card flat class="pa-4">
                <v-tabs-items v-model="tabAbout">
                    <v-tab-item>
                        <div class="about-heading">Logs</div>
                        <p>
                            AAA Tracker Logs links
                            <a href="/_aaa_tracker_debug" target="_blank">View logs</a>
                        </p>
                    </v-tab-item>
                    <v-tab-item>
                        <div class="about-heading">Overview</div>
                        <p>
                            AAA Tracker is a web application designed to help you manage and track your affiliate marketing campaigns.
                            It provides a user-friendly interface for managing offers, sources, reports, and domains.
                            The application is built using modern web technologies, including Vue.js and Vuetify, to ensure a smooth
                            and responsive user experience.

                            The application is designed to be easy to use, with a clean and intuitive interface that allows you to
                            quickly navigate through different sections. You can easily add, edit, and delete offers, sources, and
                            domains, as well as view detailed reports on your campaigns' performance.
                        </p>
                    </v-tab-item>

                    <v-tab-item>
                        <div class="about-heading">Dashboard</div>
                        <p>
                            The main overview of your advertising performance. It displays real-time metrics like
                            clicks, unique clicks, conversions, cost, revenue, and ROI. You can filter by date range and quickly spot
                            trends, spikes, or drops in your campaigns. This is your central command center for quick insights.
                        </p>
                    </v-tab-item>

                    <v-tab-item>
                        <div class="about-heading">Campaigns</div>
                        <p>
                            These are traffic entry points that connect your sources with landing pages and offers.
                            Each campaign defines the flow rules, country targeting, devices, rotation logic, and how tokens are passed.
                            You control how traffic is routed and optimized using advanced rules and flow logic.
                        </p>
                    </v-tab-item>

                    <v-tab-item>
                        <div class="about-heading">Landing Pages</div>
                        <p>
                            These are pre-offer pages used to warm up visitors or capture data before redirecting
                            them to the offer. In this section, you can upload landing files (ZIP, HTML, PHP), assign tags, and
                            configure how landers behave inside campaign flows. You can also A/B test landers.
                        </p>
                    </v-tab-item>

                    <v-tab-item>
                        <div class="about-heading">Affiliate Networks</div>
                        <p>
                            This is where you manage your partnerships with external affiliate networks. You
                            define the S2S postback structure, tokens, and offer tracking parameters.
                        </p>
                    </v-tab-item>

                    <v-tab-item>
                        <div class="about-heading">Offers</div>
                        <p>
                            The final destinations where your traffic is sent. Each offer includes a payout, targeting
                            (countries), currency, tokens, and is linked to an affiliate network.
                        </p>
                    </v-tab-item>

                    <v-tab-item>
                        <div class="about-heading">Sources</div>
                        <p>
                            Defines your traffic source configurations. You can predefine UTM
                            parameters, postback URLs, and token structures.
                        </p>
                    </v-tab-item>

                    <v-tab-item>
                        <div class="about-heading">Reports</div>
                        <p>
                            Your performance breakdown hub. Get detailed analytics on campaigns, landers, offers,
                            countries, devices, conversions, and more.
                        </p>
                    </v-tab-item>

                    {% if is_authenticated_user_type == 'admin' %}
                    <v-tab-item>
                        <div class="about-heading">Domains</div>
                        <p>
                            Manage your tracking and redirect domains. You can add custom domains, group them,
                            configure HTTPS redirects, and assign specific domains to campaigns or flows.
                        </p>
                    </v-tab-item>

                    <v-tab-item>
                        <div class="about-heading">Settings</div>
                        <p>
                            The system-wide configuration panel. Adjust timezone, currency, logging behavior,
                            auto-refresh reports, token behavior, default parameters, and more.
                        </p>
                    </v-tab-item>

                    <v-tab-item>
                        <div class="about-heading">Users</div>
                        <p>
                            Manage access to your tracker. Create users, assign roles, and control login access.
                        </p>
                    </v-tab-item>

                    <v-tab-item>
                        <div class="about-heading">System status</div>
                        {% raw %}
                        <div v-if="status" class="mt-2">
                            <v-row dense>
                                <v-col cols="6" sm="3" v-for="card in statusCards" :key="card.title">
                                    <v-card class="pa-3 stat-card">
                                        <div class="text-caption grey--text text--darken-1">{{ card.title }}</div>
                                        <div class="text-h6 font-weight-bold mt-2" :class="card.colorClass">{{ card.value }}</div>
                                        <div v-if="card.hint" class="caption grey--text mt-1">{{ card.hint }}</div>
                                    </v-card>
                                </v-col>
                            </v-row>

                            <div class="about-heading mt-6">Background loops</div>
                            <v-simple-table dense>
                                <thead>
                                <tr><th>Loop</th><th>Last run</th></tr>
                                </thead>
                                <tbody>
                                <tr v-for="(ts, name) in status.loops" :key="name">
                                    <td class="text-capitalize">{{ name }}</td>
                                    <td>
                                        <span v-if="ts">{{ $formatDate(ts) }}</span>
                                        <span v-else class="grey--text">not yet</span>
                                    </td>
                                </tr>
                                </tbody>
                            </v-simple-table>

                            <div class="caption grey--text mt-4">
                                App version {{ status.version }} · polls every 15s
                                <template v-if="status.landings_disk">
                                    · landings disk {{ status.landings_disk.used_gb }}/{{ status.landings_disk.total_gb }} GB free
                                </template>
                            </div>
                        </div>
                        <div v-else class="mt-4 grey--text">
                            {{ statusError || 'Loading status…' }}
                        </div>
                        {% endraw %}
                    </v-tab-item>
                    {% endif %}

                </v-tabs-items>
                </v-card>
            </v-col>
        </v-row>
    </v-container>
</script>


<script type="application/javascript">
    Vue.component('about-component', {
        template: '#about-template',
        data() {
            return {
                tabAbout: 0,
                status: null,
                statusError: '',
                statusTimer: null,
            }
        },
        computed: {
            statusCards() {
                if (!this.status) return [];
                const s = this.status;
                const dbCard = (name, db) => ({
                    title: name,
                    value: db.ok ? 'Up' : 'Down',
                    colorClass: db.ok ? 'success--text' : 'red--text',
                    hint: db.ok && db.latency_ms != null ? db.latency_ms + ' ms' : '',
                });
                return [
                    {title: 'Version', value: s.version || '—', colorClass: '', hint: ''},
                    dbCard('Postgres', s.postgres || {}),
                    dbCard('ClickHouse', s.clickhouse || {}),
                    {title: 'Clicks (24h)', value: Number(s.clicks_24h || 0).toLocaleString(), colorClass: '', hint: ''},
                    {title: 'Conversions (24h)', value: Number(s.conversions_24h || 0).toLocaleString(), colorClass: '', hint: ''},
                ];
            },
        },
        mounted() {
            this.$vuetify.theme.dark = (document.documentElement.dataset.theme === 'dark');
            if (this.$root.roleLabel === 'admin') {
                this.loadStatus();
                this.statusTimer = setInterval(this.loadStatus, 15000);
            }
        },
        beforeDestroy() {
            if (this.statusTimer) clearInterval(this.statusTimer);
        },
        methods: {
            loadStatus() {
                if (this.$root.roleLabel !== 'admin') return;
                fetch('/backend/api/status', {credentials: 'include'})
                    .then(res => {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(data => {
                        this.status = data;
                        this.statusError = '';
                    })
                    .catch(err => {
                        this.status = null;
                        this.statusError = 'Status unavailable (' + err.message + ')';
                    });
            },
        },
    });
</script>

<style>
    .about-heading {
        font-size: var(--fs-16, 16px);
        font-weight: 600;
        margin-bottom: var(--space-2, 8px);
    }
</style>
