{% raw %}
<script type="text/x-template" id="dashboard-template">
    <div>
        <div class="d-flex align-center justify-space-between mb-4">
            <div>
                <div class="page-title">Dashboard</div>
                <div class="page-subtitle">Performance overview across all campaigns</div>
            </div>
            <v-btn color="primary" elevation="0" :loading="loading" @click="loadData()">
                <v-icon small class="mr-1">mdi-refresh</v-icon>Refresh
            </v-btn>
        </div>

        <!-- Onboarding checklist for a new workspace: reads
             GET /api/tenants/onboarding; dismissible per workspace. -->
        <v-row dense v-if="showOnboarding">
            <v-col cols="12">
                <v-card class="pa-4 onboarding-card">
                    <div class="d-flex align-center flex-wrap mb-3">
                        <v-avatar :color="onboarding.complete ? '#0f9d581f' : '#1f4bf01f'" size="40" class="mr-3">
                            <v-icon small :color="onboarding.complete ? '#0f9d58' : '#1f4bf0'">mdi-rocket-launch-outline</v-icon>
                        </v-avatar>
                        <div class="font-weight-medium mr-3">
                            {{ onboarding.complete ? 'Workspace setup complete' : 'Finish setting up your workspace' }}
                        </div>
                        <span class="caption grey--text">{{ onboardingDoneCount }} of {{ onboardingSteps.length }} done</span>
                        <v-spacer></v-spacer>
                        <v-btn icon small @click="dismissOnboarding" aria-label="Dismiss setup checklist">
                            <v-icon small>mdi-close</v-icon>
                        </v-btn>
                    </div>
                    <v-progress-linear :value="onboardingProgress" height="4" rounded color="primary" class="mb-3"></v-progress-linear>
                    <div class="onboarding-list">
                        <div v-for="step in onboardingStepsState" :key="step.key"
                             class="onboarding-step d-flex align-center py-1">
                            <v-icon small class="mr-2" :color="step.done ? 'success' : 'grey'">
                                {{ step.done ? 'mdi-check-circle' : 'mdi-circle-outline' }}
                            </v-icon>
                            <span :class="{'onboarding-done': step.done}">{{ step.label }}</span>
                            <span class="caption grey--text ml-2 d-none d-sm-inline">{{ step.hint }}</span>
                            <v-spacer></v-spacer>
                            <v-btn v-if="!step.done" text x-small color="primary" @click="goToOnboardingStep(step)">
                                Open<v-icon x-small class="ml-1">mdi-arrow-right</v-icon>
                            </v-btn>
                        </div>
                    </div>
                </v-card>
            </v-col>
        </v-row>

        <!-- Stat cards -->
        <v-row dense>
            <v-col v-for="metric in metrics" :key="metric.title" cols="6" sm="4" md="2">
                <v-card class="pa-4 stat-card">
                    <template v-if="loading">
                        <v-skeleton-loader type="text, heading" class="mt-1"></v-skeleton-loader>
                    </template>
                    <template v-else>
                        <div class="d-flex align-center">
                            <v-avatar :color="metric.color + '1f'" size="40" class="mr-3">
                                <v-icon small :color="metric.color">{{ metric.icon }}</v-icon>
                            </v-avatar>
                            <div class="text-caption grey--text text--darken-1">{{ metric.title }}</div>
                        </div>
                        <div class="text-h5 font-weight-bold mt-3" :class="metric.title === 'ROI' ? (String(metric.value).startsWith('-') ? 'num-neg' : 'num-pos') : ''">{{ metric.value }}</div>
                        <div v-if="metric.delta" class="text-caption compare-delta mt-1" :class="metric.deltaClass">
                            <v-icon x-small>{{ metric.deltaIcon }}</v-icon>
                            {{ metric.delta }} vs previous period
                        </div>
                    </template>
                </v-card>
            </v-col>
        </v-row>

        <!-- Fraud watch (admin): 24h bot share, bot clicks, est. savings -->
        <v-row dense v-if="fraudSummary">
            <v-col cols="12">
                <v-card class="pa-4 stat-card fraud-watch-card" @click="goToFraud">
                    <div class="d-flex align-center flex-wrap">
                        <v-avatar color="#d93a3a1f" size="40" class="mr-3">
                            <v-icon small color="#d93a3a">mdi-shield-alert-outline</v-icon>
                        </v-avatar>
                        <div class="font-weight-medium mr-4">Fraud watch</div>
                        <span class="caption grey--text mr-4">
                            Bot share (24h):
                            <strong class="fraud-watch-num" :class="fraudSummary.bot_share_pct >= 10 ? 'num-neg' : 'num-pos'">{{ fraudSummary.bot_share_pct }}%</strong>
                        </span>
                        <span class="caption grey--text mr-4">
                            Bot clicks:
                            <strong class="fraud-watch-num">{{ Number(fraudSummary.bot_clicks || 0).toLocaleString() }}</strong>
                        </span>
                        <span class="caption grey--text mr-4">
                            Est. savings:
                            <strong class="fraud-watch-num num-pos">${{ Number(fraudSummary.est_savings || 0).toFixed(2) }}</strong>
                        </span>
                        <v-spacer></v-spacer>
                        <v-btn text small color="primary" @click.stop="goToFraud">
                            Open fraud dashboard<v-icon small class="ml-1">mdi-arrow-right</v-icon>
                        </v-btn>
                    </div>
                </v-card>
            </v-col>
        </v-row>

        <!-- G56: anomaly insights (admin; hidden silently with zero findings) -->
        <v-row dense v-if="insightsSummary">
            <v-col cols="12">
                <v-card class="pa-4 stat-card insights-card" @click="goToInsights">
                    <div class="d-flex align-center flex-wrap">
                        <v-avatar :color="insightsSummary.critical ? '#d93a3a1f' : '#b8770a1f'" size="40" class="mr-3">
                            <v-icon small :color="insightsSummary.critical ? '#d93a3a' : '#b8770a'">mdi-brain</v-icon>
                        </v-avatar>
                        <div class="font-weight-medium mr-4">Insights</div>
                        <span v-if="insightsSummary.critical" class="caption mr-4">
                            <span class="status-chip status-chip--danger">{{ insightsSummary.critical }} critical</span>
                        </span>
                        <span v-if="insightsSummary.warning" class="caption mr-4">
                            <span class="status-chip status-chip--warning">{{ insightsSummary.warning }} warning</span>
                        </span>
                        <span v-if="insightsSummary.info" class="caption grey--text mr-4">{{ insightsSummary.info }} info</span>
                        <span class="caption grey--text">last run {{ insightsSummary.run_at ? $formatDate(insightsSummary.run_at) : '—' }}</span>
                        <v-spacer></v-spacer>
                        <v-btn text small color="primary" @click.stop="goToInsights">
                            Review findings<v-icon small class="ml-1">mdi-arrow-right</v-icon>
                        </v-btn>
                    </div>
                </v-card>
            </v-col>
        </v-row>

        <!-- Filters -->
        <v-card class="mt-4 pa-4">
            <div class="filter-bar align-center">
                <div>
                    <v-chip v-for="preset in datePresets" :key="preset.label"
                            small label outlined
                            :color="activePreset === preset.label ? 'primary' : 'grey'"
                            :class="activePreset === preset.label ? 'primary--text' : 'grey--text text--darken-2'"
                            class="mr-1 mb-1"
                            @click="applyPreset(preset)">
                        {{ preset.label }}
                    </v-chip>
                </div>
                <v-spacer></v-spacer>
                <v-menu v-model="date_menu2" :close-on-content-click="false" transition="scale-transition" offset-y min-width="auto">
                    <template v-slot:activator="{ on, attrs }">
                        <v-text-field
                                v-model="dateRangeText"
                                label="Custom range"
                                prepend-icon="mdi-calendar"
                                readonly
                                v-bind="attrs"
                                v-on="on"
                                outlined
                                dense
                                hide-details
                                class="range-field"
                        ></v-text-field>
                    </template>
                    <v-card>
                        <v-date-picker v-model="filters.date_range" range no-title :first-day-of-week="1"></v-date-picker>
                        <v-card-actions class="pt-0">
                            <v-spacer></v-spacer>
                            <v-btn text small @click="cancelCustomRange">Cancel</v-btn>
                            <v-btn color="primary" elevation="0" small @click="applyCustomRange">Apply</v-btn>
                        </v-card-actions>
                    </v-card>
                </v-menu>
                <span v-if="longRangeWarning" class="caption long-range-hint ml-2">
                    <v-icon x-small color="warning">mdi-timer-sand</v-icon>
                    Long range — can take up to a minute
                </span>
                <v-select
                        :items="['Hours', 'Days', 'Weeks', 'Months']"
                        label="Granularity"
                        v-model="filters.detailLevel"
                        outlined
                        dense
                        hide-details
                        class="detail-select"
                ></v-select>
                <v-select
                        :items="campaigns"
                        v-model="filters.campaigns"
                        label="Campaigns"
                        item-text="name"
                        item-value="id"
                        outlined
                        dense
                        hide-details
                        multiple
                        chips
                        small-chips
                        class="campaigns-select"
                ></v-select>
                <v-switch
                        v-model="compareMode"
                        label="Compare"
                        hide-details
                        dense
                        color="primary"
                        class="mt-0 ml-1"
                ></v-switch>
                <v-switch
                        v-model="liveMode"
                        label="Live"
                        hide-details
                        dense
                        color="primary"
                        class="mt-0 ml-1"
                ></v-switch>
            </div>
        </v-card>

        <!-- Main chart + tables: keyed by loading so the block re-enters with a
             soft fade+rise each time fresh data lands -->
        <div :key="'dash-main-' + loading" class="section-enter">

        <!-- Main chart -->
        <v-row class="mt-4">
            <v-col cols="12">
                <v-card class="pa-4">
                    <div class="d-flex align-center justify-space-between mb-2">
                        <div class="font-weight-medium">Performance over time</div>
                        <div class="d-flex align-center">
                            <v-btn text small color="primary" :disabled="!chartHasData" @click="exportChartCsv">
                                <v-icon small class="mr-1">mdi-download</v-icon>Export CSV
                            </v-btn>
                            <v-btn text small color="primary" @click="openAnnotations">
                                <v-icon small class="mr-1">mdi-bookmark-outline</v-icon>Annotations<template v-if="annotations.length"> ({{ annotations.length }})</template>
                            </v-btn>
                        </div>
                    </div>
                    <apexchart
                            height="400"
                            type="area"
                            :options="mainChart.chartOptions"
                            :series="mainChart.series"
                    ></apexchart>
                </v-card>
            </v-col>
        </v-row>

        <!-- G51: live click feed (raw feed; polls every 5s while Live is on) -->
        <v-row>
            <v-col cols="12">
                <v-card class="live-card">
                    <div class="d-flex align-center pa-4 pb-3">
                        <div class="font-weight-medium mr-3">Live clicks</div>
                        <span v-if="liveMode" class="live-pulse" title="Live polling active"></span>
                        <span class="live-count caption grey--text" v-if="liveClicks.length">{{ liveClicks.length }} shown</span>
                        <v-spacer></v-spacer>
                        <v-btn icon small @click="livePanelOpen = !livePanelOpen" :aria-label="livePanelOpen ? 'Collapse live feed' : 'Expand live feed'">
                            <v-icon small>{{ livePanelOpen ? 'mdi-chevron-up' : 'mdi-chevron-down' }}</v-icon>
                        </v-btn>
                    </div>
                    <v-expand-transition>
                        <div v-show="livePanelOpen" class="live-panel">
                            <div v-if="!liveClicks.length" class="live-empty grey--text">
                                <template v-if="liveMode">Waiting for clicks…</template>
                                <template v-else>Turn the Live switch on to stream incoming clicks</template>
                            </div>
                            <table v-else class="live-table">
                                <thead>
                                <tr>
                                    <th>Time</th>
                                    <th>Campaign</th>
                                    <th>Country</th>
                                    <th>Device</th>
                                    <th>Referrer</th>
                                    <th>Status</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr v-for="row in liveClicks" :key="row._key" :class="{ 'live-flash': row._flash }">
                                    <td class="live-time">{{ liveTime(row.received_at) }}</td>
                                    <td>{{ campaignName(row.campaign_id) }}</td>
                                    <td>{{ row.country || '—' }}</td>
                                    <td>{{ row.device_type || '—' }}</td>
                                    <td class="live-ref" :title="row.referrer">{{ liveReferrer(row.referrer) }}</td>
                                    <td>
                                        <span v-if="row.status" class="status-chip" :class="liveStatusClass(row.status)">{{ row.status }}</span>
                                        <span v-else-if="row.click" class="status-chip status-chip--info">click</span>
                                        <span v-else class="grey--text">visit</span>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </v-expand-transition>
                </v-card>
            </v-col>
        </v-row>

        <!-- Tables -->
        <v-row>
            <v-col cols="12">
                <v-card>
                    <div class="d-flex align-center justify-space-between pa-4 pb-0">
                        <div class="font-weight-medium">Recent visits</div>
                        <v-btn text small color="primary" :disabled="!visits.length" @click="exportVisitsCsv">
                            <v-icon small class="mr-1">mdi-download</v-icon>Export CSV
                        </v-btn>
                    </div>
                    <v-data-table v-col-resize:dash-visits="headers"
                            :headers="headers"
                            :items="visits"
                            :items-per-page="10"
                            :footer-props="{ 'items-per-page-options': [10, 25, 50] }"
                            :loading="loading"
                            dense
                    >
                        <template v-slot:no-data>
                            <div class="empty-state">
                                <v-icon>mdi-cursor-default-click-outline</v-icon>
                                <div class="mt-2">No visits yet — traffic will appear here once a campaign is live</div>
                                <v-btn small color="primary" elevation="0" class="mt-3" @click="goToCampaigns">
                                    <v-icon small class="mr-1">mdi-sitemap</v-icon>Go to campaigns
                                </v-btn>
                            </div>
                        </template>
                    </v-data-table>
                </v-card>
            </v-col>
        </v-row>

        </div>

        <!-- G57: annotations manage dialog -->
        <v-dialog v-model="annotationDialog" max-width="520">
            <v-card>
                <v-card-title class="text-h6">Annotations</v-card-title>
                <v-card-text>
                    <div class="caption grey--text mb-3">Vertical markers on the dashboard chart — shared across all campaigns.</div>
                    <div v-for="a in annotations" :key="a.id" class="d-flex align-center mb-2">
                        <span class="annotation-dot" :style="{ background: annotationColor(a.color) }"></span>
                        <span class="annotation-date">{{ a.date }}</span>
                        <span class="annotation-text">{{ a.text }}</span>
                        <v-spacer></v-spacer>
                        <v-btn icon x-small color="error" @click="deleteAnnotation(a)">
                            <v-icon small>mdi-trash-can-outline</v-icon>
                        </v-btn>
                    </div>
                    <v-divider v-if="annotations.length" class="my-3"></v-divider>
                    <v-row dense>
                        <v-col cols="4">
                            <v-menu v-model="annotationDateMenu" :close-on-content-click="false" offset-y min-width="auto">
                                <template v-slot:activator="{ on, attrs }">
                                    <v-text-field v-model="newAnnotation.date" label="Date" readonly outlined dense hide-details
                                                  prepend-icon="mdi-calendar" v-bind="attrs" v-on="on"></v-text-field>
                                </template>
                                <v-date-picker v-model="newAnnotation.date" no-title :first-day-of-week="1"
                                               @input="annotationDateMenu = false"></v-date-picker>
                            </v-menu>
                        </v-col>
                        <v-col cols="8">
                            <v-text-field v-model="newAnnotation.text" label="Note" outlined dense hide-details
                                          placeholder="e.g. Switched landing page" @keyup.enter="addAnnotation"></v-text-field>
                        </v-col>
                    </v-row>
                    <v-select v-model="newAnnotation.color" :items="annotationColorOptions" label="Color"
                              outlined dense hide-details class="mt-3"></v-select>
                </v-card-text>
                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="annotationDialog = false">Close</v-btn>
                    <v-btn color="primary" :disabled="!newAnnotation.date || !newAnnotation.text.trim()" @click="addAnnotation">Add</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>
    </div>
</script>

<script type="application/javascript">
    const DASH_CHART_COLORS = ['#1f4bf0', '#7a3dff', '#0f9d58', '#b8770a', '#0d7fa8'];
    const DASH_COLORS = {
        info: '#1f4bf0',
        unique: '#7a3dff',
        accent: '#0f9d58',
        danger: '#d93a3a',
        success: '#0b7a45',
        warning: '#b8770a',
    };

    // Onboarding checklist: each key mirrors a boolean in
    // GET /api/tenants/onboarding, with the section that completes it.
    const ONBOARDING_STEPS = [
        {key: 'has_team', label: 'Invite your team', hint: 'Add teammates and set their roles.', icon: 'mdi-account-plus-outline', section: 'users'},
        {key: 'has_traffic_source', label: 'Add a traffic source', hint: 'Tell the tracker where clicks come from.', icon: 'mdi-database-outline', section: 'sources'},
        {key: 'has_campaign', label: 'Create a campaign', hint: 'Group offers, landers and sources.', icon: 'mdi-sitemap', section: 'campaigns'},
        {key: 'has_offer', label: 'Add an offer', hint: 'Define what you are promoting.', icon: 'mdi-tag-outline', section: 'offers'},
        {key: 'has_domain', label: 'Connect a domain', hint: 'Serve landers from your own domain.', icon: 'mdi-domain', section: 'domains'},
        {key: 'has_integration', label: 'Set up an integration', hint: 'Send conversions to your ad platforms.', icon: 'mdi-connection', section: 'integrations'},
    ];

    // Toast helper shared by every section (all templates load in one shell):
    // cap length and never surface raw SQL/HTML error bodies.
    function sanitizeToastMessage(msg) {
        let text = String(msg == null ? 'Something went wrong' : msg).trim();
        if (text.indexOf('<') !== -1) text = 'Server error — check logs';
        if (text.length > 120) text = text.slice(0, 120) + '…';
        return text;
    }

    // Notify when the theme flips so charts and other canvas/pinned colors can re-color.
    if (!window.__themePatched && window.setTheme) {
        window.__themePatched = true;
        const __origSetTheme = window.setTheme;
        window.setTheme = function (t) {
            __origSetTheme(t);
            window.dispatchEvent(new CustomEvent('theme-changed', {detail: t}));
        };
    }

    Vue.component('dashboard-component', {
        template: '#dashboard-template',
        data() {
            return {
                loading: false,
                fraudSummary: null,
                insightsSummary: null,
                // Onboarding checklist (multi-tenancy phase 1)
                onboarding: null,
                onboardingDismissed: false,
                onboardingSteps: ONBOARDING_STEPS,
                liveMode: false,
                liveTimer: null,
                livePanelOpen: false,
                liveClicks: [],
                liveAfter: null,
                liveSeen: {},
                liveSeq: 0,
                annotationDialog: false,
                annotationDateMenu: false,
                annotations: [],
                newAnnotation: { date: new Date().toISOString().split('T')[0], text: '', color: 'info' },
                annotationColorOptions: [
                    { text: 'Info (blue)', value: 'info' },
                    { text: 'Success (green)', value: 'success' },
                    { text: 'Warning (amber)', value: 'warning' },
                    { text: 'Danger (red)', value: 'danger' },
                ],
                compareMode: false,
                previous: null,
                date_menu2: false,
                dateRangeBackup: null,
                activePreset: 'Last 30 days',
                datePresets: [
                    { label: 'Today', days: 0 },
                    { label: 'Yesterday', days: 1 },
                    { label: 'Last 7 days', days: 6 },
                    { label: 'Last 30 days', days: 29 },
                ],
                filters: {
                    campaigns: [],
                    date_range: [
                        new Date(new Date().setDate(new Date().getDate() - 29)).toISOString().split('T')[0],
                        new Date().toISOString().split('T')[0]
                    ],
                    detailLevel: 'Days',
                },
                campaigns: [],
                metrics: [
                    {title: 'Clicks', value: 0, color: DASH_COLORS.info, icon: 'mdi-cursor-default-click-outline'},
                    {title: 'Unique clicks', value: 0, color: DASH_COLORS.unique, icon: 'mdi-account-switch-outline'},
                    {title: 'Conversions', value: 0, color: DASH_COLORS.accent, icon: 'mdi-check-decagram-outline'},
                    {title: 'Cost', value: '$0', color: DASH_COLORS.danger, icon: 'mdi-cash-minus'},
                    {title: 'Revenue', value: '$0', color: DASH_COLORS.success, icon: 'mdi-cash-plus'},
                    {title: 'ROI', value: '0%', color: DASH_COLORS.warning, icon: 'mdi-trending-up'},
                ],
                mainChart: {
                    series: [
                        { name: 'Visits', data: [] },
                        { name: 'Unique visits', data: [] },
                        { name: 'Clicks', data: [] },
                        { name: 'Conversions', data: [] },
                        { name: 'Unique clicks', data: [] },
                    ],
                    chartOptions: {
                        chart: {
                            background: 'None',
                            id: 'basic-line',
                            stacked: false,
                            toolbar: { show: true },
                            zoom: { enabled: false }
                        },
                        dataLabels: { enabled: false },
                        stroke: {
                            curve: 'monotoneCubic'
                        },
                        theme: { mode: 'light' },
                        colors: DASH_CHART_COLORS,
                        xaxis: {
                            type: 'category',
                            labels: {
                                rotate: -45,
                                style: {
                                    colors: '#6b7280'
                                }
                            }
                        },
                        yaxis: {
                            labels: {
                                style: {
                                    colors: '#6b7280'
                                }
                            }
                        },
                        legend: {
                            position: 'top',
                            horizontalAlign: 'left'
                        },
                    }
                },
                headers: [
                    {text: 'IP', value: 'ip'},
                    {text: 'Country', value: 'country'},
                    {text: 'Url', value: 'url'},
                    {text: 'Referrer', value: 'referrer'},
                    {text: 'Time', value: 'received_at'},
                ],
                visits: [],
            }
        },
        computed: {
            dateRangeText() {
                return this.filters.date_range.join(' ~ ')
            },
            longRangeWarning() {
                const r = this.filters.date_range || [];
                if (r.length < 2) return false;
                const days = Math.round(Math.abs(new Date(r[1]) - new Date(r[0])) / 86400000) + 1;
                return days > 60;
            },
            onboardingStepsState() {
                const result = this.onboarding || {};
                return this.onboardingSteps.map(step => ({...step, done: !!result[step.key]}));
            },
            onboardingDoneCount() {
                return this.onboardingStepsState.filter(s => s.done).length;
            },
            onboardingProgress() {
                return this.onboardingSteps.length
                    ? Math.round(this.onboardingDoneCount / this.onboardingSteps.length * 100)
                    : 0;
            },
            showOnboarding() {
                return !!this.onboarding && !this.onboardingDismissed;
            },
            livePayload() {
                return {
                    campaigns: this.filters.campaigns,
                    date_from: this.filters.date_range[0],
                    date_to: this.filters.date_range[1],
                    detail_level: this.filters.detailLevel
                };
            },
            chartHasData() {
                return (this.mainChart.series[0] && this.mainChart.series[0].data.length > 0);
            },
        },
        mounted() {
            this.$vuetify.theme.dark = (document.documentElement.dataset.theme === 'dark');
            this.applyChartTheme();
            window.addEventListener('theme-changed', this.applyChartTheme);
            this.loadData();
            this.loadAnnotations();
            this.loadFraudSummary();
            this.loadInsightsSummary();
            this.loadOnboarding();
            document.addEventListener('visibilitychange', this.onVisibilityChange);
            this.$root.$on('load-dashboard', this.loadData);
        },
        beforeDestroy() {
            window.removeEventListener('theme-changed', this.applyChartTheme);
            document.removeEventListener('visibilitychange', this.onVisibilityChange);
            this.stopLiveFeed();
            this.stopLiveClicks();
        },
        watch: {
            date_menu2(open) {
                if (open) this.dateRangeBackup = this.filters.date_range.slice();
            },
            liveMode(on) {
                if (on) {
                    this.livePanelOpen = true;
                    this.loadVisits();
                    this.liveTimer = setInterval(this.loadVisits, 10000);
                    this.startLiveClicks();
                } else {
                    this.stopLiveFeed();
                    this.stopLiveClicks();
                }
            },
            compareMode() {
                this.loadData();
            },
        },
        methods: {
            applyChartTheme() {
                const css = getComputedStyle(document.documentElement);
                const val = n => (css.getPropertyValue(n) || '').trim();
                const dark = document.documentElement.dataset.theme === 'dark';
                const o = this.mainChart.chartOptions || {};
                const chart = o.chart || {};
                const grid = o.grid || {};
                const tooltip = o.tooltip || {};
                const legend = o.legend || {};
                const xaxis = o.xaxis || {};
                const yaxis = o.yaxis || {};
                const xlabels = xaxis.labels || {};
                const ylabels = yaxis.labels || {};
                this.mainChart.chartOptions = {
                    ...o,
                    theme: {mode: dark ? 'dark' : 'light'},
                    chart: {...chart, background: 'transparent'},
                    grid: {...grid, borderColor: val('--border') || '#e4e9f2'},
                    tooltip: {...tooltip, theme: dark ? 'dark' : 'light'},
                    legend: {...legend, labels: {...(legend.labels || {}), colors: [val('--text-primary') || '#0a0d16']}},
                    xaxis: {...xaxis, labels: {...xlabels, style: {...(xlabels.style || {}), colors: val('--text-secondary') || '#6b7280'}}},
                    yaxis: {...yaxis, labels: {...ylabels, style: {...(ylabels.style || {}), colors: val('--text-secondary') || '#6b7280'}}},
                };
            },
            loadVisits() {
                fetch('/backend/api/dashboard/visits', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(this.livePayload)
                })
                    .then(window.fetchJsonFromResponse)
                    .then(data => {
                        this.visits = Array.isArray(data) ? data : [];
                    })
                    .catch(err => console.error('visits', err));
            },
            stopLiveFeed() {
                if (this.liveTimer) {
                    clearInterval(this.liveTimer);
                    this.liveTimer = null;
                }
            },
            // --- fraud watch (admin-only endpoint; silently hidden for others) ---
            loadFraudSummary() {
                fetch('/backend/api/fraud/summary', {credentials: 'include'})
                    .then(window.fetchJsonFromResponse)
                    .then(data => {
                        this.fraudSummary = data;
                    })
                    .catch(() => {
                        this.fraudSummary = null;
                    });
            },
            goToFraud() {
                window.location.href = '/backend/fraud';
            },
            goToCampaigns() {
                window.location.href = '/backend/campaigns';
            },
            // --- G56 insights card (admin-only endpoint; hidden otherwise/empty) ---
            loadInsightsSummary() {
                fetch('/backend/api/insights/latest', {credentials: 'include'})
                    .then(window.fetchJsonFromResponse)
                    .then(data => {
                        const counts = {critical: 0, warning: 0, info: 0};
                        (data.findings || []).forEach(f => {
                            if (counts[f.severity] != null) counts[f.severity] += 1;
                        });
                        // hide silently when there is nothing worth surfacing
                        if (!counts.critical && !counts.warning) {
                            this.insightsSummary = null;
                            return;
                        }
                        this.insightsSummary = {
                            critical: counts.critical, warning: counts.warning,
                            info: counts.info, run_at: data.run_at || null,
                        };
                    })
                    .catch(() => {
                        this.insightsSummary = null;
                    });
            },
            goToInsights() {
                window.location.href = '/backend/fraud';
                try { localStorage.setItem('fraud_tab', 'insights'); } catch (e) {}
            },
            // --- onboarding checklist (workspace setup) ---
            loadOnboarding() {
                fetch('/backend/api/tenants/onboarding', {credentials: 'include'})
                    .then(window.fetchJsonFromResponse)
                    .then(data => {
                        this.onboarding = data;
                        let hidden = false;
                        try {
                            hidden = localStorage.getItem('aaa_onboarding_dismissed_' + data.tenant_id) === '1';
                        } catch (e) { /* private mode — the checklist just stays visible */ }
                        this.onboardingDismissed = hidden;
                    })
                    .catch(() => { this.onboarding = null; });
            },
            dismissOnboarding() {
                this.onboardingDismissed = true;
                if (this.onboarding) {
                    try {
                        localStorage.setItem('aaa_onboarding_dismissed_' + this.onboarding.tenant_id, '1');
                    } catch (e) { /* private mode */ }
                }
            },
            goToOnboardingStep(step) {
                window.location.href = '/backend/' + step.section;
            },
            // --- G51: live click feed ---
            onVisibilityChange() {
                // Resume immediately when the tab becomes visible again
                if (!document.hidden && this.liveMode && this.liveClicksTimer) {
                    this.pollLiveClicks();
                }
            },
            startLiveClicks() {
                this.liveClicks = [];
                this.liveAfter = null;
                this.liveSeen = {};
                this.pollLiveClicks();
                if (this.liveClicksTimer) clearInterval(this.liveClicksTimer);
                this.liveClicksTimer = setInterval(this.pollLiveClicks, 5000);
            },
            stopLiveClicks() {
                if (this.liveClicksTimer) {
                    clearInterval(this.liveClicksTimer);
                    this.liveClicksTimer = null;
                }
            },
            pollLiveClicks() {
                if (document.hidden) return;  // pause while the tab is in the background
                const params = this.liveAfter ? '?after=' + encodeURIComponent(this.liveAfter) : '';
                fetch('/backend/api/dashboard/live-clicks' + params)
                    .then(window.fetchJsonFromResponse)
                    .then(rows => {
                        if (!Array.isArray(rows) || !rows.length) return;
                        const fresh = [];
                        rows.forEach(r => {
                            const key = (r.visitor_id || '') + '@' + r.received_at;
                            if (this.liveSeen[key]) return;
                            this.liveSeen[key] = true;
                            this.$set(r, '_key', 'lc-' + (++this.liveSeq));
                            this.$set(r, '_flash', !!this.liveAfter);
                            fresh.push(r);
                            if (!this.liveAfter || String(r.received_at) > String(this.liveAfter)) {
                                this.liveAfter = r.received_at;
                            }
                        });
                        if (fresh.length) {
                            // rows arrive newest-first — keep that order on top of the feed
                            this.liveClicks = [...fresh, ...this.liveClicks].slice(0, 60);
                            this.$nextTick(() => {
                                fresh.forEach(r => setTimeout(() => { r._flash = false; }, 1600));
                            });
                        }
                    })
                    .catch(err => console.error('live-clicks', err));
            },
            liveTime(ts) {
                const s = String(ts || '');
                return s.includes('T') ? (s.split('T')[1] || '').slice(0, 8) : s;
            },
            campaignName(id) {
                const c = this.campaigns.find(x => x.id === id);
                return c ? c.name : (id == null ? '—' : '#' + id);
            },
            liveReferrer(ref) {
                if (!ref) return '—';
                try {
                    return new URL(ref).host;
                } catch (e) {
                    return ref.length > 32 ? ref.slice(0, 32) + '…' : ref;
                }
            },
            liveStatusClass(status) {
                const map = {sale: 'status-chip--success', upsale: 'status-chip--success', lead: 'status-chip--info', rejected: 'status-chip--danger', hold: 'status-chip--warning', trash: 'status-chip--neutral'};
                return map[status] || 'status-chip--neutral';
            },
            // --- G57: annotations ---
            annotationColor(color) {
                const map = {success: '#0f9d58', warning: '#b8770a', danger: '#d93a3a', info: '#1f4bf0'};
                return map[color] || map.info;
            },
            openAnnotations() {
                this.newAnnotation = { date: new Date().toISOString().split('T')[0], text: '', color: 'info' };
                this.annotationDialog = true;
            },
            loadAnnotations() {
                fetch('/backend/api/settings/annotations', {credentials: 'include'})
                    .then(window.fetchJsonFromResponse)
                    .then(data => {
                        this.annotations = data.annotations || [];
                        this.applyChartAnnotations();
                    })
                    .catch(() => { this.annotations = []; });
            },
            addAnnotation() {
                const payload = { date: this.newAnnotation.date, text: this.newAnnotation.text.trim(), color: this.newAnnotation.color };
                if (!payload.date || !payload.text) return;
                fetch('/backend/api/settings/annotations', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify(payload)
                })
                    .then(window.fetchJsonFromResponse)
                    .then(() => {
                        this.newAnnotation.text = '';
                        this.loadAnnotations();
                        this.$root.$emit('show-message', {type: 'success', text: 'Annotation added'});
                    })
                    .catch(err => this.$root.$emit('show-message', {type: 'error', text: 'Annotation failed: ' + sanitizeToastMessage(err.message)}));
            },
            deleteAnnotation(a) {
                fetch('/backend/api/settings/annotations/' + a.id, {method: 'DELETE', credentials: 'include'})
                    .then(res => {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        this.loadAnnotations();
                    })
                    .catch(err => this.$root.$emit('show-message', {type: 'error', text: 'Delete failed: ' + sanitizeToastMessage(err.message)}));
            },
            applyChartAnnotations() {
                const o = this.mainChart.chartOptions || {};
                const inRange = new Set((this.mainChart.series[0] ? this.mainChart.series[0].data : []).map(p => String(p.x)));
                const markers = this.annotations
                    .filter(a => !inRange.size || inRange.has(a.date))
                    .map(a => ({
                        x: a.date,
                        strokeDashArray: 0,
                        borderColor: this.annotationColor(a.color),
                        label: {
                            text: a.text,
                            style: {color: '#fff', background: this.annotationColor(a.color), fontSize: '11px'},
                            orientation: 'vertical',
                            position: 'top',
                        },
                    }));
                this.mainChart.chartOptions = {
                    ...o,
                    annotations: markers.length ? {xaxis: markers} : {xaxis: []},
                };
            },
            applyPreset(preset) {
                this.activePreset = preset.label;
                const to = new Date();
                let from = new Date();
                if (preset.label === 'Today') {
                    // from = today
                } else if (preset.label === 'Yesterday') {
                    from = new Date(to);
                    from.setDate(from.getDate() - 1);
                    to.setDate(to.getDate() - 1);
                } else {
                    from.setDate(from.getDate() - preset.days);
                }
                this.filters.date_range = [from.toISOString().split('T')[0], to.toISOString().split('T')[0]];
                this.loadData();
            },
            applyCustomRange() {
                const picked = this.filters.date_range || [];
                if (picked.length !== 2) {
                    this.$root.$emit('show-message', {type: 'error', text: 'Pick a start and an end date, then hit Apply.'});
                    return;
                }
                this.filters.date_range = [...picked].sort();
                this.activePreset = null;
                this.date_menu2 = false;
                this.loadData();
            },
            cancelCustomRange() {
                if (this.dateRangeBackup) this.filters.date_range = this.dateRangeBackup;
                this.date_menu2 = false;
            },
            downloadCsv(headers, rows, filename) {
                const csv = [headers, ...rows].map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\n');
                const blob = new Blob([csv], {type: 'text/csv'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                a.click();
                URL.revokeObjectURL(a.href);
                this.$root.$emit('show-message', {type: 'success', text: 'CSV exported'});
            },
            exportVisitsCsv() {
                this.downloadCsv(
                    this.headers.map(h => h.text),
                    this.visits.map(it => this.headers.map(h => it[h.value])),
                    'recent_visits.csv'
                );
            },
            exportChartCsv() {
                const names = this.mainChart.series.map(s => s.name);
                const rows = this.mainChart.series[0].data.map((point, i) =>
                    names.map(name => {
                        const p = this.mainChart.series.find(s => s.name === name).data[i];
                        return p ? p.y : 0;
                    })
                );
                this.downloadCsv(['Date', ...names], rows, 'performance.csv');
            },
            loadFiltersData() {
                fetch('/backend/api/campaigns/')
                    .then(window.fetchJsonFromResponse)
                    .then(data => {
                        this.campaigns = Array.isArray(data) ? data : [];
                    })
                    .catch(() => { this.campaigns = []; });
            },
            loadData(date) {
                this.loading = true;
                // No full-screen overlay here: the in-card skeletons and table
                // loading states carry the wait, so the user can keep reading.
                this.loadFiltersData();

                const payload = {
                    campaigns: this.filters.campaigns,
                    date_from: this.filters.date_range[0],
                    date_to: this.filters.date_range[1],
                    detail_level: this.filters.detailLevel,
                    compare: this.compareMode
                };

                this.loadVisits();

                fetch('/backend/api/dashboard/metrics', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                })
                    .then(window.fetchJsonFromResponse)
                    .then(data => {
                        const m = data.metrics;
                        const roiNum = parseFloat(m.roi) || 0;
                        const roiColor = roiNum > 0 ? DASH_COLORS.success : (roiNum < 0 ? DASH_COLORS.danger : DASH_COLORS.warning);
                        this.previous = this.compareMode ? (data.previous || null) : null;

                        // G50: delta vs the immediately-preceding period of the same length
                        const pm = this.previous ? this.previous.metrics : null;
                        const deltaFor = (cur, prev) => {
                            if (!pm || prev == null || isNaN(parseFloat(prev))) return null;
                            cur = parseFloat(cur) || 0;
                            prev = parseFloat(prev) || 0;
                            if (prev === 0) return cur > 0 ? '+100%' : null;
                            const pct = (cur - prev) / Math.abs(prev) * 100;
                            return (pct > 0 ? '+' : '') + pct.toLocaleString('en-US', {maximumFractionDigits: 1}) + '%';
                        };
                        const deltaMeta = (txt) => {
                            if (!txt) return {delta: null};
                            const up = !txt.startsWith('-');
                            return {delta: txt, deltaIcon: up ? 'mdi-arrow-up-bold' : 'mdi-arrow-down-bold', deltaClass: up ? 'num-pos' : 'num-neg'};
                        };
                        const card = (base, cur, prev) => Object.assign({}, base, deltaMeta(deltaFor(cur, prev)));

                        this.metrics = [
                            card({title: 'Clicks', value: Number(m.clicks || 0).toLocaleString(), color: DASH_COLORS.info, icon: 'mdi-cursor-default-click-outline'}, m.clicks, pm && pm.clicks),
                            card({title: 'Unique clicks', value: Number(m.unique_clicks || 0).toLocaleString(), color: DASH_COLORS.unique, icon: 'mdi-account-switch-outline'}, m.unique_clicks, pm && pm.unique_clicks),
                            card({title: 'Conversions', value: Number(m.conversions || 0).toLocaleString(), color: DASH_COLORS.accent, icon: 'mdi-check-decagram-outline'}, m.conversions, pm && pm.conversions),
                            card({title: 'Cost', value: '$' + Number(m.cost || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}), color: DASH_COLORS.danger, icon: 'mdi-cash-minus'}, m.cost, pm && pm.cost),
                            card({title: 'Revenue', value: '$' + Number(m.revenue || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}), color: DASH_COLORS.success, icon: 'mdi-cash-plus'}, m.revenue, pm && pm.revenue),
                            {title: 'ROI', value: (roiNum < 0 ? '' : '+') + (Number(roiNum).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})) + '%', color: roiColor, icon: roiNum < 0 ? 'mdi-trending-down' : 'mdi-trending-up'},
                        ];

                        const categories = data.chart.labels;

                        this.mainChart.series = [
                            {
                                name: 'Visits',
                                data: categories.map((label, i) => ({x: label, y: data.chart.visits[i] || 0}))
                            },
                            {
                                name: 'Unique visits',
                                data: categories.map((label, i) => ({x: label, y: data.chart.unique_visits[i] || 0}))
                            },
                            {
                                name: 'Clicks',
                                data: categories.map((label, i) => ({x: label, y: data.chart.clicks[i] || 0}))
                            },
                            {
                                name: 'Conversions',
                                data: categories.map((label, i) => ({x: label, y: data.chart.conversions[i] || 0}))
                            },
                            {
                                name: 'Unique clicks',
                                data: categories.map((label, i) => ({
                                    x: label,
                                    y: data.chart.unique_clicks[i] || 0
                                }))
                            }
                        ];

                        // G50: overlay the previous period as dashed trend lines
                        if (this.previous && this.previous.chart) {
                            const prevChart = this.previous.chart;
                            this.mainChart.series.push({
                                name: 'Visits (prev)',
                                data: categories.map((label, i) => ({x: label, y: (prevChart.visits[i] || 0)}))
                            });
                            this.mainChart.series.push({
                                name: 'Conversions (prev)',
                                data: categories.map((label, i) => ({x: label, y: (prevChart.conversions[i] || 0)}))
                            });
                        }
                        this.mainChart.chartOptions.stroke = {
                            ...(this.mainChart.chartOptions.stroke || {}),
                            dashArray: this.mainChart.series.map(s => s.name.endsWith('(prev)') ? 6 : 0),
                        };

                        this.mainChart.chartOptions.xaxis.type = 'category';
                        delete this.mainChart.chartOptions.xaxis.categories;

                        this.applyChartTheme();
                        this.applyChartAnnotations();
                        this.loading = false;
                    }).catch((err) => {
                        this.loading = false;
                        this.$root.$emit('show-message', {
                            type: 'error',
                            text: 'Dashboard failed to load — ' + sanitizeToastMessage(err && err.message)
                                + '. Hit Refresh to retry.'
                        });
                    });

            },

        }
    });
</script>
