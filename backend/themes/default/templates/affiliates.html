{% raw %}
<script type="text/x-template" id="affiliates-template">
    <v-container fluid>
        <v-row align="center" class="mb-4">
            <v-col>
                <div class="page-title">Affiliate Networks</div>
                <div class="page-subtitle">Manage your affiliate networks</div>
            </v-col>
            <v-col class="d-flex justify-end" cols="auto">
                <v-btn class="mr-2" elevation="0" @click="openCatalog">
                    <v-icon small class="mr-1">mdi-view-grid-outline</v-icon>
                    From catalog
                </v-btn>
                <v-btn color="primary" elevation="0" @click="openCreate">
                    <v-icon small class="mr-1">mdi-plus</v-icon>
                    Add affiliate network
                </v-btn>
            </v-col>
        </v-row>

        <v-dialog v-model="dialog">
            <v-card class="dialog-md">
                <v-card-title>
                    <span class="text-h6">{{ isEdit ? 'Edit affiliate network' : 'Add affiliate network' }}</span>
                </v-card-title>

                <v-card-text>

                    <v-text-field
                            label="Network name"
                            v-model="form.name"
                            outlined
                            dense
                    ></v-text-field>

                    <v-textarea
                            label="Offer parameters (comma or JSON format)"
                            v-model="form.offer_parameters"
                            outlined
                            dense
                            rows="2"
                            auto-grow
                    ></v-textarea>

                    <v-text-field
                            label="S2S postback URL"
                            v-model="form.s2s_postback"
                            outlined
                            dense
                    ></v-text-field>

                </v-card-text>

                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="close">Cancel</v-btn>
                    <v-btn color="primary" elevation="0" @click="save">Save</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>

        <v-dialog v-model="catalogOpen" scrollable>
            <v-card class="dialog-lg">
                <v-card-title class="d-flex align-center">
                    <span class="text-h6">Offer Sources Catalog</span>
                    <v-spacer></v-spacer>
                    <v-btn icon small @click="catalogOpen = false">
                        <v-icon small>mdi-close</v-icon>
                    </v-btn>
                </v-card-title>

                <v-card-text>
                    <v-text-field
                            v-model="catalogSearch"
                            label="Search networks or verticals"
                            prepend-inner-icon="mdi-magnify"
                            outlined
                            dense
                            clearable
                            hide-details
                            class="mb-3"
                    ></v-text-field>

                    <div class="aff-catalog-verticals mb-3">
                        <v-chip
                                v-for="v in topVerticals"
                                :key="v"
                                x-small
                                label
                                class="mr-1 mb-1"
                                :class="catalogVertical === v ? 'aff-catalog-vchip--on' : ''"
                                :outlined="catalogVertical !== v"
                                @click="catalogVertical = catalogVertical === v ? '' : v"
                        >{{ v }}</v-chip>
                    </div>

                    <div class="aff-catalog-grid">
                        <div v-for="p in filteredPresets" :key="p.name" class="aff-catalog-card">
                            <div class="d-flex align-center">
                                <div class="aff-catalog-logo">
                                    <div v-if="!showLogo(p)" class="aff-catalog-logo-fallback">{{ p.name.charAt(0) }}</div>
                                    <img v-if="showLogo(p)" :src="logoSrc(p)"
                                         width="48" height="48" alt=""
                                         @load="logoLoaded(p, $event)" @error="$set(p, '_logoBroken', true)">
                                </div>
                                <div class="aff-catalog-name">{{ p.name }}</div>
                            </div>
                            <div class="aff-catalog-verticals">
                                <span v-for="v in p.verticals.slice(0, 4)" :key="v" class="status-chip status-chip--neutral mr-1 mb-1">{{ v }}</span>
                                <span v-if="p.verticals.length > 4" class="status-chip status-chip--neutral mr-1 mb-1">+{{ p.verticals.length - 4 }}</span>
                            </div>
                            <v-btn
                                    small
                                    elevation="0"
                                    color="primary"
                                    class="mt-auto"
                                    :disabled="addedNames.includes(p.name)"
                                    @click="addFromPreset(p)"
                            >
                                <v-icon small class="mr-1">{{ addedNames.includes(p.name) ? 'mdi-check' : 'mdi-plus' }}</v-icon>
                                {{ addedNames.includes(p.name) ? 'Added' : 'Add' }}
                            </v-btn>
                        </div>
                    </div>

                    <div v-if="!filteredPresets.length" class="empty-state py-6">
                        <v-icon>mdi-magnify</v-icon>
                        <div class="mt-2">No networks match your search</div>
                    </div>
                </v-card-text>
            </v-card>
        </v-dialog>

        <v-row dense class="mt-4">
            <v-col>
                <v-card>
                    <!-- Bulk actions bar -->
                    <div v-if="selected.length" class="d-flex align-center pa-2 pl-4 bulk-bar">
                        <span class="text-body-2 font-weight-medium mr-4">{{ selected.length }} selected</span>
                        <v-btn small color="red" elevation="0" class="mr-2" :loading="bulkLoading" @click="bulkDelete">
                            <v-icon small class="mr-1">mdi-trash-can-outline</v-icon>Delete
                        </v-btn>
                        <v-spacer></v-spacer>
                        <v-btn small text @click="selected = []">Clear selection</v-btn>
                    </div>
                    <v-data-table v-col-resize:affiliates="headers"
                            v-model="selected"
                            show-select
                            :headers="headers"
                            :items="affiliateNetworks"
                            dense
                            :loading="loading"
                            :items-per-page="10"
                            :footer-props="{ 'items-per-page-options': [10, 25, 50] }"
                    >
                        <template v-slot:item.name="{ item }">
                            <div class="aff-name-cell">
                                <div v-if="showLogo(item)" class="aff-logo-wrap">
                                    <div v-if="item._logoBroken" class="aff-table-logo-fallback">{{ item.name.charAt(0) }}</div>
                                    <img v-if="!item._logoBroken" :src="logoSrc(item)"
                                         width="20" height="20" alt="" class="aff-table-logo"
                                         @load="logoLoaded(item, $event)" @error="$set(item, '_logoBroken', true)">
                                </div>
                                <span v-else class="aff-table-logo-fallback aff-table-logo-solo">{{ item.name.charAt(0) }}</span>
                                <span>{{ item.name }}</span>
                                <v-tooltip bottom v-if="presetNames.includes(item.name)">
                                    <template v-slot:activator="{ on, attrs }">
                                        <v-chip
                                                x-small
                                                label
                                                outlined
                                                color="primary"
                                                class="ml-1"
                                                v-bind="attrs"
                                                v-on="on"
                                                @click="openEdit(item)"
                                        >
                                            Preset
                                        </v-chip>
                                    </template>
                                    <span>Built-in preset — click to open and edit</span>
                                </v-tooltip>
                            </div>
                        </template>

                        <template v-slot:item.s2s_postback="{ item }">
                            <span v-if="item.s2s_postback" class="text-truncate postback-cell">
                                {{ readyPostbackUrl(item) }}
                            </span>
                            <span v-else>-</span>
                        </template>

                        <template v-slot:item.created_at="{ item }">
                            {{ $formatDate(item.created_at) }}
                        </template>

                        <template v-slot:item.updated_at="{ item }">
                            {{ $formatDate(item.updated_at) }}
                        </template>

                        <template v-slot:item.actions="{ item }">
                            <v-tooltip bottom v-if="item.s2s_postback">
                                <template v-slot:activator="{ on, attrs }">
                                    <v-btn icon small color="grey" v-bind="attrs" v-on="on" @click="copyPostback(item)">
                                        <v-icon small>mdi-content-copy</v-icon>
                                    </v-btn>
                                </template>
                                <span>Copy postback URL</span>
                            </v-tooltip>
                            <v-tooltip bottom>
                                <template v-slot:activator="{ on, attrs }">
                                    <v-btn icon small color="primary" v-bind="attrs" v-on="on" @click="openEdit(item)">
                                        <v-icon small>mdi-pencil-outline</v-icon>
                                    </v-btn>
                                </template>
                                <span>Edit</span>
                            </v-tooltip>
                            <v-tooltip bottom>
                                <template v-slot:activator="{ on, attrs }">
                                    <v-btn icon small color="red" v-bind="attrs" v-on="on" @click="deleteAffiliateNetwork(item)">
                                        <v-icon small>mdi-trash-can-outline</v-icon>
                                    </v-btn>
                                </template>
                                <span>Delete</span>
                            </v-tooltip>
                        </template>

                        <template v-slot:no-data>
                            <div class="empty-state">
                                <v-icon>mdi-inbox-outline</v-icon>
                                <div class="mt-2">No data yet</div>
                            </div>
                        </template>
                    </v-data-table>
                </v-card>
            </v-col>
        </v-row>

        <confirm-dialog-component ref="confirm" />
    </v-container>
</script>

<script type="application/javascript">
    Vue.component('affiliates-component', {
        template: '#affiliates-template',
        data() {
            return {
                dialog: false,
                isEdit: false,
                postbackKey: '',
                form: {
                    id: null,
                    name: '',
                    offer_parameters: '',
                    s2s_postback: ''
                },
                presets: [],
                catalogOpen: false,
                catalogSearch: '',
                catalogVertical: '',
                headers: [
                    {text: 'Name', value: 'name'},
                    {text: 'Offer Parameters', value: 'offer_parameters'},
                    {text: 'Postback URL', value: 's2s_postback'},
                    {text: 'Created', value: 'created_at'},
                    {text: 'Updated', value: 'updated_at'},
                    {text: 'Actions', value: 'actions', sortable: false}
                ],
                affiliateNetworks: [],
                loading: false,
                selected: [],
                bulkLoading: false,

            }
        },
        mounted() {
            this.$vuetify.theme.dark = (document.documentElement.dataset.theme === 'dark');
            this.loadAffiliateNetworks();
            // Postback security key (when enabled) so copied URLs include it
            fetch('/backend/api/settings/', {credentials: 'include'})
                .then(res => res.ok ? res.json() : null)
                .then(data => {
                    const sec = (data && data.postback_security) || {};
                    this.postbackKey = sec.enabled ? (sec.secret_key || '') : '';
                })
                .catch(() => {});
            this.$root.$on('load-affiliates', this.loadAffiliateNetworks);
            this.loadPresets();
        },
        computed: {
            presetNames() {
                return this.presets.map(p => p.name);
            },
            presetByName() {
                const map = {};
                this.presets.forEach(p => { map[p.name] = p; });
                return map;
            },
            addedNames() {
                return this.affiliateNetworks.map(n => n.name);
            },
            topVerticals() {
                const counts = {};
                this.presets.forEach(p => p.verticals.forEach(v => {
                    counts[v] = (counts[v] || 0) + 1;
                }));
                return Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 12);
            },
            filteredPresets() {
                const q = (this.catalogSearch || '').trim().toLowerCase();
                return this.presets.filter(p => {
                    if (this.catalogVertical && !p.verticals.includes(this.catalogVertical)) return false;
                    if (!q) return true;
                    return p.name.toLowerCase().includes(q) ||
                        p.verticals.some(v => v.toLowerCase().includes(q));
                });
            }
        },
        methods: {
            loadPresets() {
                fetch("/backend/api/affiliate-networks/presets", {credentials: "include"})
                    .then(res => res.json())
                    .then(data => {
                        this.presets = (data && data.presets) || [];
                    })
                    .catch(err => {
                        console.error(err);
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    });
            },

            openCatalog() {
                this.catalogOpen = true;
                if (!this.presets.length) this.loadPresets();
            },

            showLogo(x) {
                const p = (x.logo_domain !== undefined) ? x : this.presetByName[x.name];
                return !!(p && (p.logo_url || p.logo_domain)) && !x._logoBroken;
            },
            logoSrc(x) {
                const p = (x.logo_domain !== undefined) ? x : this.presetByName[x.name];
                return p.logo_url || ('/backend/api/affiliate-networks/favicon/' + encodeURIComponent(p.logo_domain));
            },
            // The favicon proxy returns a 1×1 transparent PNG for missing
            // favicons (HTTP 200, so @error never fires) — treat that as broken.
            logoLoaded(x, e) {
                if (e.target.naturalWidth <= 1) this.$set(x, '_logoBroken', true);
            },

            addFromPreset(p) {
                fetch("/backend/api/affiliate-networks/", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        name: p.name,
                        offer_parameters: p.offer_parameters,
                        // store the real tracker domain, not the placeholder
                        s2s_postback: "https://YOUR-TRACKER-DOMAIN/pb/{click_id}/{status}/{payout}"
                            .replace(/YOUR-TRACKER-DOMAIN/gi, window.location.host)
                    }),
                    credentials: "include"
                })
                    .then(async res => {
                        const text = await res.text();
                        if (!res.ok) {
                            let msg = text;
                            try {
                                const err = JSON.parse(text);
                                msg = err.detail || msg;
                            } catch {
                            }
                            throw new Error(msg);
                        }
                        this.$root.$emit("show-message", {type: "success", text: p.name + " added"});
                        this.loadAffiliateNetworks();
                    })
                    .catch(err => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    });
            },

            loadAffiliateNetworks() {
                this.loading = true;
                fetch("/backend/api/affiliate-networks/", {
                    credentials: "include"
                })
                    .then(res => res.json())
                    .then(data => {
                        this.affiliateNetworks = data;
                    })
                    .catch(err => {
                        console.error(err);
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    })
                    .finally(() => {
                        this.loading = false;
                    });
            },

            readyPostbackUrl(item) {
                // Build a ready-to-use postback URL: fill in this tracker's domain,
                // append the security key when postback protection is enabled.
                let url = item.s2s_postback || '';
                url = url.replace(/YOUR-TRACKER-DOMAIN/gi, window.location.host);
                if (!/^https?:\/\//i.test(url)) {
                    url = window.location.origin + '/' + url.replace(/^\/+/, '');
                }
                if (this.postbackKey) {
                    url += (url.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(this.postbackKey);
                }
                return url;
            },
            async copyPostback(item) {
                const url = this.readyPostbackUrl(item);
                try {
                    await navigator.clipboard.writeText(url);
                    this.$root.$emit('show-message', {type: 'success', text: 'Ready postback URL copied'});
                } catch (e) {
                    this.$root.$emit('show-message', {type: 'error', text: 'Copy failed — copy it from the postback column'});
                }
            },

            openCreate() {
                this.isEdit = false;
                this.dialog = true;
                this.form = {
                    id: null,
                    name: '',
                    offer_parameters: '',
                    s2s_postback: ''
                };
            },

            openEdit(network) {
                this.isEdit = true;
                this.dialog = true;
                this.form = {
                    id: network.id,
                    name: network.name,
                    offer_parameters: network.offer_parameters || '',
                    s2s_postback: network.s2s_postback || ''
                };
            },

            save() {
                if (!this.form.name) {
                    this.$root.$emit("show-message", {type: "error", text: "Name is required."});
                    return;
                }

                const payload = {
                    name: this.form.name,
                    offer_parameters: this.form.offer_parameters,
                    s2s_postback: this.form.s2s_postback
                };

                const method = this.isEdit ? "PATCH" : "POST";
                const url = this.isEdit
                    ? `/backend/api/affiliate-networks/${this.form.id}`
                    : `/backend/api/affiliate-networks/`;

                fetch(url, {
                    method,
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(payload),
                    credentials: "include"
                })
                    .then(async res => {
                        const text = await res.text();
                        if (!res.ok) {
                            let msg = text;
                            try {
                                const err = JSON.parse(text);
                                msg = err.detail || msg;
                            } catch {
                            }
                            throw new Error(msg);
                        }

                        this.dialog = false;
                        this.$root.$emit("show-message", {
                            type: "success",
                            text: this.isEdit ? "Affiliate network updated" : "Affiliate network created"
                        });
                        this.loadAffiliateNetworks();
                    })
                    .catch(err => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    });
            },

            async bulkDelete() {
                const ok = await this.$refs.confirm.open(
                    'Delete affiliate networks',
                    `Permanently delete ${this.selected.length} network(s)? Networks with linked offers are skipped. This cannot be undone.`);
                if (!ok) return;
                this.bulkLoading = true;
                try {
                    const res = await fetch('/backend/api/affiliate-networks/bulk', {
                        method: 'POST',
                        credentials: 'include',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ids: this.selected.map(n => n.id), action: 'delete'})
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok) throw new Error(data.detail || 'Bulk delete failed');
                    const skipped = (data.skipped || []).length
                        ? ` Skipped (has offers): ${data.skipped.join(', ')}.` : '';
                    this.$root.$emit('show-message', {
                        type: 'success',
                        text: `Deleted ${data.updated ?? this.selected.length} networks.${skipped}`
                    });
                    this.selected = [];
                    this.loadNetworks();
                } catch (e) {
                    this.$root.$emit('show-message', {type: 'error', text: e.message});
                } finally {
                    this.bulkLoading = false;
                }
            },

            async deleteAffiliateNetwork(network) {
                const ok = await this.$refs.confirm.open('Delete affiliate network', 'Are you sure you want to delete this affiliate network? This cannot be undone.');
                if (!ok) return;

                fetch(`/backend/api/affiliate-networks/${network.id}`, {
                    method: "DELETE",
                    credentials: "include"
                })
                    .then(async res => {
                        const text = await res.text();
                        if (!res.ok) {
                            let msg = text;
                            try {
                                const err = JSON.parse(text);
                                msg = err.detail || msg;
                            } catch {
                            }
                            throw new Error(msg);
                        }

                        this.$root.$emit("show-message", {
                            type: "success",
                            text: "Affiliate network deleted"
                        });
                        this.loadAffiliateNetworks();
                    })
                    .catch(err => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    });
            },

            close() {
                this.dialog = false;
            }
        }

    });
</script>

<style>
    .postback-cell {
        max-width: 260px;
        display: inline-block;
    }
</style>
{% endraw %}
