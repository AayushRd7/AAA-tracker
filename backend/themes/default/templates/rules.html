{% raw %}
<script type="text/x-template" id="rules-template">
    <v-container fluid>
        <div class="d-flex align-center justify-space-between mb-4 flex-wrap">
            <div>
                <div class="page-title">Automatic rules</div>
                <div class="page-subtitle">Watch a campaign's metrics and act on it automatically</div>
            </div>
        </div>

        <v-row>
            <v-col cols="12">
                <v-card class="pa-4" id="automatic-rules-card">
                    <v-card-title class="d-flex align-center">
                        <v-icon color="primary" class="mr-2">mdi-tune-variant</v-icon>
                        Automatic rules
                        <v-spacer></v-spacer>
                        <v-btn small outlined color="primary" @click="openRuleDialog">
                            <v-icon small class="mr-1">mdi-plus</v-icon>Add rule
                        </v-btn>
                    </v-card-title>
                    <v-card-text>
                        <div class="caption grey--text mb-3">
                            Each rule is evaluated against the tracked metrics for its lookback window —
                            by default every 15 minutes, or on its own schedule. When ALL conditions match,
                            the action runs: pause the campaign, send a Telegram alert, or send an email.
                            A per-rule email recipient list is also sent on fire, alongside the action.
                            Alert actions fire once per continuous match (they re-arm after the condition
                            clears).
                        </div>
                        <v-data-table
                                :headers="ruleHeaders"
                                :items="rules"
                                dense
                                :loading="rulesLoading"
                                :items-per-page="10"
                        >
                            <template v-slot:item.enabled="{ item }">
                                <v-switch :input-value="item.enabled" dense hide-details inset
                                          @change="toggleRule(item)"></v-switch>
                            </template>
                            <template v-slot:item.conditions="{ item }">
                                <div v-for="(c, i) in item.conditions" :key="i" class="caption">
                                    {{ c.metric }} {{ c.comparator }} {{ c.value }} · last {{ c.period_hours }}h
                                </div>
                                <div class="caption grey--text">{{ scheduleLabel(item.schedule) }}</div>
                            </template>
                            <template v-slot:item.created_by="{ item }">
                                <div class="caption">{{ item.created_by || '—' }}</div>
                                <div class="caption grey--text">{{ formatWhen(item.created_at) }}</div>
                            </template>
                            <template v-slot:item.last_result="{ item }">
                                <template v-if="item.last_result">
                                    <span class="status-chip"
                                          :class="item.last_result.matched ? 'status-chip--warning' : 'status-chip--success'">
                                        {{ item.last_result.matched ? 'fired' : 'clear' }}
                                    </span>
                                    <div class="caption grey--text">
                                        {{ actionLabel(item.last_result.action || item.action) }}
                                        <span v-if="item.last_run"> · {{ formatWhen(item.last_run) }}</span>
                                    </div>
                                    <div class="caption" v-if="item.last_result.action_taken && !item.last_result.action_taken.ok">
                                        <span class="red--text">{{ item.last_result.action_taken.detail }}</span>
                                    </div>
                                    <div class="caption" v-if="item.last_result.notification && !item.last_result.notification.ok">
                                        <span class="red--text">{{ item.last_result.notification.detail }}</span>
                                    </div>
                                    <div class="caption grey--text">
                                        {{ (item.last_result.conditions || []).map(c => c.metric + ' ' + c.comparator + ' ' + c.value + ' → ' + (c.actual == null ? '—' : c.actual)).join('; ') }}
                                    </div>
                                </template>
                                <span v-else class="grey--text caption">never run</span>
                            </template>
                            <template v-slot:item.actions="{ item }">
                                <v-btn small text color="primary" :loading="ruleRunning === item.id"
                                       @click="runRuleNow(item)">Run now</v-btn>
                                <v-btn icon small color="red" @click="deleteRule(item)"
                                       :aria-label="'Delete rule ' + item.name">
                                    <v-icon small>mdi-trash-can-outline</v-icon>
                                </v-btn>
                            </template>
                            <template v-slot:no-data>
                                <div class="empty-state">
                                    <v-icon>mdi-tune-variant</v-icon>
                                    <div class="mt-2">No automatic rules yet — e.g. "ROI &lt; -30% over 6h → pause campaign"</div>
                                </div>
                            </template>
                        </v-data-table>
                    </v-card-text>
                </v-card>
            </v-col>
        </v-row>

        <v-dialog v-model="ruleDialog" persistent max-width="560px">
            <v-card>
                <v-card-title class="text-h6">New automatic rule</v-card-title>
                <v-card-text>
                    <v-text-field
                            label="Rule name"
                            v-model="ruleForm.name"
                            outlined
                            dense
                    ></v-text-field>
                    <v-select
                            label="Campaign"
                            v-model="ruleForm.campaign_id"
                            :items="campaignOptions"
                            item-text="name"
                            item-value="id"
                            outlined
                            dense
                            hint="Rules always evaluate one campaign's metrics (required for pause)."
                            persistent-hint
                    ></v-select>
                    <v-row dense>
                        <v-col cols="4">
                            <v-select
                                    label="Metric"
                                    v-model="ruleForm.metric"
                                    :items="ruleMetrics"
                                    outlined
                                    dense
                            ></v-select>
                        </v-col>
                        <v-col cols="3">
                            <v-text-field
                                    label="Period (h)"
                                    v-model.number="ruleForm.period_hours"
                                    type="number"
                                    min="1"
                                    max="720"
                                    outlined
                                    dense
                            ></v-text-field>
                        </v-col>
                        <v-col cols="2">
                            <v-select
                                    label="Cmp"
                                    v-model="ruleForm.comparator"
                                    :items="['<', '>', '<=', '>=', '==', '!=']"
                                    outlined
                                    dense
                            ></v-select>
                        </v-col>
                        <v-col cols="3">
                            <v-text-field
                                    label="Value"
                                    v-model.number="ruleForm.value"
                                    type="number"
                                    step="any"
                                    outlined
                                    dense
                            ></v-text-field>
                        </v-col>
                    </v-row>
                    <v-select
                            label="Action"
                            v-model="ruleForm.action"
                            :items="ruleActions"
                            outlined
                            dense
                    ></v-select>
                    <v-text-field
                            label="Email recipients (optional)"
                            v-model="ruleForm.email_recipients"
                            outlined
                            dense
                            hint="Comma-separated. Sent on fire in addition to the action; for the email action this list replaces the workspace recipients."
                            persistent-hint
                    ></v-text-field>
                    <v-select
                            label="Schedule"
                            v-model="ruleForm.schedule_mode"
                            :items="ruleSchedules"
                            outlined
                            dense
                            hint="Cadence is the standard 15-minute evaluation."
                            persistent-hint
                    ></v-select>
                    <v-text-field
                            v-if="ruleForm.schedule_mode === 'interval'"
                            label="Every N minutes"
                            v-model.number="ruleForm.interval_minutes"
                            type="number"
                            min="1"
                            max="10080"
                            outlined
                            dense
                    ></v-text-field>
                    <div v-if="ruleForm.schedule_mode === 'days_times'">
                        <div class="caption grey--text mb-1">Days</div>
                        <v-btn-toggle v-model="ruleForm.days" multiple dense class="mb-3 flex-wrap">
                            <v-btn v-for="d in dayOptions" :key="d.value" :value="d.value" small
                                   class="mr-1">{{ d.text }}</v-btn>
                        </v-btn-toggle>
                        <v-text-field
                                label="Times (HH:MM, comma-separated)"
                                v-model="ruleForm.times"
                                placeholder="09:00, 18:00"
                                outlined
                                dense
                        ></v-text-field>
                    </div>
                    <v-row v-if="ruleForm.schedule_mode === 'date_range'" dense>
                        <v-col cols="6">
                            <v-text-field
                                    label="From"
                                    v-model="ruleForm.date_from"
                                    type="date"
                                    outlined
                                    dense
                            ></v-text-field>
                        </v-col>
                        <v-col cols="6">
                            <v-text-field
                                    label="To"
                                    v-model="ruleForm.date_to"
                                    type="date"
                                    outlined
                                    dense
                            ></v-text-field>
                        </v-col>
                    </v-row>
                </v-card-text>
                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="ruleDialog = false">Cancel</v-btn>
                    <v-btn color="primary" elevation="0" :loading="ruleSaving" @click="saveRule">Create rule</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>
    </v-container>
</script>

<script type="application/javascript">
    Vue.component('rules-component', {
        template: '#rules-template',
        data() {
            return {
                rules: [],
                rulesLoading: false,
                ruleRunning: null,
                ruleDialog: false,
                ruleSaving: false,
                ruleForm: {name: '', campaign_id: null, metric: 'roi', period_hours: 6,
                           comparator: '<', value: -30, action: 'alert_telegram',
                           email_recipients: '', schedule_mode: 'cadence',
                           interval_minutes: 30, days: [0, 1, 2, 3, 4], times: '09:00',
                           date_from: '', date_to: ''},
                ruleMetrics: ['roi', 'profit', 'cost', 'revenue', 'conversions', 'clicks'],
                ruleActions: [
                    {text: 'Pause campaign', value: 'pause_campaign'},
                    {text: 'Alert via Telegram', value: 'alert_telegram'},
                    {text: 'Alert via email', value: 'alert_email'},
                ],
                ruleSchedules: [
                    {text: 'Every 15 minutes (default)', value: 'cadence'},
                    {text: 'Interval (every N minutes)', value: 'interval'},
                    {text: 'Chosen days & times', value: 'days_times'},
                    {text: 'Date range', value: 'date_range'},
                ],
                dayOptions: [
                    {text: 'Mon', value: 0}, {text: 'Tue', value: 1}, {text: 'Wed', value: 2},
                    {text: 'Thu', value: 3}, {text: 'Fri', value: 4}, {text: 'Sat', value: 5},
                    {text: 'Sun', value: 6},
                ],
                ruleHeaders: [
                    {text: 'Name', value: 'name'},
                    {text: 'Enabled', value: 'enabled', sortable: false},
                    {text: 'Conditions', value: 'conditions', sortable: false},
                    {text: 'Action', value: 'action'},
                    {text: 'Creator', value: 'created_by', sortable: false},
                    {text: 'Last result', value: 'last_result', sortable: false},
                    {text: 'Actions', value: 'actions', sortable: false},
                ],
                campaignOptions: [],
            };
        },
        mounted() {
            this.loadRules();
            this.$root.$on('load-rules', this.loadRules);
        },
        beforeDestroy() {
            this.$root.$off('load-rules', this.loadRules);
        },
        methods: {
            emptyRuleForm() {
                return {name: '', campaign_id: null, metric: 'roi', period_hours: 6,
                        comparator: '<', value: -30, action: 'alert_telegram',
                        email_recipients: '', schedule_mode: 'cadence',
                        interval_minutes: 30, days: [0, 1, 2, 3, 4], times: '09:00',
                        date_from: '', date_to: ''};
            },
            loadRules() {
                this.rulesLoading = true;
                fetch('/backend/api/rules/', {credentials: 'include'})
                    .then(r => r.ok ? r.json() : {rules: []})
                    .then(data => {
                        this.rules = data.rules || [];
                    })
                    .catch(() => {})
                    .finally(() => {
                        this.rulesLoading = false;
                    });
                fetch('/backend/api/campaigns/', {credentials: 'include'})
                    .then(r => r.ok ? r.json() : [])
                    .then(data => {
                        this.campaignOptions = (data || []).map(c => ({id: c.id, name: c.name}));
                    })
                    .catch(() => {});
            },
            openRuleDialog() {
                this.ruleForm = this.emptyRuleForm();
                this.ruleDialog = true;
            },
            buildSchedule() {
                const f = this.ruleForm;
                if (f.schedule_mode === 'interval') {
                    return {mode: 'interval', interval_minutes: f.interval_minutes};
                }
                if (f.schedule_mode === 'days_times') {
                    return {mode: 'days_times', days: f.days || [],
                            times: (f.times || '').split(',').map(s => s.trim()).filter(Boolean)};
                }
                if (f.schedule_mode === 'date_range') {
                    const s = {mode: 'date_range'};
                    if (f.date_from) s.date_from = f.date_from;
                    if (f.date_to) s.date_to = f.date_to;
                    return s;
                }
                return {};
            },
            async saveRule() {
                if (!this.ruleForm.name.trim() || !this.ruleForm.campaign_id) {
                    this.$root.$emit('show-message', {type: 'error',
                        text: 'Rule name and campaign are required.'});
                    return;
                }
                this.ruleSaving = true;
                try {
                    const recipients = (this.ruleForm.email_recipients || '')
                        .split(',').map(s => s.trim()).filter(Boolean);
                    const res = await fetch('/backend/api/rules/', {
                        method: 'POST',
                        credentials: 'include',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            name: this.ruleForm.name.trim(),
                            enabled: true,
                            campaign_id: this.ruleForm.campaign_id,
                            conditions: [{metric: this.ruleForm.metric,
                                          period_hours: this.ruleForm.period_hours,
                                          comparator: this.ruleForm.comparator,
                                          value: this.ruleForm.value}],
                            action: this.ruleForm.action,
                            email_recipients: recipients,
                            schedule: this.buildSchedule(),
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'HTTP ' + res.status);
                    this.ruleDialog = false;
                    this.$root.$emit('show-message', {type: 'success', text: 'Rule created'});
                    this.loadRules();
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error',
                        text: 'Rule save failed: ' + sanitizeToastMessage(err.message)});
                } finally {
                    this.ruleSaving = false;
                }
            },
            async toggleRule(item) {
                try {
                    const res = await fetch(`/backend/api/rules/${item.id}`, {
                        method: 'PATCH',
                        credentials: 'include',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({enabled: !item.enabled})
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    this.loadRules();
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error',
                        text: 'Toggle failed: ' + sanitizeToastMessage(err.message)});
                }
            },
            actionLabel(action) {
                const map = {pause_campaign: 'Pause campaign',
                             alert_telegram: 'Telegram alert',
                             alert_email: 'Email alert'};
                return map[action] || action || '—';
            },
            formatWhen(iso) {
                if (!iso) return '—';
                try {
                    // Server timestamps are UTC without a zone suffix.
                    const d = new Date(iso.endsWith('Z') ? iso : iso + 'Z');
                    return isNaN(d.getTime()) ? iso : d.toLocaleString();
                } catch (e) {
                    return iso;
                }
            },
            scheduleLabel(schedule) {
                const s = schedule || {};
                if (!s.mode || s.mode === 'cadence') return 'Every 15 min';
                if (s.mode === 'interval') return `Every ${s.interval_minutes} min`;
                if (s.mode === 'days_times') {
                    const names = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
                    const days = (s.days || []).map(d => names[d]).join('/') || 'No days';
                    return `${days} at ${(s.times || []).join(', ')}`;
                }
                if (s.mode === 'date_range') {
                    return `From ${s.date_from || '…'} to ${s.date_to || '…'}`;
                }
                return s.mode;
            },
            async runRuleNow(item) {
                this.ruleRunning = item.id;
                try {
                    const res = await fetch(`/backend/api/rules/${item.id}/run`, {
                        method: 'POST', credentials: 'include'});
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'HTTP ' + res.status);
                    const conds = (data.conditions || []).map(c =>
                        `${c.metric} ${c.comparator} ${c.value} → ${c.actual == null ? '—' : c.actual}`);
                    this.$root.$emit('show-message', {
                        type: data.would_fire ? 'warning' : 'success',
                        text: `Run: ${conds.join('; ')}${data.would_fire ? ' — would fire' : ' — clear'}`});
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error',
                        text: 'Run failed: ' + sanitizeToastMessage(err.message)});
                } finally {
                    this.ruleRunning = null;
                }
            },
            async deleteRule(item) {
                if (!confirm(`Delete rule "${item.name}"?`)) return;
                try {
                    const res = await fetch(`/backend/api/rules/${item.id}`, {
                        method: 'DELETE', credentials: 'include'});
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    this.loadRules();
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error',
                        text: 'Delete failed: ' + sanitizeToastMessage(err.message)});
                }
            },
        },
    });
</script>
{% endraw %}
