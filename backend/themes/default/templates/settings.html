{% raw %}
<script type="text/x-template" id="settings-template">
    <v-container fluid>
        <div class="d-flex align-center justify-space-between mb-4">
            <div>
                <div class="page-title">Settings</div>
                <div class="page-subtitle">Tracker configuration and postback URLs</div>
            </div>
            <div class="d-flex align-center">
                <v-btn
                        text
                        small
                        class="mr-2"
                        @click="exportSettingsBackup"
                >
                    <v-icon small class="mr-1">mdi-download</v-icon>Export
                </v-btn>
                <v-btn
                        text
                        small
                        class="mr-2"
                        @click="openImportPicker"
                >
                    <v-icon small class="mr-1">mdi-upload</v-icon>Import
                </v-btn>
                <input ref="importFile" type="file" accept="application/json,.json" style="display:none"
                       @change="onImportFileChosen">
                <v-btn
                        color="primary"
                        elevation="0"
                        :disabled="!settingsLoaded"
                        :loading="savingSettings"
                        @click="saveSettings(false)"
                >
                    <v-icon small class="mr-1">mdi-content-save-outline</v-icon>Save settings
                </v-btn>
            </div>
        </div>
        <v-alert
                v-if="!settingsLoaded"
                :type="settingsLoadError ? 'error' : 'info'"
                dense
                text
                class="mb-3"
        >
            <span v-if="settingsLoadError">
                Save is disabled — {{ settingsLoadError }} Saving now would overwrite
                the stored configuration with this page's defaults, so it is blocked
                until the settings load succeeds.
            </span>
            <span v-else>Loading settings — Save is disabled until they load.</span>
            <v-btn v-if="settingsLoadError" text small color="primary" class="ml-2"
                   @click="loadSettings">Reload</v-btn>
        </v-alert>
        <v-container fluid class="px-0 settings-grid">

            <v-row class="mb-2">
                <v-col cols="12">
                    <v-card class="pa-4">
                        <v-card-title>Postback URLs</v-card-title>
                        <v-card-text>
                            <div class="caption grey--text mb-2">Accepts GET requests — statuses can only be: 'lead', 'sale', 'upsale', 'rejected', 'hold', 'trash'</div>
                            <div class="d-flex align-center code-row">
                                <code class="code-inline">{{ postbackUrl }}</code>
                                <v-tooltip bottom>
                                    <template v-slot:activator="{ on, attrs }">
                                        <v-btn icon small color="primary" v-bind="attrs" v-on="on" @click="copyText(postbackUrl)">
                                            <v-icon small>mdi-content-copy</v-icon>
                                        </v-btn>
                                    </template>
                                    <span>Copy postback URL</span>
                                </v-tooltip>
                            </div>
                            <div class="d-flex align-center code-row mt-2">
                                <span class="caption grey--text mr-2 demo-label">Demo</span>
                                <code class="code-inline">{{ postbackUrlDemo }}</code>
                                <v-tooltip bottom>
                                    <template v-slot:activator="{ on, attrs }">
                                        <v-btn icon small color="primary" v-bind="attrs" v-on="on" @click="copyText(postbackUrlDemo)">
                                            <v-icon small>mdi-content-copy</v-icon>
                                        </v-btn>
                                    </template>
                                    <span>Copy demo URL</span>
                                </v-tooltip>
                            </div>
                        </v-card-text>
                    </v-card>
                </v-col>
            </v-row>
            <v-row class="mb-2">
                <v-col cols="12">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-lifebuoy</v-icon>
                            Global fallback URL
                        </v-card-title>
                        <v-card-text>
                            <div class="caption grey--text mb-2">Where visitors are sent when no flow is eligible and the campaign has no fallback URL of its own. Leave empty to show a 404 page. Click macros are substituted at redirect time.</div>
                            <v-text-field
                                    label="Fallback URL"
                                    v-model="settings.fallback_url"
                                    outlined
                                    dense
                                    placeholder="https://example.com/offer?click_id={click_id}"
                                    hint="Global default — a campaign's own fallback URL always wins"
                                    persistent-hint
                            ></v-text-field>
                            <v-btn color="primary" elevation="0" class="mt-2"
                                   :disabled="!settingsLoaded" :loading="savingSettings"
                                   @click="saveSettings(false)">
                                <v-icon small class="mr-1">mdi-content-save-outline</v-icon>Save
                            </v-btn>
                            <div class="mt-4">Click to insert a token:</div>
                            <v-chip-group column>
                                <v-chip
                                        v-for="tok in fallbackTokens"
                                        :key="tok"
                                        class="ma-1"
                                        small
                                        outlined
                                        @click="insertFallbackToken(tok)"
                                >{{"{"}}{{ tok }}{{"}"}}</v-chip>
                            </v-chip-group>
                        </v-card-text>
                    </v-card>
                </v-col>
            </v-row>
            <v-row>
                <v-col cols="12" md="6">
                    <v-card class="pa-4">
                        <v-card-title>General settings</v-card-title>
                        <v-card-text>
                            <v-switch
                                    v-model="darkMode"
                                    label="Dark mode"
                                    inset
                                    dense
                                    hide-details
                                    hint="Switches the whole dashboard between light and dark"
                                    persistent-hint
                                    class="mb-3"
                            ></v-switch>

                            <v-text-field
                                    label="Tracker domain"
                                    v-model="settings.domain"
                                    outlined
                                    dense
                            ></v-text-field>

                            <v-select
                                    label="Currency"
                                    :items="currencies"
                                    v-model="settings.currency"
                                    outlined
                                    dense
                            ></v-select>

                            <v-select
                                    label="Timezone"
                                    :items="timezones"
                                    v-model="settings.timezone"
                                    outlined
                                    dense
                            ></v-select>

                            <v-divider class="my-4"></v-divider>
                            <div class="subtitle-2 mb-2">Table display</div>

                            <v-row dense>
                                <v-col cols="6">
                                    <v-text-field
                                            label="Decimals"
                                            v-model.number="settings.workspace.decimals"
                                            type="number" min="0" max="6" step="1"
                                            outlined dense hide-details
                                            hint="0–6, applied to every numeric table cell"
                                            persistent-hint
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="6">
                                    <v-select
                                            label="Thousands divider"
                                            :items="dividerOptions"
                                            v-model="settings.workspace.divider"
                                            outlined dense hide-details
                                    ></v-select>
                                </v-col>
                            </v-row>
                            <div class="caption grey--text mt-2 mb-3">
                                Preview: <strong>{{ workspacePreview }}</strong>
                                — shown in Logs, Reports and Campaigns metrics.
                            </div>

                            <div class="subtitle-2 mb-1">Conditional row colouring</div>
                            <div class="caption grey--text mb-2">
                                Tint a data row when a numeric column matches a rule
                                (Logs tables and the Reports click/conversion tables).
                            </div>
                            <div v-for="(rule, i) in settings.workspace.row_coloring" :key="i"
                                 class="d-flex align-center row-color-rule">
                                <v-combobox
                                        v-model="rule.column"
                                        :items="rowColumnSuggestions"
                                        label="Column"
                                        outlined dense hide-details
                                        class="row-rule-col"
                                ></v-combobox>
                                <v-select
                                        v-model="rule.operator"
                                        :items="rowOperatorOptions"
                                        label="Op"
                                        outlined dense hide-details
                                        class="row-rule-op"
                                ></v-select>
                                <v-text-field
                                        v-model="rule.value"
                                        label="Value"
                                        outlined dense hide-details
                                        class="row-rule-val"
                                ></v-text-field>
                                <v-select
                                        v-model="rule.color"
                                        :items="rowColorOptions"
                                        label="Colour"
                                        outlined dense hide-details
                                        class="row-rule-color"
                                ></v-select>
                                <v-btn icon small @click="settings.workspace.row_coloring.splice(i, 1)">
                                    <v-icon small color="red">mdi-close</v-icon>
                                </v-btn>
                            </div>
                            <div class="mt-2">
                                <v-btn small text color="primary" @click="addRowColorRule">
                                    <v-icon small class="mr-1">mdi-plus</v-icon>Add rule
                                </v-btn>
                            </div>

                        </v-card-text>
                    </v-card>
                </v-col>

                <v-col cols="12" md="6">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-telegram</v-icon>
                            Telegram notifications
                        </v-card-title>
                        <v-card-text>
                            <v-switch
                                    v-model="settings.telegram.enabled"
                                    label="Notify about conversions in Telegram"
                                    inset
                                    dense
                                    hide-details
                            ></v-switch>

                            <v-text-field
                                    label="Bot token"
                                    v-model="settings.telegram.bot_token"
                                    outlined
                                    dense
                                    hint="Create a bot with @BotFather → /newbot → copy its token (looks like 123456789:AAExampleTokenFormat)"
                                    persistent-hint
                            ></v-text-field>

                            <v-text-field
                                    label="Chat ID"
                                    v-model="settings.telegram.chat_id"
                                    outlined
                                    dense
                                    hint="Message your bot once, then open api.telegram.org/bot<TOKEN>/getUpdates in a browser and copy chat.id (groups use a negative id)"
                                    persistent-hint
                            ></v-text-field>

                            <div class="caption grey--text mt-2 mb-1">Notify for statuses</div>
                            <v-row dense no-gutters>
                                <v-col v-for="s in telegramStatusList" :key="s" cols="6" sm="4">
                                    <v-checkbox
                                            v-model="settings.telegram.statuses[s]"
                                            :label="s"
                                            dense
                                            hide-details
                                            class="mt-0"
                                    ></v-checkbox>
                                </v-col>
                            </v-row>

                            <div class="d-flex align-center mt-3">
                                <v-btn small outlined color="primary" :loading="tgTesting" @click="testTelegram">
                                    <v-icon small class="mr-1">mdi-send-outline</v-icon>Send test message
                                </v-btn>
                                <div class="caption grey--text ml-2">Saves settings first, then sends a test to your chat</div>
                            </div>
                        </v-card-text>
                    </v-card>
                </v-col>

                <v-col cols="12" md="6">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-email-outline</v-icon>
                            Daily email reports
                        </v-card-title>
                        <v-card-text>
                            <v-switch
                                    v-model="settings.email_reports.enabled"
                                    label="Send a daily report at the scheduled time"
                                    inset
                                    dense
                                    hide-details
                            ></v-switch>

                            <v-row dense>
                                <v-col cols="8">
                                    <v-text-field
                                            label="SMTP host"
                                            v-model="settings.email_reports.smtp_host"
                                            outlined
                                            dense
                                            hint="e.g. smtp-relay.brevo.com (Brevo) or smtp.gmail.com (Gmail)"
                                            persistent-hint
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="4">
                                    <v-text-field
                                            label="Port"
                                            v-model="settings.email_reports.smtp_port"
                                            type="number"
                                            outlined
                                            dense
                                            hint="587 (STARTTLS)"
                                            persistent-hint
                                    ></v-text-field>
                                </v-col>
                            </v-row>

                            <v-text-field
                                    label="SMTP login"
                                    v-model="settings.email_reports.smtp_login"
                                    outlined
                                    dense
                            ></v-text-field>

                            <v-text-field
                                    label="SMTP password"
                                    v-model="settings.email_reports.smtp_password"
                                    :append-icon="showSmtpPassword ? 'mdi-eye-off-outline' : 'mdi-eye-outline'"
                                    :type="showSmtpPassword ? 'text' : 'password'"
                                    @click:append="showSmtpPassword = !showSmtpPassword"
                                    outlined
                                    dense
                                    hint="Brevo SMTP key, Gmail App Password, or SendGrid API key"
                                    persistent-hint
                            ></v-text-field>

                            <v-row dense>
                                <v-col cols="6">
                                    <v-text-field
                                            label="From name"
                                            v-model="settings.email_reports.from_name"
                                            outlined
                                            dense
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="6">
                                    <v-text-field
                                            label="From email"
                                            v-model="settings.email_reports.from_email"
                                            outlined
                                            dense
                                    ></v-text-field>
                                </v-col>
                            </v-row>

                            <v-text-field
                                    label="Brevo API key (optional)"
                                    v-model="settings.email_reports.api_key"
                                    :append-icon="showBrevoApiKey ? 'mdi-eye-off-outline' : 'mdi-eye-outline'"
                                    :type="showBrevoApiKey ? 'text' : 'password'"
                                    @click:append="showBrevoApiKey = !showBrevoApiKey"
                                    outlined
                                    dense
                                    hint="Optional — paste your Brevo API key (xkeysib-…) to send via the API instead of SMTP. The API has no IP restriction, so it works even when the relay returns 'Unauthorized IP address'"
                                    persistent-hint
                            ></v-text-field>

                            <v-text-field
                                    label="Recipients"
                                    v-model="settings.email_reports.recipients"
                                    outlined
                                    dense
                                    hint="Comma-separated list, e.g. you@gmail.com, partner@company.com"
                                    persistent-hint
                            ></v-text-field>

                            <v-text-field
                                    label="Send hour (UTC)"
                                    v-model="settings.email_reports.hour"
                                    type="number"
                                    min="0" max="23"
                                    outlined
                                    dense
                                    hint="Report covers the previous day, sent at this UTC hour"
                                    persistent-hint
                            ></v-text-field>

                            <div class="d-flex align-center mt-2">
                                <v-btn small outlined color="primary" :loading="emailTesting" @click="testEmailReport">
                                    <v-icon small class="mr-1">mdi-send-outline</v-icon>Send test report now
                                </v-btn>
                                <div class="caption grey--text ml-2">Saves settings first, then emails yesterday's report</div>
                            </div>
                        </v-card-text>
                    </v-card>
                </v-col>

                <v-col cols="12" md="6">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-shield-lock-outline</v-icon>
                            Postback security
                        </v-card-title>
                        <v-card-text>
                            <v-switch
                                    v-model="settings.postback_security.enabled"
                                    label="Require a secret key or IP allowlist for inbound postbacks"
                                    inset
                                    dense
                                    hide-details
                            ></v-switch>

                            <v-text-field
                                    label="Secret key"
                                    v-model="settings.postback_security.secret_key"
                                    :disabled="!settings.postback_security.enabled"
                                    :append-icon="showPbSecret ? 'mdi-eye-off-outline' : 'mdi-eye-outline'"
                                    :type="showPbSecret ? 'text' : 'password'"
                                    @click:append="showPbSecret = !showPbSecret"
                                    outlined
                                    dense
                                    hint="Networks must pass it as ?key=... or ?secret=... or an X-Postback-Key header. Leave empty to allow the key check."
                                    persistent-hint
                            ></v-text-field>

                            <v-textarea
                                    label="Allowed IPs"
                                    v-model="settings.postback_security.allowed_ips"
                                    :disabled="!settings.postback_security.enabled"
                                    outlined
                                    dense
                                    rows="2"
                                    hint="Comma-separated IPs or CIDR ranges, e.g. 203.0.113.5, 10.0.0.0/8. Leave empty to allow any IP."
                                    persistent-hint
                            ></v-textarea>

                            <div class="caption grey--text">
                                When enabled, inbound postbacks must satisfy every non-empty check. If both stay empty while enabled, postbacks are allowed.
                            </div>
                        </v-card-text>
                    </v-card>
                </v-col>

                <v-col cols="12" md="6">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-database-refresh-outline</v-icon>
                            Data retention
                        </v-card-title>
                        <v-card-text>
                            <v-switch
                                    v-model="settings.data_retention.enabled"
                                    label="Auto-delete tracking data older than a set window"
                                    inset
                                    dense
                                    hide-details
                            ></v-switch>
                            <v-text-field
                                    label="Keep data for (days)"
                                    v-model.number="settings.data_retention.days"
                                    :disabled="!settings.data_retention.enabled"
                                    type="number"
                                    min="1"
                                    outlined
                                    dense
                                    hint="A daily job prunes clicks_data older than this. Example: 180."
                                    persistent-hint
                            ></v-text-field>
                        </v-card-text>
                    </v-card>
                </v-col>

                <!-- Custom conversion statuses block (G19) -->
                <v-col cols="12" md="6">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-tag-plus-outline</v-icon>
                            Conversion statuses
                        </v-card-title>
                        <v-card-text>
                            <div class="caption grey--text mb-3">
                                Custom event types accepted on postbacks and imports, in addition to the
                                built-ins (lead, sale, upsale, rejected, hold, trash). Names are normalized
                                to lowercase_underscore — "ReGistration Bonus" becomes
                                <code>registration_bonus</code>.
                            </div>

                            <div v-for="(cs, i) in settings.custom_statuses" :key="i"
                                 class="d-flex align-center custom-status-row">
                                <v-text-field
                                        v-model="cs.name"
                                        label="Status name"
                                        outlined
                                        dense
                                        hide-details
                                        class="mr-3"
                                ></v-text-field>
                                <span class="status-chip mr-3" :class="customStatusChipClass(i)">
                                    {{ slugifyStatus(cs.name) || '…' }}
                                </span>
                                <v-btn icon small @click="settings.custom_statuses.splice(i, 1)">
                                    <v-icon small color="red">mdi-close</v-icon>
                                </v-btn>
                            </div>

                            <div class="mt-2">
                                <v-btn small text color="primary" @click="addCustomStatus">
                                    <v-icon small class="mr-1">mdi-plus</v-icon>Add status
                                </v-btn>
                            </div>

                            <div class="caption grey--text mt-2">
                                Custom statuses appear in the conversion-log status filter and edit dialog,
                                and in the postback URL <code>/pb?clickid=…&amp;status=…&amp;payout=…</code>.
                            </div>
                        </v-card-text>
                    </v-card>
                </v-col>

                <!-- Variable mapping block -->
                <v-col cols="12">
                    <v-card class="pa-4">
                        <v-card-title>Matching variables (Sub IDs)</v-card-title>
                        <v-card-text>
                            <v-row dense v-for="(mapping, index) in subIdMapping" :key="index" align="center">
                                <v-col cols="3">
                                    <v-text-field
                                            :label="mapping.name"
                                            v-model="mapping.name"
                                            :readonly="!mapping.editable_name"
                                            outlined
                                            dense
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="3">
                                    <v-text-field
                                            :label="mapping.parameter"
                                            v-model="mapping.parameter"
                                            :readonly="!mapping.editable_name"
                                            outlined
                                            dense
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="6">
                                    <v-text-field
                                            label="Variable name"
                                            v-model="mapping.token"
                                            outlined
                                            dense
                                    ></v-text-field>
                                </v-col>
                            </v-row>

                        </v-card-text>
                    </v-card>
                </v-col>

                <!-- G69: flow monitoring -->
                <v-col cols="12">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-heart-pulse</v-icon>
                            Monitoring
                            <v-spacer></v-spacer>
                            <v-btn small outlined color="primary" :loading="monitorChecking" @click="checkNow">
                                <v-icon small class="mr-1">mdi-refresh</v-icon>Check now
                            </v-btn>
                        </v-card-title>
                        <v-card-text>
                            <v-switch
                                    v-model="settings.monitoring.auto_disable_flows"
                                    label="Auto-disable flows after 3 consecutive failures"
                                    inset
                                    dense
                                    hide-details
                                    hint="Every 15 minutes the tracker HTTP-checks every offer URL, landing link and redirect URL used by active campaigns. A dead flow is switched off in its campaign config so the routing engine skips it, and a Telegram alert is sent (when Telegram notifications are enabled). Turning this off keeps monitoring + alerts but never changes flows."
                                    persistent-hint
                                    class="mb-3"
                            ></v-switch>
                            <v-data-table
                                    :headers="monitorHeaders"
                                    :items="monitorItems"
                                    dense
                                    :loading="monitorLoading"
                                    :items-per-page="10"
                            >
                                <template v-slot:item.status="{ item }">
                                    <span class="status-chip"
                                          :class="item.status === 'ok' ? 'status-chip--success' : 'status-chip--danger'">{{ item.status }}</span>
                                </template>
                                <template v-slot:item.checked_at="{ item }">
                                    {{ item.checked_at ? $formatDate(item.checked_at) : '—' }}
                                </template>
                                <template v-slot:no-data>
                                    <div class="empty-state">
                                        <v-icon>mdi-heart-pulse</v-icon>
                                        <div class="mt-2">No checks yet — hit "Check now" to probe every flow destination</div>
                                    </div>
                                </template>
                            </v-data-table>
                        </v-card-text>
                    </v-card>
                </v-col>

                <!-- D1e: privacy -->
                <v-col cols="12" md="6">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-shield-lock-outline</v-icon>
                            Privacy
                        </v-card-title>
                        <v-card-text>
                            <v-switch
                                    v-model="settings.privacy.anonymize_ip"
                                    label="Anonymize IP addresses"
                                    inset
                                    dense
                                    hide-details
                                    hint="The tracking plane masks visitor IPs (last octet zeroed: 203.0.113.55 → 203.0.113.0) before writing ClickHouse rows. Geo detection still works; per-IP drill-down is lost. Applied to new traffic only."
                                    persistent-hint
                                    class="mb-3"
                            ></v-switch>
                            <div class="caption grey--text">
                                Visitors can opt out of all tracking entirely via the
                                <a :href="optoutUrl" target="_blank">{{ optoutUrl }}</a> page — it sets the
                                <code>aaa_optout</code> cookie and the tracking plane stops writing rows and setting
                                cookies for that browser.
                            </div>
                        </v-card-text>
                    </v-card>
                </v-col>

                <!-- Tracking plane toggles -->
                <v-col cols="12" md="6">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-crosshairs-gps</v-icon>
                            Tracking
                        </v-card-title>
                        <v-card-text>
                            <v-switch
                                    v-model="settings.tracking.prefetch_filter_enabled"
                                    label="Ignore prefetch requests"
                                    inset dense hide-details
                                    hint="Browser prefetch/prerender hits (Purpose: prefetch) still get the redirect but are not counted as visits or click-outs. Default on — prefetches otherwise inflate stats."
                                    persistent-hint
                                    class="mb-3"
                            ></v-switch>
                            <v-switch
                                    v-model="settings.tracking.skip_bot_costs"

            this.loadMonitorStatus();
            this.$root.$on('load-settings', this.loadSettings);

            },
            // Header sort arrows are server-side: a new ordering refetches page 1
            auditSortBy() { this.loadAudit(1); },
            auditSortDesc() { this.loadAudit(1); },
        },
        computed:{
              // The saved list the cost sync reads — mirrored read-only in the
              // cost-sync card so accounts are picked in exactly one place.
              metaAdsSavedAccounts() {
                return (((this.metaAdsStatus || {}).ad_account_ids) || []).map(String);
              },
              postbackUrl() {
                return `${window.location.origin}/pb?clickid={clickid}&payout={payout}&status={status}&tid={tid}`;
              },
              postbackUrlDemo() {
                return `${window.location.origin}/pb?clickid=d8f8d388-356b-4063-90ef-6137258b59c1&payout=202.15&status=sale&tid=TXN-90210`;
              },
              optoutUrl() {
                return `${window.location.origin}/optout`;
              },
              // Same macro set the campaign editor's token palette offers —
              // substituted in the global fallback URL at redirect time.
              fallbackTokens() {
                return [
                    'click_id', 'campaign_name', 'campaign_id', 'campaign_alias',
                    'sub_id_1', 'sub_id_2', 'sub_id_3', 'sub_id_4', 'sub_id_5',
                    'sub_id_6', 'sub_id_7', 'sub_id_8', 'sub_id_9', 'sub_id_10',
                    'country', 'city', 'region', 'os', 'os_version', 'browser',
                    'browser_version', 'device_type', 'device_model', 'language',
                    'source', 'traffic_source_name', 'referrer', 'keyword', 'ip',
                    'isp', 'is_bot', 'is_using_proxy', 'visitor_id', 'external_id',
                    'ad_campaign_id', 'utm_source', 'utm_medium', 'utm_campaign',
                    'utm_creative', '_md5', 'payout', 'status',
                ];
              },
              // Live "what your numbers will look like" hint under the controls.
              workspacePreview() {
                const ws = this.settings.workspace || {};
                let decimals = parseInt(ws.decimals, 10);
                if (isNaN(decimals)) decimals = 2;
                decimals = Math.min(6, Math.max(0, decimals));
                let out = (1234567.891).toLocaleString('en-US',
                    {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
                if (ws.divider === 'space') out = out.replace(/,/g, '\u00a0');
                else if (ws.divider === 'none') out = out.replace(/,/g, '');
                return out;
              }
        },

            async clearData() {

                await new Promise(resolve => setTimeout(resolve, 1500));
                if (!confirm("Are you REALLY sure you want to DELETE ALL TRACKING  HISTORY DATA?")) return;

                    })
                    .catch(err => {

                    });
            },
            loadSettings() {
                // Reset the gate on every (re)load: Save is unavailable until
                // this succeeds, and the snapshot the save diffs against is
                // rebuilt from what actually loaded.
                this.settingsLoaded = false;
                this.settingsLoadError = '';
                this.settingsSnapshot = null;
                let loadedRev = null;
                return fetch("/backend/api/settings/", {
                    credentials: "include"
                })
                    .then((r) => {
                        if (!r.ok) throw new Error("HTTP " + r.status);
                        return r.json();
                    })
                    .then((data) => {
                        loadedRev = (data && data.settings_rev) || null;
                        // merge so freshly saved keys never lose their defaults
                        const tgDefaults = {
                            enabled: false,
                            bot_token: '',
                            chat_id: '',
                            statuses: {
                                lead: true, sale: true, upsale: true,
                                rejected: true, hold: true, trash: true,
                            },
                        };
                        const erDefaults = {
                            enabled: false, smtp_host: '', smtp_port: 587,
                            smtp_login: '', smtp_password: '', api_key: '',
                            from_name: 'AAA Tracker', from_email: '',
                            recipients: '', hour: 9,
                        };
                        const pbDefaults = {
                            enabled: false, secret_key: '', allowed_ips: '',
                        };
                        this.settings = Object.assign({}, this.settings, data.settings || {});
                        this.settings.telegram = Object.assign({}, tgDefaults, this.settings.telegram || {});
                        this.settings.telegram.statuses = Object.assign(
                            {}, tgDefaults.statuses, this.settings.telegram.statuses || {});
                        this.settings.email_reports = Object.assign(
                            {}, erDefaults, this.settings.email_reports || {});
                        this.settings.postback_security = Object.assign(
                            {}, pbDefaults, this.settings.postback_security || {});
                        this.settings.data_retention = Object.assign(
                            {}, {enabled: false, days: 180}, this.settings.data_retention || {});
                        this.settings.monitoring = Object.assign(
                            {}, {auto_disable_flows: false}, this.settings.monitoring || {});
                        this.settings.privacy = Object.assign(
                            {}, {anonymize_ip: false}, this.settings.privacy || {});
                        this.settings.tracking = Object.assign(
                            {}, {prefetch_filter_enabled: true, skip_bot_costs: false,
                                referrer_hiding_domain: ''}, this.settings.tracking || {});
                        this.settings.login_security = Object.assign(
                            {}, {ip_whitelist: ''}, this.settings.login_security || {});
                        const maDefaults = {
                            enabled: false, ad_account_ids: [], access_token: '',
                            api_version: 'v21.0', dry_run: true, cadence: 'hourly',
                            backfill_days: 7, graph_base_url: '', match_preference: 'auto',
                        };
                        this.settings.meta_ads = Object.assign(
                            {}, maDefaults, this.settings.meta_ads || {});
                        if (!Array.isArray(this.settings.meta_ads.ad_account_ids)) {
                            this.settings.meta_ads.ad_account_ids = [];
                        }
                        this.settings.copilot = Object.assign({}, {
                            enabled: true, model: 'google/gemini-2.5-flash-lite',
                            max_tokens: 400, base_url: '', api_key: '',
                        }, this.settings.copilot || {});
                        this.loadMetaAdsStatus();
                        if (!Array.isArray(this.settings.custom_statuses)) this.settings.custom_statuses = [];
                        this.settings.workspace = Object.assign(
                            {}, {decimals: 2, divider: 'comma', row_coloring: [],
                                 default_columns: {}},
                            this.settings.workspace || {});
                        if (!Array.isArray(this.settings.workspace.row_coloring)) {
                            this.settings.workspace.row_coloring = [];
                        }
                        if (!this.settings.workspace.default_columns
                            || typeof this.settings.workspace.default_columns !== 'object') {
                            this.settings.workspace.default_columns = {};
                        }
                        if (data.subIdMapping) this.subIdMapping = data.subIdMapping;
                        // loadMonitorStatus writes settings.monitoring from the
                        // server, so snapshot only after it settles.
                        return this.loadMonitorStatus();
                    })
                    .then(() => {
                        this.settingsRev = loadedRev;
                        this.settingsSnapshot = JSON.parse(JSON.stringify(this.settings));
                        this.subIdMappingSnapshot = JSON.parse(JSON.stringify(this.subIdMapping));
                        this.settingsLoaded = true;
                    })
                    .catch((err) => {
                        this.settingsLoaded = false;
                        this.settingsSnapshot = null;
                        this.settingsLoadError =
                            "Could not load settings (" + sanitizeToastMessage(err.message) + ").";
                        this.$root.$emit("show-message", {type: "error", text: this.settingsLoadError});
                    });
            },
            // Structural comparison used to build the minimal save payload.
            deepEqual(a, b) {
                if (a === b) return true;
                if (a === null || b === null || typeof a !== typeof b) return false;
                const aArr = Array.isArray(a), bArr = Array.isArray(b);
                if (aArr || bArr) {
                    if (!aArr || !bArr || a.length !== b.length) return false;
                    for (let i = 0; i < a.length; i++) {
                        if (!this.deepEqual(a[i], b[i])) return false;
                    }
                    return true;
                }
                if (typeof a === 'object') {
                    const ka = Object.keys(a), kb = Object.keys(b);
                    if (ka.length !== kb.length) return false;
                    for (const k of ka) {
                        if (!Object.prototype.hasOwnProperty.call(b, k)) return false;
                        if (!this.deepEqual(a[k], b[k])) return false;
                    }
                    return true;
                }
                return false;
            },
            // Only the top-level sections the operator changed since the load.
            // Unchanged blocks (currency, meta_ads, bot_rules, meta_capi, …) are
            // omitted entirely, so a save can never drop or clobber them.
            changedSettingsPayload() {
                const out = {};
                const snap = this.settingsSnapshot || {};
                for (const key of Object.keys(this.settings)) {
                    if (!Object.prototype.hasOwnProperty.call(snap, key)
                        || !this.deepEqual(this.settings[key], snap[key])) {
                        out[key] = this.settings[key];
                    }
                }
                return out;
            },
            subIdMappingChanged() {
                return !this.deepEqual(this.subIdMapping,
                                       this.subIdMappingSnapshot || []);
            },
            saveSettings(silent) {
                if (!this.settingsLoaded) {
                    // No load, no save: this is what stops a page that never
                    // loaded (or failed to) from publishing its defaults.
                    if (!this.settingsLoadError) {
                        this.settingsLoadError =
                            "Settings are not loaded — save is blocked to protect the stored configuration.";
                    }
                    this.$root.$emit("show-message",
                        {type: "error", text: this.settingsLoadError});
                    return Promise.reject(new Error(this.settingsLoadError));
                }
                const payload = {
                    settings: this.changedSettingsPayload(),
                    // The server refuses a write whose rev does not match the
                    // document this page loaded.
                    _base_rev: this.settingsRev
                };
                // A sub-ID mapping save is a whole-block write, so only send it
                // when the operator edited it.
                if (this.subIdMappingChanged()) payload.subIdMapping = this.subIdMapping;
                this.savingSettings = true;
                return fetch("/backend/api/settings/", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    credentials: "include",
                    body: JSON.stringify(payload)
                })
                    .then((r) => r.json().catch(() => ({})).then((data) => {
                        if (!r.ok) throw new Error(data.detail || ("HTTP " + r.status));
                        return data;
                    }))
                    .then((data) => {
                        if (data.settings_rev) this.settingsRev = data.settings_rev;
                        this.settingsSnapshot = JSON.parse(JSON.stringify(this.settings));
                        this.subIdMappingSnapshot = JSON.parse(JSON.stringify(this.subIdMapping));
                        if (this.$loadWorkspace) this.$loadWorkspace();
                        if (!silent) {
                            this.$root.$emit("show-message", {type: "success", text: "Settings saved"});
                        }
                        return data;
                    })
                    .catch((err) => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                        throw err;
                    })
                    .finally(() => { this.savingSettings = false; });
            },
            async exportSettingsBackup() {
                try {
                    const res = await fetch("/backend/api/settings/export", {credentials: "include"});
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    const a = document.createElement("a");
                    a.href = URL.createObjectURL(await res.blob());
                    a.download = "settings-backup.json";
                    a.click();
                    URL.revokeObjectURL(a.href);
                    this.$root.$emit("show-message", {type: "success", text: "Settings exported (secrets redacted)"});
                } catch (err) {
                    this.$root.$emit("show-message", {type: "error", text: "Export failed: " + sanitizeToastMessage(err.message)});
                }
            },
            openImportPicker() {
                this.$refs.importFile.click();
            },
            onImportFileChosen(evt) {
                const file = evt.target.files && evt.target.files[0];
                evt.target.value = "";
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => this.importSettingsBackup(reader.result);
                reader.readAsText(file);
            },
            async importSettingsBackup(text) {
                let doc;
                try {
                    doc = JSON.parse(text);
                } catch (e) {
                    this.$root.$emit("show-message", {type: "error", text: "Import failed: the file is not valid JSON"});
                    return;
                }
                const ok = await this.$refs.confirm.open(
                    "Import settings",
                    "Restore settings from this backup? Current values will be overwritten; saved secrets (tokens, keys) are kept.",
                    "Import");
                if (!ok) return;
                try {
                    const res = await fetch("/backend/api/settings/import", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        credentials: "include",
                        body: JSON.stringify(doc)
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || ("HTTP " + res.status));
                    this.$root.$emit("show-message", {type: "success", text: `Settings imported (${data.imported || 0} section(s))`});
                    this.loadSettings();
                } catch (err) {
                    this.$root.$emit("show-message", {type: "error", text: "Import failed: " + sanitizeToastMessage(err.message)});
                }
            },
            async testTelegram() {
                this.tgTesting = true;
                try {
                    await this.saveSettings(true);
                    const res = await fetch("/backend/api/settings/telegram-test", {
                        method: "POST",
                        credentials: "include"
                    });
                    const data = await res.json();
                    if (res.ok && data.status === "ok") {
                        this.$root.$emit("show-message", {type: "success", text: data.message || "Test message sent"});
                    } else {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(data.detail || "Test failed")});
                    }
                } catch (e) {
                    /* error toast already shown by saveSettings or above */
                } finally {
                    this.tgTesting = false;
                }
            },

            async testEmailReport() {
                this.emailTesting = true;
                try {
                    await this.saveSettings(true);
                    const res = await fetch("/backend/api/settings/email-test", {
                        method: "POST",
                        credentials: "include"
                    });
                    const data = await res.json();
                    if (res.ok && data.status === "ok") {
                        this.$root.$emit("show-message", {type: "success", text: data.message || "Test report sent"});
                    } else {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(data.detail || "Test report failed")});
                    }
                } catch (e) {
                    /* error toast already shown by saveSettings or above */
                } finally {
                    this.emailTesting = false;
                }
            },
            loadMetaAdsStatus() {
                fetch("/backend/api/meta-ads/status", {credentials: "include"})
                    .then(r => r.json())
                    .then(data => {
                        this.metaAdsStatus = data;
                        // Source of truth for the Integrations picker: the same
                        // settings document the cost sync reads.
                        this.metaAdsAccountSelection =
                            (data.ad_account_ids || []).map(String);
                    })
                    .catch(() => { /* status is advisory — the card still saves */ });
            },
            async syncMetaAdsNow() {
                this.metaAdsSyncing = true;
                this.metaAdsResult = '';
                try {
                    await this.saveSettings(true);
                    const res = await fetch("/backend/api/meta-ads/sync", {
                        method: "POST", credentials: "include"
                    });
                    const data = await res.json();
                    this.metaAdsResult = JSON.stringify(data, null, 2);
                    this.loadMetaAdsStatus();
                    const status = data.status || "";
                    if (status === "ok") {
                        this.$root.$emit("show-message", {type: "success",
                            text: `Meta Ads sync done — matched ${data.matched || 0}, ` +
                                  `unmatched ${data.unmatched || 0}`});
                    } else if (status === "dry_run") {
                        this.$root.$emit("show-message", {type: "warning",
                            text: "Dry-run — request built, nothing written (see result)"});
                    } else {
                        this.$root.$emit("show-message", {type: "warning",
                            text: sanitizeToastMessage(data.reason || status || "Sync skipped")});
                    }
                } catch (e) {
                    this.$root.$emit("show-message", {type: "error",
                        text: "Meta Ads sync failed: " + sanitizeToastMessage(e.message)});
                } finally {
                    this.metaAdsSyncing = false;
                }
            },
            generateToken() {
                this.settings.apiToken = Math.random().toString(36).substring(2, 12);
            },
            auditQueryParams() {
                const params = new URLSearchParams();
                if (this.auditFilterUser) params.set('user', this.auditFilterUser);
                if (this.auditFilterAction) params.set('action', this.auditFilterAction);
                if (this.auditFilterEntity) params.set('entity', this.auditFilterEntity);
                if (this.auditFilterQ) params.set('q', this.auditFilterQ);
                if (this.auditFilterFrom) params.set('date_from', this.auditFilterFrom);
                if (this.auditFilterTo) params.set('date_to', this.auditFilterTo);
                if (this.auditSortBy) params.set('sort_by', this.auditSortBy);
                params.set('sort_desc', this.auditSortDesc ? 'true' : 'false');
                return params;
            },
            loadAudit(page) {
                this.auditLoading = true;
                const params = this.auditQueryParams();
                params.set('page', page || 1);
                params.set('page_size', 50);
                fetch(`/backend/api/audit/?${params.toString()}`, {credentials: 'include'})
                    .then(r => r.json())
                    .then(data => {
                        this.auditEntries = data.entries || [];
                        this.auditTotal = data.total || 0;
                        this.auditPage = data.page || 1;
                    })
                    .catch(err => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    })
                    .finally(() => {
                        this.auditLoading = false;
                    });

            loadAuditFacets() {
                fetch('/backend/api/audit/facets', {credentials: 'include'})
                    .then(r => r.json())
                    .then(data => {
                        if (Array.isArray(data.entities) && data.entities.length) {
                            this.auditEntityOptions = data.entities;
                        }
                    })
                    .catch(() => {});
            },
            exportAudit() {
                const params = this.auditQueryParams();
                window.open(`/backend/api/audit/export?${params.toString()}`, '_blank');
            },
            auditChipClass(action) {
                if (action.includes('fail') || action.includes('delete') || action === 'totp_failed') {
                    return 'status-chip--danger';
                }
                if (action.includes('login') || action === 'totp_enabled') return 'status-chip--success';
                if (action.startsWith('totp') || action.includes('update') || action === 'archive') {
                    return 'status-chip--warning';
                }
                return 'status-chip--info';
            },
            addCustomStatus() {
                if (!Array.isArray(this.settings.custom_statuses)) this.settings.custom_statuses = [];
                this.settings.custom_statuses.push({name: ''});
            },
            // --- G69 monitoring ---
            loadMonitorStatus() {
                this.monitorLoading = true;
                return fetch('/backend/api/monitor/status', {credentials: 'include'})
                    .then(r => r.ok ? r.json() : {items: []})
                    .then(data => {
                        this.monitorItems = data.items || [];
                        if (data.auto_disable_flows !== undefined) {
                            this.settings.monitoring.auto_disable_flows = data.auto_disable_flows;
                        }
                    })
                    .catch(() => {})
                    .finally(() => {
                        this.monitorLoading = false;
                    });
            },
            async checkNow() {
                this.monitorChecking = true;
                try {
                    const res = await fetch('/backend/api/monitor/check-now', {
                        method: 'POST', credentials: 'include'});
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'HTTP ' + res.status);
                    this.$root.$emit('show-message', {type: 'success',
                        text: `Checked ${data.checked} destination(s) — ${data.dead} dead`});
                    this.loadMonitorStatus();
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error',
                        text: 'Check failed: ' + sanitizeToastMessage(err.message)});
                } finally {
                    this.monitorChecking = false;
                }
            },
            slugifyStatus(name) {
                return String(name || '').trim().toLowerCase()
                    .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
            },
            customStatusChipClass(index) {
                const palette = ['status-chip--info', 'status-chip--success',
                    'status-chip--warning', 'status-chip--danger', 'status-chip--neutral'];
                return palette[index % palette.length];
            }
        }
    });
