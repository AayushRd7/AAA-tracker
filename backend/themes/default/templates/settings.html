            },
            saveSettings(silent) {
                // status_events / pixel_overrides (the legacy global fallback) stay
                // in settings; pixel records are managed through their own endpoint.
                const payload = {
                    settings: this.settings,
                    subIdMapping: this.subIdMapping
                };
                return fetch("/backend/api/settings/", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    credentials: "include",
                    body: JSON.stringify(payload)
                })
                    .then((r) => r.json())
                    .then((data) => {
                        if (!silent) {
                            this.$root.$emit("show-message", {type: "success", text: "Settings saved"});
                        }
                        return data;
                    })
                    .catch((err) => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                        throw err;
                    });
            },
            async exportSettingsBackup() {
                try {
                    const res = await fetch("/backend/api/settings/export", {credentials: "include"});
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    const a = document.createElement("a");
                    a.href = URL.createObjectURL(await res.blob());
                    a.download = "settings-backup.json";
                    a.click();
                    URL.revokeObjectURL(a.href);
                    this.$root.$emit("show-message", {type: "success", text: "Settings exported (secrets redacted)"});
                } catch (err) {
                    this.$root.$emit("show-message", {type: "error", text: "Export failed: " + sanitizeToastMessage(err.message)});
                }
            },
            openImportPicker() {
                this.$refs.importFile.click();
            },
            onImportFileChosen(evt) {
                const file = evt.target.files && evt.target.files[0];
                evt.target.value = "";
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => this.importSettingsBackup(reader.result);
                reader.readAsText(file);
            },
            async importSettingsBackup(text) {
                let doc;
                try {
                    doc = JSON.parse(text);
                } catch (e) {
                    this.$root.$emit("show-message", {type: "error", text: "Import failed: the file is not valid JSON"});
                    return;
                }
                const ok = await this.$refs.confirm.open(
                    "Import settings",
                    "Restore settings from this backup? Current values will be overwritten; saved secrets (tokens, keys) are kept.",
                    "Import");
                if (!ok) return;
                try {
                    const res = await fetch("/backend/api/settings/import", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        credentials: "include",
                        body: JSON.stringify(doc)
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || ("HTTP " + res.status));
                    this.$root.$emit("show-message", {type: "success", text: `Settings imported (${data.imported || 0} section(s))`});
                    this.loadSettings();
                } catch (err) {
                    this.$root.$emit("show-message", {type: "error", text: "Import failed: " + sanitizeToastMessage(err.message)});
                }
            },
            async testTelegram() {
                this.tgTesting = true;
                try {
                    await this.saveSettings(true);
                    const res = await fetch("/backend/api/settings/telegram-test", {

                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(data.detail || "Test failed")});

                } finally {
                    this.tgTesting = false;

            capiPlatformLabel(value) {

            async loadCapiPixels() {
                try {
                    const res = await fetch("/backend/api/settings/capi-pixels",

                    const data = await res.json();

            openPixelDialog(pixel) {
                if (pixel) {
                    this.capiForm = Object.assign({}, pixel, {
                        conversion_matching: (pixel.conversion_matching || []).map(r => Object.assign({}, r)),
                        payout_customisations: (pixel.payout_customisations || []).map(r => Object.assign({}, r)),

                    this.capiForm = {
                        title: '', platform: 'meta', pixel_id: '', access_token: '',
                        default_event_name: 'Purchase', event_url: '',
                        action_source: 'website', data_quality_token: '',

                        conversion_matching: [], payout_customisations: [],
                    };
                }
                this.showPixelToken = false;
                this.capiDialog = true;
            },
            async savePixel() {
                const f = this.capiForm;
                if (!(f.title || '').trim()) {
                    this.$root.$emit("show-message", {type: "error", text: "Title is required"});
                    return;
                }
                if (!(f.pixel_id || '').trim()) {
                    this.$root.$emit("show-message", {type: "error",
                        text: "Pixel / Dataset ID is required"});
                    return;
                }
                const body = {
                    title: f.title, platform: f.platform, pixel_id: f.pixel_id,
                    access_token: f.access_token,
                    default_event_name: f.default_event_name,
                    event_url: f.event_url, action_source: f.action_source,
                    data_quality_token: f.data_quality_token,
                    custom_matching: !!f.custom_matching, status: f.status,
                    conversion_matching: (f.conversion_matching || [])
                        .filter(r => (r.conversion_type || '').trim()),
                    payout_customisations: (f.payout_customisations || [])
                        .filter(r => (r.conversion_type || '').trim()),
                };
                this.capiSaving = true;
                try {
                    const url = f.id ? `/backend/api/settings/capi-pixels/${f.id}`
                                     : "/backend/api/settings/capi-pixels";
                    const res = await fetch(url, {
                        method: f.id ? "PUT" : "POST",
                        credentials: "include",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify(body)
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        this.$root.$emit("show-message", {type: "error",
                            text: sanitizeToastMessage(data.detail || "Could not save the pixel")});
                        return;
                    }
                    this.capiDialog = false;
                    await this.loadCapiPixels();
                    this.$root.$emit("show-message", {type: "success", text: "Pixel saved"});
                } finally {
                    this.capiSaving = false;
                }
            },
            async deletePixel(pixel) {
                if (!window.confirm(`Delete pixel “${pixel.title}”? Its channel/offer bindings are removed too.`)) return;
                const res = await fetch(`/backend/api/settings/capi-pixels/${pixel.id}`,
                                        {method: "DELETE", credentials: "include"});
                if (res.ok) {
                    await this.loadCapiPixels();
                    this.$root.$emit("show-message", {type: "success", text: "Pixel deleted"});
                }
            },
            async testMetaCapi() {
                this.metaTesting = true;
                this.metaTestResult = '';
                try {
                    await this.saveSettings(true);
                    const res = await fetch("/meta-capi/test", {
                        method: "POST",
                        credentials: "include"
                    });
                    const data = await res.json();
                    this.metaTestResult = JSON.stringify(data, null, 2);
                    if (res.ok && data.status === "ok") {
                        this.$root.$emit("show-message", {type: "success",
                            text: "Test event accepted by Meta"});
                    } else if (res.ok && data.status === "dry_run") {
                        this.$root.$emit("show-message", {type: "warning",
                            text: "Dry-run — payload built, nothing sent (see result)"});
                    } else if (res.ok && data.status === "disabled") {
                        this.$root.$emit("show-message", {type: "warning",
                            text: "Meta CAPI is disabled"});
                    } else {
                        this.$root.$emit("show-message", {type: "error",
                            text: sanitizeToastMessage(data.detail || "Test event failed")});
                    }
                } catch (e) {
                    this.$root.$emit("show-message", {type: "error",
                        text: "Test event failed: " + sanitizeToastMessage(e.message)});
                } finally {
                    this.metaTesting = false;
                }
            },
            generateToken() {
                this.settings.apiToken = Math.random().toString(36).substring(2, 12);
            },
            auditQueryParams() {
                const params = new URLSearchParams();
                if (this.auditFilterUser) params.set('user', this.auditFilterUser);
                if (this.auditFilterAction) params.set('action', this.auditFilterAction);
                if (this.auditFilterEntity) params.set('entity', this.auditFilterEntity);
                if (this.auditFilterQ) params.set('q', this.auditFilterQ);
                if (this.auditFilterFrom) params.set('date_from', this.auditFilterFrom);
                if (this.auditFilterTo) params.set('date_to', this.auditFilterTo);
                if (this.auditSortBy) params.set('sort_by', this.auditSortBy);
                params.set('sort_desc', this.auditSortDesc ? 'true' : 'false');
                return params;
            },
            loadAudit(page) {
                this.auditLoading = true;
                const params = this.auditQueryParams();
                params.set('page', page || 1);
                params.set('page_size', 50);
                fetch(`/backend/api/audit/?${params.toString()}`, {credentials: 'include'})
                    .then(r => r.json())
                    .then(data => {
                        this.auditEntries = data.entries || [];
                        this.auditTotal = data.total || 0;
                        this.auditPage = data.page || 1;
                    })
                    .catch(err => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    })
                    .finally(() => {
                        this.auditLoading = false;
                    });
            },
            loadAuditFacets() {
                fetch('/backend/api/audit/facets', {credentials: 'include'})
                    .then(r => r.json())
                    .then(data => {
                        if (Array.isArray(data.entities) && data.entities.length) {
                            this.auditEntityOptions = data.entities;
                        }
                    })
                    .catch(() => {});
            },
            exportAudit() {
                const params = this.auditQueryParams();
                window.open(`/backend/api/audit/export?${params.toString()}`, '_blank');
            },

                if (action.includes('fail') || action.includes('delete') || action === 'totp_failed') {
                    return 'status-chip--danger';
                }
                if (action.includes('login') || action === 'totp_enabled') return 'status-chip--success';
                if (action.startsWith('totp') || action.includes('update') || action === 'archive') {
                    return 'status-chip--warning';
                }
                return 'status-chip--info';
            },
            addBotRule() {
                if (!Array.isArray(this.settings.bot_rules.rules)) this.settings.bot_rules.rules = [];
                this.settings.bot_rules.rules.push({type: 'ip', value: '', action: 'block', enabled: true});
            },
            addCustomStatus() {
                if (!Array.isArray(this.settings.custom_statuses)) this.settings.custom_statuses = [];
                this.settings.custom_statuses.push({name: ''});
            },
            // --- G69 monitoring ---
            loadMonitorStatus() {
                this.monitorLoading = true;
                fetch('/backend/api/monitor/status', {credentials: 'include'})
                    .then(r => r.ok ? r.json() : {items: []})
                    .then(data => {
                        this.monitorItems = data.items || [];
                        if (data.auto_disable_flows !== undefined) {
                            this.settings.monitoring.auto_disable_flows = data.auto_disable_flows;
                        }
                    })
                    .catch(() => {})
                    .finally(() => {
                        this.monitorLoading = false;
                    });
            },
            async checkNow() {
                this.monitorChecking = true;
                try {
                    const res = await fetch('/backend/api/monitor/check-now', {
                        method: 'POST', credentials: 'include'});
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'HTTP ' + res.status);
                    this.$root.$emit('show-message', {type: 'success',
                        text: `Checked ${data.checked} destination(s) — ${data.dead} dead`});
                    this.loadMonitorStatus();
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error',
                        text: 'Check failed: ' + sanitizeToastMessage(err.message)});
                } finally {
                    this.monitorChecking = false;
                }
            },
            // --- G70 auto rules ---
            loadRules() {
                this.rulesLoading = true;
                fetch('/backend/api/rules/', {credentials: 'include'})
                    .then(r => r.ok ? r.json() : {rules: []})
                    .then(data => {
                        this.rules = data.rules || [];
                    })
                    .catch(() => {})
                    .finally(() => {
                        this.rulesLoading = false;
                    });
                fetch('/backend/api/campaigns/', {credentials: 'include'})
                    .then(r => r.ok ? r.json() : [])
                    .then(data => {
                        this.campaignOptions = (data || []).map(c => ({id: c.id, name: c.name}));
                    })
                    .catch(() => {});
            },
            openRuleDialog() {
                this.ruleForm = {name: '', campaign_id: null, metric: 'roi', period_hours: 6,
                                 comparator: '<', value: -30, action: 'alert_telegram'};
                this.ruleDialog = true;
            },
            async saveRule() {
                if (!this.ruleForm.name.trim() || !this.ruleForm.campaign_id) {
                    this.$root.$emit('show-message', {type: 'error',
                        text: 'Rule name and campaign are required.'});
                    return;
                }
                this.ruleSaving = true;
                try {
                    const res = await fetch('/backend/api/rules/', {
                        method: 'POST',
                        credentials: 'include',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            name: this.ruleForm.name.trim(),
                            enabled: true,
                            campaign_id: this.ruleForm.campaign_id,
                            conditions: [{metric: this.ruleForm.metric,
                                          period_hours: this.ruleForm.period_hours,
                                          comparator: this.ruleForm.comparator,
                                          value: this.ruleForm.value}],
                            action: this.ruleForm.action,
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'HTTP ' + res.status);
                    this.ruleDialog = false;
                    this.$root.$emit('show-message', {type: 'success', text: 'Rule created'});
                    this.loadRules();
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error',
                        text: 'Rule save failed: ' + sanitizeToastMessage(err.message)});
                } finally {
                    this.ruleSaving = false;
                }
            },
            async toggleRule(item) {
                try {
                    const res = await fetch(`/backend/api/rules/${item.id}`, {
                        method: 'PATCH',
                        credentials: 'include',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({enabled: !item.enabled})
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    this.loadRules();
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error',
                        text: 'Toggle failed: ' + sanitizeToastMessage(err.message)});
                }
            },
            async runRuleNow(item) {
                this.ruleRunning = item.id;
                try {
                    const res = await fetch(`/backend/api/rules/${item.id}/run`, {
                        method: 'POST', credentials: 'include'});
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'HTTP ' + res.status);
                    const conds = (data.conditions || []).map(c =>
                        `${c.metric} ${c.comparator} ${c.value} → ${c.actual == null ? '—' : c.actual}`);
                    this.$root.$emit('show-message', {
                        type: data.would_fire ? 'warning' : 'success',
                        text: `Run: ${conds.join('; ')}${data.would_fire ? ' — would fire' : ' — clear'}`});
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error',
                        text: 'Run failed: ' + sanitizeToastMessage(err.message)});
                } finally {
                    this.ruleRunning = null;
                }
            },
            async deleteRule(item) {
                if (!confirm(`Delete rule "${item.name}"?`)) return;
                try {
                    const res = await fetch(`/backend/api/rules/${item.id}`, {
                        method: 'DELETE', credentials: 'include'});
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    this.loadRules();
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error',
                        text: 'Delete failed: ' + sanitizeToastMessage(err.message)});
                }
            },
            slugifyStatus(name) {
                return String(name || '').trim().toLowerCase()
                    .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
            },
            customStatusChipClass(index) {
                const palette = ['status-chip--info', 'status-chip--success',
                    'status-chip--warning', 'status-chip--danger', 'status-chip--neutral'];
                return palette[index % palette.length];
            }
        }
    });
</script>
