{% raw %}
<script type="text/x-template" id="settings-template">
    <v-container fluid>
        <div class="d-flex align-center justify-space-between mb-4">
            <div>
                <div class="page-title">Settings</div>
                <div class="page-subtitle">Tracker configuration and postback URLs</div>
            </div>
            <div class="d-flex align-center">
                <v-btn
                        text
                        small
                        class="mr-2"
                        @click="exportSettingsBackup"
                >
                    <v-icon small class="mr-1">mdi-download</v-icon>Export
                </v-btn>
                <v-btn
                        text
                        small
                        class="mr-2"
                        @click="openImportPicker"
                >
                    <v-icon small class="mr-1">mdi-upload</v-icon>Import
                </v-btn>
                <input ref="importFile" type="file" accept="application/json,.json" style="display:none"
                       @change="onImportFileChosen">
                <v-btn
                        color="primary"
                        elevation="0"
                        :disabled="!settingsLoaded"
                        :loading="savingSettings"
                        @click="saveSettings(false)"
                >
                    <v-icon small class="mr-1">mdi-content-save-outline</v-icon>Save settings
                </v-btn>
            </div>
        </div>
        <v-alert
                v-if="!settingsLoaded"
                :type="settingsLoadError ? 'error' : 'info'"
                dense
                text
                class="mb-3"
        >
            <span v-if="settingsLoadError">
                Save is disabled — {{ settingsLoadError }} Saving now would overwrite
                the stored configuration with this page's defaults, so it is blocked
                until the settings load succeeds.
            </span>
            <span v-else>Loading settings — Save is disabled until they load.</span>
            <v-btn v-if="settingsLoadError" text small color="primary" class="ml-2"
                   @click="loadSettings">Reload</v-btn>
        </v-alert>
        <v-container fluid class="px-0 settings-grid">

            <v-row class="mb-2">
                <v-col cols="12">
                    <v-card class="pa-4">
                        <v-card-title>Postback URLs</v-card-title>
                        <v-card-text>
                            <div class="caption grey--text mb-2">Accepts GET requests — statuses can only be: 'lead', 'sale', 'upsale', 'rejected', 'hold', 'trash'</div>
                            <div class="d-flex align-center code-row">
                                <code class="code-inline">{{ postbackUrl }}</code>
                                <v-tooltip bottom>
                                    <template v-slot:activator="{ on, attrs }">
                                        <v-btn icon small color="primary" v-bind="attrs" v-on="on" @click="copyText(postbackUrl)">
                                            <v-icon small>mdi-content-copy</v-icon>
                                        </v-btn>
                                    </template>
                                    <span>Copy postback URL</span>
                                </v-tooltip>
                            </div>
                            <div class="d-flex align-center code-row mt-2">
                                <span class="caption grey--text mr-2 demo-label">Demo</span>
                                <code class="code-inline">{{ postbackUrlDemo }}</code>
                                <v-tooltip bottom>
                                    <template v-slot:activator="{ on, attrs }">
                                        <v-btn icon small color="primary" v-bind="attrs" v-on="on" @click="copyText(postbackUrlDemo)">
                                            <v-icon small>mdi-content-copy</v-icon>
                                        </v-btn>
                                    </template>
                                    <span>Copy demo URL</span>
                                </v-tooltip>
                            </div>
                        </v-card-text>
                    </v-card>
                </v-col>
            </v-row>
            <v-row class="mb-2">
                <v-col cols="12">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-lifebuoy</v-icon>
                            Global fallback URL
                        </v-card-title>
                        <v-card-text>
                            <div class="caption grey--text mb-2">Where visitors are sent when no flow is eligible and the campaign has no fallback URL of its own. Leave empty to show a 404 page. Click macros are substituted at redirect time.</div>
                            <v-text-field
                                    label="Fallback URL"
                                    v-model="settings.fallback_url"
                                    outlined
                                    dense
                                    placeholder="https://example.com/offer?click_id={click_id}"
                                    hint="Global default — a campaign's own fallback URL always wins"
                                    persistent-hint
                            ></v-text-field>
                            <v-btn color="primary" elevation="0" class="mt-2"
                                   :disabled="!settingsLoaded" :loading="savingSettings"
                                   @click="saveSettings(false)">
                                <v-icon small class="mr-1">mdi-content-save-outline</v-icon>Save
                            </v-btn>
                            <div class="mt-4">Click to insert a token:</div>
                            <v-chip-group column>
                                <v-chip
                                        v-for="tok in fallbackTokens"
                                        :key="tok"
                                        class="ma-1"
                                        small
                                        outlined
                                        @click="insertFallbackToken(tok)"
                                >{{"{"}}{{ tok }}{{"}"}}</v-chip>
                            </v-chip-group>
                        </v-card-text>
                    </v-card>
                </v-col>
            </v-row>
            <v-row>
                <v-col cols="12" md="6">
                    <v-card class="pa-4">
                        <v-card-title>General settings</v-card-title>
                        <v-card-text>
                            <v-switch
                                    v-model="darkMode"
                                    label="Dark mode"
                                    inset
                                    dense
                                    hide-details
                                    hint="Switches the whole dashboard between light and dark"
                                    persistent-hint
                                    class="mb-3"
                            ></v-switch>

                            <v-text-field
                                    label="Tracker domain"
                                    v-model="settings.domain"
                                    outlined
                                    dense
                            ></v-text-field>

                            <v-select
                                    label="Currency"
                                    :items="currencies"
                                    v-model="settings.currency"
                                    outlined
                                    dense
                            ></v-select>

                            <v-select
                                    label="Timezone"
                                    :items="timezones"
                                    v-model="settings.timezone"
                                    outlined
                                    dense
                            ></v-select>

                            <v-divider class="my-4"></v-divider>
                            <div class="subtitle-2 mb-2">Table display</div>

                            <v-row dense>
                                <v-col cols="6">
                                    <v-text-field
                                            label="Decimals"
                                            v-model.number="settings.workspace.decimals"
                                            type="number" min="0" max="6" step="1"
                                            outlined dense hide-details
                                            hint="0–6, applied to every numeric table cell"
                                            persistent-hint
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="6">
                                    <v-select
                                            label="Thousands divider"
                                            :items="dividerOptions"
                                            v-model="settings.workspace.divider"
                                            outlined dense hide-details
                                    ></v-select>
                                </v-col>
                            </v-row>
                            <div class="caption grey--text mt-2 mb-3">
                                Preview: <strong>{{ workspacePreview }}</strong>
                                — shown in Logs, Reports and Campaigns metrics.
                            </div>

                            <div class="subtitle-2 mb-1">Conditional row colouring</div>
                            <div class="caption grey--text mb-2">
                                Tint a data row when a numeric column matches a rule
                                (Logs tables and the Reports click/conversion tables).
                            </div>
                            <div v-for="(rule, i) in settings.workspace.row_coloring" :key="i"
                                 class="d-flex align-center row-color-rule">
                                <v-combobox
                                        v-model="rule.column"
                                        :items="rowColumnSuggestions"
                                        label="Column"
                                        outlined dense hide-details
                                        class="row-rule-col"
                                ></v-combobox>
                                <v-select
                                        v-model="rule.operator"
                                        :items="rowOperatorOptions"
                                        label="Op"
                                        outlined dense hide-details
                                        class="row-rule-op"
                                ></v-select>
                                <v-text-field
                                        v-model="rule.value"
                                        label="Value"
                                        outlined dense hide-details
                                        class="row-rule-val"
                                ></v-text-field>
                                <v-select
                                        v-model="rule.color"
                                        :items="rowColorOptions"
                                        label="Colour"
                                        outlined dense hide-details
                                        class="row-rule-color"
                                ></v-select>
                                <v-btn icon small @click="settings.workspace.row_coloring.splice(i, 1)">
                                    <v-icon small color="red">mdi-close</v-icon>
                                </v-btn>
                            </div>
                            <div class="mt-2">
                                <v-btn small text color="primary" @click="addRowColorRule">
                                    <v-icon small class="mr-1">mdi-plus</v-icon>Add rule
                                </v-btn>
                            </div>

                            <v-divider class="my-4"></v-divider>
                            <div class="subtitle-2 mb-1">Grouping view</div>
                            <div class="caption grey--text mb-2">
                                Render the report breakdown as one subtotal row per first-level
                                group, expandable to the rows inside it. Off keeps the flat
                                expandable tree.
                            </div>
                            <v-switch
                                    v-model="settings.workspace.grouping_view"
                                    label="Grouped report breakdown"
                                    inset dense hide-details
                            ></v-switch>

                            <v-divider class="my-4"></v-divider>
                            <div class="subtitle-2 mb-1">Custom report columns</div>
                            <div class="caption grey--text mb-2">
                                Name a formula over the built-in metrics, e.g.
                                <code>revenue / clicks</code> for EPC or
                                <code>profit / cost * 100</code> for margin. They appear as
                                columns in the Reports builder. Metric keys:
                                <span class="cc-hint">{{ customColumnMetricKeys.join(', ') }}</span>
                            </div>
                            <div v-for="(col, i) in settings.workspace.custom_columns" :key="'cc-' + i"
                                 class="d-flex align-center mb-2">
                                <v-chip small label class="mr-2">{{ col.name }}</v-chip>
                                <code class="cc-formula">{{ col.formula }}</code>
                                <v-spacer></v-spacer>
                                <v-btn icon x-small color="error" @click="removeCustomColumn(i)">
                                    <v-icon small>mdi-trash-can-outline</v-icon>
                                </v-btn>
                            </div>
                            <v-row dense>
                                <v-col cols="4">
                                    <v-text-field v-model="newCustomColumn.name" label="Name"
                                                  outlined dense hide-details placeholder="EPC"></v-text-field>
                                </v-col>
                                <v-col cols="8">
                                    <v-text-field v-model="newCustomColumn.formula" label="Formula"
                                                  outlined dense hide-details placeholder="revenue / clicks"
                                                  @keyup.enter="addCustomColumn"></v-text-field>
                                </v-col>
                            </v-row>
                            <div v-if="customColumnError" class="caption error--text mt-1">{{ customColumnError }}</div>
                            <div class="mt-2">
                                <v-btn small text color="primary"
                                       :disabled="settings.workspace.custom_columns.length >= 10"
                                       @click="addCustomColumn">
                                    <v-icon small class="mr-1">mdi-plus</v-icon>Add column
                                </v-btn>
                            </div>

                        </v-card-text>
                    </v-card>

                    <v-card class="pa-4 mt-4" id="fx-rates">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-currency-usd</v-icon>
                            Multi-currency reporting
                        </v-card-title>
                        <v-card-text>
                            <div class="caption grey--text mb-3">
                                Report revenue, cost and payout in one base currency.
                                Rates are fetched daily and cached — reports never call a
                                rate provider, and a stale or manually pinned rate is
                                flagged here.
                            </div>
                            <v-row dense>
                                <v-col cols="6">
                                    <v-combobox
                                            label="Base currency"
                                            :items="fxCurrencyOptions"
                                            v-model="fxDraft.base"
                                            outlined dense hide-details
                                            hint="Reporting currency"
                                            persistent-hint
                                    ></v-combobox>
                                </v-col>
                                <v-col cols="6">
                                    <v-text-field
                                            label="Stale after (hours)"
                                            type="number" min="1" max="720" step="1"
                                            v-model.number="fxDraft.stale_after_hours"
                                            outlined dense hide-details
                                            hint="Older rates are marked stale"
                                            persistent-hint
                                    ></v-text-field>
                                </v-col>
                            </v-row>
                            <v-combobox
                                    label="Currencies to convert"
                                    :items="fxCurrencyOptions"
                                    v-model="fxDraft.currencies"
                                    multiple chips small-chips deletable-chips
                                    outlined dense hide-details class="mt-3"
                                    hint="The currencies conversions can arrive in"
                                    persistent-hint
                            ></v-combobox>

                            <div class="d-flex align-center mt-4">
                                <div class="subtitle-2">Rate table</div>
                                <v-chip x-small label class="ml-2"
                                        v-if="fxStatus && fxStatus.active"
                                        :color="fxStatus.stale ? 'error' : 'success'">
                                    {{ fxStatus.stale ? 'Stale' : 'Fresh' }}
                                </v-chip>
                                <v-spacer></v-spacer>
                                <span class="caption grey--text mr-3" v-if="fxStatus">
                                    Source: {{ fxStatus.source || '—' }}
                                    <span v-if="fxStatus.age_hours !== null && fxStatus.age_hours !== undefined">
                                        · age {{ fxAgeLabel }}
                                    </span>
                                </span>
                                <v-btn small text color="primary"
                                       :loading="fxRefreshing" @click="refreshFxNow">
                                    <v-icon small class="mr-1">mdi-refresh</v-icon>Refresh now
                                </v-btn>
                            </div>
                            <div class="caption error--text mt-1" v-if="fxStatus && fxStatus.last_error">
                                Last refresh failed: {{ fxStatus.last_error }} — last good rates kept.
                            </div>
                            <v-simple-table dense class="mt-2 fx-table">
                                <thead>
                                <tr>
                                    <th>Currency</th>
                                    <th class="text-right">1 {{ fxBaseLabel }} =</th>
                                    <th>Source</th>
                                    <th></th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr v-for="row in fxRows" :key="row.currency">
                                    <td>{{ row.currency }}</td>
                                    <td class="text-right">
                                        {{ row.rate === null ? '—' : row.rate.toFixed(4) }}
                                    </td>
                                    <td class="caption grey--text">
                                        <v-chip x-small label v-if="row.overridden" color="warning">manual</v-chip>
                                        <span v-else>{{ row.source }}</span>
                                    </td>
                                    <td class="text-right">
                                        <v-btn x-small icon color="error" v-if="row.overridden"
                                               @click="clearFxOverride(row.currency)">
                                            <v-icon x-small>mdi-close</v-icon>
                                        </v-btn>
                                    </td>
                                </tr>
                                <tr v-if="!fxRows.length">
                                    <td colspan="4" class="caption grey--text">
                                        No rates yet — pick currencies and press Refresh now.
                                    </td>
                                </tr>
                                </tbody>
                            </v-simple-table>
                            <div class="d-flex align-center mt-3">
                                <v-combobox
                                        v-model="fxNewOverride.currency"
                                        :items="fxCurrencyOptions"
                                        label="Override currency"
                                        outlined dense hide-details
                                        class="mr-2 fx-override-cur"
                                ></v-combobox>
                                <v-text-field
                                        v-model.number="fxNewOverride.rate"
                                        type="number" min="0" step="0.0001"
                                        :label="'1 ' + fxBaseLabel + ' ='"
                                        outlined dense hide-details
                                        class="mr-2 fx-override-rate"
                                ></v-text-field>
                                <v-btn small text color="primary"
                                       :disabled="!fxNewOverride.currency || !(fxNewOverride.rate > 0)"
                                       @click="addFxOverride">
                                    <v-icon small class="mr-1">mdi-pin</v-icon>Pin rate
                                </v-btn>
                            </div>
                            <div class="mt-3">
                                <v-btn small color="primary" elevation="0"
                                       :loading="fxSaving" @click="saveFxConfig">
                                    <v-icon small class="mr-1">mdi-content-save-outline</v-icon>Save FX settings
                                </v-btn>
                            </div>
                        </v-card-text>
                    </v-card>

                    <v-card class="pa-4 mt-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-account-convert</v-icon>
                            Attribution
                        </v-card-title>
                        <v-card-text>
                            <div class="caption grey--text mb-3">
                                How a conversion is matched to a click, per workspace.
                                Defaults reproduce the tracker's previous behaviour:
                                a 7-day window and last click.
                            </div>

                            <v-select label="Attribution window"
                                      :items="attributionWindowOptions"
                                      v-model="attributionWindowChoice"
                                      outlined dense hide-details class="mb-2"></v-select>
                            <v-text-field v-if="attributionWindowChoice === 'custom'"
                                          label="Custom window (days)"
                                          v-model.number="settings.attribution.window_days"
                                          type="number" min="1" max="3650" step="1"
                                          outlined dense hide-details
                                          hint="1–3650 days"
                                          persistent-hint class="mb-3"></v-text-field>

                            <v-select label="Attribution model"
                                      :items="attributionModelOptions"
                                      v-model="settings.attribution.model"
                                      outlined dense hide-details
                                      hint="First click credits the visitor's earliest resolvable click; it needs a visitor ID or click rows that carry one."
                                      persistent-hint class="mb-3"></v-select>

                            <v-divider class="my-3"></v-divider>
                            <div class="subtitle-2 mb-1">Cross-device identifiers</div>
                            <div class="caption grey--text mb-2">
                                Stitch a clickless conversion onto a click using an
                                identifier the conversion carries.
                            </div>
                            <v-switch v-model="settings.attribution.stitch_visitor_id"
                                      label="First-party visitor ID (aaa_vid)"
                                      inset dense hide-details class="mb-1"
                                      hint="Already cross-session; the only identifier wired today."
                                      persistent-hint></v-switch>
                            <v-switch :input-value="settings.attribution.stitch_hashed_email"
                                      label="Hashed email (not available yet)"
                                      inset dense hide-details disabled class="mb-1"></v-switch>
                            <v-switch :input-value="settings.attribution.stitch_hashed_phone"
                                      label="Hashed phone (not available yet)"
                                      inset dense hide-details disabled class="mb-1"></v-switch>
                            <div class="caption grey--text">
                                No hashed email/phone is stored on clicks or conversions
                                yet, so those toggles have no effect — conversions fall
                                back to today's behaviour.
                            </div>
                        </v-card-text>
                    </v-card>
                </v-col>

                <v-col cols="12" md="6">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-telegram</v-icon>
                            Telegram notifications
                            <v-spacer></v-spacer>
                            <v-chip x-small :color="settings.telegram.enabled ? 'green' : 'grey'" dark>
                                {{ settings.telegram.enabled ? 'enabled' : 'disabled' }}
                            </v-chip>
                        </v-card-title>
                        <v-card-text>
                            <v-switch
                                    v-model="settings.telegram.enabled"
                                    label="Notify about conversions in Telegram"
                                    inset
                                    dense
                                    hide-details
                            ></v-switch>

                            <v-alert v-if="!deployment.telegram_bot_configured"
                                     type="warning" text dense class="mt-3 mb-0">
                                Telegram is not configured for this deployment yet, so these
                                notifications stay off. The bot belongs to the whole deployment,
                                not to this workspace: set <code>TELEGRAM_BOT_TOKEN</code> (and
                                <code>TELEGRAM_BOT_USERNAME</code> for the bot button) in the
                                server environment and restart the backend. Only your chat is
                                chosen here.
                            </v-alert>
                            <template v-else>
                                <div class="caption grey--text mt-3 mb-1">
                                    Step 1 — open the bot and press Start
                                </div>
                                <v-btn v-if="deployment.telegram_bot_url" small outlined color="primary"
                                       :href="deployment.telegram_bot_url" target="_blank" rel="noopener"
                                       class="mb-3">
                                    <v-icon small class="mr-1">mdi-open-in-new</v-icon>Open Telegram bot
                                </v-btn>

                                <div class="caption grey--text mb-1">
                                    Step 2 — paste the chat you want alerts in
                                </div>
                                <v-text-field
                                        label="Chat ID"
                                        v-model="settings.telegram.chat_id"
                                        outlined
                                        dense
                                        hint="Send the bot any message, then forward it to @userinfobot to see your numeric chat ID (group chats use a negative id)"
                                        persistent-hint
                                ></v-text-field>
                            </template>

                            <div class="caption grey--text mt-2 mb-1">Notify for statuses</div>
                            <v-row dense no-gutters>
                                <v-col v-for="s in telegramStatusList" :key="s" cols="6" sm="4">
                                    <v-checkbox
                                            v-model="settings.telegram.statuses[s]"
                                            :label="s"
                                            dense
                                            hide-details
                                            class="mt-0"
                                    ></v-checkbox>
                                </v-col>
                            </v-row>

                            <div class="d-flex align-center mt-3">
                                <v-btn small outlined color="primary" :loading="tgTesting"
                                       :disabled="!deployment.telegram_bot_configured" @click="testTelegram">
                                    <v-icon small class="mr-1">mdi-send-outline</v-icon>Send test message
                                </v-btn>
                                <div class="caption grey--text ml-2">Saves settings first, then sends a test to your chat</div>
                            </div>
                        </v-card-text>
                    </v-card>
                </v-col>

                <v-col cols="12" md="6">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-email-outline</v-icon>
                            Daily email reports
                            <v-spacer></v-spacer>
                            <v-chip x-small :color="settings.email_reports.enabled ? 'green' : 'grey'" dark>
                                {{ settings.email_reports.enabled ? 'enabled' : 'disabled' }}
                            </v-chip>
                        </v-card-title>
                        <v-card-text>
                            <v-switch
                                    v-model="settings.email_reports.enabled"
                                    label="Send a daily report at the scheduled time"
                                    inset
                                    dense
                                    hide-details
                            ></v-switch>

                            <v-alert v-if="!deployment.email_configured"
                                     type="warning" text dense class="mt-3 mb-0">
                                Email delivery is not configured for this deployment yet, so
                                reports cannot be sent. The relay belongs to the whole
                                deployment, not to this workspace: set <code>SMTP_HOST</code>
                                with <code>SMTP_LOGIN</code> and <code>SMTP_PASSWORD</code>, or
                                <code>EMAIL_API_KEY</code>, in the server environment and
                                restart the backend.
                            </v-alert>
                            <div v-else class="caption grey--text mt-3 mb-2">
                                Delivered by this deployment's mail service<span
                                    v-if="deployment.email_from">, sent from
                                <b>{{ deployment.email_from }}</b></span> — nothing to set up here.
                            </div>

                            <v-text-field
                                    label="Recipients"
                                    v-model="settings.email_reports.recipients"
                                    outlined
                                    dense
                                    hint="Comma-separated list, e.g. you@gmail.com, partner@company.com"
                                    persistent-hint
                            ></v-text-field>

                            <v-text-field
                                    label="Send hour (UTC)"
                                    v-model="settings.email_reports.hour"
                                    type="number"
                                    min="0" max="23"
                                    outlined
                                    dense
                                    hint="Report covers the previous day, sent at this UTC hour"
                                    persistent-hint
                            ></v-text-field>

                            <div class="d-flex align-center mt-2">
                                <v-btn small outlined color="primary" :loading="emailTesting"
                                       :disabled="!deployment.email_configured" @click="testEmailReport">
                                    <v-icon small class="mr-1">mdi-send-outline</v-icon>Send test report now
                                </v-btn>
                                <div class="caption grey--text ml-2">Saves settings first, then emails yesterday's report</div>
                            </div>
                        </v-card-text>
                    </v-card>
                </v-col>

                <v-col cols="12" md="6">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">

                <!-- G69: flow monitoring -->

                            <v-icon color="primary" class="mr-2">mdi-heart-pulse</v-icon>

                        </v-card-text>
                    </v-card>
                </v-col>

                <!-- G90: admin login IP whitelist -->

                        <v-card-text>
                            <v-text-field

                                    persistent-hint

                        </v-card-text>
                    </v-card>
                </v-col>

                <!-- G65: audit log (admin-only) -->
                <v-col cols="12">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-clipboard-text-clock-outline</v-icon>
                            Audit log
                        </v-card-title>
                        <v-card-text>
                            <div class="caption grey--text mb-3">
                                Security-relevant events: sign-ins (success/failure), 2FA changes, user and permission changes, archive/restore. Newest first.
                            </div>
                            <v-row dense align="center" class="mb-2">
                                <v-col cols="12" sm="3">
                                    <v-select
                                            label="Object type"
                                            :items="auditEntityOptions"
                                            v-model="auditFilterEntity"
                                            outlined
                                            dense
                                            hide-details
                                            clearable
                                    ></v-select>
                                </v-col>
                                <v-col cols="12" sm="3">
                                    <v-text-field
                                            label="Title / ID contains"
                                            v-model="auditFilterQ"
                                            outlined
                                            dense
                                            hide-details
                                            clearable
                                            @keyup.enter="loadAudit(1)"
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="12" sm="3">
                                    <v-text-field
                                            label="Filter by user"
                                            v-model="auditFilterUser"
                                            outlined
                                            dense
                                            hide-details
                                            clearable
                                            @keyup.enter="loadAudit(1)"
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="6" sm="3">
                                    <v-select
                                            label="Action"
                                            :items="auditActions"
                                            v-model="auditFilterAction"
                                            outlined
                                            dense
                                            hide-details
                                            clearable
                                    ></v-select>
                                </v-col>
                                <v-col cols="6" sm="2">
                                    <v-text-field
                                            label="From"
                                            type="date"
                                            v-model="auditFilterFrom"
                                            outlined
                                            dense
                                            hide-details
                                            clearable
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="6" sm="2">
                                    <v-text-field
                                            label="To"
                                            type="date"
                                            v-model="auditFilterTo"
                                            outlined
                                            dense
                                            hide-details
                                            clearable
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="auto">
                                    <v-btn small outlined color="primary" @click="loadAudit(1)">
                                        <v-icon small class="mr-1">mdi-filter-outline</v-icon>Apply
                                    </v-btn>
                                </v-col>
                                <v-col cols="auto">
                                    <v-btn small outlined color="primary" @click="exportAudit">
                                        <v-icon small class="mr-1">mdi-download-outline</v-icon>Export CSV
                                    </v-btn>
                                </v-col>
                            </v-row>

                            <v-data-table
                                    v-col-resize:audit="auditHeaders"
                                    :headers="auditHeaders"
                                    :items="auditEntries"
                                    dense
                                    :loading="auditLoading"
                                    :server-items-length="auditTotal"
                                    :page.sync="auditPage"
                                    :sort-by.sync="auditSortBy"
                                    :sort-desc.sync="auditSortDesc"
                                    :items-per-page="50"
                                    hide-default-footer
                            >
                                <template v-slot:item.at="{ item }">
                                    {{ $formatDate(item.at) }}
                                </template>
                                <template v-slot:item.action="{ item }">
                                    <span class="status-chip" :class="auditChipClass(item.action)">{{ item.action }}</span>
                                </template>
                                <template v-slot:item.detail="{ item }">
                                    <code v-if="item.detail" class="caption">{{ JSON.stringify(item.detail) }}</code>
                                </template>

                                    <div class="empty-state">
                                        <v-icon>mdi-clipboard-text-outline</v-icon>

                            <div class="d-flex align-center justify-end mt-2">

                                <v-btn small outlined :disabled="auditPage <= 1" @click="loadAudit(auditPage - 1)">
                                    <v-icon small>mdi-chevron-left</v-icon>
                                </v-btn>
                                <v-btn small outlined class="ml-2" :disabled="auditPage >= Math.ceil(auditTotal / 50)" @click="loadAudit(auditPage + 1)">
                                    <v-icon small>mdi-chevron-right</v-icon>
                                </v-btn>
                            </div>
                        </v-card-text>
                    </v-card>
                </v-col>
            </v-row>

            <v-row>
                <v-col cols="12">
                    <v-card class="pa-4" id="meta-ads-cost-sync">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-chart-line</v-icon>
                            Meta Ads cost sync
                            <v-spacer></v-spacer>
                            <v-chip v-if="metaAdsStatus" x-small :color="metaAdsStatus.enabled ? 'green' : 'grey'" dark>
                                {{ metaAdsStatus.enabled ? 'enabled' : 'disabled' }}
                            </v-chip>
                        </v-card-title>
                        <v-card-text>
                            <div class="caption grey--text mb-2">
                                Keeps your campaign costs in step with Meta automatically. Connect
                                Meta and pick your ad accounts under <b>Integrations</b>, then switch
                                the sync on here — the tracker pulls each day's spend and folds it
                                into the matching campaign, so reports and ROI line up without any
                                manual entry. It runs on a schedule, off the tracking path, or on
                                demand with Sync now.

                            <v-switch
                                    v-model="settings.meta_ads.enabled"
                                    label="Keep my Meta costs up to date"
                                    inset dense hide-details
                            ></v-switch>
                            <v-switch
                                    v-model="settings.meta_ads.dry_run"

                                <v-col cols="12" md="4">
                                    <v-select
                                            label="How often"
                                            :items="metaAdsCadences"
                                            v-model="settings.meta_ads.cadence"
                                            :disabled="!settings.meta_ads.enabled"
                                            outlined dense
                                    ></v-select>
                                </v-col>
                                <v-col cols="12" md="4">
                                    <v-text-field
                                            label="Days to look back"
                                            v-model="settings.meta_ads.backfill_days"
                                            type="number"
                                            :disabled="!settings.meta_ads.enabled"
                                            outlined dense
                                            hint="Re-checked on each run (0 = yesterday only)"
                                            persistent-hint
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="12" md="4">
                                    <v-select
                                            label="Match campaigns by"
                                            :items="metaAdsMatchPreferences"
                                            v-model="settings.meta_ads.match_preference"
                                            :disabled="!settings.meta_ads.enabled"
                                            outlined dense
                                            hint="How Meta campaigns are matched to yours"
                                            persistent-hint
                                    ></v-select>
                                </v-col>
                            </v-row>

                            <div class="d-flex align-center mt-3">
                                <v-btn small outlined color="primary" :loading="metaAdsSyncing"
                                       @click="syncMetaAdsNow">
                                    <v-icon small class="mr-1">mdi-sync</v-icon>Sync now
                                </v-btn>
                                <div class="caption grey--text ml-3" v-if="metaAdsStatus">
                                    Last sync: {{ metaAdsStatus.last_sync_at || 'never' }}
                                    <span v-if="metaAdsStatus.last_result">
                                        — {{ metaAdsStatus.last_result.status }}
                                        (matched {{ metaAdsStatus.last_result.matched || 0 }},
                                        unmatched {{ metaAdsStatus.last_result.unmatched || 0 }})
                                    </span>
                                    <span v-if="metaAdsStatus.last_error" class="red--text">
                                        — error: {{ metaAdsStatus.last_error }}
                                    </span>
                                </div>
                            </div>
                            <pre v-if="metaAdsResult" class="caption mt-2">{{ metaAdsResult }}</pre>
                        </v-card-text>
                    </v-card>
                </v-col>
            </v-row>

            <v-row>
                <v-col cols="12">
                    <v-card class="pa-4" id="copilot-settings">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-robot-outline</v-icon>
                            Copilot
                            <v-spacer></v-spacer>
                            <v-chip x-small :color="settings.copilot.enabled ? 'green' : 'grey'" dark>
                                {{ settings.copilot.enabled ? 'enabled' : 'disabled' }}
                            </v-chip>
                        </v-card-title>
                        <v-card-text>
                            <div class="caption grey--text mb-2">
                                Powers the Copilot page: a plain-language summary of the account's own
                                aggregated numbers, plus an operator question box. Each call costs money, so

                                deployment and is not chosen here.
                            </div>
                            <v-switch
                                    v-model="settings.copilot.enabled"
                                    label="Enable Copilot"
                                    inset dense hide-details
                            ></v-switch>
                            <v-row dense class="mt-3">
                                <v-col cols="12" md="4">
                                    <v-text-field
                                            label="Max output tokens"
                                            v-model.number="settings.copilot.max_tokens"
                                            type="number"
                                            :disabled="!settings.copilot.enabled"
                                            outlined dense
                                            hint="Hard cap (60-800)"
                                            persistent-hint
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="12" md="8">
                                    <v-text-field
                                            label="Service key (optional)"
                                            v-model="settings.copilot.api_key"
                                            :disabled="!settings.copilot.enabled"
                                            :append-icon="showCopilotKey ? 'mdi-eye-off-outline' : 'mdi-eye-outline'"
                                            :type="showCopilotKey ? 'text' : 'password'"
                                            @click:append="showCopilotKey = !showCopilotKey"
                                            outlined dense
                                            hint="Leave as-is unless advised — usually set for the whole deployment"
                                            persistent-hint
                                    ></v-text-field>
                                </v-col>
                            </v-row>
                        </v-card-text>
                    </v-card>
                </v-col>
            </v-row>

                <v-btn
                        color="red"
                        @click="clearData"
                        outlined
                >
                    <v-icon small class="mr-1">mdi-delete-alert-outline</v-icon>Delete clicks & conversion history data
                </v-btn>

        </v-container>

        <confirm-dialog-component ref="confirm" />
    </v-container>
</script>

        template: '#settings-template',
        data() {
            return {
                settings: {
                    domain: '',
                    currency: 'USD',
                    timezone: 'UTC',
                    fallback_url: '',
                    autoUpdateReports: true,
                    apiToken: 'a1b2c3d4e5f6',
                    enableLogging: false,
                    telegram: {
                        enabled: false,
                        chat_id: '',
                        statuses: {

                    },
                    email_reports: {
                        enabled: false,
                        recipients: '',
                        hour: 9,
                    },
                    postback_security: {
                        enabled: false,
                        secret_key: '',
                        allowed_ips: '',
                    },
                    data_retention: {
                        enabled: false,
                        days: 180,
                    },
                    custom_statuses: [],
                    monitoring: {
                        auto_disable_flows: false,
                    },
                    privacy: {
                        anonymize_ip: false,
                    },
                    tracking: {
                        prefetch_filter_enabled: true,
                        skip_bot_costs: false,
                        referrer_hiding_domain: '',
                    },
                    login_security: {
                        ip_whitelist: '',
                    },
                    // Meta Ads cost auto-sync (Meta only): pulls daily spend and
                    // allocates it into clicks_data.cost for matched campaigns.
                    // The token and Graph endpoint are the deployment's; accounts
                    // are chosen under Integrations.
                    meta_ads: {
                        enabled: false,
                        ad_account_ids: [],

                        cadence: 'hourly',

                    // Copilot: AI summary / Q&A over the account's own aggregates.

            // Unchanged blocks (currency, meta_ads, bot_rules, meta_capi, …) are
            // omitted entirely, so a save can never drop or clobber them.
            changedSettingsPayload() {
                const out = {};
                const snap = this.settingsSnapshot || {};
                for (const key of Object.keys(this.settings)) {
                    if (!Object.prototype.hasOwnProperty.call(snap, key)
                        || !this.deepEqual(this.settings[key], snap[key])) {
                        out[key] = this.settings[key];
                    }
                }
                return out;
            },
            subIdMappingChanged() {
                return !this.deepEqual(this.subIdMapping,
                                       this.subIdMappingSnapshot || []);
            },
            saveSettings(silent) {
                if (!this.settingsLoaded) {
                    // No load, no save: this is what stops a page that never
                    // loaded (or failed to) from publishing its defaults.
                    if (!this.settingsLoadError) {
                        this.settingsLoadError =
                            "Settings are not loaded — save is blocked to protect the stored configuration.";
                    }
                    this.$root.$emit("show-message",
                        {type: "error", text: this.settingsLoadError});
                    return Promise.reject(new Error(this.settingsLoadError));
                }
                const payload = {
                    settings: this.changedSettingsPayload(),
                    // The server refuses a write whose rev does not match the
                    // document this page loaded.
                    _base_rev: this.settingsRev
                };
                // A sub-ID mapping save is a whole-block write, so only send it
                // when the operator edited it.
                if (this.subIdMappingChanged()) payload.subIdMapping = this.subIdMapping;
                this.savingSettings = true;
                return fetch("/backend/api/settings/", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    credentials: "include",
                    body: JSON.stringify(payload)
                })
                    .then((r) => r.json().catch(() => ({})).then((data) => {
                        if (!r.ok) throw new Error(data.detail || ("HTTP " + r.status));
                        return data;
                    }))
                    .then((data) => {
                        if (data.settings_rev) this.settingsRev = data.settings_rev;
                        this.settingsSnapshot = JSON.parse(JSON.stringify(this.settings));
                        this.subIdMappingSnapshot = JSON.parse(JSON.stringify(this.subIdMapping));
                        if (this.$loadWorkspace) this.$loadWorkspace();
                        if (!silent) {
                            this.$root.$emit("show-message", {type: "success", text: "Settings saved"});
                        }
                        return data;
                    })
                    .catch((err) => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                        throw err;
                    })
                    .finally(() => { this.savingSettings = false; });
            },
            async exportSettingsBackup() {
                try {
                    const res = await fetch("/backend/api/settings/export", {credentials: "include"});
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    const a = document.createElement("a");
                    a.href = URL.createObjectURL(await res.blob());
                    a.download = "settings-backup.json";
                    a.click();
                    URL.revokeObjectURL(a.href);
                    this.$root.$emit("show-message", {type: "success", text: "Settings exported (secrets redacted)"});
                } catch (err) {
                    this.$root.$emit("show-message", {type: "error", text: "Export failed: " + sanitizeToastMessage(err.message)});
                }
            },
            openImportPicker() {
                this.$refs.importFile.click();
            },
            onImportFileChosen(evt) {
                const file = evt.target.files && evt.target.files[0];
                evt.target.value = "";
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => this.importSettingsBackup(reader.result);
                reader.readAsText(file);
            },
            async importSettingsBackup(text) {
                let doc;
                try {
                    doc = JSON.parse(text);
                } catch (e) {
                    this.$root.$emit("show-message", {type: "error", text: "Import failed: the file is not valid JSON"});
                    return;
                }
                const ok = await this.$refs.confirm.open(
                    "Import settings",
                    "Restore settings from this backup? Current values will be overwritten; saved secrets (tokens, keys) are kept.",
                    "Import");
                if (!ok) return;
                try {
                    const res = await fetch("/backend/api/settings/import", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        credentials: "include",
                        body: JSON.stringify(doc)
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || ("HTTP " + res.status));
                    this.$root.$emit("show-message", {type: "success", text: `Settings imported (${data.imported || 0} section(s))`});
                    this.loadSettings();
                } catch (err) {
                    this.$root.$emit("show-message", {type: "error", text: "Import failed: " + sanitizeToastMessage(err.message)});
                }
            },
            async testTelegram() {
                this.tgTesting = true;
                try {
                    await this.saveSettings(true);
                    const res = await fetch("/backend/api/settings/telegram-test", {
                        method: "POST",
                        credentials: "include"
                    });
                    const data = await res.json();
                    if (res.ok && data.status === "ok") {
                        this.$root.$emit("show-message", {type: "success", text: data.message || "Test message sent"});
                    } else {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(data.detail || "Test failed")});
                    }
                } catch (e) {
                    /* error toast already shown by saveSettings or above */
                } finally {
                    this.tgTesting = false;
                }
            },

            async testEmailReport() {
                this.emailTesting = true;
                try {
                    await this.saveSettings(true);
                    const res = await fetch("/backend/api/settings/email-test", {
                        method: "POST",
                        credentials: "include"
                    });
                    const data = await res.json();
                    if (res.ok && data.status === "ok") {
                        this.$root.$emit("show-message", {type: "success", text: data.message || "Test report sent"});
                    } else {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(data.detail || "Test report failed")});
                    }
                } catch (e) {
                    /* error toast already shown by saveSettings or above */
                } finally {
                    this.emailTesting = false;
                }
            },
            loadMetaAdsStatus() {
                fetch("/backend/api/meta-ads/status", {credentials: "include"})
                    .then(r => r.json())
                    .then(data => {
                        this.metaAdsStatus = data;
                        // Source of truth for the Integrations picker: the same
                        // settings document the cost sync reads.
                        this.metaAdsAccountSelection =
                            (data.ad_account_ids || []).map(String);
                    })
                    .catch(() => { /* status is advisory — the card still saves */ });
            },
            async syncMetaAdsNow() {
                this.metaAdsSyncing = true;
                this.metaAdsResult = '';
                try {
                    await this.saveSettings(true);
                    const res = await fetch("/backend/api/meta-ads/sync", {
                        method: "POST", credentials: "include"
                    });
                    const data = await res.json();
                    this.metaAdsResult = JSON.stringify(data, null, 2);
                    this.loadMetaAdsStatus();
                    const status = data.status || "";
                    if (status === "ok") {
                        this.$root.$emit("show-message", {type: "success",
                            text: `Meta Ads sync done — matched ${data.matched || 0}, ` +
                                  `unmatched ${data.unmatched || 0}`});
                    } else if (status === "dry_run") {
                        this.$root.$emit("show-message", {type: "warning",
                            text: "Dry-run — request built, nothing written (see result)"});
                    } else {
                        this.$root.$emit("show-message", {type: "warning",
                            text: sanitizeToastMessage(data.reason || status || "Sync skipped")});
                    }
                } catch (e) {
                    this.$root.$emit("show-message", {type: "error",
                        text: "Meta Ads sync failed: " + sanitizeToastMessage(e.message)});
                } finally {
                    this.metaAdsSyncing = false;
                }
            },
            generateToken() {
                this.settings.apiToken = Math.random().toString(36).substring(2, 12);
            },
            auditQueryParams() {
                const params = new URLSearchParams();
                if (this.auditFilterUser) params.set('user', this.auditFilterUser);
                if (this.auditFilterAction) params.set('action', this.auditFilterAction);
                if (this.auditFilterEntity) params.set('entity', this.auditFilterEntity);
                if (this.auditFilterQ) params.set('q', this.auditFilterQ);
                if (this.auditFilterFrom) params.set('date_from', this.auditFilterFrom);
                if (this.auditFilterTo) params.set('date_to', this.auditFilterTo);
                if (this.auditSortBy) params.set('sort_by', this.auditSortBy);
                params.set('sort_desc', this.auditSortDesc ? 'true' : 'false');
                return params;
            },
            loadAudit(page) {
                this.auditLoading = true;
                const params = this.auditQueryParams();
                params.set('page', page || 1);
                params.set('page_size', 50);
                fetch(`/backend/api/audit/?${params.toString()}`, {credentials: 'include'})
                    .then(r => r.json())
                    .then(data => {
                        this.auditEntries = data.entries || [];
                        this.auditTotal = data.total || 0;
                        this.auditPage = data.page || 1;
                    })
                    .catch(err => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    })
                    .finally(() => {
                        this.auditLoading = false;
                    });
            },
            loadAuditFacets() {
                fetch('/backend/api/audit/facets', {credentials: 'include'})
                    .then(r => r.json())
                    .then(data => {
                        if (Array.isArray(data.entities) && data.entities.length) {
                            this.auditEntityOptions = data.entities;
                        }
                    })
                    .catch(() => {});
            },
            exportAudit() {
                const params = this.auditQueryParams();
                window.open(`/backend/api/audit/export?${params.toString()}`, '_blank');
            },
            auditChipClass(action) {
                if (action.includes('fail') || action.includes('delete') || action === 'totp_failed') {
                    return 'status-chip--danger';
                }
                if (action.includes('login') || action === 'totp_enabled') return 'status-chip--success';
                if (action.startsWith('totp') || action.includes('update') || action === 'archive') {
                    return 'status-chip--warning';
                }
                return 'status-chip--info';
            },
            addCustomStatus() {
                if (!Array.isArray(this.settings.custom_statuses)) this.settings.custom_statuses = [];
                this.settings.custom_statuses.push({name: ''});
            },
            // --- G69 monitoring ---
            loadMonitorStatus() {
                this.monitorLoading = true;
                return fetch('/backend/api/monitor/status', {credentials: 'include'})
                    .then(r => r.ok ? r.json() : {items: []})
                    .then(data => {
                        this.monitorItems = data.items || [];
                        if (data.auto_disable_flows !== undefined) {
                            this.settings.monitoring.auto_disable_flows = data.auto_disable_flows;
                        }
                    })
                    .catch(() => {})
                    .finally(() => {
                        this.monitorLoading = false;
                    });
            },
            async checkNow() {
                this.monitorChecking = true;
                try {
                    const res = await fetch('/backend/api/monitor/check-now', {
                        method: 'POST', credentials: 'include'});
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'HTTP ' + res.status);
                    this.$root.$emit('show-message', {type: 'success',
                        text: `Checked ${data.checked} destination(s) — ${data.dead} dead`});
                    this.loadMonitorStatus();
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error',
                        text: 'Check failed: ' + sanitizeToastMessage(err.message)});
                } finally {
                    this.monitorChecking = false;
                }
            },
            slugifyStatus(name) {
                return String(name || '').trim().toLowerCase()
                    .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
            },
            customStatusChipClass(index) {
                const palette = ['status-chip--info', 'status-chip--success',
                    'status-chip--warning', 'status-chip--danger', 'status-chip--neutral'];
                return palette[index % palette.length];
            }
        }
    });
</script>
