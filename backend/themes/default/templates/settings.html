{% raw %}
<script type="text/x-template" id="settings-template">
    <v-container fluid>
        <div class="d-flex align-center justify-space-between mb-4">
            <div>
                <div class="page-title">Settings</div>
                <div class="page-subtitle">Tracker configuration and postback URLs</div>
            </div>
            <div class="d-flex align-center">
                <v-btn
                        text
                        small
                        class="mr-2"
                        @click="exportSettingsBackup"
                >
                    <v-icon small class="mr-1">mdi-download</v-icon>Export
                </v-btn>
                <v-btn
                        text
                        small
                        class="mr-2"
                        @click="openImportPicker"
                >
                    <v-icon small class="mr-1">mdi-upload</v-icon>Import
                </v-btn>
                <input ref="importFile" type="file" accept="application/json,.json" style="display:none"
                       @change="onImportFileChosen">
                <v-btn
                        color="primary"
                        elevation="0"
                        @click="saveSettings(false)"
                >
                    <v-icon small class="mr-1">mdi-content-save-outline</v-icon>Save settings
                </v-btn>
            </div>
        </div>
        <v-container fluid class="px-0 settings-grid">

            <v-row class="mb-2">
                <v-col cols="12">
                    <v-card class="pa-4">
                        <v-card-title>Postback URLs</v-card-title>
                        <v-card-text>
                            <div class="caption grey--text mb-2">Accepts GET requests — statuses can only be: 'lead', 'sale', 'upsale', 'rejected', 'hold', 'trash'</div>
                            <div class="d-flex align-center code-row">
                                <code class="code-inline">{{ postbackUrl }}</code>
                                <v-tooltip bottom>
                                    <template v-slot:activator="{ on, attrs }">
                                        <v-btn icon small color="primary" v-bind="attrs" v-on="on" @click="copyText(postbackUrl)">
                                            <v-icon small>mdi-content-copy</v-icon>
                                        </v-btn>
                                    </template>
                                    <span>Copy postback URL</span>
                                </v-tooltip>
                            </div>
                            <div class="d-flex align-center code-row mt-2">
                                <span class="caption grey--text mr-2 demo-label">Demo</span>
                                <code class="code-inline">{{ postbackUrlDemo }}</code>
                                <v-tooltip bottom>
                                    <template v-slot:activator="{ on, attrs }">
                                        <v-btn icon small color="primary" v-bind="attrs" v-on="on" @click="copyText(postbackUrlDemo)">
                                            <v-icon small>mdi-content-copy</v-icon>
                                        </v-btn>
                                    </template>
                                    <span>Copy demo URL</span>
                                </v-tooltip>
                            </div>
                        </v-card-text>
                    </v-card>
                </v-col>
            </v-row>
            <v-row class="mb-2">
                <v-col cols="12">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-lifebuoy</v-icon>
                            Global fallback URL
                        </v-card-title>
                        <v-card-text>
                            <div class="caption grey--text mb-2">Where visitors are sent when no flow is eligible and the campaign has no fallback URL of its own. Leave empty to show a 404 page. Click macros are substituted at redirect time.</div>
                            <v-text-field
                                    label="Fallback URL"
                                    v-model="settings.fallback_url"
                                    outlined
                                    dense
                                    placeholder="https://example.com/offer?click_id={click_id}"
                                    hint="Global default — a campaign's own fallback URL always wins"
                                    persistent-hint
                            ></v-text-field>
                            <v-btn color="primary" elevation="0" class="mt-2" @click="saveSettings(false)">
                                <v-icon small class="mr-1">mdi-content-save-outline</v-icon>Save
                            </v-btn>
                            <div class="mt-4">Click to insert a token:</div>
                            <v-chip-group column>
                                <v-chip
                                        v-for="tok in fallbackTokens"
                                        :key="tok"
                                        class="ma-1"
                                        small
                                        outlined
                                        @click="insertFallbackToken(tok)"
                                >{{"{"}}{{ tok }}{{"}"}}</v-chip>
                            </v-chip-group>
                        </v-card-text>
                    </v-card>
                </v-col>
            </v-row>
            <v-row>
                <v-col cols="12" md="6">
                    <v-card class="pa-4">
                        <v-card-title>General settings</v-card-title>
                        <v-card-text>
                            <v-switch
                                    v-model="darkMode"
                                    label="Dark mode"
                                    inset
                                    dense
                                    hide-details
                                    hint="Switches the whole dashboard between light and dark"
                                    persistent-hint
                                    class="mb-3"
                            ></v-switch>

                            <v-text-field
                                    label="Tracker domain"
                                    v-model="settings.domain"
                                    outlined
                                    dense
                            ></v-text-field>

                            <v-select
                                    label="Currency"
                                    :items="currencies"
                                    v-model="settings.currency"
                                    outlined
                                    dense
                            ></v-select>

                            <v-select
                                    label="Timezone"
                                    :items="timezones"
                                    v-model="settings.timezone"
                                    outlined
                                    dense
                            ></v-select>

                        </v-card-text>
                    </v-card>
                </v-col>

                <v-col cols="12" md="6">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-telegram</v-icon>
                            Telegram notifications
                        </v-card-title>
                        <v-card-text>
                            <v-switch
                                    v-model="settings.telegram.enabled"
                                    label="Notify about conversions in Telegram"
                                    inset
                                    dense
                                    hide-details
                            ></v-switch>

                            <v-text-field
                                    label="Bot token"
                                    v-model="settings.telegram.bot_token"
                                    outlined
                                    dense
                                    hint="Create a bot with @BotFather → /newbot → copy its token (looks like 123456789:AAExampleTokenFormat)"
                                    persistent-hint
                            ></v-text-field>

                            <v-text-field
                                    label="Chat ID"
                                    v-model="settings.telegram.chat_id"
                                    outlined
                                    dense
                                    hint="Message your bot once, then open api.telegram.org/bot<TOKEN>/getUpdates in a browser and copy chat.id (groups use a negative id)"
                                    persistent-hint
                            ></v-text-field>

                            <div class="caption grey--text mt-2 mb-1">Notify for statuses</div>
                            <v-row dense no-gutters>
                                <v-col v-for="s in telegramStatusList" :key="s" cols="6" sm="4">
                                    <v-checkbox
                                            v-model="settings.telegram.statuses[s]"
                                            :label="s"
                                            dense
                                            hide-details
                                            class="mt-0"
                                    ></v-checkbox>
                                </v-col>
                            </v-row>

                            <div class="d-flex align-center mt-3">
                                <v-btn small outlined color="primary" :loading="tgTesting" @click="testTelegram">
                                    <v-icon small class="mr-1">mdi-send-outline</v-icon>Send test message
                                </v-btn>
                                <div class="caption grey--text ml-2">Saves settings first, then sends a test to your chat</div>
                            </div>
                        </v-card-text>
                    </v-card>
                </v-col>

                <v-col cols="12" md="6">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-email-outline</v-icon>
                            Daily email reports
                        </v-card-title>
                        <v-card-text>
                            <v-switch
                                    v-model="settings.email_reports.enabled"
                                    label="Send a daily report at the scheduled time"
                                    inset
                                    dense
                                    hide-details
                            ></v-switch>

                            <v-row dense>
                                <v-col cols="8">
                                    <v-text-field
                                            label="SMTP host"
                                            v-model="settings.email_reports.smtp_host"
                                            outlined
                                            dense
                                            hint="e.g. smtp-relay.brevo.com (Brevo) or smtp.gmail.com (Gmail)"
                                            persistent-hint
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="4">
                                    <v-text-field
                                            label="Port"
                                            v-model="settings.email_reports.smtp_port"
                                            type="number"
                                            outlined
                                            dense
                                            hint="587 (STARTTLS)"
                                            persistent-hint
                                    ></v-text-field>
                                </v-col>
                            </v-row>

                            <v-text-field
                                    label="SMTP login"
                                    v-model="settings.email_reports.smtp_login"
                                    outlined
                                    dense
                            ></v-text-field>

                            <v-text-field
                                    label="SMTP password"
                                    v-model="settings.email_reports.smtp_password"
                                    :append-icon="showSmtpPassword ? 'mdi-eye-off-outline' : 'mdi-eye-outline'"
                                    :type="showSmtpPassword ? 'text' : 'password'"
                                    @click:append="showSmtpPassword = !showSmtpPassword"
                                    outlined
                                    dense
                                    hint="Brevo SMTP key, Gmail App Password, or SendGrid API key"
                                    persistent-hint
                            ></v-text-field>

                            <v-row dense>
                                <v-col cols="6">
                                    <v-text-field
                                            label="From name"
                                            v-model="settings.email_reports.from_name"
                                            outlined
                                            dense
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="6">
                                    <v-text-field
                                            label="From email"
                                            v-model="settings.email_reports.from_email"
                                            outlined
                                            dense
                                    ></v-text-field>
                                </v-col>
                            </v-row>

                            <v-text-field
                                    label="Brevo API key (optional)"
                                    v-model="settings.email_reports.api_key"
                                    :append-icon="showBrevoApiKey ? 'mdi-eye-off-outline' : 'mdi-eye-outline'"
                                    :type="showBrevoApiKey ? 'text' : 'password'"
                                    @click:append="showBrevoApiKey = !showBrevoApiKey"
                                    outlined
                                    dense
                                    hint="Optional — paste your Brevo API key (xkeysib-…) to send via the API instead of SMTP. The API has no IP restriction, so it works even when the relay returns 'Unauthorized IP address'"
                                    persistent-hint
                            ></v-text-field>

                            <v-text-field
                                    label="Recipients"
                                    v-model="settings.email_reports.recipients"
                                    outlined
                                    dense
                                    hint="Comma-separated list, e.g. you@gmail.com, partner@company.com"
                                    persistent-hint
                            ></v-text-field>

                            <v-text-field
                                    label="Send hour (UTC)"
                                    v-model="settings.email_reports.hour"
                                    type="number"
                                    min="0" max="23"
                                    outlined
                                    dense
                                    hint="Report covers the previous day, sent at this UTC hour"
                                    persistent-hint
                            ></v-text-field>

                            <div class="d-flex align-center mt-2">
                                <v-btn small outlined color="primary" :loading="emailTesting" @click="testEmailReport">
                                    <v-icon small class="mr-1">mdi-send-outline</v-icon>Send test report now
                                </v-btn>
                                <div class="caption grey--text ml-2">Saves settings first, then emails yesterday's report</div>
                            </div>
                        </v-card-text>
                    </v-card>
                </v-col>

                <v-col cols="12" md="6">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-shield-lock-outline</v-icon>
                            Postback security
                        </v-card-title>
                        <v-card-text>
                            <v-switch
                                    v-model="settings.postback_security.enabled"
                                    label="Require a secret key or IP allowlist for inbound postbacks"
                                    inset
                                    dense
                                    hide-details
                            ></v-switch>

                            <v-text-field
                                    label="Secret key"
                                    v-model="settings.postback_security.secret_key"
                                    :disabled="!settings.postback_security.enabled"
                                    :append-icon="showPbSecret ? 'mdi-eye-off-outline' : 'mdi-eye-outline'"
                                    :type="showPbSecret ? 'text' : 'password'"
                                    @click:append="showPbSecret = !showPbSecret"
                                    outlined
                                    dense
                                    hint="Networks must pass it as ?key=... or ?secret=... or an X-Postback-Key header. Leave empty to allow the key check."
                                    persistent-hint
                            ></v-text-field>

                            <v-textarea
                                    label="Allowed IPs"
                                    v-model="settings.postback_security.allowed_ips"
                                    :disabled="!settings.postback_security.enabled"
                                    outlined
                                    dense
                                    rows="2"
                                    hint="Comma-separated IPs or CIDR ranges, e.g. 203.0.113.5, 10.0.0.0/8. Leave empty to allow any IP."
                                    persistent-hint
                            ></v-textarea>

                            <div class="caption grey--text">
                                When enabled, inbound postbacks must satisfy every non-empty check. If both stay empty while enabled, postbacks are allowed.
                            </div>
                        </v-card-text>
                    </v-card>
                </v-col>

                <v-col cols="12" md="6">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-database-refresh-outline</v-icon>
                            Data retention
                        </v-card-title>
                        <v-card-text>
                            <v-switch
                                    v-model="settings.data_retention.enabled"
                                    label="Auto-delete tracking data older than a set window"
                                    inset
                                    dense
                                    hide-details
                            ></v-switch>
                            <v-text-field
                                    label="Keep data for (days)"
                                    v-model.number="settings.data_retention.days"
                                    :disabled="!settings.data_retention.enabled"
                                    type="number"
                                    min="1"
                                    outlined
                                    dense
                                    hint="A daily job prunes clicks_data older than this. Example: 180."
                                    persistent-hint
                            ></v-text-field>
                        </v-card-text>
                    </v-card>
                </v-col>

                <v-col cols="12" md="6">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-robot-outline</v-icon>
                            Bot &amp; filter rules
                        </v-card-title>
                        <v-card-text>
                            <v-switch
                                    v-model="settings.bot_rules.enabled"
                                    label="Enable click-level bot filtering"
                                    inset
                                    dense
                                    hide-details
                            ></v-switch>

                            <div v-for="(rule, i) in settings.bot_rules.rules" :key="i"
                                 class="d-flex align-center bot-rule-row">
                                <v-select
                                        v-model="rule.type"
                                        :items="botRuleTypes"
                                        outlined
                                        dense
                                        hide-details
                                        class="bot-rule-type"
                                        @change="rule.value = ['empty_referer','duplicate_visitor'].includes(rule.type) ? '' : rule.value"
                                ></v-select>
                                <v-text-field
                                        v-if="!['empty_referer','duplicate_visitor'].includes(rule.type)"
                                        v-model="rule.value"
                                        :label="rule.type === 'ua_regex' ? 'User-Agent regex' : (rule.type === 'ip_range' ? 'CIDR ranges' : 'IPs (comma-separated)')"
                                        outlined
                                        dense
                                        hide-details
                                ></v-text-field>
                                <span v-else class="caption grey--text bot-rule-grow">no value needed</span>
                                <v-select
                                        v-model="rule.action"
                                        :items="[{text: 'Block (404)', value: 'block'}, {text: 'Mark as bot', value: 'mark'}]"
                                        outlined
                                        dense
                                        hide-details
                                        class="bot-rule-action"
                                ></v-select>
                                <v-btn icon small @click="settings.bot_rules.rules.splice(i, 1)">
                                    <v-icon small color="red">mdi-close</v-icon>
                                </v-btn>
                            </div>

                            <div class="mt-2">
                                <v-btn small text color="primary" @click="addBotRule">
                                    <v-icon small class="mr-1">mdi-plus</v-icon>Add rule
                                </v-btn>
                            </div>

                            <div class="caption grey--text mt-2">
                                "Block" returns a 404 page without tracking the visit. "Mark as bot" keeps tracking but flags the click (is_bot) so you can filter it in reports.
                            </div>
                        </v-card-text>
                    </v-card>
                </v-col>

                <!-- Custom conversion statuses block (G19) -->
                <v-col cols="12" md="6">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-tag-plus-outline</v-icon>
                            Conversion statuses
                        </v-card-title>
                        <v-card-text>
                            <div class="caption grey--text mb-3">
                                Custom event types accepted on postbacks and imports, in addition to the
                                built-ins (lead, sale, upsale, rejected, hold, trash). Names are normalized
                                to lowercase_underscore — "ReGistration Bonus" becomes
                                <code>registration_bonus</code>.
                            </div>

                            <div v-for="(cs, i) in settings.custom_statuses" :key="i"
                                 class="d-flex align-center custom-status-row">
                                <v-text-field
                                        v-model="cs.name"
                                        label="Status name"
                                        outlined
                                        dense
                                        hide-details
                                        class="mr-3"
                                ></v-text-field>
                                <span class="status-chip mr-3" :class="customStatusChipClass(i)">
                                    {{ slugifyStatus(cs.name) || '…' }}
                                </span>
                                <v-btn icon small @click="settings.custom_statuses.splice(i, 1)">
                                    <v-icon small color="red">mdi-close</v-icon>
                                </v-btn>
                            </div>

                            <div class="mt-2">
                                <v-btn small text color="primary" @click="addCustomStatus">
                                    <v-icon small class="mr-1">mdi-plus</v-icon>Add status
                                </v-btn>
                            </div>

                            <div class="caption grey--text mt-2">
                                Custom statuses appear in the conversion-log status filter and edit dialog,
                                and in the postback URL <code>/pb?clickid=…&amp;status=…&amp;payout=…</code>.
                            </div>
                        </v-card-text>
                    </v-card>
                </v-col>

                <!-- Variable mapping block -->
                <v-col cols="12">
                    <v-card class="pa-4">
                        <v-card-title>Matching variables (Sub IDs)</v-card-title>
                        <v-card-text>
                            <v-row dense v-for="(mapping, index) in subIdMapping" :key="index" align="center">
                                <v-col cols="3">
                                    <v-text-field
                                            :label="mapping.name"
                                            v-model="mapping.name"
                                            :readonly="!mapping.editable_name"
                                            outlined
                                            dense
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="3">
                                    <v-text-field
                                            :label="mapping.parameter"
                                            v-model="mapping.parameter"
                                            :readonly="!mapping.editable_name"
                                            outlined
                                            dense
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="6">
                                    <v-text-field
                                            label="Variable name"
                                            v-model="mapping.token"
                                            outlined
                                            dense
                                    ></v-text-field>
                                </v-col>
                            </v-row>

                        </v-card-text>
                    </v-card>
                </v-col>

                <!-- G69: flow monitoring -->
                <v-col cols="12">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-heart-pulse</v-icon>
                            Monitoring
                            <v-spacer></v-spacer>
                            <v-btn small outlined color="primary" :loading="monitorChecking" @click="checkNow">
                                <v-icon small class="mr-1">mdi-refresh</v-icon>Check now
                            </v-btn>
                        </v-card-title>
                        <v-card-text>
                            <v-switch
                                    v-model="settings.monitoring.auto_disable_flows"
                                    label="Auto-disable flows after 3 consecutive failures"
                                    inset
                                    dense
                                    hide-details
                                    hint="Every 15 minutes the tracker HTTP-checks every offer URL, landing link and redirect URL used by active campaigns. A dead flow is switched off in its campaign config so the routing engine skips it, and a Telegram alert is sent (when Telegram notifications are enabled). Turning this off keeps monitoring + alerts but never changes flows."
                                    persistent-hint
                                    class="mb-3"
                            ></v-switch>
                            <v-data-table
                                    :headers="monitorHeaders"
                                    :items="monitorItems"
                                    dense
                                    :loading="monitorLoading"
                                    :items-per-page="10"
                            >
                                <template v-slot:item.status="{ item }">
                                    <span class="status-chip"
                                          :class="item.status === 'ok' ? 'status-chip--success' : 'status-chip--danger'">{{ item.status }}</span>
                                </template>
                                <template v-slot:item.checked_at="{ item }">
                                    {{ item.checked_at ? $formatDate(item.checked_at) : '—' }}
                                </template>
                                <template v-slot:no-data>
                                    <div class="empty-state">
                                        <v-icon>mdi-heart-pulse</v-icon>
                                        <div class="mt-2">No checks yet — hit "Check now" to probe every flow destination</div>
                                    </div>
                                </template>
                            </v-data-table>
                        </v-card-text>
                    </v-card>
                </v-col>

                <!-- G70: auto rules -->
                <v-col cols="12">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-robot-outline</v-icon>
                            Auto rules
                            <v-spacer></v-spacer>
                            <v-btn small outlined color="primary" @click="openRuleDialog">
                                <v-icon small class="mr-1">mdi-plus</v-icon>Add rule
                            </v-btn>
                        </v-card-title>
                        <v-card-text>
                            <div class="caption grey--text mb-3">
                                Every 15 minutes each enabled rule is evaluated against ClickHouse metrics for its
                                lookback window. When ALL conditions match, the action runs: pause the campaign
                                (note: the tracking plane still routes paused campaigns — pair it with a Telegram
                                alert), or send a Telegram / email alert (once per continuous match).
                            </div>
                            <v-data-table
                                    :headers="ruleHeaders"
                                    :items="rules"
                                    dense
                                    :loading="rulesLoading"
                                    :items-per-page="10"
                            >
                                <template v-slot:item.enabled="{ item }">
                                    <v-switch :input-value="item.enabled" dense hide-details inset
                                              @change="toggleRule(item)"></v-switch>
                                </template>
                                <template v-slot:item.conditions="{ item }">
                                    <div v-for="(c, i) in item.conditions" :key="i" class="caption">
                                        {{ c.metric }} {{ c.comparator }} {{ c.value }} · last {{ c.period_hours }}h
                                    </div>
                                </template>
                                <template v-slot:item.last_result="{ item }">
                                    <template v-if="item.last_result">
                                        <span class="status-chip"
                                              :class="item.last_result.matched ? 'status-chip--warning' : 'status-chip--success'">
                                            {{ item.last_result.matched ? 'fired' : 'clear' }}
                                        </span>
                                        <div class="caption grey--text">
                                            {{ (item.last_result.conditions || []).map(c => c.metric + ' ' + c.comparator + ' ' + c.value + ' → ' + (c.actual == null ? '—' : c.actual)).join('; ') }}
                                        </div>
                                    </template>
                                    <span v-else class="grey--text caption">never run</span>
                                </template>
                                <template v-slot:item.actions="{ item }">
                                    <v-btn small text color="primary" :loading="ruleRunning === item.id"
                                           @click="runRuleNow(item)">Run now</v-btn>
                                    <v-btn icon small color="red" @click="deleteRule(item)">
                                        <v-icon small>mdi-trash-can-outline</v-icon>
                                    </v-btn>
                                </template>
                                <template v-slot:no-data>
                                    <div class="empty-state">
                                        <v-icon>mdi-robot-outline</v-icon>
                                        <div class="mt-2">No auto rules yet — e.g. "ROI &lt; -30% over 6h → pause campaign"</div>
                                    </div>
                                </template>
                            </v-data-table>
                        </v-card-text>
                    </v-card>
                </v-col>

                <!-- D1e: privacy -->
                <v-col cols="12" md="6">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-shield-lock-outline</v-icon>
                            Privacy
                        </v-card-title>
                        <v-card-text>
                            <v-switch
                                    v-model="settings.privacy.anonymize_ip"
                                    label="Anonymize IP addresses"
                                    inset
                                    dense
                                    hide-details
                                    hint="The tracking plane masks visitor IPs (last octet zeroed: 203.0.113.55 → 203.0.113.0) before writing ClickHouse rows. Geo detection still works; per-IP drill-down is lost. Applied to new traffic only."
                                    persistent-hint
                                    class="mb-3"
                            ></v-switch>
                            <div class="caption grey--text">
                                Visitors can opt out of all tracking entirely via the
                                <a :href="optoutUrl" target="_blank">{{ optoutUrl }}</a> page — it sets the
                                <code>aaa_optout</code> cookie and the tracking plane stops writing rows and setting
                                cookies for that browser.
                            </div>
                        </v-card-text>
                    </v-card>
                </v-col>

                <!-- Tracking plane toggles -->
                <v-col cols="12" md="6">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-crosshairs-gps</v-icon>
                            Tracking
                        </v-card-title>
                        <v-card-text>
                            <v-switch
                                    v-model="settings.tracking.prefetch_filter_enabled"
                                    label="Ignore prefetch requests"
                                    inset dense hide-details
                                    hint="Browser prefetch/prerender hits (Purpose: prefetch) still get the redirect but are not counted as visits or click-outs. Default on — prefetches otherwise inflate stats."
                                    persistent-hint
                                    class="mb-3"
                            ></v-switch>
                            <v-switch
                                    v-model="settings.tracking.skip_bot_costs"
                                    label="Do not assign costs for bot clicks"
                                    inset dense hide-details
                                    hint="Bot-flagged hits get cost 0 so cost reports are not inflated. Default off — existing behavior is preserved until enabled."
                                    persistent-hint
                                    class="mb-3"
                            ></v-switch>
                            <v-text-field
                                    v-model="settings.tracking.referrer_hiding_domain"
                                    label="Referrer-hiding domain"
                                    outlined dense hide-details clearable
                                    placeholder="hide.example.com"
                                    hint="When a campaign hides the referrer, the meta-refresh hop is served from this domain instead of the campaign host. Leave empty for current behavior."
                                    persistent-hint
                                    class="mb-3"
                            ></v-text-field>
                        </v-card-text>
                    </v-card>
                </v-col>

                <!-- G90: admin login IP whitelist -->
                <v-col cols="12" md="6">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-login-variant</v-icon>
                            Login security
                        </v-card-title>
                        <v-card-text>
                            <v-text-field
                                    v-model="settings.login_security.ip_whitelist"
                                    label="Admin login IP whitelist"
                                    outlined dense hide-details clearable
                                    placeholder="127.0.0.1/32, 10.0.0.0/8"
                                    hint="Comma-separated IPs/CIDRs allowed to sign in. Empty = allow everyone (current behavior). A blocked IP gets 403 before credentials are checked — make sure your own address is included."
                                    persistent-hint
                            ></v-text-field>
                        </v-card-text>
                    </v-card>
                </v-col>

                <!-- G65: audit log (admin-only) -->
                <v-col cols="12">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-clipboard-text-clock-outline</v-icon>
                            Audit log
                        </v-card-title>
                        <v-card-text>
                            <div class="caption grey--text mb-3">
                                Security-relevant events: sign-ins (success/failure), 2FA changes, user and permission changes, archive/restore. Newest first.
                            </div>
                            <v-row dense align="center" class="mb-2">
                                <v-col cols="12" sm="3">
                                    <v-select
                                            label="Object type"
                                            :items="auditEntityOptions"
                                            v-model="auditFilterEntity"
                                            outlined
                                            dense
                                            hide-details
                                            clearable
                                    ></v-select>
                                </v-col>
                                <v-col cols="12" sm="3">
                                    <v-text-field
                                            label="Title / ID contains"
                                            v-model="auditFilterQ"
                                            outlined
                                            dense
                                            hide-details
                                            clearable
                                            @keyup.enter="loadAudit(1)"
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="12" sm="3">
                                    <v-text-field
                                            label="Filter by user"
                                            v-model="auditFilterUser"
                                            outlined
                                            dense
                                            hide-details
                                            clearable
                                            @keyup.enter="loadAudit(1)"
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="6" sm="3">
                                    <v-select
                                            label="Action"
                                            :items="auditActions"
                                            v-model="auditFilterAction"
                                            outlined
                                            dense
                                            hide-details
                                            clearable
                                    ></v-select>
                                </v-col>
                                <v-col cols="6" sm="2">
                                    <v-text-field
                                            label="From"
                                            type="date"
                                            v-model="auditFilterFrom"
                                            outlined
                                            dense
                                            hide-details
                                            clearable
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="6" sm="2">
                                    <v-text-field
                                            label="To"
                                            type="date"
                                            v-model="auditFilterTo"
                                            outlined
                                            dense
                                            hide-details
                                            clearable
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="auto">
                                    <v-btn small outlined color="primary" @click="loadAudit(1)">
                                        <v-icon small class="mr-1">mdi-filter-outline</v-icon>Apply
                                    </v-btn>
                                </v-col>
                                <v-col cols="auto">
                                    <v-btn small outlined color="primary" @click="exportAudit">
                                        <v-icon small class="mr-1">mdi-download-outline</v-icon>Export CSV
                                    </v-btn>
                                </v-col>
                            </v-row>

                            <v-data-table
                                    v-col-resize:audit="auditHeaders"
                                    :headers="auditHeaders"
                                    :items="auditEntries"
                                    dense
                                    :loading="auditLoading"
                                    :server-items-length="auditTotal"
                                    :page.sync="auditPage"
                                    :sort-by.sync="auditSortBy"
                                    :sort-desc.sync="auditSortDesc"
                                    :items-per-page="50"
                                    hide-default-footer
                            >
                                <template v-slot:item.at="{ item }">
                                    {{ $formatDate(item.at) }}
                                </template>
                                <template v-slot:item.action="{ item }">
                                    <span class="status-chip" :class="auditChipClass(item.action)">{{ item.action }}</span>
                                </template>
                                <template v-slot:item.detail="{ item }">
                                    <code v-if="item.detail" class="caption">{{ JSON.stringify(item.detail) }}</code>
                                </template>
                                <template v-slot:no-data>
                                    <div class="empty-state">
                                        <v-icon>mdi-clipboard-text-outline</v-icon>
                                        <div class="mt-2">No audit entries match</div>
                                    </div>
                                </template>
                            </v-data-table>
                            <div class="d-flex align-center justify-end mt-2">
                                <span class="caption grey--text mr-4">{{ auditTotal }} entries · page {{ auditPage }} of {{ Math.max(1, Math.ceil(auditTotal / 50)) }}</span>
                                <v-btn small outlined :disabled="auditPage <= 1" @click="loadAudit(auditPage - 1)">
                                    <v-icon small>mdi-chevron-left</v-icon>
                                </v-btn>
                                <v-btn small outlined class="ml-2" :disabled="auditPage >= Math.ceil(auditTotal / 50)" @click="loadAudit(auditPage + 1)">
                                    <v-icon small>mdi-chevron-right</v-icon>
                                </v-btn>
                            </div>
                        </v-card-text>
                    </v-card>
                </v-col>
            </v-row>

            <v-row>
                <v-col cols="12">
                    <v-card class="pa-4">
                        <v-card-title class="d-flex align-center">
                            <v-icon color="primary" class="mr-2">mdi-facebook</v-icon>
                            CAPI integrations
                            <v-spacer></v-spacer>
                            <v-btn small color="primary" elevation="0" @click="openPixelDialog()">
                                <v-icon small class="mr-1">mdi-plus</v-icon>Add new pixel
                            </v-btn>
                        </v-card-title>
                        <v-card-text>
                            <div class="caption grey--text mb-2">
                                Pixels are first-class records. Bind a pixel to a traffic channel or an
                                offer/website; conversions are sent server-side so ad clicks are matched by
                                fbc/fbp, IP and (optionally) hashed email/phone. Runs off the redirect and
                                postback path.
                            </div>
                            <v-switch
                                    v-model="settings.meta_capi.enabled"
                                    label="Send conversions to Meta"
                                    inset
                                    dense
                                    hide-details
                            ></v-switch>
                            <v-switch
                                    v-model="settings.meta_capi.dry_run"
                                    label="Dry-run (build + log the payload, send nothing)"
                                    inset
                                    dense
                                    hide-details
                                    :disabled="!settings.meta_capi.enabled"
                            ></v-switch>
                            <v-switch
                                    v-model="settings.meta_capi.include_customer_match"
                                    label="Include hashed email/phone when the postback provides them"
                                    inset
                                    dense
                                    hide-details
                                    :disabled="!settings.meta_capi.enabled"
                            ></v-switch>

                            <v-simple-table dense class="mt-3">
                                <thead>
                                    <tr>
                                        <th class="text-left">Title</th>
                                        <th class="text-left">Pixel / Dataset ID</th>
                                        <th class="text-left">Platform</th>
                                        <th class="text-left">Status</th>
                                        <th class="text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="p in capiPixels" :key="p.id">
                                        <td>{{ p.title }}</td>
                                        <td>{{ p.pixel_id }}</td>
                                        <td>{{ capiPlatformLabel(p.platform) }}</td>
                                        <td>
                                            <v-chip x-small :color="p.status === 'active' ? 'green' : 'grey'" dark>
                                                {{ p.status }}
                                            </v-chip>
                                        </td>
                                        <td class="text-right">
                                            <v-btn icon x-small @click="openPixelDialog(p)">
                                                <v-icon x-small>mdi-pencil-outline</v-icon>
                                            </v-btn>
                                            <v-btn icon x-small @click="deletePixel(p)">
                                                <v-icon x-small>mdi-delete-outline</v-icon>
                                            </v-btn>
                                        </td>
                                    </tr>
                                    <tr v-if="!capiPixels.length">
                                        <td colspan="5" class="grey--text">
                                            No pixels yet — use “Add new pixel”, then bind it to a channel
                                            (Sources) or an offer.
                                        </td>
                                    </tr>
                                </tbody>
                            </v-simple-table>

                            <v-row dense class="mt-3">
                                <v-col cols="12" md="6">
                                    <v-text-field
                                            label="Fallback Dataset / Pixel ID"
                                            v-model="settings.meta_capi.dataset_id"
                                            :disabled="!settings.meta_capi.enabled"
                                            outlined dense
                                            hint="Used only when no pixel record is bound"
                                            persistent-hint
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="12" md="6">
                                    <v-text-field
                                            label="Fallback access token"
                                            v-model="settings.meta_capi.access_token"
                                            :disabled="!settings.meta_capi.enabled"
                                            :append-icon="showMetaToken ? 'mdi-eye-off-outline' : 'mdi-eye-outline'"
                                            :type="showMetaToken ? 'text' : 'password'"
                                            @click:append="showMetaToken = !showMetaToken"
                                            outlined dense
                                            hint="Used only when no pixel record is bound. Stored as a secret."
                                            persistent-hint
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="12" md="4">
                                    <v-text-field
                                            label="Test event code"
                                            v-model="settings.meta_capi.test_event_code"
                                            :disabled="!settings.meta_capi.enabled"
                                            outlined dense
                                            hint="Optional — routes events to the Test Events tab"
                                            persistent-hint
                                    ></v-text-field>
                                </v-col>
                                <v-col cols="12" md="4">
                                    <v-select
                                            label="Default currency"
                                            :items="currencies"
                                            v-model="settings.meta_capi.default_currency"
                                            :disabled="!settings.meta_capi.enabled"
                                            outlined dense
                                    ></v-select>
                                </v-col>
                                <v-col cols="12" md="4">
                                    <v-text-field
                                            label="API version"
                                            v-model="settings.meta_capi.api_version"
                                            :disabled="!settings.meta_capi.enabled"
                                            outlined dense
                                            hint="e.g. v21.0"
                                            persistent-hint
                                    ></v-text-field>
                                </v-col>
                            </v-row>

                            <div class="caption grey--text mt-2 mb-1">Send these conversion statuses</div>
                            <v-row dense no-gutters>
                                <v-col v-for="s in metaStatusList" :key="s" cols="6" sm="3">
                                    <v-checkbox
                                            v-model="settings.meta_capi.send_statuses"
                                            :value="s"
                                            :label="s"
                                            dense
                                            hide-details
                                            class="mt-0"
                                    ></v-checkbox>
                                </v-col>
                            </v-row>

                            <v-text-field
                                    label="Graph base URL (test only)"
                                    v-model="settings.meta_capi.graph_base_url"
                                    outlined dense class="mt-3"
                                    hint="Leave empty for https://graph.facebook.com. Point at a mock receiver when testing."
                                    persistent-hint
                            ></v-text-field>

                            <div class="d-flex align-center mt-3">
                                <v-btn small outlined color="primary" :loading="metaTesting" @click="testMetaCapi">
                                    <v-icon small class="mr-1">mdi-send-outline</v-icon>Send test event
                                </v-btn>
                                <div class="caption grey--text ml-2">Saves settings first, then sends one synthetic event</div>
                            </div>
                            <pre v-if="metaTestResult" class="caption meta-test-result mt-2">{{ metaTestResult }}</pre>
                        </v-card-text>
                    </v-card>
                </v-col>
            </v-row>

            <v-dialog v-model="capiDialog" max-width="780" scrollable>
                <v-card>
                    <v-card-title>
                        {{ capiForm.id ? 'Edit pixel' : 'Add pixel' }}
                    </v-card-title>
                    <v-card-text>
                        <v-alert type="info" text dense class="mb-4">
                            <div class="font-weight-medium mb-1">Configure a pixel in ONE place</div>
                            Bind it at the <strong>traffic-channel</strong> level to send only conversions
                            attributed to that channel, or at the <strong>offer / website</strong> level to
                            send all of that offer's conversions, from any channel. Configuring both
                            duplicates events — the sender resolves the channel binding first and, when a
                            pixel is bound at both levels, still sends it only once.
                        </v-alert>

                        <v-alert v-if="!capiIsMeta" type="warning" text dense class="mb-4">
                            Sending to {{ capiPlatformLabel(capiForm.platform) }} is not implemented yet —
                            the record is stored and bindable, but events are not sent until that sender
                            ships (Meta is fully wired today).
                        </v-alert>

                        <v-row dense>
                            <v-col cols="12" md="6">
                                <v-text-field label="Title" v-model="capiForm.title" outlined dense></v-text-field>
                            </v-col>
                            <v-col cols="12" md="6">
                                <v-select label="Platform" :items="capiPlatforms"
                                          v-model="capiForm.platform" outlined dense
                                          hint="Only Meta sends events today; the others are selectable for later."
                                          persistent-hint></v-select>
                            </v-col>
                            <v-col cols="12" md="6">
                                <v-text-field :label="capiFieldLabels.id" v-model="capiForm.pixel_id"
                                              outlined dense></v-text-field>
                            </v-col>
                            <v-col cols="12" md="6">
                                <v-text-field :label="capiFieldLabels.token" v-model="capiForm.access_token"
                                              :append-icon="showPixelToken ? 'mdi-eye-off-outline' : 'mdi-eye-outline'"
                                              :type="showPixelToken ? 'text' : 'password'"
                                              @click:append="showPixelToken = !showPixelToken"
                                              outlined dense></v-text-field>
                            </v-col>
                            <v-col cols="12" md="6">
                                <v-combobox label="Default event name" :items="metaEventSuggestions"
                                            v-model="capiForm.default_event_name" outlined dense
                                            hint="Used for every conversion this pixel receives unless a custom
                                                  conversion match overrides it."
                                            persistent-hint></v-combobox>
                            </v-col>
                            <v-col cols="12" md="6">
                                <v-text-field label="Event URL" v-model="capiForm.event_url" outlined dense
                                              hint="Optional event_source_url sent with the event."
                                              persistent-hint></v-text-field>
                            </v-col>
                            <v-col cols="12" md="6">
                                <v-select label="Action source" :items="capiActionSources"
                                          v-model="capiForm.action_source" outlined dense></v-select>
                            </v-col>
                            <v-col cols="12" md="6">
                                <v-text-field label="Data Quality API Token" v-model="capiForm.data_quality_token"
                                              outlined dense
                                              hint="Optional. Stored as a secret."
                                              persistent-hint></v-text-field>
                            </v-col>
                            <v-col cols="12" md="6">
                                <v-select label="Status" :items="['active', 'inactive']"
                                          v-model="capiForm.status" outlined dense></v-select>
                            </v-col>
                        </v-row>

                        <v-switch v-model="capiForm.custom_matching" inset dense hide-details
                                  label="Custom conversion matching"
                                  class="mt-1"></v-switch>
                        <div class="caption grey--text mb-2">
                            Map a conversion type to a specific Meta event name. Anything not listed uses
                            the default event name above.
                        </div>
                        <template v-if="capiForm.custom_matching">
                            <div v-for="(row, idx) in capiForm.conversion_matching" :key="'cm'+idx"
                                 class="d-flex align-center bot-rule-row mb-1">
                                <v-select :items="metaStatusList" v-model="row.conversion_type"
                                          label="Conversion type" outlined dense hide-details
                                          class="bot-rule-type"></v-select>
                                <v-icon small class="mx-2">mdi-arrow-right</v-icon>
                                <v-combobox :items="metaEventSuggestions" v-model="row.event_name"
                                            label="Event name" outlined dense hide-details
                                            class="bot-rule-grow"></v-combobox>
                                <v-btn icon small class="ml-2"
                                       @click="capiForm.conversion_matching.splice(idx, 1)">
                                    <v-icon small>mdi-close</v-icon>
                                </v-btn>
                            </div>
                            <v-btn x-small text color="primary"
                                   @click="capiForm.conversion_matching.push({conversion_type: '', event_name: ''})">
                                <v-icon x-small class="mr-1">mdi-plus</v-icon>Add more
                            </v-btn>
                        </template>

                        <div class="d-flex align-center mt-4 mb-1">
                            <v-btn x-small text color="primary"
                                   @click="capiForm.payout_customisations.push({conversion_type: '', value: '', currency: ''})">
                                <v-icon x-small class="mr-1">mdi-plus</v-icon>Add payout customisation
                            </v-btn>
                            <div class="caption grey--text ml-2">
                                Default: the conversion payout is sent as <code>value</code> with the
                                conversion currency.
                            </div>
                        </div>
                        <div v-for="(row, idx) in capiForm.payout_customisations" :key="'pc'+idx"
                             class="d-flex align-center bot-rule-row mb-1">
                            <v-select :items="metaStatusList" v-model="row.conversion_type"
                                      label="Conversion type" outlined dense hide-details
                                      class="bot-rule-type"></v-select>
                            <v-text-field v-model="row.value" label="Value" type="number" step="0.01"
                                          outlined dense hide-details class="bot-rule-grow ml-2"></v-text-field>
                            <v-text-field v-model="row.currency" label="Currency" outlined dense
                                          hide-details class="bot-rule-grow ml-2"
                                          style="max-width: 110px"></v-text-field>
                            <v-btn icon small class="ml-2"
                                   @click="capiForm.payout_customisations.splice(idx, 1)">
                                <v-icon small>mdi-close</v-icon>
                            </v-btn>
                        </div>
                    </v-card-text>
                    <v-card-actions>
                        <v-spacer></v-spacer>
                        <v-btn text @click="capiDialog = false">Cancel</v-btn>
                        <v-btn color="primary" :loading="capiSaving" @click="savePixel">Save pixel</v-btn>
                    </v-card-actions>
                </v-card>
            </v-dialog>

            <v-row class="mt-6 mb-4">
                <v-btn
                        color="red"
                        @click="clearData"
                        outlined
                >
                    <v-icon small class="mr-1">mdi-delete-alert-outline</v-icon>Delete clicks & conversion history data
                </v-btn>
            </v-row>

        </v-container>

        <v-dialog v-model="ruleDialog" persistent max-width="520px">
            <v-card>
                <v-card-title class="text-h6">New auto rule</v-card-title>
                <v-card-text>
                    <v-text-field
                            label="Rule name"
                            v-model="ruleForm.name"
                            outlined
                            dense
                    ></v-text-field>
                    <v-select
                            label="Campaign"
                            v-model="ruleForm.campaign_id"
                            :items="campaignOptions"
                            item-text="name"
                            item-value="id"
                            outlined
                            dense
                            hint="Rules always evaluate one campaign's metrics (required for pause)."
                            persistent-hint
                    ></v-select>
                    <v-row dense>
                        <v-col cols="4">
                            <v-select
                                    label="Metric"
                                    v-model="ruleForm.metric"
                                    :items="ruleMetrics"
                                    outlined
                                    dense
                            ></v-select>
                        </v-col>
                        <v-col cols="3">
                            <v-text-field
                                    label="Period (h)"
                                    v-model.number="ruleForm.period_hours"
                                    type="number"
                                    min="1"
                                    max="720"
                                    outlined
                                    dense
                            ></v-text-field>
                        </v-col>
                        <v-col cols="2">
                            <v-select
                                    label="Cmp"
                                    v-model="ruleForm.comparator"
                                    :items="['<', '>', '<=', '>=', '==', '!=']"
                                    outlined
                                    dense
                            ></v-select>
                        </v-col>
                        <v-col cols="3">
                            <v-text-field
                                    label="Value"
                                    v-model.number="ruleForm.value"
                                    type="number"
                                    step="any"
                                    outlined
                                    dense
                            ></v-text-field>
                        </v-col>
                    </v-row>
                    <v-select
                            label="Action"
                            v-model="ruleForm.action"
                            :items="ruleActions"
                            outlined
                            dense
                    ></v-select>
                </v-card-text>
                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="ruleDialog = false">Cancel</v-btn>
                    <v-btn color="primary" elevation="0" :loading="ruleSaving" @click="saveRule">Create rule</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>

        <confirm-dialog-component ref="confirm" />
    </v-container>

            loadSettings() {
                fetch("/backend/api/settings/", {
                    credentials: "include"

                    .then((r) => r.json())
                    .then((data) => {
                        // merge so freshly saved keys never lose their defaults
                        const tgDefaults = {
                            enabled: false,
                            bot_token: '',
                            chat_id: '',
                            statuses: {
                                lead: true, sale: true, upsale: true,
                                rejected: true, hold: true, trash: true,

                            enabled: false, smtp_host: '', smtp_port: 587,
                            smtp_login: '', smtp_password: '', api_key: '',
                            from_name: 'AAA Tracker', from_email: '',
                            recipients: '', hour: 9,
                        };

                            enabled: false, secret_key: '', allowed_ips: '',
                        };
                        this.settings = Object.assign({}, this.settings, data.settings || {});
                        this.settings.telegram = Object.assign({}, tgDefaults, this.settings.telegram || {});
                        this.settings.telegram.statuses = Object.assign(
                            {}, tgDefaults.statuses, this.settings.telegram.statuses || {});
                        this.settings.email_reports = Object.assign(
                            {}, erDefaults, this.settings.email_reports || {});
                        this.settings.postback_security = Object.assign(
                            {}, pbDefaults, this.settings.postback_security || {});
                        this.settings.bot_rules = Object.assign(
                            {}, {enabled: false, rules: []}, this.settings.bot_rules || {});
                        if (!Array.isArray(this.settings.bot_rules.rules)) this.settings.bot_rules.rules = [];
                        this.settings.data_retention = Object.assign(
                            {}, {enabled: false, days: 180}, this.settings.data_retention || {});
                        this.settings.monitoring = Object.assign(
                            {}, {auto_disable_flows: false}, this.settings.monitoring || {});
                        this.settings.privacy = Object.assign(
                            {}, {anonymize_ip: false}, this.settings.privacy || {});
                        this.settings.tracking = Object.assign(
                            {}, {prefetch_filter_enabled: true, skip_bot_costs: false,
                                referrer_hiding_domain: ''}, this.settings.tracking || {});
                        this.settings.login_security = Object.assign(
                            {}, {ip_whitelist: ''}, this.settings.login_security || {});

                            enabled: false, dataset_id: '', access_token: '',
                            test_event_code: '', default_currency: 'USD',
                            api_version: 'v21.0', graph_base_url: '', dry_run: true,

                        }
