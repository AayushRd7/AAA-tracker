{% raw %}
<script type="text/x-template" id="users-template">
    <v-container fluid>
        <v-row align="center" class="mb-4">
            <v-col>
                <div class="page-title">Users</div>
                <div class="page-subtitle">Workspace members and platform users</div>
            </v-col>
            <v-col class="d-flex justify-end" cols="auto">
                <v-btn v-if="isPlatformAdmin" color="primary" elevation="0" @click="openCreate">
                    <v-icon small class="mr-1">mdi-plus</v-icon>
                    Add user
                </v-btn>
            </v-col>
        </v-row>

        <!-- Workspace members: the current tenant's memberships. Authority
             comes from the membership role, so a viewer/editor sees no controls. -->
        <v-row dense>
            <v-col>
                <v-card>
                    <v-card-title class="d-flex align-center">
                        <v-icon color="primary" class="mr-2">mdi-account-multiple-outline</v-icon>
                        Workspace members
                        <span v-if="membersMeta.seats !== null && membersMeta.seats !== undefined"
                              class="caption grey--text ml-2">({{ membersMeta.member_count }} / {{ membersMeta.seats }} seats)</span>
                        <v-spacer></v-spacer>
                        <v-btn color="primary" elevation="0" small
                               :disabled="!canManageMembers" @click="openAddMember">
                            <v-icon small class="mr-1">mdi-account-plus-outline</v-icon>
                            Add member
                        </v-btn>
                    </v-card-title>
                    <v-card-text>
                        <div class="caption grey--text mb-2">
                            Members of this workspace. Roles: owner (everything incl. ownership),
                            admin (everything except ownership), editor (content write), viewer (read-only).
                        </div>
                        <v-data-table
                                :headers="memberHeaders"
                                :items="members"
                                dense
                                :loading="loadingMembers"
                                :items-per-page="10"
                                :footer-props="{ 'items-per-page-options': [10, 25, 50] }"
                        >
                            <template v-slot:item.role="{ item }">
                                <v-select v-if="canManageMembers && item.role !== 'owner'"
                                          :items="assignableRoles"
                                          :value="item.role"
                                          dense hide-details outlined
                                          style="max-width: 150px"
                                          @change="changeRole(item, $event)"></v-select>
                                <span v-else class="status-chip"
                                      :class="item.role === 'owner' ? 'status-chip--success' : 'status-chip--neutral'">{{ item.role }}</span>
                            </template>
                            <template v-slot:item.is_platform_admin="{ item }">
                                <span v-if="item.is_platform_admin" class="status-chip status-chip--success">Platform</span>
                                <span v-else class="grey--text">—</span>
                            </template>
                            <template v-slot:item.last_login="{ item }">
                                {{ item.last_login ? $formatDate(item.last_login) : '—' }}
                            </template>
                            <template v-slot:item.created_at="{ item }">
                                {{ $formatDate(item.created_at) }}
                            </template>
                            <template v-slot:item.actions="{ item }">
                                <v-tooltip bottom v-if="canManageMembers && item.role !== 'owner'">
                                    <template v-slot:activator="{ on, attrs }">
                                        <v-btn icon small color="primary" v-bind="attrs" v-on="on"
                                               @click="transferOwnership(item)">
                                            <v-icon small>mdi-crown-outline</v-icon>
                                        </v-btn>
                                    </template>
                                    <span>Make owner</span>
                                </v-tooltip>
                                <v-tooltip bottom v-if="canManageMembers && item.role !== 'owner'">
                                    <template v-slot:activator="{ on, attrs }">
                                        <v-btn icon small color="red" v-bind="attrs" v-on="on"
                                               @click="removeMember(item)">
                                            <v-icon small>mdi-account-remove-outline</v-icon>
                                        </v-btn>
                                    </template>
                                    <span>Remove from workspace</span>
                                </v-tooltip>
                                <span v-if="!canManageMembers || item.role === 'owner'"
                                      class="caption grey--text">—</span>
                            </template>
                            <template v-slot:no-data>
                                <div class="empty-state">
                                    <v-icon>mdi-account-multiple-outline</v-icon>
                                    <div class="mt-2">No members</div>
                                </div>
                            </template>
                        </v-data-table>
                    </v-card-text>
                </v-card>
            </v-col>
        </v-row>

        <!-- Add-member dialog: an existing user gains a membership, or a brand
             new user is created with one. -->
        <v-dialog v-model="addMemberDialog" max-width="520">
            <v-card>
                <v-card-title><span class="text-h6">Add workspace member</span></v-card-title>
                <v-card-text>
                    <v-btn-toggle v-model="addForm.mode" mandatory dense class="mb-4">
                        <v-btn small value="existing">Existing user</v-btn>
                        <v-btn small value="new">New user</v-btn>
                    </v-btn-toggle>
                    <v-text-field label="Username" v-model="addForm.username" outlined dense></v-text-field>
                    <template v-if="addForm.mode === 'new'">
                        <v-text-field label="Email" v-model="addForm.email" outlined dense></v-text-field>
                        <v-text-field label="Password" v-model="addForm.password" type="password"
                                      outlined dense></v-text-field>
                    </template>
                    <v-select label="Role" :items="assignableRoles" v-model="addForm.role"
                              outlined dense></v-select>
                </v-card-text>
                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="addMemberDialog = false">Cancel</v-btn>
                    <v-btn color="primary" elevation="0" @click="saveMember">Add</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>

        <v-dialog v-model="dialog" v-if="isPlatformAdmin">
            <v-card class="dialog-md">
                <v-card-title>
                    <span class="text-h6">{{ isEdit ? 'Edit user' : 'Add user' }}</span>
                </v-card-title>

                <v-card-text>

                    <v-text-field
                            label="Username"
                            v-model="form.username"
                            outlined
                            dense
                            :disabled="isEdit"
                    ></v-text-field>

                    <v-text-field
                            label="Email"
                            v-model="form.email"
                            outlined
                            dense
                    ></v-text-field>

                    <v-text-field
                            label="Password"
                            v-model="form.password"
                            type="password"
                            outlined
                            dense
                            :rules="[v => !isEdit || (v && v.length > 0) || 'Password is required']"
                            :hint="isEdit ? 'Leave blank to keep existing password' : ''"
                    ></v-text-field>

                    <v-text-field
                            v-if="!isEdit || form.password"
                            label="Confirm password"
                            v-model="form.confirmPassword"
                            type="password"
                            outlined
                            dense
                            :rules="[v => v === form.password || 'Passwords do not match']"
                    ></v-text-field>

                    <v-switch
                            label="Active"
                            v-model="form.active"
                            inset
                            dense
                    ></v-switch>

                    <v-divider class="my-3"></v-divider>
                    <div class="subtitle-2 mb-1 d-flex align-center">
                        <v-icon small class="mr-1">mdi-tune-variant</v-icon>Permissions
                        <v-spacer></v-spacer>
                        <v-btn v-if="form.customPermissions" small text color="primary" @click="resetPermissions">Reset to defaults</v-btn>
                        <v-switch
                                v-else
                                label="Custom"
                                v-model="form.customPermissions"
                                inset
                                dense
                                hide-details
                                class="mt-0"
                        ></v-switch>
                    </div>
                    <template v-if="form.customPermissions">
                        <v-row dense>
                            <v-col cols="6" sm="4" v-for="s in permSections" :key="s">
                                <v-checkbox
                                        v-model="form.permissions.sections[s]"
                                        :label="s.charAt(0).toUpperCase() + s.slice(1)"
                                        dense
                                        hide-details
                                        class="mt-0"
                                ></v-checkbox>
                            </v-col>
                        </v-row>
                        <v-switch
                                label="Allow editing (write access)"
                                v-model="form.permissions.write"
                                inset
                                dense
                                hide-details
                                class="mt-2"
                        ></v-switch>
                        <div class="caption grey--text mt-1">
                            Defaults: admins have everything; regular users get all non-admin sections with write access. Admin sections (Users, Settings, Domains) are off unless explicitly granted.
                        </div>
                    </template>

                </v-card-text>

                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="close">Cancel</v-btn>
                    <v-btn color="primary" elevation="0" @click="save">Save</v-btn>
                </v-card-actions>

            </v-card>
        </v-dialog>


        <!-- Platform operators only: the install-wide user list. 2FA reset,
             password change and enable/disable stay global because sessions and
             2FA are user-level, not workspace-level. -->
        <v-row dense class="mt-4" v-if="isPlatformAdmin">
            <v-col>
                <v-card>
                    <v-card-title class="d-flex align-center">
                        <v-icon color="primary" class="mr-2">mdi-account-supervisor-outline</v-icon>
                        Platform users
                    </v-card-title>
                    <v-data-table v-col-resize:users="headers"
                            :headers="headers"
                            :items="users"
                            dense
                            :loading="loadingUsers"
                            :items-per-page="10"
                            :footer-props="{ 'items-per-page-options': [10, 25, 50] }"
                    >

                        <template v-slot:item.active="{ item }">
                            <span class="status-chip" :class="item.active ? 'status-chip--success' : 'status-chip--neutral'">{{ item.active ? 'Yes' : 'No' }}</span>
                        </template>
                        <template v-slot:item.is_admin="{ item }">
                            <span class="status-chip" :class="item.is_admin ? 'status-chip--success' : 'status-chip--neutral'">{{ item.is_admin ? 'Yes' : 'No' }}</span>
                        </template>
                        <template v-slot:item.totp_enabled="{ item }">
                            <span class="status-chip" :class="item.totp_enabled ? 'status-chip--success' : 'status-chip--neutral'">{{ item.totp_enabled ? 'On' : 'Off' }}</span>
                        </template>
                        <template v-slot:item.created_at="{ item }">
                            {{ $formatDate(item.created_at) }}
                        </template>
                        <template v-slot:item.updated_at="{ item }">
                            {{ $formatDate(item.updated_at) }}
                        </template>

                        <template v-slot:item.actions="{ item }">
                            <v-tooltip bottom>
                                <template v-slot:activator="{ on, attrs }">
                                    <v-btn icon small color="primary" v-bind="attrs" v-on="on" @click="openEdit(item)">
                                        <v-icon small>mdi-pencil-outline</v-icon>
                                    </v-btn>
                                </template>
                                <span>Edit</span>
                            </v-tooltip>
                            <v-tooltip bottom>
                                <template v-slot:activator="{ on, attrs }">
                                    <v-btn icon small color="teal" v-bind="attrs" v-on="on" @click="openSessions(item)">
                                        <v-icon small>mdi-devices</v-icon>
                                    </v-btn>
                                </template>
                                <span>Devices</span>
                            </v-tooltip>
                            <v-tooltip bottom v-if="item.totp_enabled">
                                <template v-slot:activator="{ on, attrs }">
                                    <v-btn icon small color="orange" v-bind="attrs" v-on="on" @click="resetTotp(item)">
                                        <v-icon small>mdi-shield-off-outline</v-icon>
                                    </v-btn>
                                </template>
                                <span>Reset 2FA</span>
                            </v-tooltip>
                            <v-tooltip bottom v-if="item.username !== 'tracker_admin'">
                                <template v-slot:activator="{ on, attrs }">
                                    <v-btn icon small color="red" v-bind="attrs" v-on="on" @click="deleteUser(item)">
                                        <v-icon small>mdi-trash-can-outline</v-icon>
                                    </v-btn>
                                </template>
                                <span>Delete</span>
                            </v-tooltip>
                        </template>

                        <template v-slot:no-data>
                            <div class="empty-state">
                                <v-icon>mdi-inbox-outline</v-icon>
                                <div class="mt-2">No data yet</div>
                            </div>
                        </template>
                    </v-data-table>
                </v-card>
            </v-col>
        </v-row>

        <v-row dense class="mt-4">
            <v-col>
                <v-card>
                    <v-card-title class="d-flex align-center">
                        <v-icon color="primary" class="mr-2">mdi-shield-account-outline</v-icon>
                        Active sessions
                        <v-spacer></v-spacer>
                        <v-btn small outlined color="primary" :disabled="!hasOtherSessions"
                               @click="logoutOtherDevices">
                            <v-icon small class="mr-1">mdi-logout-variant</v-icon>
                            Log out all other devices
                        </v-btn>
                    </v-card-title>
                    <v-card-text>
                        <div class="caption grey--text mb-2">
                            Devices currently signed in to your account. Revoke any you do not recognise.
                        </div>
                        <v-data-table
                                :headers="sessionHeaders"
                                :items="mySessions"
                                dense
                                :loading="loadingSessions"
                                :items-per-page="10"
                                hide-default-footer
                        >
                            <template v-slot:item.device="{ item }">
                                <v-icon small class="mr-1">{{ deviceIcon(item.device) }}</v-icon>{{ item.device }}
                                <span v-if="item.current" class="status-chip status-chip--success ml-2">This device</span>
                            </template>
                            <template v-slot:item.last_seen="{ item }">
                                {{ item.last_seen ? $formatDate(item.last_seen) : '—' }}
                            </template>
                            <template v-slot:item.created_at="{ item }">
                                {{ $formatDate(item.created_at) }}
                            </template>
                            <template v-slot:item.actions="{ item }">
                                <v-btn v-if="!item.current" icon small color="red" @click="revokeMySession(item)">
                                    <v-icon small>mdi-delete-outline</v-icon>
                                </v-btn>
                                <span v-else class="caption grey--text">Current</span>
                            </template>
                            <template v-slot:no-data>
                                <div class="empty-state">
                                    <v-icon>mdi-shield-account-outline</v-icon>
                                    <div class="mt-2">No active sessions</div>
                                </div>
                            </template>
                        </v-data-table>
                    </v-card-text>
                </v-card>
            </v-col>
        </v-row>

        <v-dialog v-model="sessionsDialog" max-width="760">
            <v-card>
                <v-card-title>
                    <span class="text-h6">Devices — {{ sessionsUser ? sessionsUser.username : '' }}</span>
                </v-card-title>
                <v-card-text>
                    <v-data-table
                            :headers="adminSessionHeaders"
                            :items="adminSessions"
                            dense
                            :loading="loadingAdminSessions"
                            hide-default-footer
                    >
                        <template v-slot:item.device="{ item }">
                            <v-icon small class="mr-1">{{ deviceIcon(item.device) }}</v-icon>{{ item.device }}
                        </template>
                        <template v-slot:item.last_seen="{ item }">
                            {{ item.last_seen ? $formatDate(item.last_seen) : '—' }}
                        </template>
                        <template v-slot:item.created_at="{ item }">
                            {{ $formatDate(item.created_at) }}
                        </template>
                        <template v-slot:no-data>
                            <div class="empty-state">
                                <v-icon>mdi-shield-account-outline</v-icon>
                                <div class="mt-2">No active sessions</div>
                            </div>
                        </template>
                    </v-data-table>
                </v-card-text>
                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="sessionsDialog = false">Close</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>

        <confirm-dialog-component ref="confirm" />
    </v-container>
</script>

<script type="application/javascript">
    Vue.component('users-component', {
        template: '#users-template',
        data() {
            return {
                isEdit: false,
                dialog: false,
                headers: [
                    {text: 'Username', value: 'username'},
                    {text: 'Email', value: 'email'},
                    {text: 'Created', value: 'created_at'},
                    {text: 'Updated', value: 'updated_at'},
                    {text: 'Is Active', value: 'active'},
                    {text: 'Is Admin', value: 'is_admin'},
                    {text: '2FA', value: 'totp_enabled'},
                    {text: 'Actions', value: 'actions', sortable: false},
                ],
                users: [],
                loadingUsers: false,
                isPlatformAdmin: false,
                // Workspace members (phase 2A)
                members: [],
                loadingMembers: false,
                membersMeta: {seats: null, member_count: 0, caller_role: '', can_manage: false},
                memberHeaders: [
                    {text: 'Username', value: 'username'},
                    {text: 'Email', value: 'email'},
                    {text: 'Role', value: 'role'},
                    {text: 'Platform', value: 'is_platform_admin'},
                    {text: 'Last login', value: 'last_login'},
                    {text: 'Created', value: 'created_at'},
                    {text: 'Actions', value: 'actions', sortable: false},
                ],
                addMemberDialog: false,
                addForm: {mode: 'existing', username: '', email: '', password: '', role: 'editor'},
                mySessions: [],
                loadingSessions: false,
                sessionsDialog: false,
                sessionsUser: null,
                adminSessions: [],
                loadingAdminSessions: false,
                sessionHeaders: [
                    {text: 'Device', value: 'device'},
                    {text: 'OS', value: 'os'},
                    {text: 'Browser', value: 'browser'},
                    {text: 'IP', value: 'ip'},
                    {text: 'Last seen', value: 'last_seen'},
                    {text: 'Started', value: 'created_at'},
                    {text: 'Actions', value: 'actions', sortable: false},
                ],
                adminSessionHeaders: [
                    {text: 'Device', value: 'device'},
                    {text: 'OS', value: 'os'},
                    {text: 'Browser', value: 'browser'},
                    {text: 'IP', value: 'ip'},
                    {text: 'Last seen', value: 'last_seen'},
                    {text: 'Started', value: 'created_at'},
                ],
                permSections: ['dashboard', 'campaigns', 'landings', 'affiliates', 'offers',
                    'sources', 'reports', 'domains', 'settings', 'users'],
                form: {
                    id: null,
                    username: '',
                    email: '',
                    password: '',
                    confirmPassword: '',
                    active: true,
                    customPermissions: false,
                    permissions: null
                }

            }
        },
        computed: {
            dateRangeText() {
                return this.date_range.join(' ~ ')
            },
            hasOtherSessions() {
                return this.mySessions.some(s => !s.current);
            },
            // Ownership is never assigned by the role picker (server rejects it);
            // it moves through the explicit "Make owner" action.
            assignableRoles() {
                return ['admin', 'editor', 'viewer'];
            },
            canManageMembers() {
                return !!this.membersMeta.can_manage;
            },
        },
        mounted() {
            this.$vuetify.theme.dark = (document.documentElement.dataset.theme === 'dark');
            this.loadMe();
            this.loadMembers();
            this.loadMySessions();
            this.$root.$on('load-users', this.loadUsers);
        },
        methods: {
            loadMe() {
                fetch("/backend/api/users/me", {credentials: "include"})
                    .then(res => res.ok ? res.json() : {})
                    .then(data => {
                        this.isPlatformAdmin = !!data.is_admin;
                        if (this.isPlatformAdmin) this.loadUsers();
                    })
                    .catch(() => {});
            },
            loadMembers() {
                this.loadingMembers = true;
                fetch("/backend/api/members/", {credentials: "include"})
                    .then(res => res.ok ? res.json() : {})
                    .then(data => {
                        this.members = data.members || [];
                        this.membersMeta = {
                            seats: data.seats === undefined ? null : data.seats,
                            member_count: data.member_count || 0,
                            caller_role: data.caller_role || '',
                            can_manage: !!data.can_manage,
                        };
                    })
                    .catch(err => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    })
                    .finally(() => {
                        this.loadingMembers = false;
                    });
            },
            openAddMember() {
                this.addForm = {mode: 'existing', username: '', email: '', password: '', role: 'editor'};
                this.addMemberDialog = true;
            },
            saveMember() {
                const f = this.addForm;
                if (!f.username) {
                    this.$root.$emit("show-message", {type: "error", text: "Username is required."});
                    return;
                }
                if (f.mode === 'new' && !f.password) {
                    this.$root.$emit("show-message", {type: "error", text: "Password is required for a new user."});
                    return;
                }
                const payload = {username: f.username, role: f.role};
                if (f.mode === 'new') {
                    payload.email = f.email;
                    payload.password = f.password;
                }
                fetch("/backend/api/members/", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(payload),
                    credentials: "include"
                })
                    .then(async res => {
                        const data = await res.json().catch(() => ({}));
                        if (!res.ok) throw new Error(data.detail || "Failed to add member");
                        this.addMemberDialog = false;
                        this.$root.$emit("show-message", {type: "success", text: "Member added"});
                        this.loadMembers();
                    })
                    .catch(err => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    });
            },
            changeRole(member, role) {
                if (!role || role === member.role) return;
                fetch(`/backend/api/members/${member.user_id}`, {
                    method: "PUT",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({role: role}),
                    credentials: "include"
                })
                    .then(async res => {
                        const data = await res.json().catch(() => ({}));
                        if (!res.ok) throw new Error(data.detail || "Failed to update role");
                        this.$root.$emit("show-message", {type: "success", text: `Role updated for ${member.username}`});
                        this.loadMembers();
                    })
                    .catch(err => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                        this.loadMembers();
                    });
            },
            async removeMember(member) {
                const ok = await this.$refs.confirm.open('Remove member',
                    `Remove ${member.username} from this workspace? Their user account and other memberships are untouched.`, 'Remove');
                if (!ok) return;
                fetch(`/backend/api/members/${member.user_id}`, {
                    method: "DELETE",
                    credentials: "include"
                })
                    .then(async res => {
                        const data = await res.json().catch(() => ({}));
                        if (!res.ok) throw new Error(data.detail || "Failed to remove member");
                        this.$root.$emit("show-message", {type: "success", text: "Member removed"});
                        this.loadMembers();
                    })
                    .catch(err => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    });
            },
            async transferOwnership(member) {
                const ok = await this.$refs.confirm.open('Transfer ownership',
                    `Make ${member.username} the owner of this workspace? You will be demoted to admin.`, 'Transfer');
                if (!ok) return;
                fetch(`/backend/api/members/${member.user_id}/transfer-ownership`, {
                    method: "POST",
                    credentials: "include"
                })
                    .then(async res => {
                        const data = await res.json().catch(() => ({}));
                        if (!res.ok) throw new Error(data.detail || "Failed to transfer ownership");
                        this.$root.$emit("show-message", {type: "success", text: "Ownership transferred"});
                        this.loadMembers();
                    })
                    .catch(err => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    });
            },
            loadUsers() {
                this.loadingUsers = true;
                fetch("/backend/api/users/", {
                    method: "GET",
                    credentials: "include"
                })
                    .then(res => res.json())
                    .then(data => {
                        this.users = data;
                    })
                    .catch(err => {
                        console.error(err);
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    })
                    .finally(() => {
                        this.loadingUsers = false;
                    });
            },

            openCreate() {
                this.isEdit = false;
                this.dialog = true;
                this.form = {
                    id: null,
                    username: '',
                    email: '',
                    password: '',
                    confirmPassword: '',
                    active: true,
                    customPermissions: false,
                    permissions: null
                };
            },

            defaultPermissions() {
                const sections = {};
                this.permSections.forEach(s => { sections[s] = true; });
                sections.domains = false;
                sections.settings = false;
                sections.users = false;
                return {sections: sections, write: true};
            },

            openEdit(user) {
                this.isEdit = true;
                this.dialog = true;
                this.form = {
                    id: user.id,
                    username: user.username,
                    email: user.email,
                    password: '',
                    confirmPassword: '',
                    active: user.active,
                    customPermissions: !!user.permissions,
                    permissions: user.permissions
                        ? JSON.parse(JSON.stringify(user.permissions))
                        : this.defaultPermissions()
                };
            },

            resetPermissions() {
                this.form.customPermissions = false;
                this.form.permissions = null;
            },

            save() {
                if (!this.form.username || (!this.isEdit && !this.form.password)) {
                    this.$root.$emit("show-message", {type: "error", text: "Username and password are required."});
                    return;
                }

                if (this.form.password && this.form.password !== this.form.confirmPassword) {
                    this.$root.$emit("show-message", {
                        type: "error",
                        text: "Passwords do not match."
                    });
                    return;
                }

                const payload = {
                    username: this.form.username,
                    email: this.form.email,
                    active: this.form.active
                };

                if (this.form.customPermissions && this.form.permissions) {
                    payload.permissions = this.form.permissions;
                } else if (this.isEdit) {
                    payload.clear_permissions = true;  // back to role defaults
                }

                if (this.form.password) {
                    payload.password = this.form.password;
                }

                const method = this.isEdit ? "PATCH" : "POST";
                const url = this.isEdit
                    ? `/backend/api/users/${this.form.id}`
                    : "/backend/api/users/";

                fetch(url, {
                    method,
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(payload),
                    credentials: "include"
                })
                    .then(async res => {
                        const text = await res.text();
                        if (!res.ok) {
                            let msg = "Unknown error";
                            try {
                                const err = JSON.parse(text);
                                msg = err.detail || msg;
                            } catch (e) {
                                msg = text;
                            }
                            throw new Error(msg);
                        }
                        this.dialog = false;
                        this.$root.$emit("show-message", {
                            type: "success",
                            text: this.isEdit ? "User updated" : "User created"
                        });
                        this.loadUsers();
                    })
                    .catch(err => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    });
            },

            async deleteUser(user) {
                const ok = await this.$refs.confirm.open('Delete user', 'Are you sure you want to delete this user? This cannot be undone.');
                if (!ok) return;

                fetch(`/backend/api/users/${user.id}`, {
                    method: "DELETE",
                    credentials: "include"
                })
                    .then(async res => {
                        if (!res.ok) {
                            const text = await res.text();
                            let msg = text;
                            try {
                                const data = JSON.parse(text);
                                msg = data.detail || msg;
                            } catch {
                            }
                            throw new Error(msg);
                        }

                        this.$root.$emit("show-message", {
                            type: "success",
                            text: "User deleted"
                        });
                        this.loadUsers();
                    })
                    .catch(err => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    });
            },

            async resetTotp(user) {
                const ok = await this.$refs.confirm.open('Reset 2FA', `Disable two-factor authentication for ${user.username}? They will be able to log in with just their password.`, 'Reset');
                if (!ok) return;

                fetch(`/backend/api/users/${user.id}/totp/reset`, {
                    method: "POST",
                    credentials: "include"
                })
                    .then(async res => {
                        if (!res.ok) {
                            const data = await res.json().catch(() => ({}));
                            throw new Error(data.detail || 'Reset failed');
                        }
                        this.$root.$emit("show-message", {type: "success", text: `2FA reset for ${user.username}`});
                        this.loadUsers();
                    })
                    .catch(err => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    });
            },

            close() {
                this.dialog = false;
            },

            deviceIcon(device) {
                const d = (device || '').toLowerCase();
                if (d.includes('iphone') || d.includes('android phone') || d.includes('mobile')) {
                    return 'mdi-cellphone';
                }
                if (d.includes('ipad') || d.includes('tablet')) return 'mdi-tablet';
                if (d.includes('bot') || d.includes('cli')) return 'mdi-robot';
                if (d.includes('desktop')) return 'mdi-monitor';
                return 'mdi-devices';
            },

            loadMySessions() {
                this.loadingSessions = true;
                fetch("/backend/api/users/me/sessions", {credentials: "include"})
                    .then(res => res.json())
                    .then(data => {
                        this.mySessions = data.sessions || [];
                    })
                    .catch(err => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    })
                    .finally(() => {
                        this.loadingSessions = false;
                    });
            },

            async revokeMySession(item) {
                const ok = await this.$refs.confirm.open('Revoke session',
                    `Log out the ${item.device} device at ${item.ip || 'unknown IP'}?`, 'Revoke');
                if (!ok) return;
                fetch(`/backend/api/users/me/sessions/${encodeURIComponent(item.id)}`, {
                    method: "DELETE",
                    credentials: "include"
                })
                    .then(async res => {
                        if (!res.ok) {
                            const data = await res.json().catch(() => ({}));
                            throw new Error(data.detail || 'Revoke failed');
                        }
                        this.$root.$emit("show-message", {type: "success", text: "Session revoked"});
                        this.loadMySessions();
                    })
                    .catch(err => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    });
            },

            async logoutOtherDevices() {
                const ok = await this.$refs.confirm.open('Log out other devices',
                    'Log out every other device signed in to your account? This device stays signed in.',
                    'Log out');
                if (!ok) return;
                fetch("/backend/api/users/me/sessions?others=true", {
                    method: "DELETE",
                    credentials: "include"
                })
                    .then(async res => {
                        if (!res.ok) {
                            const data = await res.json().catch(() => ({}));
                            throw new Error(data.detail || 'Logout failed');
                        }
                        const data = await res.json();
                        this.$root.$emit("show-message", {
                            type: "success",
                            text: `Logged out ${data.revoked || 0} other device(s)`
                        });
                        this.loadMySessions();
                    })
                    .catch(err => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    });
            },

            openSessions(user) {
                this.sessionsUser = user;
                this.sessionsDialog = true;
                this.loadAdminSessions();
            },

            loadAdminSessions() {
                if (!this.sessionsUser) return;
                this.loadingAdminSessions = true;
                fetch(`/backend/api/users/${this.sessionsUser.id}/sessions`, {credentials: "include"})
                    .then(res => res.json())
                    .then(data => {
                        this.adminSessions = data.sessions || [];
                    })
                    .catch(err => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    })
                    .finally(() => {
                        this.loadingAdminSessions = false;
                    });
            }
        }

    });
</script>
