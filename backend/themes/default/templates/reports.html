{% raw %}
<script type="text/x-template" id="reports-template">
    <v-container fluid>
        <v-row align="center" class="mb-4">
            <v-col>
                <div class="page-title">Reports</div>
                <div class="page-subtitle">Break down performance by any dimension</div>
            </v-col>
            <v-col class="d-flex justify-end" cols="auto">
                <v-btn
                        outlined
                        elevation="0"
                        class="mr-2"
                        :disabled="!reportRows.length"
                        @click="exportReportCsv"
                >
                    <v-icon small class="mr-1">mdi-download</v-icon>
                    Export CSV
                </v-btn>
                <v-btn color="primary" elevation="0" :loading="loading" @click="runReport">
                    <v-icon small class="mr-1">mdi-play</v-icon>
                    Run Report
                </v-btn>
            </v-col>
        </v-row>

        <!-- Report builder controls -->
        <v-card class="pa-4 mb-4">
            <div class="d-flex flex-wrap align-center">
                <v-select
                        v-model="dimension"
                        :items="dimensionItems"
                        item-text="label"
                        item-value="key"
                        label="Break down by"
                        outlined
                        dense
                        hide-details
                        style="max-width: 220px;"
                        class="mr-2"
                ></v-select>
                <v-menu v-model="dateMenu" :close-on-content-click="false" transition="scale-transition" offset-y min-width="auto">
                    <template v-slot:activator="{ on, attrs }">
                        <v-text-field
                                v-model="dateRangeText"
                                label="Date range"
                                prepend-icon="mdi-calendar"
                                readonly
                                v-bind="attrs"
                                v-on="on"
                                outlined
                                dense
                                hide-details
                                style="max-width: 240px;"
                                class="mr-2"
                        ></v-text-field>
                    </template>
                    <v-date-picker v-model="dateRange" range @input="dateMenu = false"></v-date-picker>
                </v-menu>
                <v-select
                        :items="campaigns"
                        v-model="selectedCampaigns"
                        label="Campaigns"
                        item-text="name"
                        item-value="id"
                        outlined
                        dense
                        hide-details
                        multiple
                        chips
                        small-chips
                        style="max-width: 240px;"
                ></v-select>
            </div>
            <div class="mt-2">
                <v-chip v-for="preset in datePresets" :key="preset.label"
                        small label outlined
                        :color="activePreset === preset.label ? 'primary' : 'grey'"
                        :class="activePreset === preset.label ? 'primary--text' : 'grey--text text--darken-2'"
                        class="mr-1"
                        @click="applyPreset(preset)">
                    {{ preset.label }}
                </v-chip>
            </div>
        </v-card>

        <!-- Breakdown table -->
        <v-card>
            <v-data-table v-col-resize:reports-conversions="headers" v-col-resize:reports-clicklog="clickLogHeaders" v-col-resize:reports-breakdown="reportHeaders"
                    :headers="reportHeaders"
                    :items="reportRows"
                    dense
                    :items-per-page="15"
                    :footer-props="{ 'items-per-page-options': [15, 25, 50, 100] }"
                    :loading="loading"
                    :item-class="perfRowClass"
            >
                <template v-slot:item.visits="{ item }">
                    <span>{{ Number(item.visits || 0).toLocaleString() }}</span>
                </template>
                <template v-slot:item.unique_visits="{ item }">
                    <span>{{ Number(item.unique_visits || 0).toLocaleString() }}</span>
                </template>
                <template v-slot:item.clicks="{ item }">
                    <span>{{ Number(item.clicks || 0).toLocaleString() }}</span>
                </template>
                <template v-slot:item.unique_clicks="{ item }">
                    <span>{{ Number(item.unique_clicks || 0).toLocaleString() }}</span>
                </template>
                <template v-slot:item.leads="{ item }">
                    <span>{{ Number(item.leads || 0).toLocaleString() }}</span>
                </template>
                <template v-slot:item.conversions="{ item }">
                    <span>{{ Number(item.conversions || 0).toLocaleString() }}</span>
                </template>
                <template v-slot:item.rejected="{ item }">
                    <span>{{ Number(item.rejected || 0).toLocaleString() }}</span>
                </template>
                <template v-slot:item.cost="{ item }">
                    <span>{{ formatMoney(item.cost) }}</span>
                </template>
                <template v-slot:item.revenue="{ item }">
                    <span>{{ formatMoney(item.revenue) }}</span>
                </template>
                <template v-slot:item.profit="{ item }">
                    <span :class="signClass(item.profit)">{{ formatMoney(item.profit) }}</span>
                </template>
                <template v-slot:item.cr="{ item }">
                    <span>{{ formatPct(item.cr) }}</span>
                </template>
                <template v-slot:item.epc="{ item }">
                    <span>{{ formatEpc(item.epc) }}</span>
                </template>
                <template v-slot:item.roi="{ item }">
                    <span :class="signClass(item.roi)">{{ formatPct(item.roi) }}</span>
                </template>
                <template v-slot:body.append="{ headers }">
                    <tr class="perf-totals-row" v-if="reportRows.length">
                        <td>Total</td>
                        <td v-for="h in headers.slice(1)" :key="h.value" :class="h.align === 'end' ? 'text-end' : ''">
                            <template v-if="['visits','unique_visits','clicks','unique_clicks','leads','conversions','rejected'].includes(h.value)">
                                {{ Number(totals[h.value] || 0).toLocaleString() }}
                            </template>
                            <template v-else-if="['cost','revenue','profit'].includes(h.value)">
                                <span :class="h.value === 'profit' ? signClass(totals.profit) : ''">{{ formatMoney(totals[h.value]) }}</span>
                            </template>
                            <template v-else-if="h.value === 'cr'">{{ formatPct(totals.cr) }}</template>
                            <template v-else-if="h.value === 'epc'">{{ formatEpc(totals.epc) }}</template>
                            <template v-else-if="h.value === 'roi'">
                                <span :class="signClass(totals.roi)">{{ formatPct(totals.roi) }}</span>
                            </template>
                            <template v-else>&nbsp;</template>
                        </td>
                    </tr>
                </template>
                <template v-slot:no-data>
                    <div class="empty-state">
                        <v-icon>mdi-chart-box-outline</v-icon>
                        <div class="mt-2">Run a report to see the breakdown</div>
                    </div>
                </template>
            </v-data-table>
        </v-card>

        <!-- Click log drill-down -->
        <div class="d-flex align-center justify-space-between mt-6 mb-2">
            <div>
                <div class="font-weight-medium">Click Log</div>
                <div class="page-subtitle">Raw click records with drill-down filters</div>
            </div>
            <v-btn text small color="primary" :disabled="!clickLog.length" @click="exportClickLogCsv">
                <v-icon small class="mr-1">mdi-download</v-icon>Export CSV
            </v-btn>
        </div>
        <v-card class="pa-4 mb-4">
            <div class="d-flex flex-wrap align-center">
                <v-text-field
                        v-model="logFilters.country"
                        label="Country"
                        outlined dense hide-details clearable
                        style="max-width: 110px;"
                        class="mr-2"
                ></v-text-field>
                <v-text-field
                        v-model="logFilters.device_type"
                        label="Device"
                        outlined dense hide-details clearable
                        style="max-width: 110px;"
                        class="mr-2"
                ></v-text-field>
                <v-text-field
                        v-model="logFilters.os"
                        label="OS"
                        outlined dense hide-details clearable
                        style="max-width: 110px;"
                        class="mr-2"
                ></v-text-field>
                <v-select
                        v-model="logFilters.status"
                        :items="['', 'lead', 'sale', 'upsale', 'rejected', 'hold', 'trash']"
                        label="Status"
                        outlined dense hide-details clearable
                        style="max-width: 130px;"
                        class="mr-2"
                ></v-select>
                <v-text-field
                        v-model="logFilters.search"
                        label="Search (url, referrer, ip, visitor id)"
                        prepend-inner-icon="mdi-magnify"
                        outlined dense hide-details clearable
                        style="max-width: 280px;"
                        class="mr-2"
                        @keyup.enter="loadClickLog"
                ></v-text-field>
                <v-btn color="primary" elevation="0" :loading="logLoading" @click="loadClickLog">
                    <v-icon small class="mr-1">mdi-magnify</v-icon>Search
                </v-btn>
            </div>
        </v-card>
        <v-card>
            <v-data-table
                    :headers="clickLogHeaders"
                    :items="clickLog"
                    dense
                    :items-per-page="15"
                    :footer-props="{ 'items-per-page-options': [15, 25, 50, 100] }"
                    :loading="logLoading"
            >
                <template v-slot:item.is_bot="{ item }">
                    <v-chip v-if="item.is_bot" x-small label color="error" text-color="white">bot</v-chip>
                    <span v-else class="grey--text">—</span>
                </template>
                <template v-slot:item.status="{ item }">
                    <span v-if="item.status" class="font-weight-medium">{{ item.status }}</span>
                    <span v-else class="grey--text">—</span>
                </template>
                <template v-slot:no-data>
                    <div class="empty-state">
                        <v-icon>mdi-inbox-outline</v-icon>
                        <div class="mt-2">No clicks match the filters</div>
                    </div>
                </template>
            </v-data-table>
        </v-card>

        <!-- Conversion log -->
        <div class="d-flex align-center justify-space-between mt-6 mb-2">
            <div>
                <div class="font-weight-medium">Conversion Log</div>
                <div class="page-subtitle">Every conversion received via postback — edit status, payout or delete</div>
            </div>
            <div>
                <v-btn text small color="primary" class="mr-2" :disabled="!conversions || !conversions.length" @click="exportCsv">
                    <v-icon small class="mr-1">mdi-download</v-icon>Export CSV
                </v-btn>
                <v-btn text small color="primary" @click="reloadReports">
                    <v-icon small class="mr-1">mdi-refresh</v-icon>Reload
                </v-btn>
            </div>
        </div>
        <v-card class="pa-4 mb-2">
            <div class="d-flex flex-wrap align-center">
                <v-select
                        v-model="convFilters.status"
                        :items="['', 'lead', 'sale', 'upsale', 'rejected', 'hold', 'trash']"
                        label="Status"
                        outlined dense hide-details clearable
                        style="max-width: 130px;"
                        class="mr-2"
                ></v-select>
                <v-text-field
                        v-model="convFilters.search"
                        label="Search (click id, external id, transaction id, visitor id)"
                        prepend-inner-icon="mdi-magnify"
                        outlined dense hide-details clearable
                        style="max-width: 320px;"
                        class="mr-2"
                        @keyup.enter="loadReports"
                ></v-text-field>
                <v-btn color="primary" elevation="0" :loading="convLoading" @click="loadReports">
                    <v-icon small class="mr-1">mdi-magnify</v-icon>Search
                </v-btn>
            </div>
        </v-card>
        <v-row dense>
            <v-col>
                <v-card>
                    <v-data-table
                            :headers="headers"
                            :items="conversions"
                            dense
                            :items-per-page="10"
                            :footer-props="{ 'items-per-page-options': [10, 25, 50] }"
                            :loading="convLoading"
                    >
                        <template v-slot:item.status="{ item }">
                            <v-chip x-small label outlined :color="statusColor(item.status)" class="font-weight-medium">
                                {{ item.status || '—' }}
                            </v-chip>
                        </template>
                        <template v-slot:item.payout="{ item }">
                            <span>{{ formatMoney(item.payout) }}</span>
                        </template>
                        <template v-slot:item.profit="{ item }">
                            <span :class="signClass(item.profit)">{{ formatMoney(item.profit) }}</span>
                        </template>
                        <template v-slot:item.revenue="{ item }">
                            <span>{{ formatMoney(item.revenue) }}</span>
                        </template>
                        <template v-slot:item.postback_count="{ item }">
                            <span v-if="item.postback_count > 1" class="font-weight-medium">{{ item.postback_count }}</span>
                            <span v-else-if="item.postback_count === 1">1</span>
                            <span v-else class="grey--text">—</span>
                        </template>
                        <template v-slot:item.actions="{ item }">
                            <v-tooltip bottom>
                                <template v-slot:activator="{ on, attrs }">
                                    <v-btn icon x-small color="primary" v-bind="attrs" v-on="on" @click="openEdit(item)">
                                        <v-icon small>mdi-pencil-outline</v-icon>
                                    </v-btn>
                                </template>
                                <span>Edit conversion</span>
                            </v-tooltip>
                            <v-tooltip bottom>
                                <template v-slot:activator="{ on, attrs }">
                                    <v-btn icon x-small color="error" v-bind="attrs" v-on="on" @click="deleteConversion(item)">
                                        <v-icon small>mdi-trash-can-outline</v-icon>
                                    </v-btn>
                                </template>
                                <span>Delete conversion</span>
                            </v-tooltip>
                        </template>
                        <template v-slot:no-data>
                            <div class="empty-state">
                                <v-icon>mdi-inbox-outline</v-icon>
                                <div class="mt-2">No data yet</div>
                            </div>
                        </template>
                    </v-data-table>
                </v-card>
            </v-col>
        </v-row>

        <!-- Edit conversion dialog -->
        <v-dialog v-model="editDialog" max-width="520px">
            <v-card>
                <v-card-title class="text-h6">Edit Conversion</v-card-title>
                <v-card-text>
                    <div class="caption grey--text mb-3">
                        Click ID: <code>{{ editItem.click_id }}</code>
                        <template v-if="editItem.received_at"> · {{ editItem.received_at }}</template>
                    </div>
                    <v-select
                            v-model="editItem.status"
                            :items="['lead', 'sale', 'upsale', 'rejected', 'hold', 'trash']"
                            label="Status"
                            outlined
                            dense
                    ></v-select>
                    <v-row dense>
                        <v-col cols="6">
                            <v-text-field label="Payout" v-model="editItem.payout" type="number" step="0.01" outlined dense></v-text-field>
                        </v-col>
                        <v-col cols="6">
                            <v-text-field label="Revenue" v-model="editItem.revenue" type="number" step="0.01" outlined dense></v-text-field>
                        </v-col>
                    </v-row>
                    <v-text-field label="External ID" v-model="editItem.external_id" outlined dense></v-text-field>
                    <v-text-field label="Transaction ID" v-model="editItem.transaction_id" outlined dense></v-text-field>
                </v-card-text>
                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="editDialog = false">Cancel</v-btn>
                    <v-btn color="primary" :loading="editSaving" @click="saveConversion">Save</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>

        <confirm-dialog-component ref="confirm" />
    </v-container>
</script>

<script type="application/javascript">
    Vue.component('reports-component', {
        template: '#reports-template',
        data() {
            return {
                loading: false,
                dateMenu: false,
                activePreset: 'Last 30 days',
                datePresets: [
                    { label: 'Today', days: 0 },
                    { label: 'Yesterday', days: 1 },
                    { label: 'Last 7 days', days: 6 },
                    { label: 'Last 30 days', days: 29 },
                ],
                dateRange: [
                    new Date(new Date().setDate(new Date().getDate() - 29)).toISOString().split('T')[0],
                    new Date().toISOString().split('T')[0]
                ],
                dimension: 'country',
                dimensionItems: [
                    { key: 'date', label: 'Date' },
                    { key: 'hour', label: 'Hour' },
                    { key: 'campaign_id', label: 'Campaign' },
                    { key: 'offer_id', label: 'Offer' },
                    { key: 'landing_id', label: 'Landing Page' },
                    { key: 'country', label: 'Country' },
                    { key: 'region', label: 'Region' },
                    { key: 'city', label: 'City' },
                    { key: 'device_type', label: 'Device Type' },
                    { key: 'os', label: 'OS' },
                    { key: 'browser', label: 'Browser' },
                    { key: 'language', label: 'Language' },
                    { key: 'traffic_source_name', label: 'Traffic Source' },
                    { key: 'utm_source', label: 'UTM Source' },
                    { key: 'utm_campaign', label: 'UTM Campaign' },
                    { key: 'utm_creative', label: 'UTM Creative' },
                    { key: 'keyword', label: 'Keyword' },
                    { key: 'isp', label: 'ISP' },
                    { key: 'connection_type', label: 'Connection Type' },
                    { key: 'status', label: 'Conversion Status' },
                    { key: 'is_bot', label: 'Bot Flag' },
                    { key: 'is_using_proxy', label: 'Proxy Flag' },
                ],
                campaigns: [],
                selectedCampaigns: [],
                reportHeadersBase: [
                    {text: 'Visits', value: 'visits', align: 'end'},
                    {text: 'Unique Visits', value: 'unique_visits', align: 'end'},
                    {text: 'Clicks', value: 'clicks', align: 'end'},
                    {text: 'Unique Clicks', value: 'unique_clicks', align: 'end'},
                    {text: 'Leads', value: 'leads', align: 'end'},
                    {text: 'Conversions', value: 'conversions', align: 'end'},
                    {text: 'Rejected', value: 'rejected', align: 'end'},
                    {text: 'Cost', value: 'cost', align: 'end'},
                    {text: 'Revenue', value: 'revenue', align: 'end'},
                    {text: 'Profit', value: 'profit', align: 'end'},
                    {text: 'CR %', value: 'cr', align: 'end'},
                    {text: 'EPC', value: 'epc', align: 'end'},
                    {text: 'ROI %', value: 'roi', align: 'end'},
                ],
                reportRows: [],
                headers: [
                    {text: 'Received At', value: 'received_at'},
                    {text: 'Click ID', value: 'click_id'},
                    {text: 'Campaign ID', value: 'campaign_id'},
                    {text: 'Offer ID', value: 'offer_id'},
                    {text: 'Status', value: 'status'},
                    {text: 'External ID', value: 'external_id'},
                    {text: 'Sub ID 1', value: 'sub_id_1'},
                    {text: 'IP', value: 'ip'},
                    {text: 'Payout', value: 'payout', align: 'end'},
                    {text: 'Profit', value: 'profit', align: 'end'},
                    {text: 'Revenue', value: 'revenue', align: 'end'},
                    {text: 'Postbacks', value: 'postback_count', align: 'end'},
                    {text: 'Actions', value: 'actions', sortable: false},
                ],
                conversions: [],
                convLoading: false,
                convFilters: {
                    status: '',
                    search: '',
                },
                editDialog: false,
                editSaving: false,
                editItem: {},
                logLoading: false,
                clickLog: [],
                logFilters: {
                    country: '',
                    device_type: '',
                    os: '',
                    status: '',
                    search: '',
                },
                clickLogHeaders: [
                    {text: 'Time', value: 'received_at'},
                    {text: 'IP', value: 'ip'},
                    {text: 'Country', value: 'country'},
                    {text: 'Device', value: 'device_type'},
                    {text: 'OS', value: 'os'},
                    {text: 'Browser', value: 'browser'},
                    {text: 'URL', value: 'url'},
                    {text: 'Referrer', value: 'referrer'},
                    {text: 'Keyword', value: 'keyword'},
                    {text: 'Source', value: 'traffic_source_name'},
                    {text: 'Campaign', value: 'campaign_id'},
                    {text: 'Status', value: 'status'},
                    {text: 'Bot', value: 'is_bot'},
                    {text: 'Visitor ID', value: 'visitor_id'},
                ],
            }
        },
        computed: {
            dateRangeText() {
                return this.dateRange.join(' ~ ');
            },
            reportHeaders() {
                const dimLabel = (this.dimensionItems.find(d => d.key === this.dimension) || {}).label || 'Dimension';
                return [{text: dimLabel, value: 'dimension'}, ...this.reportHeadersBase];
            },
            totals() {
                const rows = this.reportRows;
                const sum = f => rows.reduce((a, r) => a + (parseFloat(r[f]) || 0), 0);
                const clicks = sum('clicks');
                const cost = sum('cost');
                const revenue = sum('revenue');
                const conversions = sum('conversions');
                const profit = sum('profit');
                return {
                    visits: sum('visits'),
                    unique_visits: sum('unique_visits'),
                    clicks,
                    unique_clicks: sum('unique_clicks'),
                    leads: sum('leads'),
                    conversions,
                    rejected: sum('rejected'),
                    cost, revenue, profit,
                    cr: clicks ? (conversions / clicks) * 100 : 0,
                    epc: clicks ? revenue / clicks : 0,
                    roi: cost ? (profit / cost) * 100 : 0,
                };
            },
        },
        mounted() {
            this.loadCampaigns();
            this.loadReports();
            this.loadClickLog();
            this.$root.$on('load-reports', () => { this.loadCampaigns(); this.loadReports(); this.loadClickLog(); });
        },
        methods: {
            roiClass(roi) {
                const v = parseFloat(roi);
                if (isNaN(v) || v === 0) return 'grey--text';
                return v > 0 ? 'success--text' : 'error--text';
            },
            // Row tint: deeper tint the further from break-even (ROI-led,
            // profit as fallback when the dimension has no ROI).
            perfRowClass(item) {
                const roi = parseFloat(item.roi);
                const profit = parseFloat(item.profit) || 0;
                let score = null;
                if (!isNaN(roi) && roi !== 0) score = roi;
                else if (profit !== 0) {
                    const cost = Math.abs(parseFloat(item.cost) || 0);
                    score = cost ? (profit / cost) * 100 : (profit > 0 ? 100 : -100);
                }
                if (score === null || score === 0) return '';
                if (score >= 50) return 'perf-win-3';
                if (score >= 10) return 'perf-win-2';
                if (score > 0) return 'perf-win-1';
                if (score <= -50) return 'perf-loss-3';
                if (score <= -10) return 'perf-loss-2';
                return 'perf-loss-1';
            },
            signClass(v) {
                const n = parseFloat(v);
                if (isNaN(n) || n === 0) return 'num-neutral';
                return n > 0 ? 'num-pos' : 'num-neg';
            },
            formatMoney(v) {
                const n = parseFloat(v) || 0;
                return '$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            },
            formatPct(v) {
                const n = parseFloat(v) || 0;
                return n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '%';
            },
            formatEpc(v) {
                const n = parseFloat(v) || 0;
                return '$' + n.toLocaleString('en-US', {minimumFractionDigits: 5, maximumFractionDigits: 5});
            },
            applyPreset(preset) {
                this.activePreset = preset.label;
                const to = new Date();
                let from = new Date();
                if (preset.label === 'Yesterday') {
                    from = new Date(to);
                    from.setDate(from.getDate() - 1);
                    to.setDate(to.getDate() - 1);
                } else if (preset.days > 0) {
                    from.setDate(from.getDate() - preset.days);
                }
                this.dateRange = [from.toISOString().split('T')[0], to.toISOString().split('T')[0]];
                this.runReport();
            },
            loadCampaigns() {
                fetch('/backend/api/campaigns/')
                    .then(res => res.ok ? res.json() : Promise.reject(new Error('HTTP ' + res.status)))
                    .then(data => { this.campaigns = Array.isArray(data) ? data : []; })
                    .catch(err => { this.campaigns = []; });
            },
            runReport() {
                this.loading = true;
                const payload = {
                    dimension: this.dimension,
                    filters: {
                        date_from: this.dateRange[0],
                        date_to: this.dateRange[1],
                        campaigns: this.selectedCampaigns,
                    },
                };
                fetch('/backend/api/dashboard/breakdown', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                })
                    .then(res => res.json())
                    .then(data => {
                        this.reportRows = data.rows || [];
                        this.loading = false;
                    })
                    .catch(err => {
                        this.loading = false;
                        this.$root.$emit('show-message', {type: 'error', text: 'Report failed: ' + err.message});
                    });
            },
            exportReportCsv() {
                const headers = this.reportHeaders.map(h => h.text);
                const rows = this.reportRows.map(it => this.reportHeaders.map(h => it[h.value]));
                const csv = [headers, ...rows].map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\n');
                const blob = new Blob([csv], {type: 'text/csv'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'report_' + this.dimension + '.csv';
                a.click();
                URL.revokeObjectURL(a.href);
            },
            exportCsv() {
                const headers = this.headers.map(h => h.text);
                const rows = this.conversions.map(it => this.headers.map(h => {
                    const v = it[h.value];
                    return v == null ? '' : String(v);
                }));
                const csv = [headers, ...rows].map(r => r.map(c => `"${c}"`).join(',')).join('\n');
                const blob = new Blob([csv], {type: 'text/csv'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'conversions.csv';
                a.click();
                URL.revokeObjectURL(a.href);
            },
            loadClickLog() {
                this.logLoading = true;
                const payload = {
                    date_from: this.dateRange[0],
                    date_to: this.dateRange[1],
                    campaigns: this.selectedCampaigns,
                    country: this.logFilters.country || null,
                    device_type: this.logFilters.device_type || null,
                    os: this.logFilters.os || null,
                    status: this.logFilters.status || null,
                    search: this.logFilters.search || null,
                    limit: 500,
                };
                Object.keys(payload).forEach(k => payload[k] === null && delete payload[k]);
                fetch('/backend/api/dashboard/click-log', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                })
                    .then(res => res.ok ? res.json() : Promise.reject(new Error('HTTP ' + res.status)))
                    .then(data => {
                        this.clickLog = Array.isArray(data) ? data : [];
                        this.logLoading = false;
                    })
                    .catch(err => {
                        this.logLoading = false;
                        this.$root.$emit('show-message', {type: 'error', text: 'Click log failed: ' + err.message});
                    });
            },
            exportClickLogCsv() {
                const headers = this.clickLogHeaders.map(h => h.text);
                const rows = this.clickLog.map(it => this.clickLogHeaders.map(h => it[h.value]));
                const csv = [headers, ...rows].map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\n');
                const blob = new Blob([csv], {type: 'text/csv'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'click_log.csv';
                a.click();
                URL.revokeObjectURL(a.href);
            },
            reloadReports() {
                this.loadReports();
                this.$root.$emit("show-message", {type: "success", text: 'Conversions reloaded successfully!'});
            },
            loadReports() {
                this.convLoading = true;
                const params = new URLSearchParams();
                if (this.convFilters.status) params.set('status', this.convFilters.status);
                if (this.convFilters.search) params.set('search', this.convFilters.search);
                fetch('/backend/api/reports/?' + params.toString())
                    .then(response => response.ok ? response.json() : Promise.reject(new Error('HTTP ' + response.status)))
                    .then(data => {
                        this.conversions = Array.isArray(data) ? data : [];
                        this.convLoading = false;
                    })
                    .catch(err => {
                        this.convLoading = false;
                        console.error("Failed to load conversions:", err)
                        this.$root.$emit("show-message", {type: "error", text: err.message});
                    });
            },
            statusColor(status) {
                const map = {sale: 'success', lead: 'info', upsale: 'success', rejected: 'error', hold: 'warning', trash: 'grey'};
                return map[status] || 'grey';
            },
            openEdit(item) {
                this.editItem = Object.assign({}, item);
                this.editDialog = true;
            },
            async saveConversion() {
                this.editSaving = true;
                const payload = {
                    status: this.editItem.status,
                    payout: this.editItem.payout === '' || this.editItem.payout == null ? null : parseFloat(this.editItem.payout),
                    revenue: this.editItem.revenue === '' || this.editItem.revenue == null ? null : parseFloat(this.editItem.revenue),
                    external_id: this.editItem.external_id || null,
                    transaction_id: this.editItem.transaction_id || null,
                };
                try {
                    const res = await fetch('/backend/api/reports/' + this.editItem.id, {
                        method: 'PATCH',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'Update failed');
                    this.editDialog = false;
                    this.$root.$emit("show-message", {type: "success", text: 'Conversion updated'});
                    this.loadReports();
                } catch (err) {
                    this.$root.$emit("show-message", {type: "error", text: err.message});
                } finally {
                    this.editSaving = false;
                }
            },
            async deleteConversion(item) {
                const ok = await this.$refs.confirm.open(
                    'Delete conversion?',
                    `Click ${item.click_id} will be permanently removed. This cannot be undone.`,
                    'Delete'
                );
                if (!ok) return;
                try {
                    const res = await fetch('/backend/api/reports/' + item.id, {method: 'DELETE'});
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'Delete failed');
                    this.$root.$emit("show-message", {type: "success", text: 'Conversion deleted'});
                    this.loadReports();
                } catch (err) {
                    this.$root.$emit("show-message", {type: "error", text: err.message});
                }
            },
        },
    });
</script>
