{% raw %}
<script type="text/x-template" id="reports-template">
    <v-container fluid>
        <v-row align="center" class="mb-4">
            <v-col>
                <div class="page-title">Reports</div>
                <div class="page-subtitle">Break down performance by any dimension</div>
                <v-btn-toggle v-model="reportView" dense class="mt-3" mandatory>
                    <v-btn value="builder" small>Report builder</v-btn>
                    <v-btn value="funnel" small>Funnel</v-btn>
                </v-btn-toggle>
            </v-col>
            <v-col class="d-flex justify-end" cols="auto">
                <v-btn
                        outlined
                        elevation="0"
                        class="mr-2"
                        :disabled="!reportRows.length"
                        @click="exportReportCsv"
                >
                    <v-icon small class="mr-1">mdi-download</v-icon>
                    Export CSV
                </v-btn>
                <v-btn color="primary" elevation="0" :loading="loading" @click="runReport">
                    <v-icon small class="mr-1">mdi-play</v-icon>
                    Run report
                </v-btn>
            </v-col>
        </v-row>

        <!-- Report builder controls -->
        <template v-if="reportView === 'builder'">
        <!-- Wave 19B: built-in report template gallery (frontend-only list) -->
        <v-card class="pa-4 mb-4 report-gallery-card">
            <div class="d-flex align-center mb-2">
                <div class="builder-label mb-0">Report templates</div>
                <span class="builder-hint ml-2">load a ready-made configuration into the builder</span>
            </div>
            <div class="report-gallery">
                <v-card v-for="t in reportTemplateGallery" :key="t.id"
                        outlined class="report-template-card" :class="{'report-template-card--active': activeTemplate === t.id}"
                        @click="applyReportTemplate(t)">
                    <v-card-text class="pa-3">
                        <div class="d-flex align-center">
                            <v-icon small class="mr-2">{{ t.icon }}</v-icon>
                            <span class="font-weight-medium">{{ t.name }}</span>
                        </div>
                        <div class="caption grey--text mt-1">{{ t.hint }}</div>
                    </v-card-text>
                </v-card>
            </div>
            <div v-if="templateNote" class="basis-note mt-2">
                <v-icon small class="mr-1">mdi-information-outline</v-icon>{{ templateNote }}
            </div>
        </v-card>
        <v-card class="pa-4 mb-4">
            <div class="filter-bar align-center">
                <v-menu v-model="dateMenu" :close-on-content-click="false" transition="scale-transition" offset-y min-width="auto">
                    <template v-slot:activator="{ on, attrs }">
                        <v-text-field
                                v-model="dateRangeText"
                                label="Date range"
                                prepend-icon="mdi-calendar"
                                readonly
                                v-bind="attrs"
                                v-on="on"
                                outlined
                                dense
                                hide-details
                                class="range-field"
                        ></v-text-field>
                    </template>
                    <v-date-picker v-model="dateRange" range @input="dateMenu = false"></v-date-picker>
                </v-menu>
                <v-select
                        :items="campaigns"
                        v-model="selectedCampaigns"
                        label="Campaigns"
                        item-text="name"
                        item-value="id"
                        outlined
                        dense
                        hide-details
                        multiple
                        chips
                        small-chips
                        class="campaigns-select"
                ></v-select>
                <v-btn-toggle v-model="dateBasis" dense class="basis-toggle" mandatory>
                    <v-btn value="click_date" small>Click date</v-btn>
                    <v-btn value="conversion_date" small>Conversion date</v-btn>
                </v-btn-toggle>
            </div>
            <div class="mt-2">
                <v-chip v-for="preset in datePresets" :key="preset.label"
                        small label outlined
                        :color="activePreset === preset.label ? 'primary' : 'grey'"
                        :class="activePreset === preset.label ? 'primary--text' : 'grey--text text--darken-2'"
                        class="mr-1"
                        @click="applyPreset(preset)">
                    {{ preset.label }}
                </v-chip>
            </div>

            <!-- Dimension pipeline: ordered drill-down, up to 5 -->
            <div class="mt-4">
                <div class="builder-label">Breakdown pipeline <span class="builder-hint">click a row in the table to expand the next level</span></div>
                <div class="dim-pipeline">
                    <template v-for="(dim, i) in dimensions">
                        <v-chip :key="'dim-' + i" small label class="dim-chip" close
                                @click:close="removeDimension(i)">
                            <span class="dim-chip__order">{{ i + 1 }}</span>
                            {{ dimLabel(dim) }}
                            <v-icon small class="dim-chip__move" :disabled="i === 0" @click.stop="moveDimension(i, -1)">mdi-chevron-left</v-icon>
                            <v-icon small class="dim-chip__move" :disabled="i === dimensions.length - 1" @click.stop="moveDimension(i, 1)">mdi-chevron-right</v-icon>
                        </v-chip>
                        <v-icon v-if="i < dimensions.length - 1" :key="'sep-' + i" small class="dim-sep">mdi-chevron-right</v-icon>
                    </template>
                    <v-select
                            v-if="dimensions.length < 5"
                            :items="availableDimensions"
                            item-text="label"
                            item-value="key"
                            label="+ Add dimension"
                            outlined
                            dense
                            hide-details
                            class="dim-add"
                            @input="addDimension"
                    ></v-select>
                    <span v-else class="builder-hint ml-2">maximum 5 dimensions</span>
                </div>
                <!-- G58: one-click roll-up presets -->
                <div class="mt-3">
                    <span class="builder-hint mr-1">Presets:</span>
                    <v-chip v-for="preset in dimensionPresets" :key="preset.label" small label outlined
                            class="mr-1 preset-chip" @click="applyDimensionPreset(preset)">
                        <v-icon small class="mr-1">{{ preset.icon }}</v-icon>{{ preset.label }}
                    </v-chip>
                </div>
            </div>

            <!-- Columns / sorting / saved reports -->
            <div class="filter-bar align-center mt-3">
                <v-select
                        v-model="selectedColumns"
                        :items="columnOptions"
                        label="Columns"
                        outlined
                        dense
                        hide-details
                        multiple
                        chips
                        small-chips
                        class="columns-select"
                ></v-select>
                <!-- Wave 19A: checkbox column picker + saved column templates -->
                <v-menu offset-y left :close-on-content-click="false">
                    <template v-slot:activator="{ on, attrs }">
                        <v-btn small outlined class="mr-2" v-bind="attrs" v-on="on">
                            <v-icon small>mdi-view-column-outline</v-icon>
                        </v-btn>
                    </template>
                    <v-card class="pa-2 column-menu-card">
                        <div class="caption grey--text px-2 pt-1">Show columns</div>
                        <v-checkbox
                                v-for="h in reportHeadersBase"
                                :key="'rcol-' + h.value"
                                :input-value="selectedColumns.indexOf(h.value) !== -1"
                                @change="toggleReportColumn(h.value)"
                                :label="h.text"
                                dense hide-details
                                class="mt-0 column-menu-check"
                        ></v-checkbox>
                        <v-checkbox
                                v-for="c in allCustomColumns"
                                :key="'rccol-' + c.name"
                                :input-value="selectedColumns.indexOf(c.name) !== -1"
                                @change="toggleReportColumn(c.name)"
                                :label="c.name"
                                dense hide-details
                                class="mt-0 column-menu-check"
                        ></v-checkbox>
                        <v-divider class="my-2"></v-divider>
                        <div class="caption grey--text px-2">Templates</div>
                        <div class="px-2 mt-1">
                            <v-btn small text color="primary" @click="saveColumnTemplate">
                                <v-icon small class="mr-1">mdi-content-save-outline</v-icon>Save as template
                            </v-btn>
                        </div>
                        <v-list dense class="py-0">
                            <v-list-item v-for="t in columnTemplates" :key="t.name" link
                                         @click="applyColumnTemplate(t)">
                                <v-list-item-title>{{ t.name }}</v-list-item-title>
                                <v-list-item-icon>
                                    <v-icon small @click.stop="deleteColumnTemplate(t)">mdi-delete</v-icon>
                                </v-list-item-icon>
                            </v-list-item>
                            <div v-if="!columnTemplates.length" class="caption grey--text px-2 py-1">
                                No saved templates
                            </div>
                        </v-list>
                        <v-divider class="my-2"></v-divider>
                        <div class="px-2">
                            <v-btn small text color="primary" @click="saveDefaultColumns">
                                <v-icon small class="mr-1">mdi-pin-outline</v-icon>Use as default
                            </v-btn>
                        </div>
                    </v-card>
                </v-menu>
                <v-select
                        v-model="sortBy"
                        :items="sortOptions"
                        label="Sort by"
                        outlined
                        dense
                        hide-details
                        class="sort-select"
                ></v-select>
                <v-btn small outlined :color="sortDir === 'asc' ? 'primary' : 'grey'" class="mr-2" @click="sortDir = sortDir === 'asc' ? 'desc' : 'asc'">
                    <v-icon small>{{ sortDir === 'asc' ? 'mdi-sort-ascending' : 'mdi-sort-descending' }}</v-icon>
                </v-btn>
                <v-btn small outlined class="mr-2" @click="customMetricDialog = true">
                    <v-icon small class="mr-1">mdi-calculator</v-icon>
                    Custom metrics<template v-if="customMetrics.length"> ({{ customMetrics.length }})</template>
                </v-btn>
                <v-select
                        v-model="savedReportId"
                        :items="savedReports"
                        item-text="name"
                        item-value="id"
                        label="Saved reports"
                        outlined
                        dense
                        hide-details
                        clearable
                        class="saved-select"
                        @change="loadSavedReport"
                ></v-select>
                <v-btn small outlined class="mr-1" @click="openSaveDialog">
                    <v-icon small>mdi-content-save-outline</v-icon>
                </v-btn>
                <v-btn small outlined class="mr-1" :disabled="!savedReportId" @click="openShareDialog">
                    <v-icon small>mdi-share-variant-outline</v-icon>
                </v-btn>
                <v-btn small outlined class="mr-1" :disabled="!savedReportId" @click="openEmailScheduleDialog">
                    <v-icon small>mdi-email-outline</v-icon>
                </v-btn>
                <v-btn small outlined color="error" :disabled="!savedReportId" @click="deleteSavedReport">
                    <v-icon small>mdi-trash-can-outline</v-icon>
                </v-btn>
                <v-select
                        v-model="selectedReportPreset"
                        :items="reportPresets"
                        item-text="name"
                        item-value="id"
                        label="Filter presets"
                        outlined dense hide-details clearable
                        class="saved-select"
                        @change="applyReportPreset"
                ></v-select>
                <v-btn small outlined class="mr-1" @click="saveReportPreset" title="Save current filters as preset">
                    <v-icon small>mdi-content-save-outline</v-icon>
                </v-btn>
                <v-btn small outlined color="error" class="mr-1" :disabled="!selectedReportPreset"
                       @click="deleteReportPreset" title="Delete preset">
                    <v-icon small>mdi-delete</v-icon>
                </v-btn>
                <v-spacer></v-spacer>
                <v-btn
                        v-if="$root.roleLabel === 'admin'"
                        outlined
                        elevation="0"
                        class="mr-2"
                        @click="openCostDialog"
                >
                    <v-icon small class="mr-1">mdi-cash-sync</v-icon>
                    Cost update
                </v-btn>
                <v-btn
                        outlined
                        elevation="0"
                        class="mr-2"
                        :disabled="!reportRows.length"
                        @click="exportReportCsv"
                >
                    <v-icon small class="mr-1">mdi-download</v-icon>
                    Export CSV
                </v-btn>
                <v-btn color="primary" elevation="0" :loading="loading" @click="runReport">
                    <v-icon small class="mr-1">mdi-play</v-icon>
                    Run report
                </v-btn>
            </div>
            <div v-if="basisNote" class="basis-note mt-2">
                <v-icon small class="mr-1">mdi-information-outline</v-icon>{{ basisNote }}
            </div>
            <!-- Drill breadcrumb: click a segment to collapse everything below it -->
            <div v-if="reportRows.length" class="drill-path mt-3">
                <span class="builder-label mr-2">Levels</span>
                <v-chip v-for="(dim, i) in dimensions" :key="'bc-' + i"
                        small label outlined class="mr-1 drill-path__chip"
                        @click="collapseBelow(i)">
                    {{ i + 1 }}. {{ dimLabel(dim) }}
                </v-chip>
            </div>
        </v-card>

        <!-- Warehouse export (BI): one raw CSV per dataset, or a ZIP of all of
             them, with a schema/manifest. Plain download — no credentials. -->
        <v-card class="pa-4 mb-4">
            <div class="d-flex align-center flex-wrap mb-2">
                <div class="builder-label mb-0">Warehouse export</div>
                <span class="builder-hint ml-2">
                    Raw CSV datasets with a schema manifest — point BigQuery, Snowflake or Google Sheets at the file
                </span>
            </div>
            <div class="filter-bar align-center">
                <v-menu v-model="warehouseDateMenu" :close-on-content-click="false" transition="scale-transition" offset-y min-width="auto">
                    <template v-slot:activator="{ on, attrs }">
                        <v-text-field
                                v-model="warehouseDateText"
                                label="Date range"
                                prepend-icon="mdi-calendar"
                                readonly
                                v-bind="attrs"
                                v-on="on"
                                outlined
                                dense
                                hide-details
                                class="range-field"
                        ></v-text-field>
                    </template>
                    <v-date-picker v-model="warehouseDateRange" range @input="warehouseDateMenu = false"></v-date-picker>
                </v-menu>
                <div class="d-flex align-center mr-3">
                    <v-checkbox v-for="d in warehouseDatasetOptions" :key="d.value"
                            v-model="warehouseDatasets" :value="d.value" :label="d.label"
                            dense hide-details class="mr-3 warehouse-check"></v-checkbox>
                </div>
                <v-checkbox v-model="warehouseBom" label="UTF-8 BOM (Sheets)" dense hide-details class="mr-3 warehouse-check"></v-checkbox>
                <v-checkbox v-model="warehouseGzip" label="gzip" dense hide-details class="mr-3 warehouse-check"></v-checkbox>
                <v-btn color="primary" elevation="0" :loading="warehouseLoading" @click="downloadWarehouseExport">
                    <v-icon small class="mr-1">mdi-download</v-icon>
                    Download
                </v-btn>
            </div>
            <div class="caption grey--text mt-2">
                One file per dataset; one dataset downloads a plain .csv (gzip optional), two or more a ZIP with README.txt + _manifest.csv.
                Load hints inside cover BigQuery (<code>--autodetect</code>), Snowflake (<code>COPY INTO</code>) and Google Sheets ("Import as CSV").
            </div>
        </v-card>

        <!-- Breakdown table -->
        <div :key="'rep-table-' + loading" class="section-enter">
        <v-card>
            <v-data-table v-col-resize:reports-breakdown="reportHeaders"
                    :headers="reportHeaders"
                    :items="displayRows"
                    dense
                    :items-per-page="25"
                    :footer-props="{ 'items-per-page-options': [15, 25, 50, 100] }"
                    :loading="loading"
                    :item-class="perfRowClass"
            >
                <template v-slot:item.dimension="{ item }">
                    <div class="dim-cell" :style="{ paddingLeft: ((item.level - 1) * 18) + 'px' }">
                        <v-btn v-if="canToggle(item)" icon x-small class="dim-cell__toggle" tabindex="-1"
                               @click.stop="toggleRow(item)">
                            <v-icon small>{{ isExpanded(item) ? 'mdi-chevron-down' : 'mdi-chevron-right' }}</v-icon>
                        </v-btn>
                        <span v-else class="dim-cell__leaf"></span>
                        <span class="dim-value" role="button" @click="onRowClick(item)">{{ item.value || '(empty)' }}</span>
                        <v-chip v-if="groupingView && item.level === 1" x-small label
                                class="ml-2 group-chip">subtotal</v-chip>
                        <v-btn
                                v-if="$root.roleLabel === 'admin' && item.dim === 'offer_id' && isNumericId(item.value) && !offerArchived(item.value)"
                                icon x-small class="ml-1 offer-pause-btn"
                                :title="offerPaused(item.value) ? 'Resume offer' : 'Pause offer'"
                                @click.stop="toggleOfferPause(item)"
                        >
                            <v-icon small>{{ offerPaused(item.value) ? 'mdi-play-circle-outline' : 'mdi-pause-circle-outline' }}</v-icon>
                        </v-btn>
                    </div>
                </template>
                <template v-slot:item.visits="{ item }">
                    <span>{{ $fmtNum(Number(item.visits || 0)) }}</span>
                </template>
                <template v-slot:item.unique_visits="{ item }">
                    <span>{{ $fmtNum(Number(item.unique_visits || 0)) }}</span>
                </template>
                <template v-slot:item.clicks="{ item }">
                    <span>{{ $fmtNum(Number(item.clicks || 0)) }}</span>
                </template>
                <template v-slot:item.unique_clicks="{ item }">
                    <span>{{ $fmtNum(Number(item.unique_clicks || 0)) }}</span>
                </template>
                <template v-slot:item.leads="{ item }">
                    <span>{{ $fmtNum(Number(item.leads || 0)) }}</span>
                </template>
                <template v-slot:item.conversions="{ item }">
                    <span>{{ $fmtNum(Number(item.conversions || 0)) }}</span>
                </template>
                <template v-slot:item.rejected="{ item }">
                    <span>{{ $fmtNum(Number(item.rejected || 0)) }}</span>
                </template>
                <template v-slot:item.cost="{ item }">
                    <span>{{ formatMoney(item.cost) }}</span>
                </template>
                <template v-slot:item.revenue="{ item }">
                    <span>{{ formatMoney(item.revenue) }}</span>
                </template>
                <template v-slot:item.profit="{ item }">
                    <span :class="signClass(item.profit)">{{ formatMoney(item.profit) }}</span>
                </template>
                <template v-slot:item.cr="{ item }">
                    <span>{{ formatPct(item.cr) }}</span>
                </template>
                <template v-slot:item.epc="{ item }">
                    <span>{{ formatEpc(item.epc) }}</span>
                </template>
                <template v-slot:item.roi="{ item }">
                    <span :class="signClass(item.roi)">{{ formatPct(item.roi) }}</span>
                </template>
                <template v-slot:item.rejected_rate="{ item }">
                    <span :class="signClass(-Math.abs(item.rejected_rate || 0))">{{ formatPct(item.rejected_rate) }}</span>
                </template>
                <template v-slot:item.click_through_rate="{ item }">
                    <span>{{ formatPct(item.click_through_rate) }}</span>
                </template>
                <template v-slot:item.bot_clicks="{ item }">
                    <span :class="item.bot_clicks ? 'num-neg' : ''">{{ $fmtNum(Number(item.bot_clicks || 0)) }}</span>
                </template>
                <template v-slot:item.bot_cost="{ item }">
                    <span :class="signClass(-Math.abs(item.bot_cost || 0))">{{ formatMoney(item.bot_cost) }}</span>
                </template>
                <template v-slot:item.fraud_score_avg="{ item }">
                    <span>{{ item.fraud_score_avg == null ? '—' : Number(item.fraud_score_avg).toFixed(2) }}</span>
                </template>
                <template v-slot:item.human_clicks="{ item }">
                    <span>{{ $fmtNum(Number(item.human_clicks || 0)) }}</span>
                </template>
                <template v-for="cm in allCustomColumns" v-slot:[customSlot(cm)]="{ item }">
                    <span :key="cm.name + '-' + rowKey(item)">{{ formatCustom(item[cm.name]) }}</span>
                </template>
                <template v-slot:body.append="{ headers }">
                    <tr class="perf-totals-row" v-if="reportRows.length">
                        <td>Total</td>
                        <td v-for="h in headers.slice(1)" :key="h.value" :class="h.align === 'end' ? 'text-end' : ''">
                            <template v-if="['visits','unique_visits','clicks','unique_clicks','leads','conversions','rejected'].includes(h.value)">
                                {{ $fmtNum(Number(reportTotals[h.value] || 0)) }}
                            </template>
                            <template v-else-if="['cost','revenue','profit'].includes(h.value)">
                                <span :class="h.value === 'profit' ? signClass(reportTotals.profit) : ''">{{ formatMoney(reportTotals[h.value]) }}</span>
                            </template>
                            <template v-else-if="h.value === 'cr'">{{ formatPct(reportTotals.cr) }}</template>
                            <template v-else-if="h.value === 'epc'">{{ formatEpc(reportTotals.epc) }}</template>
                            <template v-else-if="h.value === 'roi'">
                                <span :class="signClass(reportTotals.roi)">{{ formatPct(reportTotals.roi) }}</span>
                            </template>
                            <template v-else-if="h.value === 'rejected_rate' || h.value === 'click_through_rate'">
                                {{ formatPct(reportTotals[h.value]) }}
                            </template>
                            <template v-else-if="['bot_clicks','human_clicks'].includes(h.value)">
                                {{ $fmtNum(Number(reportTotals[h.value] || 0)) }}
                            </template>
                            <template v-else-if="h.value === 'bot_cost'">{{ formatMoney(reportTotals.bot_cost) }}</template>
                            <template v-else-if="h.value === 'fraud_score_avg'">
                                {{ reportTotals.fraud_score_avg == null ? '—' : Number(reportTotals.fraud_score_avg).toFixed(2) }}
                            </template>
                            <template v-else-if="customMetricNames.includes(h.value)">{{ formatCustom(reportTotals[h.value]) }}</template>
                            <template v-else>&nbsp;</template>
                        </td>
                    </tr>
                </template>
                <template v-slot:no-data>
                    <div class="empty-state">
                        <v-icon>mdi-chart-box-outline</v-icon>
                        <div class="mt-2">Run a report to see the breakdown</div>
                    </div>
                </template>
            </v-data-table>
        </v-card>
        </div>

        <!-- Save report dialog -->
        <v-dialog v-model="saveDialog" max-width="420">
            <v-card>
                <v-card-title class="text-h6">Save report</v-card-title>
                <v-card-text>
                    <v-text-field v-model="saveName" label="Report name" outlined dense autofocus
                                  @keyup.enter="saveReport"></v-text-field>
                    <div class="caption grey--text">Saves dimensions, columns, custom metrics, date basis and filters.</div>
                </v-card-text>
                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="saveDialog = false">Cancel</v-btn>
                    <v-btn color="primary" :loading="saveLoading" @click="saveReport">Save</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>

        <!-- Custom metrics dialog (G49) -->
        <v-dialog v-model="customMetricDialog" max-width="560">
            <v-card>
                <v-card-title class="text-h6">Custom metrics</v-card-title>
                <v-card-text>
                    <div class="caption grey--text mb-3">
                        Formula references built-in metrics by key with <code>+ - * / ( )</code>, e.g.
                        <code>conversions*100/clicks</code>. Divide by zero yields an empty cell.
                    </div>
                    <div v-for="(cm, i) in customMetrics" :key="'cm-' + i" class="d-flex align-center mb-2">
                        <v-chip small label class="mr-2">{{ cm.name }}</v-chip>
                        <code class="cm-formula">{{ cm.formula }}</code>
                        <v-spacer></v-spacer>
                        <v-btn icon x-small color="error" @click="removeCustomMetric(i)">
                            <v-icon small>mdi-trash-can-outline</v-icon>
                        </v-btn>
                    </div>
                    <v-divider v-if="customMetrics.length" class="my-3"></v-divider>
                    <v-row dense>
                        <v-col cols="4">
                            <v-text-field v-model="newMetricName" label="Name" outlined dense hide-details placeholder="uCR"></v-text-field>
                        </v-col>
                        <v-col cols="8">
                            <v-text-field v-model="newMetricFormula" label="Formula" outlined dense hide-details
                                          placeholder="conversions*100/clicks"
                                          @keyup.enter="addCustomMetric"></v-text-field>
                        </v-col>
                    </v-row>
                    <div v-if="metricError" class="caption error--text mt-1">{{ metricError }}</div>
                </v-card-text>
                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="customMetricDialog = false">Close</v-btn>
                    <v-btn color="primary" @click="addCustomMetric">Add metric</v-btn>

                </v-card-actions>
            </v-card>
        </v-dialog>
        </template>

        <!-- FUNNEL VIEW (G10): per-step visits / click-outs / conversions -->
        <template v-else>
            <v-card class="pa-4 mb-4">
                <div class="filter-bar align-center">
                    <v-select
                            :items="funnelCampaigns"

                            dense
                            hide-details
                            class="campaigns-select"

                           :disabled="!funnelCampaignId" @click="loadFunnelReport">
                        <v-icon small class="mr-1">mdi-play</v-icon>
                        Load funnel
                    </v-btn>
                </div>
                <div class="mt-2 builder-hint">
                    Funnel campaigns only. Visits = tracked clicks at each step; click-outs = conversion rows created at the step;
                    conversions = rows not rejected/trash. Visitors advance one step per campaign-URL visit after a click-out.
                </div>
            </v-card>
            <v-alert v-if="!funnelCampaigns.length" type="info" dense outlined>
                No funnel campaigns yet — enable a funnel on a campaign (Campaigns → edit → Funnel tab) and traffic will appear here.

                        :headers="funnelHeaders"
                        :items="funnelSteps"

            dateRangeText() {

            warehouseDateText() {

            // Workspace columns first, then the ad-hoc per-report metrics; a
            // repeated name is folded into one column (the workspace one wins).
            allCustomColumns() {
                const out = [];
                const seen = new Set();
                const push = (list) => (list || []).forEach(c => {
                    const name = String((c && c.name) || '').trim();
                    if (!name || seen.has(name)) return;
                    seen.add(name);
                    out.push({name: name, formula: (c && c.formula) || ''});
                });
                push(this.workspaceCustomColumns);
                push(this.customMetrics);
                return out;
            },
            columnOptions() {
                return [
                    ...this.reportHeadersBase.map(h => ({ text: h.text, value: h.value })),
                    ...this.allCustomColumns.map(c => ({ text: c.name, value: c.name })),
                ];
            },
            customMetricNames() {
                return this.allCustomColumns.map(m => m.name);
            },
            campaignTagOptions() {
                // Distinct tags across the campaigns the caller can see — the
                // click-log tag filter matches campaigns carrying ANY of these.
                const set = new Set();
                (this.campaigns || []).forEach(c => (c.tags || []).forEach(t => t && set.add(t)));
                return Array.from(set).sort();
            },
            shareReportName() {
                const r = this.savedReports.find(x => x.id === this.savedReportId);
                return r ? r.name : '';
            },
            emailScheduleReportName() {
                const r = this.savedReports.find(x => x.id === this.savedReportId);
                return r ? r.name : '';
            },
            sortOptions() {
                // columnOptions already carries built-ins + custom columns.
                return this.columnOptions.slice();
            },
            availableDimensions() {
                return this.dimensionItems.filter(d => !this.dimensions.includes(d.key));
            },
            reportHeaders() {
                const first = this.dimensions[0] || 'country';
                const dimLabel = (this.dimensionItems.find(d => d.key === first) || {}).label || 'Dimension';
                const byKey = {};
                this.reportHeadersBase.forEach(h => { byKey[h.value] = h; });
                const cols = this.selectedColumns
                    .map(key => byKey[key] || { text: key, value: key, align: 'end' })
                    .map(h => ({ ...h, sortable: false }));
                return [{ text: dimLabel, value: 'dimension', sortable: false }, ...cols];
            },
            visibleRows() {
                const SEP = '\u001f';
                return this.reportRows.filter(r => {
                    if (!r.parent_key) return true;
                    const parts = r.parent_key.split(SEP);
                    for (let i = 1; i <= parts.length; i++) {
                        if (!this.expanded[parts.slice(0, i).join(SEP)]) return false;
                    }
                    return true;
                });
            },
            // Grouped view: one first-level subtotal row per group, and expanding
            // a group reveals every row beneath it at once (rather than the
            // level-by-level tree of the flat view).
            displayRows() {
                if (!this.groupingView) return this.visibleRows;
                const SEP = '\u001f';
                const out = [];
                this.reportRows.filter(r => r.level === 1).forEach(group => {
                    out.push(group);
                    const gk = this.rowKey(group);
                    if (!this.expanded[gk]) return;
                    this.reportRows.forEach(r => {
                        if (r.level > 1 && (r.parent_key === gk
                                || r.parent_key.startsWith(gk + SEP))) {
                            out.push(r);
                        }
                    });
                });
                return out;
            },
            logFiltersActive() {
                const f = this.logFilters;
                return !!(f.country || f.device_type || f.os || f.status || f.search
                          || (f.campaign_tags && f.campaign_tags.length));
            },
            convFiltersActive() {
                const f = this.convFilters;
                return !!(f.status || f.approval || f.search || f.url);
            },
            statusOptions() {
                return ['', 'lead', 'sale', 'upsale', 'rejected', 'hold', 'trash', ...this.customStatuses];
            },
            approvalOptions() {
                return ['', ...this.approvalValues];
            },
            funnelCampaigns() {
                return (this.campaigns || []).filter(c => c.config && c.config.funnel && c.config.funnel.enabled);
            },
            // Inbound ingestion endpoint for a CRM / call platform. Built from
            // the page origin so the copy-ready curl fits this deployment.
            ingestEndpoint() {
                return `${window.location.origin}/backend/api/reports/ingest`;
            },
            ingestCurl() {
                return `curl -X POST '${this.ingestEndpoint}' \\\n`
                    + `  -H 'Authorization: Bearer <WORKSPACE_API_TOKEN>' \\\n`
                    + `  -H 'Content-Type: application/json' \\\n`
                    + `  -d '{"click_id":"abc123","transaction_id":"order-42",`
                    + `"status":"sale","payout":19.99,"currency":"USD",`
                    + `"occurred_at":"2026-09-30T10:00:00Z"}'`;
            },
        },
        mounted() {
            this.$vuetify.theme.dark = (document.documentElement.dataset.theme === 'dark');
            this.loadCampaigns();
            this.loadReports();
            this.loadClickLog();
            this.loadCustomStatuses();
            this.loadSavedReports();
            this.loadReportPresets();
            this.loadColumnTemplates();
            if (this.$loadWorkspace) {
                this.$loadWorkspace().then(() => {
                    const ws = this.$workspace || {};
                    const d = ws.default_columns || {};
                    if (Array.isArray(d.reports) && d.reports.length) {
                        this.selectedColumns = d.reports.slice();
                    }
                    this.workspaceCustomColumns = Array.isArray(ws.custom_columns)
                        ? ws.custom_columns
                            .filter(c => c && String(c.name || '').trim())
                            .map(c => ({name: String(c.name).trim(), formula: c.formula || ''}))
                        : [];
                    this.groupingView = ws.grouping_view === true;
                });
            }
            if (this.$root.roleLabel === 'admin') this.loadOffers();
            this.$root.$on('load-reports', () => { this.loadCampaigns(); this.loadReports(); this.loadClickLog(); });
        },
        methods: {
            // --- report builder: dimension pipeline (G47) ---
            dimLabel(key) {
                return (this.dimensionItems.find(d => d.key === key) || {}).label || key;
            },
            addDimension(key) {
                if (key && this.dimensions.length < 5 && !this.dimensions.includes(key)) {
                    this.dimensions.push(key);
                }
            },
            removeDimension(i) {
                this.dimensions.splice(i, 1);
            },
            moveDimension(i, dir) {
                const j = i + dir;
                if (j < 0 || j >= this.dimensions.length) return;
                const dims = this.dimensions.slice();
                [dims[i], dims[j]] = [dims[j], dims[i]];
                this.dimensions = dims;
            },
            // --- drill-down tree (rows are preloaded flattened; expand in place) ---
            rowKey(row) {
                return row.parent_key ? row.parent_key + '\u001f' + row.value : row.value;
            },
            hasChildren(row) {
                const key = this.rowKey(row);
                return this.reportRows.some(r => r.parent_key === key);
            },
            isExpanded(row) {
                return !!this.expanded[this.rowKey(row)];
            },
            toggleRow(row) {
                if (!this.hasChildren(row)) return;
                const key = this.rowKey(row);
                if (this.expanded[key]) {
                    const expanded = {};
                    Object.keys(this.expanded).forEach(k => {
                        if (k !== key && !k.startsWith(key + '\u001f')) expanded[k] = true;
                    });
                    this.expanded = expanded;
                } else {
                    this.expanded = { ...this.expanded, [key]: true };
                }
            },
            // In grouped mode only the first-level group row toggles; child rows
            // are shown/hidden with their group, so their own chevron is hidden.
            canToggle(item) {
                if (!this.hasChildren(item)) return false;
                return this.groupingView ? item.level === 1 : true;
            },
            onRowClick(item) {
                if (this.canToggle(item)) this.toggleRow(item);
            },
            collapseBelow(dimIdx) {
                const expanded = {};
                Object.keys(this.expanded).forEach(k => {
                    if (k.split('\u001f').length <= dimIdx) expanded[k] = true;
                });
                this.expanded = expanded;

                if (this.customMetricNames.includes(name) || this.reportHeadersBase.some(h => h.value === name)) {

                if (!/^[\d\sA-Za-z_+\-*/().]+$/.test(formula)) {

                this.dateRange = [from.toISOString().split('T')[0], to.toISOString().split('T')[0]];

                this.expanded = {};

            perfRowClass(item) {
                const cls = this.perfTintClass(item);

                return [cls, group].filter(Boolean).join(' ');

            perfTintClass(item) {
                const roi = parseFloat(item.roi);
                const profit = parseFloat(item.profit) || 0;
                let score = null;
                if (!isNaN(roi) && roi !== 0) score = roi;
                else if (profit !== 0) {
                    const cost = Math.abs(parseFloat(item.cost) || 0);
                    score = cost ? (profit / cost) * 100 : (profit > 0 ? 100 : -100);
                }
                if (score === null || score === 0) return '';
                if (score >= 50) return 'perf-win-3';
                if (score >= 10) return 'perf-win-2';
                if (score > 0) return 'perf-win-1';
                if (score <= -50) return 'perf-loss-3';
                if (score <= -10) return 'perf-loss-2';
                return 'perf-loss-1';
            },

                fetch('/backend/api/reports/funnel/' + this.funnelCampaignId, {credentials: 'include'})
                    .then(async res => {
                        if (!res.ok) {
                            const err = await res.json().catch(() => ({}));
                            throw new Error(err.detail || ('HTTP ' + res.status));
                        }
                        return res.json();
                    })
                    .then(data => {
                        this.funnelSteps = data.steps || [];
                        this.funnelLoaded = true;
                    })
                    .catch(err => {
                        this.$root.$emit('show-message', {
                            type: 'error',
                            text: 'Funnel report failed: ' + (err.message || err)
                        });
                    })
                    .finally(() => {
                        this.funnelLoading = false;
                    });
            },
            applyPreset(preset) {
                this.activePreset = preset.label;
                const to = new Date();
                let from = new Date();
                if (preset.label === 'Yesterday') {
                    from = new Date(to);
                    from.setDate(from.getDate() - 1);
                    to.setDate(to.getDate() - 1);
                } else if (preset.days > 0) {
                    from.setDate(from.getDate() - preset.days);
                }
                this.dateRange = [from.toISOString().split('T')[0], to.toISOString().split('T')[0]];
                this.runReport();
            },
            loadCampaigns() {
                fetch('/backend/api/campaigns/')
                    .then(res => res.ok ? res.json() : Promise.reject(new Error('HTTP ' + res.status)))
                    .then(data => { this.campaigns = Array.isArray(data) ? data : []; })
                    .catch(err => { this.campaigns = []; });
            },
            // --- admin: pause/resume an offer straight from a report row ---
            loadOffers() {
                fetch('/backend/api/offers/', {credentials: 'include'})
                    .then(res => res.ok ? res.json() : Promise.reject(new Error('HTTP ' + res.status)))
                    .then(data => {
                        const map = {};
                        (data || []).forEach(o => { map[String(o.id)] = o; });
                        this.offersById = map;
                    })
                    .catch(() => { this.offersById = {}; });
            },
            isNumericId(value) {
                return /^\d+$/.test(String(value == null ? '' : value));
            },
            offerPaused(value) {
                const o = this.offersById[String(value)];
                return !!(o && o.status === 'paused');
            },
            offerArchived(value) {
                const o = this.offersById[String(value)];
                return !!(o && o.archived);
            },
            async toggleOfferPause(item) {
                const id = String(item.value);
                const offer = this.offersById[id] || {};
                const pausing = !this.offerPaused(id);
                const name = offer.name || ('offer #' + id);
                const ok = await this.$refs.confirm.open(
                    (pausing ? 'Pause ' : 'Resume ') + name + '?',
                    pausing
                        ? 'Paused offers stop receiving click-outs immediately. Resume them here or in Offers.'
                        : 'This offer will start receiving click-outs again.',
                    pausing ? 'Pause' : 'Resume'
                );
                if (!ok) return;
                fetch('/backend/api/offers/' + encodeURIComponent(id) + '/status', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify({status: pausing ? 'paused' : 'active'}),
                })
                    .then(res => res.ok ? res.json() : Promise.reject(new Error('HTTP ' + res.status)))
                    .then(data => {
                        if (this.offersById[id]) this.offersById[id].status = data.status;
                        this.$root.$emit('show-message', {
                            type: 'success', text: 'Offer ' + (pausing ? 'paused' : 'resumed')});
                        this.runReport();
                    })
                    .catch(err => this.$root.$emit('show-message', {
                        type: 'error', text: 'Offer update failed: ' + sanitizeToastMessage(err.message)}));
            },
            runReport() {
                this.templateNote = '';
                if (this.dimensions.includes('ip') && !this.isSingleDayRange()) {
                    this.basisNote =
                        'IP report works on a single day — set the same start and end date (e.g. today) and run it again.';
                    return;
                }
                this.loading = true;
                this.expanded = {};
                const payload = {
                    dimensions: this.dimensions,
                    filters: {
                        date_from: this.dateRange[0],
                        date_to: this.dateRange[1],
                        campaigns: this.selectedCampaigns,
                    },
                    date_basis: this.dateBasis,
                    custom_metrics: this.allCustomColumns,
                    sort_by: this.sortBy,
                    sort_dir: this.sortDir,
                    limit: 1000,
                };
                fetch('/backend/api/dashboard/breakdown', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                })
                    .then(res => res.ok ? res.json() : Promise.reject(new Error('HTTP ' + res.status)))
                    .then(data => {
                        this.reportRows = data.rows || [];
                        this.reportTotals = data.totals || {};
                        this.basisNote = data.fallback_note || null;
                        if (data.date_basis && data.date_basis !== this.dateBasis) this.dateBasis = data.date_basis;
                        this.loading = false;
                    })
                    .catch(err => {
                        this.loading = false;
                        this.$root.$emit('show-message', {type: 'error', text: 'Report failed: ' + sanitizeToastMessage(err.message)});
                    });
            },
            downloadCsv(headers, rows, filename) {
                const csv = [headers, ...rows].map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\n');
                const blob = new Blob([csv], {type: 'text/csv'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                a.click();
                URL.revokeObjectURL(a.href);
            },
            exportReportCsv() {
                const SEP = '\u001f';
                const chain = row => {
                    const parts = row.parent_key ? row.parent_key.split(SEP) : [];
                    parts.push(row.value);
                    return parts;
                };
                const maxLevel = this.reportRows.reduce((m, r) => Math.max(m, r.level), 0);
                const head = [];
                for (let i = 0; i < maxLevel; i++) head.push(this.dimLabel(this.dimensions[i] || ''));
                this.downloadCsv(
                    [...head, ...this.reportHeaders.slice(1).map(h => h.text)],
                    this.reportRows.map(r => [...chain(r), ...this.reportHeaders.slice(1).map(h => r[h.value])]),
                    'report_' + this.dimensions.join('_') + '.csv'
                );
            },
            clickLogPayload() {
                const payload = {
                    date_from: this.dateRange[0],
                    date_to: this.dateRange[1],
                    campaigns: this.selectedCampaigns,
                    country: this.logFilters.country || null,
                    device_type: this.logFilters.device_type || null,
                    os: this.logFilters.os || null,
                    status: this.logFilters.status || null,
                    campaign_tags: (this.logFilters.campaign_tags || []).length
                        ? this.logFilters.campaign_tags : null,
                    search: this.logFilters.search || null,
                };
                Object.keys(payload).forEach(k => payload[k] === null && delete payload[k]);
                return payload;
            },
            searchClickLog() {
                this.logPage = 1;
                this.loadClickLog();
            },
            onLogPage(page) {
                if (page === this.logPage) return;
                this.logPage = page;
                this.loadClickLog();
            },
            loadClickLog() {
                this.logLoading = true;
                const payload = Object.assign(this.clickLogPayload(), {
                    limit: this.logPageSize,
                    offset: (this.logPage - 1) * this.logPageSize,
                });
                fetch('/backend/api/dashboard/click-log', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                })
                    .then(res => res.ok ? res.json() : Promise.reject(new Error('HTTP ' + res.status)))
                    .then(data => {
                        if (Array.isArray(data)) {
                            this.clickLog = data;
                            this.logTotal = data.length;
                        } else {
                            this.clickLog = data.items || [];
                            this.logTotal = data.total || 0;
                        }
                        this.logLoading = false;
                    })
                    .catch(err => {
                        this.logLoading = false;
                        this.$root.$emit('show-message', {type: 'error', text: 'Click log failed: ' + sanitizeToastMessage(err.message)});
                    });
            },
            async exportClickLogCsv() {
                try {
                    const res = await fetch('/backend/api/dashboard/click-log/export', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        credentials: 'include',
                        body: JSON.stringify(this.clickLogPayload())
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    this.saveBlob(await res.blob(), 'click_log.csv');
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error', text: 'Click log export failed: ' + sanitizeToastMessage(err.message)});
                }
            },
            saveBlob(blob, filename) {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                a.click();
                URL.revokeObjectURL(a.href);
                this.$root.$emit('show-message', {type: 'success', text: 'CSV exported'});
            },
            // Warehouse export: one dataset -> plain .csv (gzip optional);
            // two or more -> a ZIP carrying every selected CSV plus the manifest.
            downloadWarehouseExport() {
                const selected = this.warehouseDatasets || [];
                if (!selected.length) {
                    this.$root.$emit('show-message', {type: 'error', text: 'Select at least one dataset'});
                    return;
                }
                const params = new URLSearchParams();
                params.set('date_from', this.warehouseDateRange[0]);
                params.set('date_to', this.warehouseDateRange[1]);
                if (this.warehouseBom) params.set('bom', '1');
                let url, filename;
                if (selected.length === 1) {
                    url = '/backend/api/dashboard/exports/' + selected[0];
                    filename = selected[0] + '_export.csv' + (this.warehouseGzip ? '.gz' : '');
                    if (this.warehouseGzip) params.set('gzip', '1');
                } else {
                    url = '/backend/api/dashboard/exports/zip';
                    params.set('datasets', selected.join(','));
                    filename = 'warehouse_export.zip';
                }
                this.warehouseLoading = true;
                fetch(url + '?' + params.toString(), {credentials: 'include'})
                    .then(async res => {
                        if (!res.ok) {
                            let detail = 'HTTP ' + res.status;
                            try {
                                const err = await res.json();
                                if (err && err.detail) detail = err.detail;
                            } catch (e) {}
                            throw new Error(detail);
                        }
                        return res.blob();
                    })
                    .then(blob => {
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = filename;
                        a.click();
                        URL.revokeObjectURL(a.href);
                        this.$root.$emit('show-message', {type: 'success', text: 'Warehouse export downloaded'});
                    })
                    .catch(err => this.$root.$emit('show-message',
                        {type: 'error', text: 'Export failed: ' + sanitizeToastMessage(err.message)}))
                    .finally(() => { this.warehouseLoading = false; });
            },
            reloadReports() {
                this.convSelected = [];
                this.loadReports();
                this.$root.$emit("show-message", {type: "success", text: 'Conversions reloaded successfully!'});
            },
            loadCustomStatuses() {
                fetch('/backend/api/settings/', {credentials: 'include'})
                    .then(res => res.ok ? res.json() : Promise.reject(new Error('HTTP ' + res.status)))
                    .then(data => {
                        const customs = (data.settings && data.settings.custom_statuses) || [];
                        this.customStatuses = customs
                            .map(s => this.slugifyStatus(s && s.name))
                            .filter(Boolean);
                    })
                    .catch(() => { this.customStatuses = []; });
            },
            slugifyStatus(name) {
                return String(name || '').trim().toLowerCase()
                    .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
            },
            statusChipClass(status) {
                const map = {sale: 'status-chip--success', upsale: 'status-chip--success', lead: 'status-chip--info', rejected: 'status-chip--danger', hold: 'status-chip--warning', trash: 'status-chip--neutral'};
                if (map[status]) return map[status];
                // custom statuses cycle through the existing chip modifiers
                const idx = this.customStatuses.indexOf(status);
                if (idx > -1) {
                    const palette = ['status-chip--info', 'status-chip--success',
                        'status-chip--warning', 'status-chip--danger', 'status-chip--neutral'];
                    return palette[idx % palette.length];
                }
                return 'status-chip--neutral';
            },
            approvalChipClass(approval) {
                const map = {approved: 'approval-chip--approved', declined: 'approval-chip--declined',
                    pending: 'approval-chip--pending', other: 'approval-chip--other'};
                return map[approval] || 'approval-chip--other';
            },
            openImport() {
                this.importText = '';
                this.importResults = [];
                this.importDialog = true;
            },
            async runImport() {
                if (!this.importText.trim()) {
                    this.$root.$emit("show-message", {type: "error", text: "Paste at least one conversion line"});
                    return;
                }
                this.importing = true;
                try {
                    const res = await fetch('/backend/api/reports/import', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        credentials: 'include',
                        body: JSON.stringify({lines: this.importText})
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'Import failed');
                    this.importResults = data.results || [];
                    const failed = (data.results || []).filter(r => !r.ok).length;
                    this.$root.$emit("show-message", {
                        type: failed ? "warning" : "success",
                        text: `Imported ${data.imported || 0} conversion(s)` + (failed ? `, ${failed} failed` : '')
                    });
                    this.loadReports();
                } catch (err) {
                    this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                } finally {
                    this.importing = false;
                }
            },
            conversionListParams() {
                const params = new URLSearchParams();
                if (this.convFilters.status) params.set('status', this.convFilters.status);
                if (this.convFilters.approval) params.set('approval', this.convFilters.approval);
                if (this.convFilters.search) params.set('search', this.convFilters.search);
                if (this.convFilters.url) params.set('url', this.convFilters.url);
                params.set('date_from', this.dateRange[0]);
                params.set('date_to', this.dateRange[1]);
                params.set('date_basis', this.convDateBasis);
                return params;
            },
            searchConversions() {
                this.convPage = 1;
                this.loadReports();
            },
            onConvPage(page) {
                if (page === this.convPage) return;
                this.convPage = page;
                this.loadReports();
            },
            loadReports() {
                this.convLoading = true;
                this.loadConversionsSummary();
                const params = this.conversionListParams();
                params.set('limit', this.convPageSize);
                params.set('offset', (this.convPage - 1) * this.convPageSize);
                fetch('/backend/api/reports/?' + params.toString())
                    .then(response => response.ok ? response.json() : Promise.reject(new Error('HTTP ' + response.status)))
                    .then(data => {
                        if (Array.isArray(data)) {
                            this.conversions = data;
                            this.convTotal = data.length;
                        } else {
                            this.conversions = data.items || [];
                            this.convTotal = data.total || 0;
                        }
                        this.convLoading = false;
                    })
                    .catch(err => {
                        this.convLoading = false;
                        console.error("Failed to load conversions:", err)
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                    });
            },
            loadConversionsSummary() {
                fetch('/backend/api/reports/summary?' + this.conversionListParams().toString(),
                      {credentials: 'include'})
                    .then(res => res.ok ? res.json() : Promise.reject(new Error('HTTP ' + res.status)))
                    .then(data => { this.convSummary = data; })
                    .catch(() => { this.convSummary = null; });
            },
            async exportCsv() {
                try {
                    const res = await fetch('/backend/api/reports/export?' + this.conversionListParams().toString(),
                        {credentials: 'include'});
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    this.saveBlob(await res.blob(), 'conversions.csv');
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error', text: 'Conversions export failed: ' + sanitizeToastMessage(err.message)});
                }
            },
            openEdit(item) {
                this.editItem = Object.assign({}, item);
                if (!this.editItem.approval) this.editItem.approval = 'pending';
                this.editDialog = true;
            },
            async saveConversion() {
                this.editSaving = true;
                const payload = {
                    status: this.editItem.status,
                    approval: this.editItem.approval || 'pending',
                    payout: this.editItem.payout === '' || this.editItem.payout == null ? null : parseFloat(this.editItem.payout),
                    revenue: this.editItem.revenue === '' || this.editItem.revenue == null ? null : parseFloat(this.editItem.revenue),
                    external_id: this.editItem.external_id || null,
                    transaction_id: this.editItem.transaction_id || null,
                };
                try {
                    const res = await fetch('/backend/api/reports/' + this.editItem.id, {
                        method: 'PATCH',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'Update failed');
                    this.editDialog = false;
                    this.$root.$emit("show-message", {type: "success", text: 'Conversion updated'});
                    this.loadReports();
                } catch (err) {
                    this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                } finally {
                    this.editSaving = false;
                }
            },
            async deleteConversion(item) {
                const ok = await this.$refs.confirm.open(
                    'Delete conversion?',
                    `Click ${item.click_id} will be permanently removed. This cannot be undone.`,
                    'Delete'
                );
                if (!ok) return;
                try {
                    const res = await fetch('/backend/api/reports/' + item.id, {method: 'DELETE'});
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'Delete failed');
                    this.$root.$emit("show-message", {type: "success", text: 'Conversion deleted'});
                    this.loadReports();
                } catch (err) {
                    this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                }
            },
            // --- Wave 19B: bulk status / approval on selected conversions ---
            selectedConvIds() {
                return (this.convSelected || []).map(c => c.id);
            },
            async applyBulkStatus() {
                const ids = this.selectedConvIds();
                if (!ids.length || !this.bulkStatusValue) return;
                this.bulkLoading = true;
                try {
                    const res = await fetch('/backend/api/reports/bulk-status', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        credentials: 'include',
                        body: JSON.stringify({ids: ids, status: this.bulkStatusValue}),
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'Bulk update failed');
                    this.$root.$emit("show-message", {type: "success",
                        text: 'Status updated on ' + data.updated + ' conversion(s)'});
                    this.convSelected = [];
                    this.bulkStatusValue = null;
                    this.loadReports();
                } catch (err) {
                    this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                } finally {
                    this.bulkLoading = false;
                }
            },
            async applyBulkApproval() {
                const ids = this.selectedConvIds();
                if (!ids.length || !this.bulkApprovalValue) return;
                this.bulkLoading = true;
                try {
                    const res = await fetch('/backend/api/reports/bulk-approval', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        credentials: 'include',
                        body: JSON.stringify({ids: ids, approval: this.bulkApprovalValue}),
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'Bulk update failed');
                    this.$root.$emit("show-message", {type: "success",
                        text: 'Approval updated on ' + data.updated + ' conversion(s)'});
                    this.convSelected = [];
                    this.bulkApprovalValue = '';
                    this.loadReports();
                } catch (err) {
                    this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                } finally {
                    this.bulkLoading = false;
                }
            },
            // --- Wave 19B: manual add conversion ---
            openAddConversion() {
                this.addError = '';
                this.addForm = {
                    status: 'sale', approval: 'pending', payout: '', revenue: '',
                    click_id: '', external_id: '', transaction_id: '',
                    sub_id_1: '', sub_id_2: '', sub_id_3: '', sub_id_4: '', sub_id_5: '',
                    sub_id_6: '', sub_id_7: '', sub_id_8: '', sub_id_9: '', sub_id_10: '',
                };
                this.addDialog = true;
            },
            async submitAddConversion() {
                const f = this.addForm;
                if (!f.click_id && !f.external_id && !f.transaction_id) {
                    this.addError = 'Provide a click id, external id or transaction id';
                    return;
                }
                this.addSaving = true;
                this.addError = '';
                const sub_ids = {};
                for (let n = 1; n <= 10; n++) {
                    if (f['sub_id_' + n]) sub_ids['sub_id_' + n] = f['sub_id_' + n];
                }
                const payload = {
                    status: f.status || 'sale',
                    approval: f.approval || 'pending',
                    payout: f.payout === '' ? null : parseFloat(f.payout),
                    revenue: f.revenue === '' ? null : parseFloat(f.revenue),
                    click_id: f.click_id || null,
                    external_id: f.external_id || null,
                    transaction_id: f.transaction_id || null,
                    sub_ids: sub_ids,
                };
                try {
                    const res = await fetch('/backend/api/reports/conversion', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        credentials: 'include',
                        body: JSON.stringify(payload),
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'Add failed');
                    this.addDialog = false;
                    this.$root.$emit("show-message", {type: "success",
                        text: data.created ? 'Conversion added' : 'Conversion updated (existing id)'});
                    this.loadReports();
                } catch (err) {
                    this.addError = sanitizeToastMessage(err.message);
                } finally {
                    this.addSaving = false;
                }
            },
        },
    });
</script>
