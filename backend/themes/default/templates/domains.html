{% raw %}
<script type="text/x-template" id="domains-template">
    <v-container fluid>
        <v-row align="center" class="mb-4">
            <v-col>
                <div class="page-title">Domains</div>
                <div class="page-subtitle">Manage your domains</div>
            </v-col>
            <v-col class="d-flex justify-end" cols="auto">
                <v-btn color="primary" elevation="0" class="mr-2" @click="checkDomains">
                    <v-icon small class="mr-1">mdi-check-circle-outline</v-icon>
                    Check domains statuses
                </v-btn>
                <v-btn color="primary" elevation="0" @click="openCreate">
                    <v-icon small class="mr-1">mdi-plus</v-icon>
                    Add domain
                </v-btn>
            </v-col>
        </v-row>

        <v-alert type="info" text dense class="mb-4">
            <strong>Your tracking domain is the address the tracker answers on —
            clicks, landing pages and postbacks.</strong>
            Add it here first, then point it at us in your DNS provider: a
            <code>CNAME</code> for the tracking domain (for example
            <code>track.yoursite.com</code>) to your tracker host<span v-if="serverIp">,
            or an <code>A</code> record to <code>{{ serverIp }}</code></span>. Once it
            resolves here, press the DNS button on the row to confirm, then
            <em>Update SSL</em> to issue its certificate automatically.
            <br>
            Your own website is not affected — it keeps running on its own domain and
            nothing is moved or copied. The tracker only takes over the tracking
            address you choose; visitors who land on your real site are served by your
            own server as before.
        </v-alert>


        <v-dialog v-model="dialog" persistent>
            <v-card class="dialog-md dialog-flex">
                <v-card-title>
                    <span class="text-h6">{{ isEdit ? 'Edit domain' : 'Add domain' }}</span>
                </v-card-title>

                <v-card-text>

                    <v-text-field
                            label="Domain (e.g. example.com)"
                            v-model="form.domain"
                            outlined
                            dense
                    ></v-text-field>

                    <v-switch
                            label="Redirect to HTTPS"
                            v-model="form.redirect_https"
                            inset
                            dense
                    ></v-switch>

                    <v-select
                            label="404 handling"
                            :items="[
                                { text: 'Handle 404 errors', value: 'handle' },
                                { text: 'Error', value: 'error' }
                              ]"
                            v-model="form.handle_404"
                            outlined
                            dense
                    ></v-select>

                    <v-select
                            label="Default campaign"
                            :items="campaigns"
                            item-text="name"
                            item-value="id"
                            v-model="form.default_campaign_id"
                            outlined
                            dense
                    ></v-select>

                    <v-text-field
                            label="Group name (optional)"
                            v-model="form.group_name"
                            outlined
                            dense
                    ></v-text-field>

                </v-card-text>

                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="close">Cancel</v-btn>
                    <v-btn color="primary" elevation="0" @click="save">Save</v-btn>
                </v-card-actions>

            </v-card>
        </v-dialog>


        <v-row dense class="mt-4">
            <v-col>
                <v-card>
                    <v-data-table v-col-resize:domains="headers"
                            :headers="headers"
                            :items="domains"
                            :loading="loadingDomains"
                            dense
                            :items-per-page="10"
                            :footer-props="{ 'items-per-page-options': [10, 25, 50] }"
                    >
                        <template v-slot:item.domain="{ item }">
                            <a v-if="item.domain" :href="'https://'+item.domain" target="_blank">
                                https://{{ item.domain }}
                            </a>
                        </template>
                        <template v-slot:item.redirect_https="{ item }">
                            <span class="status-chip" :class="item.redirect_https ? 'status-chip--success' : 'status-chip--neutral'">
                                <v-icon x-small class="mr-1">{{ item.redirect_https ? 'mdi-check' : 'mdi-minus' }}</v-icon>{{ item.redirect_https ? 'On' : 'Off' }}
                            </span>
                        </template>
                        <template v-slot:item.handle_404="{ item }">
                            <span class="status-chip" :class="item.handle_404 === 'handle' ? 'status-chip--info' : 'status-chip--neutral'">{{ item.handle_404 }}</span>
                        </template>
                        <template v-slot:item.status="{ item }">
                            <span class="status-chip" :class="statusChipClass(item.status)">{{ item.status }}</span>
                        </template>
                        <template v-slot:item.ssl_status="{ item }">
                            <span class="status-chip" :class="statusChipClass(item.ssl_status)">{{ item.ssl_status }}</span>
                        </template>
                        <template v-slot:item.ssl_expiry="{ item }">
                            <span v-if="sslExpiry[item.id]" class="status-chip"
                                  :class="sslChipClass(sslExpiry[item.id])"
                                  :title="sslExpiry[item.id].days_to_expiry == null ? 'No certificate found on the server' : sslExpiry[item.id].days_to_expiry + ' days until expiry'">
                                {{ sslExpiryText(sslExpiry[item.id]) }}
                            </span>
                            <span v-else class="grey--text">—</span>
                        </template>
                        <template v-slot:item.dns="{ item }">
                            <div class="d-flex align-center">
                                <span v-if="dnsResults[item.id]" class="status-chip"
                                      :class="dnsResults[item.id].points_to_server ? 'status-chip--success' : (dnsResults[item.id].resolves ? 'status-chip--warning' : 'status-chip--danger')"
                                      :title="dnsResults[item.id].addresses.join(', ')">
                                    {{ dnsResults[item.id].points_to_server ? 'Points here' : (dnsResults[item.id].resolves ? 'Resolves elsewhere' : 'No DNS') }}
                                </span>
                                <v-btn icon small @click="checkDns(item)" :loading="dnsLoading === item.id">
                                    <v-icon small>mdi-dns</v-icon>
                                </v-btn>
                            </div>
                        </template>
                        <template v-slot:item.default_campaign_id="{ item }">
                            {{ campaignName(item.default_campaign_id) }}
                        </template>
                        <template v-slot:item.created_at="{ item }">
                            {{ $formatDate(item.created_at) }}
                        </template>
                        <template v-slot:item.updated_at="{ item }">
                            {{ $formatDate(item.updated_at) }}
                        </template>
                        <template v-slot:item.actions="{ item }">
                            <v-tooltip bottom>
                                <template v-slot:activator="{ on, attrs }">
                                    <v-btn icon small color="primary" v-bind="attrs" v-on="on" @click="openEdit(item)">
                                        <v-icon small>mdi-pencil-outline</v-icon>
                                    </v-btn>
                                </template>
                                <span>Edit</span>
                            </v-tooltip>
                            <v-tooltip bottom>
                                <template v-slot:activator="{ on, attrs }">
                                    <v-btn icon small color="info" v-bind="attrs" v-on="on" @click="setupSSL(item)">
                                        <v-icon small>mdi-certificate-outline</v-icon>
                                    </v-btn>
                                </template>
                                <span>Update SSL for 90 days</span>
                            </v-tooltip>
                            <v-tooltip bottom>
                                <template v-slot:activator="{ on, attrs }">
                                    <v-btn icon small color="red" v-bind="attrs" v-on="on" @click="deleteDomain(item)">
                                        <v-icon small>mdi-trash-can-outline</v-icon>
                                    </v-btn>
                                </template>
                                <span>Delete</span>
                            </v-tooltip>
                        </template>

                        <template v-slot:no-data>
                            <div class="empty-state">
                                <v-icon>mdi-inbox-outline</v-icon>
                                <div class="mt-2">No data yet</div>
                            </div>
                        </template>
                    </v-data-table>
                </v-card>
            </v-col>
        </v-row>

        <v-row align="center" class="mb-2 mt-6">
            <v-col>
                <div class="page-title">Domain groups</div>
                <div class="page-subtitle">Group domains and control which users may bind them to campaigns</div>
            </v-col>
            <v-col class="d-flex justify-end" cols="auto">
                <v-btn color="primary" elevation="0" @click="openGroupCreate">
                    <v-icon small class="mr-1">mdi-plus</v-icon>
                    Add group
                </v-btn>
            </v-col>
        </v-row>

        <v-row dense>
            <v-col>
                <v-card id="domain-groups-card">
                    <v-data-table
                            :headers="groupHeaders"
                            :items="groups"
                            :loading="groupsLoading"
                            dense
                            :items-per-page="10"
                            :footer-props="{ 'items-per-page-options': [10, 25, 50] }"
                    >
                        <template v-slot:item.domains="{ item }">
                            <span v-if="!(item.domain_ids || []).length" class="grey--text">-</span>
                            <v-chip v-for="did in (item.domain_ids || [])" :key="did" x-small outlined class="mr-1 tag-chip">
                                {{ domainName(did) }}
                            </v-chip>
                        </template>
                        <template v-slot:item.users="{ item }">
                            <span v-if="!(item.users || []).length" class="grey--text">All users (no restrictions)</span>
                            <v-chip v-for="u in (item.users || [])" :key="u.id" x-small outlined class="mr-1 tag-chip">
                                {{ u.username }}
                            </v-chip>
                        </template>
                        <template v-slot:item.actions="{ item }">
                            <v-tooltip bottom>
                                <template v-slot:activator="{ on, attrs }">
                                    <v-btn icon small color="primary" v-bind="attrs" v-on="on" @click="openGroupManage(item)">
                                        <v-icon small>mdi-playlist-edit</v-icon>
                                    </v-btn>
                                </template>
                                <span>Manage domains &amp; users</span>
                            </v-tooltip>
                            <v-tooltip bottom>
                                <template v-slot:activator="{ on, attrs }">
                                    <v-btn icon small color="red" v-bind="attrs" v-on="on" @click="deleteGroup(item)">
                                        <v-icon small>mdi-trash-can-outline</v-icon>
                                    </v-btn>
                                </template>
                                <span>Delete group</span>
                            </v-tooltip>
                        </template>
                        <template v-slot:no-data>
                            <div class="empty-state">
                                <v-icon>mdi-inbox-outline</v-icon>
                                <div class="mt-2">No domain groups yet</div>
                            </div>
                        </template>
                    </v-data-table>
                </v-card>
            </v-col>
        </v-row>

        <v-dialog v-model="groupDialog" persistent max-width="440px">
            <v-card>
                <v-card-title class="text-h6">{{ groupForm.id ? 'Rename group' : 'Add group' }}</v-card-title>
                <v-card-text>
                    <v-text-field
                            label="Group name"
                            v-model="groupForm.name"
                            outlined
                            dense
                            @keyup.enter="saveGroup"
                    ></v-text-field>
                </v-card-text>
                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="groupDialog = false">Cancel</v-btn>
                    <v-btn color="primary" elevation="0" :loading="groupSaving" @click="saveGroup">Save</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>

        <v-dialog v-model="groupManageDialog" persistent max-width="560px">
            <v-card>
                <v-card-title class="text-h6">Manage "{{ manageForm.group ? manageForm.group.name : '' }}"</v-card-title>
                <v-card-text>
                    <v-select
                            label="Domains in this group"
                            :items="domains"
                            item-text="domain"
                            item-value="id"
                            v-model="manageForm.domain_ids"
                            multiple
                            chips
                            small-chips
                            deletable-chips
                            outlined
                            dense
                            hint="Grouped domains are hidden from non-granted users when binding to campaigns"
                            persistent-hint
                    ></v-select>
                    <v-select
                            label="Users granted access"
                            :items="allUsers"
                            item-text="username"
                            item-value="id"
                            v-model="manageForm.user_ids"
                            multiple
                            chips
                            small-chips
                            deletable-chips
                            outlined
                            dense
                            hint="Empty = every user can use these domains; admins always can"
                            persistent-hint
                    ></v-select>
                </v-card-text>
                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="groupManageDialog = false">Cancel</v-btn>
                    <v-btn color="primary" elevation="0" :loading="groupSaving" @click="saveGroupManage">Save</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>

        <confirm-dialog-component ref="confirm" />
    </v-container>
</script>

<script type="application/javascript">
    Vue.component('domains-component', {
        template: '#domains-template',
        data() {
            return {
                dialog: false,
                isEdit: false,
                form: {
                    id: null,
                    domain: '',
                    redirect_https: true,
                    handle_404: 'error',
                    default_campaign_id: '',
                    group_name: '',
                    status: 'pending'
                },
                newDomain: '',
                loadingDomains: false,
                domains: [],
                campaigns: [],
                serverIp: '',
                dnsResults: {},
                dnsLoading: null,
                sslExpiry: {},
                groups: [],
                groupsLoading: false,
                groupDialog: false,
                groupSaving: false,
                groupForm: {id: null, name: ''},
                groupManageDialog: false,
                manageForm: {group: null, domain_ids: [], user_ids: []},
                allUsers: [],
                groupHeaders: [
                    {text: 'ID', value: 'id'},
                    {text: 'Name', value: 'name'},
                    {text: 'Domains', value: 'domains', sortable: false},
                    {text: 'Granted users', value: 'users', sortable: false},
                    {text: 'Actions', value: 'actions', sortable: false},
                ],
                headers: [
                    {text: 'ID', value: 'id'},
                    {text: 'Domain', value: 'domain'},
                    {text: 'Redirect HTTPS', value: 'redirect_https'},
                    {text: 'Handle 404', value: 'handle_404'},
                    {text: 'Default Campaign', value: 'default_campaign_id'},
                    {text: 'Group Name', value: 'group_name'},
                    {text: 'SSL Status', value: 'ssl_status'},
                    {text: 'SSL Expiry', value: 'ssl_expiry', sortable: false},
                    {text: 'DNS', value: 'dns', sortable: false},
                    {text: 'Status', value: 'status'},
                    {text: 'Created At', value: 'created_at'},
                    {text: 'Updated At', value: 'updated_at'},
                    {text: 'Actions', value: 'actions'},
                ],
            };
        },
        mounted() {
            this.$vuetify.theme.dark = (document.documentElement.dataset.theme === 'dark');
            this.loadDomains();
            this.loadServerInfo();
            this.loadGroups();
            this.loadSslExpiry();
            this.$root.$on('load-domains', this.loadDomains);
        },
        methods: {
            domainName(id) {
                const d = (this.domains || []).find(x => String(x.id) === String(id));
                return d ? d.domain : ('#' + id);
            },
            async loadGroups() {
                this.groupsLoading = true;
                try {
                    const r = await fetch('/backend/api/domains/groups', {credentials: 'include'});
                    if (r.ok) this.groups = await r.json();
                } catch (e) { /* keep existing list */ }
                finally { this.groupsLoading = false; }
            },
            async loadUsers() {
                if (this.allUsers.length) return;
                try {
                    const r = await fetch('/backend/api/users/', {credentials: 'include'});
                    if (r.ok) this.allUsers = await r.json();
                } catch (e) { /* non-admin viewers just get an empty picker */ }
            },
            openGroupCreate() {
                this.groupForm = {id: null, name: ''};
                this.groupDialog = true;
            },
            async saveGroup() {
                const name = (this.groupForm.name || '').trim();
                if (!name) {
                    this.$root.$emit('show-message', {type: 'error', text: 'Group name is required.'});
                    return;
                }
                this.groupSaving = true;
                try {
                    const url = this.groupForm.id
                        ? `/backend/api/domains/groups/${this.groupForm.id}`
                        : '/backend/api/domains/groups';
                    const r = await fetch(url, {
                        method: this.groupForm.id ? 'PUT' : 'POST',
                        credentials: 'include',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({name})
                    });
                    const data = await r.json();
                    if (!r.ok) throw new Error(data.detail || ('HTTP ' + r.status));
                    this.groupDialog = false;
                    this.$root.$emit('show-message', {type: 'success', text: 'Group saved'});
                    this.loadGroups();
                } catch (e) {
                    this.$root.$emit('show-message', {type: 'error', text: sanitizeToastMessage(e.message)});
                } finally {
                    this.groupSaving = false;
                }
            },
            async openGroupManage(group) {
                await Promise.all([this.loadUsers()]);
                this.manageForm = {
                    group,
                    domain_ids: (group.domain_ids || []).slice(),
                    user_ids: (group.users || []).map(u => u.id)
                };
                this.groupManageDialog = true;
            },
            async saveGroupManage() {
                const group = this.manageForm.group;
                if (!group) return;
                this.groupSaving = true;
                try {
                    const beforeDomains = new Set(group.domain_ids || []);
                    const afterDomains = new Set(this.manageForm.domain_ids || []);
                    const toAdd = [...afterDomains].filter(x => !beforeDomains.has(x));
                    const toRemove = [...beforeDomains].filter(x => !afterDomains.has(x));
                    const beforeUsers = new Set((group.users || []).map(u => u.id));
                    const afterUsers = new Set(this.manageForm.user_ids || []);
                    const toGrant = [...afterUsers].filter(x => !beforeUsers.has(x));
                    const toRevoke = [...beforeUsers].filter(x => !afterUsers.has(x));

                    if (toAdd.length) {
                        const r = await fetch(`/backend/api/domains/groups/${group.id}/domains`, {
                            method: 'POST', credentials: 'include',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ids: toAdd})});
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                    }
                    for (const did of toRemove) {
                        const r = await fetch(`/backend/api/domains/groups/${group.id}/domains/${did}`, {
                            method: 'DELETE', credentials: 'include'});
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                    }
                    if (toGrant.length) {
                        const r = await fetch(`/backend/api/domains/groups/${group.id}/users`, {
                            method: 'POST', credentials: 'include',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ids: toGrant})});
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                    }
                    for (const uid of toRevoke) {
                        const r = await fetch(`/backend/api/domains/groups/${group.id}/users/${uid}`, {
                            method: 'DELETE', credentials: 'include'});
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                    }
                    this.groupManageDialog = false;
                    this.$root.$emit('show-message', {type: 'success', text: 'Group updated'});
                    this.loadGroups();
                } catch (e) {
                    this.$root.$emit('show-message', {type: 'error', text: 'Group update failed: ' + sanitizeToastMessage(e.message)});
                } finally {
                    this.groupSaving = false;
                }
            },
            async deleteGroup(group) {
                const ok = await this.$refs.confirm.open(
                    'Delete group',
                    `Delete group "${group.name}"? Its domains become unrestricted again.`,
                    'Delete');
                if (!ok) return;
                try {
                    const r = await fetch(`/backend/api/domains/groups/${group.id}`, {
                        method: 'DELETE', credentials: 'include'});
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    this.$root.$emit('show-message', {type: 'success', text: 'Group deleted'});
                    this.loadGroups();
                } catch (e) {
                    this.$root.$emit('show-message', {type: 'error', text: 'Group delete failed: ' + sanitizeToastMessage(e.message)});
                }
            },
            async loadServerInfo() {
                try {
                    const r = await fetch('/backend/api/domains/server-info', {credentials: 'include'});
                    if (r.ok) this.serverIp = (await r.json()).server_ip || '';
                } catch (e) { /* banner stays hidden */ }
            },
            async checkDns(item) {
                this.dnsLoading = item.id;
                try {
                    const r = await fetch('/backend/api/domains/dns-status?domain=' + encodeURIComponent(item.domain), {credentials: 'include'});
                    if (r.ok) this.$set(this.dnsResults, item.id, await r.json());
                    else this.$set(this.dnsResults, item.id, {resolves: false, addresses: [], points_to_server: false});
                } catch (e) {
                    this.$set(this.dnsResults, item.id, {resolves: false, addresses: [], points_to_server: false});
                } finally {
                    this.dnsLoading = null;
                }
            },
            statusChipClass(status) {
                switch (status) {
                    case 'success':
                        return 'status-chip--success';
                    case 'pending':
                    case 'not_started':
                        return 'status-chip--warning';
                    case 'error':
                        return 'status-chip--danger';
                    default:
                        return 'status-chip--neutral';
                }
            },
            sslChipClass(info) {
                switch (info.status) {
                    case 'ok':
                        return 'status-chip--success';
                    case 'warning':
                        return 'status-chip--warning';
                    case 'critical':
                    case 'expired':
                        return 'status-chip--danger';
                    default:
                        return 'status-chip--neutral';
                }
            },
            sslExpiryText(info) {
                if (info.days_to_expiry == null) return 'No cert';
                if (info.days_to_expiry < 0) return 'Expired';
                return info.days_to_expiry + 'd left';
            },
            async loadSslExpiry() {
                try {
                    const r = await fetch('/backend/api/domains/ssl-expiry', {credentials: 'include'});
                    if (!r.ok) return;
                    const map = {};
                    for (const row of (await r.json()).domains || []) map[row.id] = row;
                    this.sslExpiry = map;
                } catch (e) { /* chips stay hidden */ }
            },
            async setupSSL(item) {
                const ok = await this.$refs.confirm.open('Update SSL', `Update the SSL certificate for "${item.domain}"? Keep this page open — SSL issuance takes up to 10 minutes per domain.`, 'Update SSL');
                if (!ok) {
                    return;
                }

                this.$root.$emit('show-overlay', 'Issuing SSL certificate — this can take up to 10 minutes per domain. Keep this page open.');

                fetch(`/domain_update_ssl?domain_id=`+item.id, {
                    method: 'GET',
                    credentials: 'include'
                })
                    .then(async (response) => {
                        const text = await response.text();
                        if (!response.ok) {
                            let message = 'Unknown error setting up SSL';
                            try {
                                const errorData = JSON.parse(text);
                                if (Array.isArray(errorData.detail)) {
                                    message = errorData.detail.map(d => d.msg).join('; ');
                                } else if (typeof errorData.detail === 'string') {
                                    message = errorData.detail;
                                }
                            } catch (e) {
                                message = text;
                            }
                            throw new Error(message);
                        }

                        await this.loadDomains();
                        this.$root.$emit('hide-overlay');

                        this.$root.$emit('show-message', {
                            type: 'success',
                            text: 'SSL setup successfully!'
                        });
                    })
                    .catch((error) => {
                        console.error('Error setting up SSL:', error);
                        this.$root.$emit('hide-overlay');
                        this.$root.$emit('show-message', {
                            type: 'error',
                            text: sanitizeToastMessage(error.message)
                        });
                    });
            },
            campaignName(id) {
                const campaign = this.campaigns.find(c => String(c.id) === String(id));
                return campaign ? campaign.name : '-';
            },
            async checkDomains() {
                try {
                    this.$root.$emit('show-overlay', 'Checking domains statuses... Can take up to 20 seconds per domain...');
                    await fetch("/backend/api/domains/check-domains");
                    await this.loadDomains();
                    this.$root.$emit('hide-overlay');
                    this.$root.$emit('show-message', {
                        type: 'success',
                        text: 'Domains statuses checked successfully!'
                    });
                } catch (error) {
                    console.error('Error checking domains statuses:', error);
                    this.$root.$emit('hide-overlay');
                    this.$root.$emit('show-message', {
                        type: 'error',
                        text: sanitizeToastMessage(error.message)
                    });
                }
            },
            async loadCampaigns() {
                try {
                    const response = await fetch('/backend/api/campaigns/', {
                        method: 'GET',
                        credentials: 'include'
                    });
                    const text = await response.text();
                    if (!response.ok) {
                        let message = 'Error loading campaigns';
                        try {
                            const errorData = JSON.parse(text);
                            message = errorData.detail || message;
                        } catch (e) {
                            message = text;
                        }
                        throw new Error(message);
                    }
                    this.campaigns = JSON.parse(text);
                    this.campaigns.unshift({id: '', name: '— No campaign —'});
                } catch (error) {
                    this.$root.$emit('show-message', {
                        type: 'error',
                        text: sanitizeToastMessage(error.message)
                    });
                }
            },
            async openCreate() {
                await this.loadCampaigns();
                this.isEdit = false;
                this.form = {
                    id: null,
                    domain: '',
                    redirect_https: true,
                    handle_404: 'error',
                    default_campaign_id: '',
                    group_name: '',
                    status: 'pending'
                };
                this.dialog = true;
            },

            async openEdit(item) {
                await this.loadCampaigns();
                this.isEdit = true;
                this.form = {
                    id: item.id,
                    domain: item.domain,
                    redirect_https: item.redirect_https,
                    handle_404: item.handle_404,
                    default_campaign_id: item.default_campaign_id,
                    group_name: item.group_name
                };
                this.dialog = true;
            },

            close() {
                this.dialog = false;
            },

            save() {
                if (!this.form.domain) {
                    this.$root.$emit('show-message', {type: 'error', text: 'Domain is required.'});
                    return;
                }

                const data = {
                    domain: this.form.domain,
                    redirect_https: this.form.redirect_https,
                    handle_404: this.form.handle_404,
                    default_campaign_id: this.form.default_campaign_id || null,
                    group_name: this.form.group_name || ''
                };

                const url = this.isEdit
                    ? `/backend/api/domains/${this.form.id}`
                    : `/backend/api/domains/`;

                const method = this.isEdit ? 'PUT' : 'POST';

                fetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data),
                    credentials: 'include'
                })
                    .then(async (response) => {
                        const text = await response.text();
                        if (!response.ok) {
                            let message = 'Unknown error';
                            try {
                                const errorData = JSON.parse(text);
                                if (Array.isArray(errorData.detail)) {
                                    message = errorData.detail.map(d => d.msg).join('; ');
                                } else if (typeof errorData.detail === 'string') {
                                    message = errorData.detail;
                                }
                            } catch (e) {
                                message = text;
                            }
                            throw new Error(message);
                        }

                        this.dialog = false;
                        this.$root.$emit('show-message', {
                            type: 'success',
                            text: this.isEdit ? 'Domain updated successfully!' : 'Domain created successfully!'
                        });
                        this.loadDomains();
                    })
                    .catch((error) => {
                        console.error('Error saving domain:', error);
                        this.$root.$emit('show-message', {
                            type: 'error',
                            text: sanitizeToastMessage(error.message)
                        });
                    });
            },


            async loadDomains() {
                await this.loadCampaigns();
                this.loadingDomains = true;
                fetch('/backend/api/domains/', {
                    method: 'GET',
                    credentials: 'include'
                })
                    .then(async (response) => {
                        const text = await response.text();
                        if (!response.ok) {
                            let message = 'Unknown error loading domains';
                            try {
                                const errorData = JSON.parse(text);
                                if (Array.isArray(errorData.detail)) {
                                    message = errorData.detail.map(d => d.msg).join('; ');
                                } else if (typeof errorData.detail === 'string') {
                                    message = errorData.detail;
                                }
                            } catch (e) {
                                message = text;
                            }
                            throw new Error(message);
                        }

                        let data = [];
                        try {
                            data = JSON.parse(text);
                        } catch (e) {
                            console.warn('Response is not valid JSON:', text);
                        }

                        this.domains = data;

                    })
                    .catch((error) => {
                        console.error('Error fetching domains:', error);
                        this.$root.$emit('show-message', {
                            type: 'error',
                            text: sanitizeToastMessage(error.message)
                        });
                    })
                    .finally(() => {
                        this.loadingDomains = false;
                    });
            },

            async deleteDomain(item) {
                const ok = await this.$refs.confirm.open('Delete domain', 'Are you sure you want to delete this domain? This cannot be undone.');
                if (!ok) {
                    return;
                }

                fetch(`/backend/api/domains/${item.id}`, {
                    method: 'DELETE',
                    credentials: 'include'
                })
                    .then(async (response) => {
                        const text = await response.text();
                        if (!response.ok) {
                            let message = 'Unknown error deleting domain';
                            try {
                                const errorData = JSON.parse(text);
                                if (Array.isArray(errorData.detail)) {
                                    message = errorData.detail.map(d => d.msg).join('; ');
                                } else if (typeof errorData.detail === 'string') {
                                    message = errorData.detail;
                                }
                            } catch (e) {
                                message = text;
                            }
                            throw new Error(message);
                        }

                        this.$root.$emit('show-message', {
                            type: 'success',
                            text: 'Domain deleted successfully!'
                        });
                        this.loadDomains();
                    })
                    .catch((error) => {
                        console.error('Error deleting domain:', error);
                        this.$root.$emit('show-message', {
                            type: 'error',
                            text: sanitizeToastMessage(error.message)
                        });
                    });
            }
        }

    });

</script>
