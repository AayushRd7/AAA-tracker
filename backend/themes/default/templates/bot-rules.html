{% raw %}
<script type="text/x-template" id="bot-rules-template">
    <v-container fluid>
        <div class="d-flex align-center justify-space-between mb-4 flex-wrap">
            <div>
                <div class="page-title">Bot rules</div>
                <div class="page-subtitle">Click-level bot filtering — block or flag traffic as it arrives</div>
            </div>
            <v-btn color="primary" elevation="0" :disabled="!botRulesLoaded"
                   :loading="botRulesSaving" @click="saveBotRules">
                <v-icon small class="mr-1">mdi-content-save-outline</v-icon>Save settings
            </v-btn>
        </div>

        <v-alert
                v-if="!botRulesLoaded"
                :type="botRulesLoadError ? 'error' : 'info'"
                dense
                text
                class="mb-3"
        >
            <span v-if="botRulesLoadError">
                Save is disabled — {{ botRulesLoadError }} Saving now would overwrite
                the stored configuration with this page's defaults, so it is blocked
                until the settings load succeeds.
            </span>
            <span v-else>Loading settings — Save is disabled until they load.</span>
            <v-btn v-if="botRulesLoadError" text small color="primary" class="ml-2"
                   @click="loadBotRules">Reload</v-btn>
        </v-alert>

        <v-row>
            <v-col cols="12">
                <v-card class="pa-4" id="bot-rules-card">
                    <v-card-title class="d-flex align-center">
                        <v-icon color="primary" class="mr-2">mdi-robot-outline</v-icon>
                        Bot &amp; filter rules
                    </v-card-title>
                    <v-card-text>
                        <v-switch
                                v-model="settings.bot_rules.enabled"
                                label="Enable click-level bot filtering"
                                inset
                                dense
                                hide-details
                        ></v-switch>

                        <div v-for="(rule, i) in settings.bot_rules.rules" :key="i"
                             class="d-flex align-center bot-rule-row">
                            <v-select
                                    v-model="rule.type"
                                    :items="botRuleTypes"
                                    outlined
                                    dense
                                    hide-details
                                    class="bot-rule-type"
                                    @change="rule.value = ['empty_referer','duplicate_visitor'].includes(rule.type) ? '' : rule.value"
                            ></v-select>
                            <v-text-field
                                    v-if="!['empty_referer','duplicate_visitor'].includes(rule.type)"
                                    v-model="rule.value"
                                    :label="rule.type === 'ua_regex' ? 'User-Agent regex' : (rule.type === 'ip_range' ? 'CIDR ranges' : 'IPs (comma-separated)')"
                                    outlined
                                    dense
                                    hide-details
                            ></v-text-field>
                            <span v-else class="caption grey--text bot-rule-grow">no value needed</span>
                            <v-select
                                    v-model="rule.action"
                                    :items="[{text: 'Block (404)', value: 'block'}, {text: 'Mark as bot', value: 'mark'}]"
                                    outlined
                                    dense
                                    hide-details
                                    class="bot-rule-action"
                            ></v-select>
                            <v-btn icon small @click="settings.bot_rules.rules.splice(i, 1)">
                                <v-icon small color="red">mdi-close</v-icon>
                            </v-btn>
                        </div>

                        <div class="mt-2">
                            <v-btn small text color="primary" @click="addBotRule">
                                <v-icon small class="mr-1">mdi-plus</v-icon>Add rule
                            </v-btn>
                        </div>

                        <div class="caption grey--text mt-2">
                            "Block" returns a 404 page without tracking the visit. "Mark as bot" keeps tracking but flags the click (is_bot) so you can filter it in reports.
                        </div>
                    </v-card-text>
                </v-card>
            </v-col>
        </v-row>
    </v-container>
</script>

<script type="application/javascript">
    Vue.component('bot-rules-component', {
        template: '#bot-rules-template',
        data() {
            return {
                settings: {
                    bot_rules: {
                        enabled: false,
                        rules: [],
                    },
                },
                botRulesSaving: false,
                // Load gate: Save stays disabled until a settings load succeeds,
                // and every save echoes the rev the server handed out.
                botRulesLoaded: false,
                botRulesLoadError: '',
                botRulesRev: null,
                botRulesSnapshot: null,
                botRuleTypes: [
                    {text: 'IP address', value: 'ip'},
                    {text: 'IP range (CIDR)', value: 'ip_range'},
                    {text: 'User-Agent regex', value: 'ua_regex'},
                    {text: 'Empty referer', value: 'empty_referer'},
                    {text: 'Duplicate visitor', value: 'duplicate_visitor'},
                ],
            };
        },
        mounted() {
            this.loadBotRules();
            this.$root.$on('load-bot-rules', this.loadBotRules);
        },
        beforeDestroy() {
            this.$root.$off('load-bot-rules', this.loadBotRules);
        },
        methods: {
            loadBotRules() {
                // Reset the gate on every (re)load: Save is unavailable until
                // this succeeds, so a failed load cannot publish the defaults.
                this.botRulesLoaded = false;
                this.botRulesLoadError = '';
                this.botRulesSnapshot = null;
                let loadedRev = null;
                return fetch("/backend/api/settings/", {credentials: "include"})
                    .then((r) => {
                        if (!r.ok) throw new Error("HTTP " + r.status);
                        return r.json();
                    })
                    .then((data) => {
                        loadedRev = (data && data.settings_rev) || null;
                        const s = (data && data.settings) || {};
                        this.settings.bot_rules = Object.assign(
                            {}, {enabled: false, rules: []}, s.bot_rules || {});
                        if (!Array.isArray(this.settings.bot_rules.rules)) {
                            this.settings.bot_rules.rules = [];
                        }
                        this.botRulesRev = loadedRev;
                        this.botRulesSnapshot = JSON.parse(JSON.stringify(this.settings.bot_rules));
                        this.botRulesLoaded = true;
                    })
                    .catch((err) => {
                        this.botRulesLoaded = false;
                        this.botRulesSnapshot = null;
                        this.botRulesLoadError =
                            "Could not load settings (" + sanitizeToastMessage(err.message) + ").";
                        this.$root.$emit("show-message", {type: "error", text: this.botRulesLoadError});
                    });
            },
            saveBotRules() {
                if (!this.botRulesLoaded) {
                    // No load, no save: this stops a page whose load failed from
                    // publishing its bot_rules defaults over the real block.
                    if (!this.botRulesLoadError) {
                        this.botRulesLoadError =
                            "Settings are not loaded — save is blocked to protect the stored configuration.";
                    }
                    this.$root.$emit("show-message", {type: "error", text: this.botRulesLoadError});
                    return Promise.reject(new Error(this.botRulesLoadError));
                }
                // Only the bot_rules section is written here; the server merges
                // it into the stored settings document. The rev pins the write
                // to the document this page loaded.
                const payload = {
                    settings: {bot_rules: this.settings.bot_rules},
                    _base_rev: this.botRulesRev,
                };
                this.botRulesSaving = true;
                return fetch("/backend/api/settings/", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    credentials: "include",
                    body: JSON.stringify(payload)
                })
                    .then((r) => r.json().catch(() => ({})).then((data) => {
                        if (!r.ok) throw new Error(data.detail || ("HTTP " + r.status));
                        return data;
                    }))
                    .then((data) => {
                        if (data.settings_rev) this.botRulesRev = data.settings_rev;
                        this.botRulesSnapshot = JSON.parse(JSON.stringify(this.settings.bot_rules));
                        this.$root.$emit("show-message", {type: "success", text: "Settings saved"});
                        return data;
                    })
                    .catch((err) => {
                        this.$root.$emit("show-message", {type: "error", text: sanitizeToastMessage(err.message)});
                        throw err;
                    })
                    .finally(() => {
                        this.botRulesSaving = false;
                    });
            },
            addBotRule() {
                if (!Array.isArray(this.settings.bot_rules.rules)) this.settings.bot_rules.rules = [];
                this.settings.bot_rules.rules.push({type: 'ip', value: '', action: 'block', enabled: true});
            },
        },
    });
</script>

<style>
    .bot-rule-row {
        gap: var(--space-2, 8px);
    }
    .bot-rule-type {
        max-width: 170px;
    }
    .bot-rule-action {
        max-width: 150px;
    }
    .bot-rule-grow {
        flex: 1;
    }
</style>
{% endraw %}
