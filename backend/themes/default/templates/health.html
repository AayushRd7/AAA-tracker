{% raw %}
<script type="text/x-template" id="health-template">
    <v-container fluid>
        <div class="d-flex align-center justify-space-between mb-4 flex-wrap">
            <div>
                <div class="page-title">Health centre</div>
                <div class="page-subtitle">What this backend can see about itself — databases, row counts, background loops and recent send failures</div>
            </div>
            <v-btn color="primary" elevation="0" :loading="loading" @click="load">
                <v-icon small class="mr-1">mdi-refresh</v-icon>Re-check
            </v-btn>
        </div>

        <v-alert v-if="error" type="error" dense outlined class="mb-4" id="health-error">
            Could not read the health report: {{ error }}
        </v-alert>

        <v-card class="pa-4 mb-4" id="health-verdict-card">
            <div class="d-flex align-center flex-wrap" id="healthVerdict">
                <v-icon large :color="verdictColor" class="mr-3">{{ verdictIcon }}</v-icon>
                <div>
                    <div class="text-h6">{{ verdictHeadline }}</div>
                    <div class="caption grey--text" v-if="report && report.checked_at">
                        Checked {{ formatTime(report.checked_at) }}
                    </div>
                </div>
            </div>
            <ul v-if="attention.length" class="mt-3 health-attention">
                <li v-for="(a, i) in attention" :key="i">{{ a }}</li>
            </ul>
            <div v-else-if="!incidentRows.length" class="caption grey--text mt-2">
                No problems detected from the backend's vantage point.
            </div>
        </v-card>

        <v-card class="pa-4 mb-4" id="health-incidents-card">
            <v-card-title class="px-0 subtitle-1 font-weight-bold">
                <v-icon color="primary" class="mr-2">mdi-alert-decagram-outline</v-icon>Incident console
            </v-card-title>

            <div v-if="incidentRows.length" class="mb-3">
                <v-chip small label class="mr-2 white--text" color="error">
                    {{ incidentCounts.critical }} critical
                </v-chip>
                <v-chip small label class="mr-2 white--text" color="warning">
                    {{ incidentCounts.warning }} warning
                </v-chip>
                <v-chip small label class="white--text" color="info">
                    {{ incidentCounts.info }} info
                </v-chip>
            </div>

            <template v-if="incidentRows.length">
                <div v-for="group in incidentGroups" :key="group.severity"
                     class="mb-3" v-show="group.rows.length">
                    <div class="caption font-weight-bold text-uppercase mb-1"
                         :class="'health-sev-' + group.severity">
                        {{ group.label }} ({{ group.rows.length }})
                    </div>
                    <v-list dense class="py-0">
                        <v-list-item v-for="(inc, i) in group.rows" :key="group.severity + '-' + i"
                                     class="px-0">
                            <v-list-item-icon class="mr-2">
                                <v-icon :color="severityColor(inc.severity)" small>
                                    {{ severityIcon(inc.severity) }}
                                </v-icon>
                            </v-list-item-icon>
                            <v-list-item-content>
                                <v-list-item-title>
                                    {{ inc.subject }}
                                    <span class="caption grey--text">· {{ inc.area }}</span>
                                </v-list-item-title>
                                <v-list-item-subtitle class="caption">
                                    {{ inc.detail }}
                                    <span v-if="inc.since"> · since {{ formatTime(inc.since) }}</span>
                                    · <a :href="inc.link">fix</a>
                                </v-list-item-subtitle>
                            </v-list-item-content>
                        </v-list-item>
                    </v-list>
                </div>
            </template>

            <div v-else class="empty-state">
                <v-icon color="success">mdi-check-circle-outline</v-icon>
                <div class="mt-2">No incidents — every check this backend can make is clear.</div>
            </div>
        </v-card>

        <v-row dense class="mb-2">
            <v-col cols="6" sm="4" md="2" v-for="n in countTiles" :key="n.label">
                <v-card class="pa-3" outlined>
                    <div class="caption grey--text">{{ n.label }}</div>
                    <div class="health-value">{{ n.value }}</div>
                </v-card>
            </v-col>
        </v-row>

        <v-row>
            <v-col cols="12" md="6">
                <v-card class="pa-4 mb-4" id="health-databases-card">
                    <v-card-title class="px-0 subtitle-1 font-weight-bold">
                        <v-icon color="primary" class="mr-2">mdi-database-check-outline</v-icon>Databases
                    </v-card-title>
                    <v-list dense class="py-0">
                        <v-list-item v-for="d in databases" :key="d.name" class="px-0">
                            <v-list-item-icon class="mr-2">
                                <v-icon :color="d.ok ? 'success' : 'error'" small>
                                    {{ d.ok ? 'mdi-check-circle' : 'mdi-alert-circle' }}
                                </v-icon>
                            </v-list-item-icon>
                            <v-list-item-content>
                                <v-list-item-title>{{ d.name }}</v-list-item-title>
                                <v-list-item-subtitle class="caption">
                                    {{ d.ok ? 'reachable' : 'unreachable' }}
                                    <span v-if="d.ok && d.latency_ms != null"> · round-trip {{ d.latency_ms }} ms</span>
                                </v-list-item-subtitle>
                            </v-list-item-content>
                        </v-list-item>
                    </v-list>
                </v-card>

                <v-card class="pa-4" id="health-process-card">
                    <v-card-title class="px-0 subtitle-1 font-weight-bold">
                        <v-icon color="primary" class="mr-2">mdi-information-outline</v-icon>Process
                    </v-card-title>
                    <v-list dense class="py-0">
                        <v-list-item class="px-0">
                            <v-list-item-content>
                                <v-list-item-title>Version</v-list-item-title>
                                <v-list-item-subtitle class="caption">{{ report ? report.version : '—' }}</v-list-item-subtitle>
                            </v-list-item-content>
                        </v-list-item>
                        <v-list-item class="px-0">
                            <v-list-item-content>
                                <v-list-item-title>Uptime</v-list-item-title>
                                <v-list-item-subtitle class="caption">{{ uptimeText }}</v-list-item-subtitle>
                            </v-list-item-content>
                        </v-list-item>
                        <v-list-item class="px-0">
                            <v-list-item-content>
                                <v-list-item-title>Failed outbound sends (24h)</v-list-item-title>
                                <v-list-item-subtitle class="caption">
                                    {{ report ? (report.errors && report.errors.capi_failed_24h) : 0 }}
                                </v-list-item-subtitle>
                            </v-list-item-content>
                        </v-list-item>
                    </v-list>
                </v-card>
            </v-col>

            <v-col cols="12" md="6">
                <v-card class="pa-4 mb-4" id="health-loops-card">
                    <v-card-title class="px-0 subtitle-1 font-weight-bold">
                        <v-icon color="primary" class="mr-2">mdi-sync</v-icon>Background loops
                    </v-card-title>
                    <v-data-table
                            :headers="loopHeaders"
                            :items="loopRows"
                            dense
                            hide-default-footer
                            :items-per-page="-1"
                    >
                        <template v-slot:item.stale="{ item }">
                            <v-chip x-small label class="white--text"
                                    :color="item.stale ? 'error' : (item.never_run ? 'grey' : 'success')">
                                {{ item.stale ? 'stale' : (item.never_run ? 'not yet run' : 'ok') }}
                            </v-chip>
                        </template>
                    </v-data-table>
                    <div class="caption grey--text mt-2">
                        Each loop's own last-run stamp, read from the backend process. A loop that has
                        not run since boot is marked "not yet run", not stale.
                    </div>
                </v-card>
            </v-col>
        </v-row>

        <v-card class="pa-4 mb-4" id="health-sources-card">
            <v-card-title class="px-0 subtitle-1 font-weight-bold">
                <v-icon color="primary" class="mr-2">mdi-call-received</v-icon>Last successful postback per source
            </v-card-title>
            <v-data-table
                    :headers="sourceHeaders"
                    :items="sourceRows"
                    dense
                    hide-default-footer
                    :items-per-page="-1"
            >
                <template v-slot:item.source="{ item }">
                    <a :href="item.url">{{ item.source }}</a>
                </template>
                <template v-slot:no-data>
                    <div class="empty-state">
                        <v-icon>mdi-call-missed</v-icon>
                        <div class="mt-2">No accepted postbacks recorded in the last 30 days</div>
                    </div>
                </template>
            </v-data-table>
            <div class="caption grey--text mt-2">
                Each row links to that postback in the S2S postbacks log, filtered by its click id.
                Only accepted postbacks from the last 30 days are considered.
            </div>
        </v-card>
    </v-container>
</script>

<script type="application/javascript">
    Vue.component('health-component', {
        template: '#health-template',
        data() {
            return {
                loading: false,
                error: '',
                report: null,
                loopHeaders: [
                    {text: 'Loop', value: 'label'},
                    {text: 'Cadence', value: 'cadence'},
                    {text: 'Last run', value: 'last'},
                    {text: 'State', value: 'stale', sortable: false},
                ],
                sourceHeaders: [
                    {text: 'Source', value: 'source'},
                    {text: 'Last success', value: 'last'},
                ],
            };
        },
        computed: {
            attention() {
                return (this.report && this.report.attention) || [];
            },
            incidentRows() {
                return (this.report && this.report.incidents) || [];
            },
            incidentCounts() {
                const c = (this.report && this.report.incident_counts) || {};
                return {critical: c.critical || 0, warning: c.warning || 0, info: c.info || 0};
            },
            // The verdict banner must agree with the incident console below it:
            // any recorded incident (not just the server's coarse verdict)
            // means this is not "all clear".
            hasProblems() {
                return this.attention.length > 0 || this.incidentRows.length > 0;
            },
            incidentGroups() {
                const labels = {critical: 'Critical', warning: 'Warning', info: 'Info'};
                return ['critical', 'warning', 'info'].map(severity => ({
                    severity: severity,
                    label: labels[severity],
                    rows: this.incidentRows.filter(i => i.severity === severity),
                }));
            },
            verdictColor() {
                if (!this.report) return 'grey';
                return (this.report.verdict === 'attention' || this.hasProblems) ? 'warning' : 'success';
            },
            verdictIcon() {
                if (!this.report) return 'mdi-heart-pulse';
                return (this.report.verdict === 'attention' || this.hasProblems) ? 'mdi-alert-circle-outline' : 'mdi-check-circle-outline';
            },
            verdictHeadline() {
                if (!this.report) return 'Reading the backend…';
                return (this.report.verdict === 'attention' || this.hasProblems)
                    ? 'Attention needed'
                    : 'All clear';
            },
            databases() {
                const d = (this.report && this.report.databases) || {};
                return [
                    {name: 'Database', ok: !!(d.database && d.database.ok),
                     latency_ms: d.database ? d.database.latency_ms : null},
                    {name: 'Analytics', ok: !!(d.analytics && d.analytics.ok),
                     latency_ms: d.analytics ? d.analytics.latency_ms : null},
                ];
            },
            countTiles() {
                const c = (this.report && this.report.counts) || {};
                const tile = (label, key) => ({
                    label: label,
                    value: c[key] == null ? '—' : this.$fmtNum(c[key]),
                });
                return [
                    tile('Clicks', 'clicks'),
                    tile('Conversions', 'conversions'),
                    tile('Campaigns', 'campaigns'),
                    tile('Users', 'users'),
                    tile('Postbacks', 'postbacks'),
                    tile('CAPI attempts', 'capi_attempts'),
                ];
            },
            loopRows() {
                const l = (this.report && this.report.loops) || {};
                const order = ['monitor', 'rules', 'optimizer', 'insights', 'meta_ads'];
                const names = {monitor: 'Monitor', rules: 'Auto rules', optimizer: 'Optimizer',
                              insights: 'Insights', meta_ads: 'Meta cost sync'};
                return order.map(key => {
                    const row = l[key] || {};
                    return {
                        key: key,
                        label: names[key] || key,
                        cadence: row.cadence_minutes ? row.cadence_minutes + ' min' : '—',
                        last: row.last_run ? this.formatTime(row.last_run) : '—',
                        stale: !!row.stale,
                        never_run: !!row.never_run,
                    };
                });
            },
            sourceRows() {
                const rows = (this.report && this.report.last_success_by_source) || [];
                return rows.map(r => ({
                    source: r.source || '—',
                    last: r.last_success ? this.formatTime(r.last_success) : '—',
                    url: this.postbackLogUrl(r),
                }));
            },
            uptimeText() {
                const secs = this.report ? Number(this.report.uptime_seconds || 0) : 0;
                const d = Math.floor(secs / 86400);
                const h = Math.floor((secs % 86400) / 3600);
                const m = Math.floor((secs % 3600) / 60);
                const s = secs % 60;
                const parts = [];
                if (d) parts.push(d + 'd');
                if (h) parts.push(h + 'h');
                if (m) parts.push(m + 'm');
                parts.push(s + 's');
                return parts.join(' ');
            },
        },
        mounted() {
            this.$vuetify.theme.dark = (document.documentElement.dataset.theme === 'dark');
            this.load();
            this.$root.$on('load-health-center', this.load);
        },
        beforeDestroy() {
            this.$root.$off('load-health-center', this.load);
        },
        methods: {
            load() {
                this.loading = true;
                this.error = '';
                fetch('/backend/api/health', {credentials: 'include'})
                    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
                    .then(data => { this.report = data; })
                    .catch(err => {
                        this.report = null;
                        this.error = sanitizeToastMessage(err.message);
                    })
                    .finally(() => { this.loading = false; });
            },
            formatTime(iso) {
                if (!iso) return '';
                const d = new Date(iso);
                return isNaN(d.getTime()) ? iso : d.toLocaleString();
            },
            severityColor(severity) {
                return severity === 'critical' ? 'error'
                    : (severity === 'warning' ? 'warning' : 'info');
            },
            severityIcon(severity) {
                return severity === 'critical' ? 'mdi-alert-octagon'
                    : (severity === 'warning' ? 'mdi-alert' : 'mdi-information-outline');
            },
            // Deep link into the S2S postbacks log, narrowed to this row's click
            // id — logs.html seeds its filter state from the query string.
            postbackLogUrl(row) {
                const base = '/backend/logs-postbacks';
                return row && row.click_id
                    ? base + '?click_id=' + encodeURIComponent(row.click_id)
                    : base;
            },
        },
    });
</script>

<style>
    .health-value {
        font-size: 1.25rem;
        font-weight: 600;
        line-height: 1.4;
    }
    .health-attention {
        padding-left: 1.25rem;
        margin-bottom: 0;
    }
    .health-sev-critical { color: #d93a3a; }
    .health-sev-warning { color: #b8770a; }
    .health-sev-info { color: #7a3dff; }
</style>
{% endraw %}
