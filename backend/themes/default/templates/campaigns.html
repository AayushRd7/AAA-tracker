{% raw %}
<script type="text/x-template" id="campaigns-template">
    <v-container fluid>
        <div class="d-flex align-center justify-space-between mb-4">
            <div>
                <div class="page-title">Campaigns</div>
                <div class="page-subtitle">Manage traffic campaigns and their flows</div>
            </div>
            <v-col class="d-flex justify-end align-center">
                <div class="filter-bar align-center">
                <v-menu v-model="colMenu" offset-y :close-on-content-click="false">
                    <template v-slot:activator="{ on, attrs }">
                        <v-btn small outlined v-bind="attrs" v-on="on">
                            <v-icon small class="mr-1">mdi-view-column-outline</v-icon>Columns
                        </v-btn>
                    </template>
                    <v-card min-width="230">
                        <div class="col-menu-list pa-2">
                            <v-checkbox
                                    v-for="h in headers"
                                    :key="h.value"
                                    dense
                                    hide-details
                                    class="mt-1"
                                    :label="h.text"
                                    :input-value="colVisibility[h.value] !== false"
                                    :disabled="h.value === 'name' || h.value === 'actions'"
                                    @change="toggleCol(h.value, $event)"
                            ></v-checkbox>
                        </div>
                        <v-divider></v-divider>
                        <v-card-actions>
                            <v-btn small text @click="resetCols">Show all</v-btn>
                            <v-spacer></v-spacer>
                            <v-btn small text color="primary" @click="colMenu = false">Done</v-btn>
                        </v-card-actions>
                    </v-card>
                </v-menu>
                <v-select
                        v-model="tagFilter"
                        :items="allTags"
                        multiple
                        chips
                        small-chips
                        deletable-chips
                        outlined
                        dense
                        hide-details
                        label="Tags"
                        class="tags-filter"
                ></v-select>
                <v-select
                        v-model="metricsPeriod"
                        :items="metricsPeriodItems"
                        label="Stats period"
                        outlined
                        dense
                        hide-details
                        class="period-filter"
                        @change="metricsPeriodChanged"
                ></v-select>
                <v-switch
                        v-model="showArchived"
                        label="Show archived"
                        inset
                        dense
                        hide-details
                        class="ml-3 mt-0 archived-switch"
                ></v-switch>
                <v-btn small outlined class="mr-2" @click="exportCsv" :loading="exporting">
                    <v-icon small class="mr-1">mdi-file-download-outline</v-icon>Export
                </v-btn>
                <v-btn small outlined class="mr-2" @click="openImport">
                    <v-icon small class="mr-1">mdi-file-upload-outline</v-icon>Import
                </v-btn>
                <v-btn color="primary" elevation="0" @click="openCreate">
                    <v-icon small class="mr-1">mdi-plus</v-icon>Create Campaign
                </v-btn>
                </div>
            </v-col>
        </div>

        <v-dialog v-model="dialog" fullscreen persistent scrollable>
            <v-card class="pa-4">
                <v-row>
                    <v-col cols="12" class="ma-4">

                        <v-row dense class="mt-2">
                            <v-col cols="12" md="6">
                                <h3>{{ isEdit ? 'Edit Campaign' : 'New Campaign' }}</h3>
                            </v-col>
                        </v-row>
                        <v-row dense class="mt-2">
                            <v-col cols="12" md="4">
                                <v-text-field label="Name" v-model="form.name" outlined
                                              dense></v-text-field>
                            </v-col>


                            <v-col cols="12" md="2">
                                <v-select label="Type" v-model="form.type" :items="types"
                                          outlined
                                          dense></v-select>
                            </v-col>
                        </v-row>
                        <v-row class="mt-0">
                            <v-col cols="12" md="6">
                                <v-tabs v-model="tab">
                                    <v-tab>General</v-tab>
                                    <v-tab>Cost</v-tab>
                                    <v-tab>Tracking</v-tab>
                                    <v-tab>Parameters</v-tab>
                                    <v-tab>S2S Postbacks</v-tab>
                                    <v-tab>Notes</v-tab>
                                </v-tabs>

                                <v-tabs-items v-model="tab">
                                    <!-- GENERAL -->
                                    <v-tab-item>
                                        <v-card flat>
                                            <v-container>
                                                <v-row dense>

                                                    <v-col cols="12" class="mt-2">
                                                        <v-switch
                                                                label="Status"
                                                                v-model="form.status"
                                                                :value="form.status === 'active'"
                                                                :false-value="'paused'"
                                                                :true-value="'active'"
                                                                inset
                                                                dense
                                                        ></v-switch>
                                                    </v-col>
                                                    <v-col cols="12">
                                                        <v-select
                                                                v-model="form.domain_id"
                                                                :items="domains"
                                                                item-text="domain"
                                                                item-value="id"
                                                                label="Domain"
                                                                outlined
                                                                dense></v-select>
                                                    </v-col>
                                                    <v-col cols="12">
                                                        <v-text-field label="Alias" v-model="form.alias" outlined
                                                                      dense></v-text-field>
                                                    </v-col>

                                                    <v-col cols="12">
                                                        <v-combobox
                                                                label="Tags"
                                                                v-model="form.tags"
                                                                :items="allTags"
                                                                multiple
                                                                chips
                                                                small-chips
                                                                deletable-chips
                                                                outlined
                                                                dense
                                                                hint="Type a tag and press Enter — e.g. vertical, geo, traffic type"
                                                                persistent-hint
                                                        ></v-combobox>
                                                    </v-col>
                                                    <v-col cols="12">
                                                        <v-select label="Traffic Source"
                                                                  v-model="form.traffic_source_id"
                                                                  :items="sources" item-text="name" item-value="id"
                                                                  outlined
                                                                  dense></v-select>
                                                    </v-col>

                                                    <v-col cols="12">
                                                        <v-text-field
                                                                label="Uniqueness Bind TTL (hours)"
                                                                v-model="form.bind_ttl_hours"
                                                                type="number"
                                                                outlined
                                                                dense
                                                        ></v-text-field>
                                                    </v-col>

                                                    <v-col cols="12">
                                                        <v-switch
                                                                label="Visitor stickiness (bind visitors to their flow)"
                                                                v-model="form.stickiness"
                                                                inset
                                                                dense
                                                                hint="Returning visitors keep the flow/offer they were first assigned to — makes weight-based A/B splits stable. Stored in a signed 30-day aaa_bind cookie; editing the flow list invalidates bindings."
                                                                persistent-hint
                                                        ></v-switch>
                                                    </v-col>

                                                </v-row>
                                            </v-container>
                                        </v-card>
                                    </v-tab-item>

                                    <!-- COST -->
                                    <v-tab-item>
                                        <v-card flat>
                                            <v-container>
                                                <v-row dense>
                                                    <v-col cols="12">
                                                        <v-select label="Cost Model" v-model="form.cost_model"
                                                                  :items="costModels"
                                                                  outlined dense></v-select>
                                                    </v-col>
                                                    <v-col cols="12">
                                                        <v-text-field label="Traffic Loss (%)"
                                                                      v-model="form.traffic_loss_percent"
                                                                      type="number" outlined dense></v-text-field>
                                                    </v-col>
                                                    <v-col cols="12">
                                                        <v-text-field label="Cost"
                                                                      v-model="form.cost"
                                                                      type="number" outlined dense></v-text-field>
                                                    </v-col>
                                                    <v-col cols="12">
                                                        <v-autocomplete label="Cost Currency"
                                                                        v-model="form.cost_currency"
                                                                        :items="currencies"
                                                                        outlined dense></v-autocomplete>
                                                        <v-col cols="12">
                                                            <v-switch label="Cost from Cost Parameter"
                                                                      v-model="form.cost_from_cost_parameter"
                                                                      inset
                                                                      dense></v-switch>
                                                        </v-col>
                                                    </v-col>
                                                </v-row>
                                            </v-container>
                                        </v-card>
                                    </v-tab-item>

                                    <!-- TRACKING -->
                                    <v-tab-item>
                                        <v-card flat>
                                            <v-container>
                                                <v-row dense>
                                                    <v-col cols="12">
                                                        <v-text-field
                                                                label="Campaign URL"
                                                                :value="campaignUrl"
                                                                readonly
                                                                outlined
                                                                dense
                                                                append-icon="mdi-content-copy"
                                                                @click:append="copyCampaignUrl"></v-text-field>
                                                    </v-col>
                                                    <v-col cols="12">
                                                        <v-switch label="Send se_referrer"
                                                                  v-model="form.send_se_referrer"
                                                                  inset
                                                                  dense></v-switch>
                                                    </v-col>
                                                    <v-col cols="12">
                                                        <v-switch label="Use <title> as keyword"
                                                                  v-model="form.use_title_as_keyword"
                                                                  inset
                                                                  dense></v-switch>
                                                    </v-col>
                                                    <v-col cols="12">
                                                        <v-switch label="Send query params"
                                                                  v-model="form.send_query_params"
                                                                  inset
                                                                  dense></v-switch>
                                                    </v-col>
                                                    <v-col cols="12">
                                                        <v-switch label="Hide Referrer (meta refresh)"
                                                                  v-model="form.hide_referrer"
                                                                  inset
                                                                  dense
                                                                  hint="Redirect visitors through an HTML meta refresh so target pages see no referrer"
                                                                  persistent-hint></v-switch>
                                                    </v-col>
                                                    <v-col cols="12">
                                                        <v-text-field
                                                                label="Fallback URL"
                                                                v-model="form.fallback_url"
                                                                outlined
                                                                dense
                                                                hint="Where to send visitors when no flow's filters match. Leave empty to show a 404 page."
                                                                persistent-hint></v-text-field>
                                                    </v-col>
                                                    <v-col cols="12">
                                                        <v-select
                                                                label="Tracking Script Method"
                                                                v-model="form.integration_method"
                                                                :items="Object.entries(integrationMethods).map(([key, value]) => ({ key, value }))"
                                                                item-text="value"
                                                                item-value="key"
                                                                outlined
                                                                dense
                                                        ></v-select>
                                                    </v-col>
                                                    <v-col cols="12" v-if="form.integration_method">
                                                        <v-textarea
                                                                label="Tracking Script"
                                                                readonly
                                                                outlined
                                                                dense
                                                                v-model="trackingScript"
                                                        >
                                                        </v-textarea>
                                                    </v-col>
                                                    <v-col cols="12" class="direct-tracking-head">
                                                        <div class="direct-tracking-title">Direct Tracking (no-redirect)</div>
                                                        <div class="direct-tracking-hint">
                                                            First-party tracking without any redirect: the script records the
                                                            visit, stores the click id in a cookie, and your offer links plus the
                                                            conversion pixel reuse it — landing URLs stay clean. Put the script on
                                                            the landing page, point offer links through
                                                            <code>/c/{{ form.alias || 'ALIAS' }}/{offer}?click_id=...</code> (or
                                                            <code>aaaTrack.clickThrough(url)</code>), and fire the pixel on the
                                                            thank-you page.
                                                        </div>
                                                    </v-col>
                                                    <v-col cols="12">
                                                        <v-textarea
                                                                label="Direct Tracking Script"
                                                                :value="directTrackingScript"
                                                                readonly
                                                                outlined
                                                                dense
                                                                append-icon="mdi-content-copy"
                                                                @click:append="copyText(directTrackingScript)"
                                                        ></v-textarea>
                                                    </v-col>
                                                    <v-col cols="12">
                                                        <v-textarea
                                                                label="Conversion Pixel (img — noscript / cross-domain safe)"
                                                                :value="conversionPixelImg"
                                                                readonly
                                                                outlined
                                                                dense
                                                                append-icon="mdi-content-copy"
                                                                @click:append="copyText(conversionPixelImg)"
                                                        ></v-textarea>
                                                    </v-col>
                                                    <v-col cols="12">
                                                        <v-textarea
                                                                label="Conversion Pixel (fetch — from the tracked page)"
                                                                :value="conversionPixelFetch"
                                                                readonly
                                                                outlined
                                                                dense
                                                                append-icon="mdi-content-copy"
                                                                @click:append="copyText(conversionPixelFetch)"
                                                        ></v-textarea>
                                                    </v-col>
                                                </v-row>
                                            </v-container>
                                        </v-card>
                                    </v-tab-item>

                                    <!-- PARAMETERS -->
                                    <v-tab-item>
                                        <v-card flat>
                                            <v-container>
                                                <v-row class="mb-4">
                                                    <v-col cols="12" class="text-right">
                                                        <v-btn small color="primary" @click="addParameter">Add</v-btn>
                                                    </v-col>
                                                </v-row>

                                                <v-row align="center" class="param-header">
                                                    <v-col cols="3">
                                                        Name
                                                    </v-col>
                                                    <v-col cols="3">
                                                        Parameter In System
                                                    </v-col>
                                                    <v-col cols="5">
                                                        Variable Input (empty if same name)
                                                    </v-col>
                                                    <v-col cols="1">
                                                    </v-col>
                                                </v-row>
                                                <v-row dense v-for="(mapping, index) in form.paramsIdMapping"
                                                       :key="index" align="center">
                                                    <v-col cols="3">
                                                        <template v-if="!mapping.editable_name">
                                                            {{ mapping.name }}
                                                        </template>
                                                        <template v-else>
                                                            <v-text-field
                                                                    :label="mapping.name"
                                                                    v-model="mapping.name"
                                                                    outlined
                                                                    dense
                                                            ></v-text-field>
                                                        </template>
                                                    </v-col>
                                                    <v-col cols="3">
                                                        <v-text-field
                                                                :label="mapping.parameter"
                                                                v-model="mapping.parameter"
                                                                outlined
                                                                dense
                                                        ></v-text-field>
                                                    </v-col>
                                                    <v-col cols="5">
                                                        <v-text-field
                                                                label="Variable Name"
                                                                v-model="mapping.token"
                                                                outlined
                                                                dense
                                                        ></v-text-field>
                                                    </v-col>
                                                    <v-col cols="1">
                                                        <v-btn icon small color="red" @click="removeParameter(index)">
                                                            <v-icon>mdi-delete</v-icon>
                                                        </v-btn>
                                                    </v-col>
                                                </v-row>
                                            </v-container>
                                        </v-card>
                                    </v-tab-item>


                                    <!-- POSTBACKS -->
                                    <v-tab-item>
                                        <v-card flat>
                                            <v-container>
                                                <!-- Existing postbacks -->
                                                <v-row
                                                        dense
                                                        v-for="(pb, i) in form.postbacks"
                                                        :key="'pb_' + i"
                                                        class="mb-2"
                                                >
                                                    <v-col cols="12">
                                                        <v-select
                                                                v-model="pb.method"
                                                                :items="['GET', 'POST']"
                                                                label="Request Method"
                                                                dense
                                                                outlined
                                                                class="mt-3"></v-select>
                                                    </v-col>
                                                    <v-col cols="12">
                                                        <v-textarea v-model="pb.url" label="Postback URL" dense

                                                                    rows="3"
                                                                    outlined></v-textarea>
                                                        <v-btn small text color="primary" @click="openPostbackEditor(i)">Edit
                                                            Postback URL
                                                        </v-btn>
                                                    </v-col>
                                                    <v-col cols="10">
                                                        <v-checkbox
                                                                v-for="key in postbackStatusKeys"
                                                                :key="key"
                                                                v-model="pb.status[key]"
                                                                :label="key.charAt(0).toUpperCase() + key.slice(1)"
                                                                dense hide-details
                                                                class="mr-2 d-inline-block"></v-checkbox>
                                                    </v-col>
                                                    <v-col cols="2" class="text-right">
                                                        <v-btn icon @click="form.postbacks.splice(i, 1)">
                                                            <v-icon color="red">mdi-delete</v-icon>
                                                        </v-btn>
                                                    </v-col>
                                                </v-row>

                                                <v-divider class="my-4"></v-divider>
                                                <h3>Add New</h3>

                                                <!-- Adding a new one -->
                                                <v-row dense>
                                                    <v-col cols="12">
                                                        <v-select
                                                                v-model="newPostback.method"
                                                                :items="['GET', 'POST']"
                                                                label="Request Method"
                                                                dense
                                                                outlined
                                                                class="mt-3"></v-select>
                                                    </v-col>
                                                    <v-col cols="12">
                                                        <v-textarea
                                                                v-model="newPostback.url"
                                                                label="New Postback URL"
                                                                rows="3"
                                                                dense
                                                                outlined></v-textarea>
                                                        <v-btn small text color="primary" @click="openPostbackEditor()">Edit
                                                            Postback URL
                                                        </v-btn>
                                                    </v-col>
                                                    <v-col cols="10">
                                                        <v-checkbox
                                                                v-for="key in postbackStatusKeys"
                                                                :key="'new_' + key"
                                                                v-model="newPostback.status[key]"
                                                                :label="key.charAt(0).toUpperCase() + key.slice(1)"
                                                                dense hide-details
                                                                class="mr-2 d-inline-block"></v-checkbox>
                                                    </v-col>
                                                    <v-col cols="2" class="text-right">
                                                        <v-btn color="primary" @click="addPostback"
                                                               :disabled="!newPostback.url">
                                                            Add
                                                        </v-btn>
                                                    </v-col>
                                                </v-row>
                                            </v-container>

                                        </v-card>
                                    </v-tab-item>

                                    <!-- NOTES -->
                                    <v-tab-item>
                                        <v-card flat>
                                            <v-container>
                                                <v-textarea v-model="form.notes" label="Internal Notes" outlined dense
                                                            rows="5"
                                                            auto-grow></v-textarea>
                                            </v-container>
                                        </v-card>
                                    </v-tab-item>
                                </v-tabs-items>

                            </v-col>


                            <!-- RIGHT: Flow Configuration -->
                            <v-col cols="12" md="6" v-if="form.type=='campaign'">
                                <h3 class="mb-2 mt-2">Flow Configuration</h3>

                                <v-row>
                                    <v-col cols="12" md="5">
                                        <v-select
                                                v-model="form.flowScheme"
                                                :items="[{text: 'Position (first match wins)', value: 'position'}, {text: 'Weight % (random split)', value: 'weight'}]"
                                                label="Distribution"
                                                outlined
                                                dense
                                                hint="Weight % splits visitors across flows by their weight — e.g. 70/30"
                                                persistent-hint></v-select>
                                    </v-col>
                                </v-row>

                                <v-row dense v-for="(flow, index) in form.flows" :key="index" class="mb-2 mr-5">
                                    <v-col cols="12">
                                        <v-card
                                                :class="
                                                flow.type === 'forced'
                                                    ? 'flow-card flow-card--forced'
                                                    : flow.type === 'default'
                                                    ? 'flow-card flow-card--default'
                                                    : 'flow-card'"
                                                flat
                                        >
                                            <v-card-title class="d-flex justify-space-between align-center">
                                                <v-col cols="2">
                                                    <v-btn icon small @click="moveFlowUp(index)"
                                                           :disabled="index === 0">
                                                        <v-icon>mdi-arrow-up</v-icon>
                                                    </v-btn>
                                                    <v-btn icon small @click="moveFlowDown(index)"
                                                           :disabled="index === form.flows.length - 1">
                                                        <v-icon>mdi-arrow-down</v-icon>
                                                    </v-btn>
                                                    <span class="status-chip ml-1" :class="flow.enabled ? 'status-chip--success' : 'status-chip--neutral'">{{ flow.enabled ? 'On' : 'Off' }}</span>
                                                </v-col>
                                                <v-col cols="7">
                                                    <strong>{{ flow.name }}</strong>
                                                    <span class="ml-2 grey--text">({{ flow.type }})</span>
                                                </v-col>
                                                <v-col cols="3" class="text-right">
                                                    <v-btn text color="primary" @click="openFlowEdit(flow, index)">
                                                        Edit
                                                    </v-btn>
                                                    <v-btn text color="red" @click="removeFlow(index)">Delete</v-btn>
                                                </v-col>
                                            </v-card-title>

                                            <v-card-text>
                                                <div>
                                                    <span class="mr-3">Position: <b>{{ flow.position }}</b></span>
                                                    <span class="mr-3">Weight: <b>{{ flow.weight }}%</b></span>
                                                    <span class="mr-3">Schema: <b>{{ flow.schema }}</b></span>
                                                    <span>Status: <b>{{ flow.enabled ? 'On' : 'Off' }}</b></span>
                                                </div>
                                                <div>
                                                  <span class="mr-3">
                                                    Landing:
                                                    <b>{{ landingMap[flow.landing] || '—' }}</b>
                                                  </span>
                                                    <span class="mr-3">
                                                        Offer:
                                                        <b>{{ offerMap[flow.offer] || '—' }}</b>
                                                      </span>
                                                </div>
                                                <div>
                                                  <span v-if="flowFiltersSummary(flow).length" class="d-block mt-2">
                                                    Filters:
                                                    <ul class="pl-4 mb-0">
                                                      <li v-for="(line, i) in flowFiltersSummary(flow)" :key="i">{{ line }}</li>
                                                    </ul>
                                                  </span>
                                                </div>
                                                <div v-if="flow.schedule">
                                                  <span class="mr-3">Schedule: <b>{{ flowScheduleSummary(flow.schedule) }}</b></span>
                                                </div>
                                                <div v-if="flow.caps && (flow.caps.per_hour || flow.caps.per_day || flow.caps.total)">
                                                  <span class="mr-3">Caps: <b>{{ flowCapsSummary(flow.caps) }}</b></span>
                                                </div>
                                                <div v-if="flow.notes">
                                                  <span class="mr-3">
                                                    Notes:
                                                    <b>{{ flow.notes || '—' }}</b>
                                                  </span>
                                                </div>
                                            </v-card-text>
                                        </v-card>
                                    </v-col>
                                </v-row>

                                <v-btn small color="primary" @click="openFlowEdit()">Add Flow</v-btn>
                            </v-col>

                        </v-row>
                    </v-col>
                </v-row>
                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text color="grey" @click="confirmCancel">Cancel</v-btn>
                    <v-btn text color="primary" @click="update">Update</v-btn>
                    <v-btn color="primary" elevation="0" @click="save">Save</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>

        <v-dialog v-if="form.type=='campaign'" v-model="flowDialog" persistent>
            <v-card class="dialog-xl">
                <v-card-title>
                    <span class="text-h6">{{ isEditingFlow ? 'Edit Flow' : 'New Flow' }}</span>
                </v-card-title>

                <v-card-text>
                    <v-tabs v-model="activeFlowTab">
                        <v-tab>Flow Settings</v-tab>
                        <v-tab  v-if="flowForm.type !== 'default'">Filters</v-tab>
                        <v-tab>Schema</v-tab>
                        <v-tab>Notes</v-tab>
                    </v-tabs>

                    <v-tabs-items v-model="activeFlowTab">
                        <!-- MAIN TAB -->
                        <v-tab-item>
                      <v-container>
                        <v-row dense>
                          <!-- Flow name -->
                          <v-col cols="12">
                            <v-text-field
                              v-model="flowForm.name"
                              label="Flow Name"
                              outlined
                              dense
                              required
                            ></v-text-field>
                          </v-col>

                          <!-- Flow type -->
                          <v-col cols="12">
                            <v-select
                              v-model="flowForm.type"
                              :items="['regular', 'forced', 'default']"
                              label="Flow Type"
                              outlined
                              dense
                            ></v-select>
                          </v-col>

                          <!-- Position and Weight (only when not default) -->
                          <v-col cols="6" v-if="flowForm.type !== 'default'">
                            <v-text-field
                              v-model.number="flowForm.position"
                              label="Position"
                              type="number"
                              outlined
                              dense
                            ></v-text-field>
                          </v-col>

                          <v-col cols="6" v-if="flowForm.type !== 'default'">
                            <v-text-field
                              v-model.number="flowForm.weight"
                              label="Weight (%)"
                              type="number"
                              outlined
                              dense
                            ></v-text-field>
                          </v-col>

                          <!-- Enabled and click collection -->
                          <v-col cols="6">
                            <v-switch
                              v-model="flowForm.enabled"
                              label="Enabled"
                              inset
                              dense
                            ></v-switch>
                          </v-col>

                          <!-- Schedule + caps (optional, per flow) -->
                          <v-col cols="12">
                            <v-expansion-panels flat accordion multiple class="flow-extra-panels">
                              <v-expansion-panel>
                                <v-expansion-panel-header class="px-4">
                                  <span>
                                    <v-icon small class="mr-2">mdi-clock-outline</v-icon>Schedule (dayparting)
                                    <span v-if="scheduleSummary" class="grey--text caption ml-2">{{ scheduleSummary }}</span>
                                  </span>
                                </v-expansion-panel-header>
                                <v-expansion-panel-content class="px-2">
                                  <v-row dense align="center">
                                    <v-col cols="12" md="4">
                                      <v-select
                                              v-model="flowForm.schedule.timezone"
                                              :items="timezones"
                                              label="Timezone"
                                              dense outlined hide-details
                                      ></v-select>
                                    </v-col>
                                    <v-col cols="12" md="8">
                                      <div class="caption grey--text mb-1">Days</div>
                                      <v-chip v-for="d in daysOfWeek" :key="d.value"
                                              small outlined class="mr-1 day-chip"
                                              :color="(flowForm.schedule.days || []).includes(d.value) ? 'primary' : ''"
                                              :class="(flowForm.schedule.days || []).includes(d.value) ? 'day-chip--on' : ''"
                                              @click="toggleScheduleDay(d.value)">
                                        {{ d.text }}
                                      </v-chip>
                                    </v-col>
                                    <v-col cols="6" md="2">
                                      <v-text-field
                                              v-model.number="flowForm.schedule.hoursFrom"
                                              type="number" min="0" max="23"
                                              label="Hour from"
                                              dense outlined hide-details
                                      ></v-text-field>
                                    </v-col>
                                    <v-col cols="6" md="2">
                                      <v-text-field
                                              v-model.number="flowForm.schedule.hoursTo"
                                              type="number" min="0" max="23"
                                              label="Hour to"
                                              dense outlined hide-details
                                      ></v-text-field>
                                    </v-col>
                                    <v-col cols="12" md="8">
                                      <v-btn small text color="grey" @click="clearSchedule">Clear schedule</v-btn>
                                    </v-col>
                                  </v-row>
                                </v-expansion-panel-content>
                              </v-expansion-panel>

                              <v-expansion-panel>
                                <v-expansion-panel-header class="px-4">
                                  <span>
                                    <v-icon small class="mr-2">mdi-counter</v-icon>Click caps
                                    <span v-if="capsSummary" class="grey--text caption ml-2">{{ capsSummary }}</span>
                                  </span>
                                </v-expansion-panel-header>
                                <v-expansion-panel-content class="px-2">
                                  <v-row dense>
                                    <v-col cols="12" md="4">
                                      <v-text-field
                                              v-model.number="flowForm.caps.per_hour"
                                              type="number" min="0"
                                              label="Per hour (0 = unlimited)"
                                              dense outlined hide-details
                                      ></v-text-field>
                                    </v-col>
                                    <v-col cols="12" md="4">
                                      <v-text-field
                                              v-model.number="flowForm.caps.per_day"
                                              type="number" min="0"
                                              label="Per day (0 = unlimited)"
                                              dense outlined hide-details
                                      ></v-text-field>
                                    </v-col>
                                    <v-col cols="12" md="4">
                                      <v-text-field
                                              v-model.number="flowForm.caps.total"
                                              type="number" min="0"
                                              label="Total (0 = unlimited)"
                                              dense outlined hide-details
                                      ></v-text-field>
                                    </v-col>
                                  </v-row>
                                </v-expansion-panel-content>
                              </v-expansion-panel>
                            </v-expansion-panels>
                          </v-col>
                        </v-row>
                      </v-container>
                    </v-tab-item>

                        <!-- FILTERS TAB -->
                        <v-tab-item v-if="flowForm.type !== 'default'">
                            <v-container>
                                <v-row dense align="center">
                                    <v-col cols="12" md="4">
                                        <v-select
                                                :items="[{text: 'ALL groups must match', value: 'and'}, {text: 'ANY group must match', value: 'or'}]"
                                                v-model="filtersModel.combinator"
                                                label="Groups"
                                                dense outlined hide-details
                                        ></v-select>
                                    </v-col>
                                    <v-col cols="12" md="8" class="text-md-right">
                                        <v-btn small color="primary" outlined @click="addFilterGroup">
                                            <v-icon small class="mr-1">mdi-plus</v-icon>Add Group
                                        </v-btn>
                                    </v-col>
                                </v-row>

                                <v-card v-for="(group, gi) in filtersModel.groups" :key="'fg_' + gi"
                                        outlined class="mb-3 mt-2 filter-group-card">
                                    <v-card-text class="pb-2">
                                        <v-row dense align="center">
                                            <v-col cols="6" md="3">
                                                <v-select
                                                        :items="[{text: 'AND', value: 'and'}, {text: 'OR', value: 'or'}]"
                                                        v-model="group.logic"
                                                        label="Match in group"
                                                        dense outlined hide-details
                                                ></v-select>
                                            </v-col>
                                            <v-col cols="6" md="7" class="grey--text caption">
                                                Group {{ gi + 1 }} of {{ filtersModel.groups.length }}
                                            </v-col>
                                            <v-col cols="12" md="2" class="text-right">
                                                <v-btn icon small color="red" @click="removeFilterGroup(gi)">
                                                    <v-icon>mdi-delete</v-icon>
                                                </v-btn>
                                            </v-col>
                                        </v-row>

                                        <v-row v-for="(cond, ci) in group.conditions" :key="'fc_' + gi + '_' + ci"
                                               dense align="center">
                                            <v-col cols="12" md="3">
                                                <v-select
                                                        :items="filterFieldItems"
                                                        v-model="cond.field"
                                                        label="Field"
                                                        dense outlined hide-details
                                                ></v-select>
                                            </v-col>
                                            <v-col cols="6" md="2">
                                                <v-select
                                                        :items="operatorsForField(cond.field)"
                                                        v-model="cond.operator"
                                                        label="Operator"
                                                        dense outlined hide-details
                                                ></v-select>
                                            </v-col>
                                            <v-col cols="12" md="4" v-if="isListOperator(cond.operator)">
                                                <v-combobox
                                                        v-model="cond.valueList"
                                                        label="Values (press Enter to add)"
                                                        multiple small-chips deletable-chips
                                                        dense outlined hide-details
                                                ></v-combobox>
                                            </v-col>
                                            <v-col cols="12" md="4" v-else-if="!isExistenceOperator(cond.operator)">
                                                <v-text-field
                                                        v-model="cond.value"
                                                        :label="cond.operator === 'cidr' ? 'CIDR (e.g. 10.0.0.0/8, comma list)' : 'Value'"
                                                        dense outlined hide-details
                                                ></v-text-field>
                                            </v-col>
                                            <v-col cols="12" md="4" v-else>
                                                <span class="grey--text caption">—</span>
                                            </v-col>
                                            <v-col cols="6" md="2">
                                                <v-checkbox
                                                        v-model="cond.invert"
                                                        label="IS NOT"
                                                        dense hide-details
                                                        class="mt-0"
                                                ></v-checkbox>
                                            </v-col>
                                            <v-col cols="6" md="1" class="text-right">
                                                <v-btn icon small color="red" @click="removeCondition(gi, ci)">
                                                    <v-icon>mdi-delete</v-icon>
                                                </v-btn>
                                            </v-col>
                                        </v-row>

                                        <v-btn small text color="primary" class="mt-1" @click="addCondition(gi)">
                                            <v-icon small class="mr-1">mdi-plus</v-icon>Add Condition
                                        </v-btn>
                                    </v-card-text>
                                </v-card>

                                <v-alert v-if="!filtersModel.groups.length" type="info" text dense class="mt-2">
                                    No filters — this flow matches all visitors.
                                </v-alert>
                            </v-container>
                        </v-tab-item>


                        <!-- SCHEMA TAB -->
                        <v-tab-item>
                            <v-container>
                                <v-row dense>
                                    <v-col cols="12">
                                        <v-select
                                                v-model="flowForm.schema"
                                                :items="[
                                                    { text: 'Direct redirect to Offer', value: 'direct' },
                                                    { text: 'Landing → Offer', value: 'landing_offer' },
                                                    { text: 'Landing Only', value: 'landing_only' },
                                                    { text: 'Multi Landing/Offer', value: 'multi' },
                                                    { text: 'Redirect to URL', value: 'redirect' },
                                                    { text: 'Return 404 (Not Found)', value: 'return_404' },
                                                    { text: 'Redirect to Another Campaign', value: 'redirect_campaign' }
                                                  ]"
                                                label="Flow Schema"
                                                outlined
                                                dense
                                        ></v-select>
                                    </v-col>

                                    <!-- Direct to Offer -->
                                    <v-col cols="12" v-if="flowForm.schema === 'direct'">
                                        <v-select
                                                v-model="flowForm.offer"
                                                :items="offers"
                                                item-text="name"
                                                item-value="id"
                                                label="Offer"
                                                outlined
                                                dense
                                        ></v-select>
                                    </v-col>

                                    <!-- Landing → Offer -->
                                    <template v-if="flowForm.schema === 'landing_offer'">
                                        <v-col cols="12">
                                            <v-select
                                                    v-model="flowForm.landing"
                                                    :items="landings"
                                                    item-text="name"
                                                    item-value="id"
                                                    label="Landing Page"
                                                    outlined
                                                    dense
                                            ></v-select>
                                        </v-col>
                                        <v-col cols="12">
                                            <v-select
                                                    v-model="flowForm.offer"
                                                    :items="offers"
                                                    item-text="name"
                                                    item-value="id"
                                                    label="Offer"
                                                    outlined
                                                    dense
                                            ></v-select>
                                        </v-col>
                                    </template>

                                    <!-- Landing Only -->
                                    <v-col cols="12" v-if="flowForm.schema === 'landing_only'">
                                        <v-select
                                                v-model="flowForm.landing"
                                                :items="landings"
                                                item-text="name"
                                                item-value="id"
                                                label="Landing Page"
                                                outlined
                                                dense
                                        ></v-select>
                                    </v-col>

                                    <!-- Multi landing/offer -->
                                    <template v-if="flowForm.schema === 'multi'">
                                        <v-col cols="12">
                                            <v-select
                                                    v-model="flowForm.landings"
                                                    :items="landings"
                                                    item-text="name"
                                                    item-value="id"
                                                    label="Landing Pages (multi)"
                                                    multiple
                                                    chips
                                                    outlined
                                                    dense
                                            ></v-select>
                                        </v-col>
                                        <v-col cols="12">
                                            <v-select
                                                    v-model="flowForm.offers"
                                                    :items="offers"
                                                    item-text="name"
                                                    item-value="id"
                                                    label="Offers (multi)"
                                                    multiple
                                                    chips
                                                    outlined
                                                    dense
                                            ></v-select>
                                        </v-col>
                                    </template>

                                    <v-col cols="12" v-if="flowForm.schema === 'redirect'">
                                        <v-text-field
                                          v-model="flowForm.redirect_url"
                                          label="Redirect URL"
                                          placeholder="https://your-redirect-target.com/?param=value"
                                          outlined
                                          dense
                                          required
                                        ></v-text-field>
                                      </v-col>

                                    <v-col cols="12" v-if="flowForm.schema === 'return_404'">
                                      <v-alert type="info" text dense>
                                        This flow will return HTTP 404 Not Found when triggered. No redirects or offers.
                                      </v-alert>
                                    </v-col>

                                    <v-col cols="12" v-if="flowForm.schema === 'redirect_campaign'">
                                        <v-select
                                                v-model="flowForm.redirect_campaign"
                                                :items="campaigns"
                                                item-text="name"
                                                item-value="id"
                                                label="Target Campaign"
                                                outlined
                                                dense
                                                required
                                        ></v-select>

                                        <v-alert type="info" text dense>
                                            This flow will redirect the visitor to another campaign. Make sure tracking
                                            parameters are preserved.
                                        </v-alert>
                                    </v-col>

                                </v-row>
                            </v-container>
                        </v-tab-item>

                        <!-- NOTES TAB -->
                        <v-tab-item>
                            <v-container>
                                <v-row dense>
                                    <v-col cols="12">
                                        <v-textarea label="Notes" v-model="flowForm.notes" outlined auto-grow
                                                    dense></v-textarea>
                                    </v-col>
                                </v-row>
                            </v-container>
                        </v-tab-item>
                    </v-tabs-items>
                </v-card-text>

                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text color="grey" @click="confirmCancelFlow">Cancel</v-btn>
                    <v-btn text color="primary" @click="saveFlow">Save</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>

        <v-dialog v-model="postbackEditorDialog" persistent>
            <v-card class="dialog-lg">
                <v-card-title>
                    <span class="text-h6">Edit Postback URL</span>
                </v-card-title>
                <v-card-text>
                    <v-textarea
                            v-model="postbackUrlDraft"
                            label="Postback URL"
                            auto-grow
                            outlined
                            dense
                            append-icon="mdi-content-copy"
                            @click:append="copyText(postbackUrlDraft)"
                    ></v-textarea>

                    <v-divider class="my-3"></v-divider>

                    <div>Click to insert variable:</div>
                    <v-chip-group column>
                        <v-chip
                                v-for="macro in postbackMacros"
                                :key="macro"
                                class="ma-1"
                                small
                                outlined
                                :class="isMacroInUrl(macro) ? 'primary--text' : ''"
                                @click="insertMacro(macro)"
                        >
                            {{"{"}}{{macro}}{{"}"}}
                        </v-chip>
                    </v-chip-group>
                </v-card-text>
                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="postbackEditorDialog = false">Cancel</v-btn>
                    <v-btn color="primary" elevation="0" @click="applyPostbackUrl">Apply</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>

        <v-dialog v-model="tagEditor.open" persistent>
            <v-card class="dialog-sm">
                <v-card-title class="text-h6">Tags — {{ tagEditor.name }}</v-card-title>
                <v-card-text>
                    <v-combobox
                            v-model="tagEditor.tags"
                            :items="allTags"
                            label="Tags"
                            multiple
                            chips
                            small-chips
                            deletable-chips
                            outlined
                            dense
                            hint="Type a tag and press Enter"
                            persistent-hint
                    ></v-combobox>
                </v-card-text>
                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="tagEditor.open = false">Cancel</v-btn>
                    <v-btn color="primary" elevation="0" @click="saveTagEditor">Save</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>

        <v-dialog v-model="importDialog" persistent max-width="640px">
            <v-card>
                <v-card-title class="text-h6">Import campaigns (CSV)</v-card-title>
                <v-card-text>
                    <div class="caption grey--text mb-2">
                        Paste CSV with the export header
                        <code>id,name,alias,type,status,redirect_mode,domain_id,traffic_source_id,tags,notes</code> —
                        rows with a matching id or name are updated, the rest are created. Tags are ;-separated.
                    </div>
                    <v-textarea
                            v-model="importText"
                            outlined
                            dense
                            rows="8"
                            placeholder="id,name,alias,type,status,redirect_mode,domain_id,traffic_source_id,tags,notes"
                            :disabled="importLoading"
                    ></v-textarea>
                    <div v-if="importResults.length" class="import-results">
                        <div v-for="r in importResults" :key="r.line" class="caption import-result-line"
                             :class="r.ok ? 'import-ok' : 'import-fail'">
                            <v-icon x-small class="mr-1">{{ r.ok ? 'mdi-check' : 'mdi-close' }}</v-icon>
                            Line {{ r.line }}: {{ r.detail }}
                        </div>
                    </div>
                </v-card-text>
                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="closeImport">Close</v-btn>
                    <v-btn color="primary" elevation="0" :loading="importLoading" :disabled="!importText.trim()"
                           @click="runImport">Import</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>

        <v-dialog v-model="simulateDialog" max-width="560px">
            <v-card>
                <v-card-title class="text-h6">
                    Simulate — {{ simulateData.campaign || '…' }}
                    <v-spacer></v-spacer>
                    <v-btn small outlined :loading="simulateLoading" @click="runSimulate">
                        <v-icon small class="mr-1">mdi-refresh</v-icon>Re-run
                    </v-btn>
                </v-card-title>
                <v-card-text v-if="simulateData.stats">
                    <div class="caption grey--text mb-2">
                        {{ simulateData.count }} synthetic visitors through the routing pipeline (no side effects).
                        <span v-if="simulateData.stats.rejected_by_filters">Rejected by filters: {{ simulateData.stats.rejected_by_filters }}.</span>
                        <span v-if="simulateData.stats.fallback">Fallback URL: {{ simulateData.stats.fallback }}.</span>
                        <span v-if="simulateData.stats.capped">Capped: {{ simulateData.stats.capped }}.</span>
                    </div>
                    <div class="subtitle-2 mb-1">Flow distribution</div>
                    <div v-for="(n, idx) in simulateData.stats.flow_distribution" :key="'f' + idx" class="sim-row">
                        <span class="sim-label">{{ simulateFlowName(idx) }}</span>
                        <div class="sim-bar-track">
                            <div class="sim-bar" :style="{width: simulateBarWidth(n), background: simColor(idx)}"></div>
                        </div>
                        <span class="sim-count">{{ n }}</span>
                    </div>
                    <div class="subtitle-2 mt-3 mb-1">Schema distribution</div>
                    <div v-for="(n, sch) in simulateData.stats.schema_distribution" :key="'s' + sch" class="sim-row">
                        <span class="sim-label">{{ sch }}</span>
                        <div class="sim-bar-track">
                            <div class="sim-bar sim-bar--schema" :style="{width: simulateBarWidth(n)}"></div>
                        </div>
                        <span class="sim-count">{{ n }}</span>
                    </div>
                    <div class="subtitle-2 mt-3 mb-1">Offer distribution</div>
                    <div v-for="(n, oid) in simulateData.stats.offer_distribution" :key="'o' + oid" class="sim-row">
                        <span class="sim-label">{{ offerMap[oid] || ('Offer #' + oid) }}</span>
                        <div class="sim-bar-track">
                            <div class="sim-bar sim-bar--offer" :style="{width: simulateBarWidth(n)}"></div>
                        </div>
                        <span class="sim-count">{{ n }}</span>
                    </div>
                </v-card-text>
                <v-card-text v-else-if="simulateLoading">
                    <div class="pa-4 text-center grey--text">Running simulation…</div>
                </v-card-text>
                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="simulateDialog = false">Close</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>

        <v-dialog v-model="bulkTagDialog" persistent>
            <v-card class="dialog-sm">
                <v-card-title class="text-h6">Tag {{ selected.length }} campaigns</v-card-title>
                <v-card-text>
                    <v-select
                            label="Mode"
                            v-model="bulkTagMode"
                            :items="[{text: 'Add to existing tags', value: 'add'}, {text: 'Replace all tags', value: 'replace'}]"
                            outlined
                            dense
                    ></v-select>
                    <v-combobox
                            v-model="bulkTagInput"
                            label="Tags"
                            multiple
                            chips
                            small-chips
                            deletable-chips
                            outlined
                            dense
                            hint="Type a tag and press Enter"
                            persistent-hint
                    ></v-combobox>
                </v-card-text>
                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="bulkTagDialog = false">Cancel</v-btn>
                    <v-btn color="primary" elevation="0" :loading="bulkLoading" @click="applyBulkTags">Apply</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>

        <v-dialog v-model="metricsCustomDialog" persistent>
            <v-card class="dialog-sm">
                <v-card-title class="text-h6">Custom stats period</v-card-title>
                <v-card-text>
                    <v-date-picker v-model="customRange" range no-title :first-day-of-week="1" full-width></v-date-picker>
                </v-card-text>
                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="metricsCustomDialog = false">Cancel</v-btn>
                    <v-btn color="primary" elevation="0" @click="applyCustomMetricsRange">Apply</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>


        <v-row dense class="mt-4">
            <v-col>
                <div :key="'camp-table-' + loading" class="section-enter">
                <v-card>
                    <!-- Bulk actions bar -->
                    <div v-if="selected.length" class="d-flex align-center pa-2 pl-4 bulk-bar">
                        <span class="text-body-2 font-weight-medium mr-4">{{ selected.length }} selected</span>
                        <v-btn small color="primary" elevation="0" class="mr-2" :loading="bulkLoading" @click="bulkSetStatus('active')">
