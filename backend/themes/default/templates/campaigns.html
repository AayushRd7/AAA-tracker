                                    <v-col cols="12" md="4">
                                      <v-text-field
                                              v-model.number="flowForm.caps.per_hour"
                                              type="number" min="0"
                                              label="Per hour (0 = unlimited)"
                                              dense outlined hide-details
                                      ></v-text-field>
                                    </v-col>
                                    <v-col cols="12" md="4">
                                      <v-text-field
                                              v-model.number="flowForm.caps.per_day"
                                              type="number" min="0"
                                              label="Per day (0 = unlimited)"
                                              dense outlined hide-details
                                      ></v-text-field>
                                    </v-col>
                                    <v-col cols="12" md="4">
                                      <v-text-field
                                              v-model.number="flowForm.caps.total"
                                              type="number" min="0"
                                              label="Total (0 = unlimited)"
                                              dense outlined hide-details
                                      ></v-text-field>
                                    </v-col>
                                  </v-row>
                                </v-expansion-panel-content>
                              </v-expansion-panel>
                            </v-expansion-panels>
                          </v-col>
                        </v-row>
                      </v-container>
                    </v-tab-item>

                        <!-- FILTERS TAB -->
                        <v-tab-item v-if="flowForm.type !== 'default'">
                            <v-container>
                                <v-row dense align="center">
                                    <v-col cols="12" md="4">
                                        <v-select
                                                :items="[{text: 'All groups must match', value: 'and'}, {text: 'Any group must match', value: 'or'}]"
                                                v-model="filtersModel.combinator"
                                                label="Groups"
                                                dense outlined hide-details
                                        ></v-select>
                                    </v-col>
                                    <v-col cols="12" md="8" class="text-md-right">
                                        <v-btn small color="primary" outlined @click="addFilterGroup">
                                            <v-icon small class="mr-1">mdi-plus</v-icon>Add group
                                        </v-btn>
                                    </v-col>
                                </v-row>

                                <v-card v-for="(group, gi) in filtersModel.groups" :key="'fg_' + gi"
                                        outlined class="mb-3 mt-2 filter-group-card">
                                    <v-card-text class="pb-2">
                                        <v-row dense align="center">
                                            <v-col cols="6" md="3">
                                                <v-select
                                                        :items="[{text: 'AND', value: 'and'}, {text: 'OR', value: 'or'}]"
                                                        v-model="group.logic"
                                                        label="Match in group"
                                                        dense outlined hide-details
                                                ></v-select>
                                            </v-col>
                                            <v-col cols="6" md="7" class="grey--text caption">
                                                Group {{ gi + 1 }} of {{ filtersModel.groups.length }}
                                            </v-col>
                                            <v-col cols="12" md="2" class="text-right">
                                                <v-btn icon small color="red" @click="removeFilterGroup(gi)">
                                                    <v-icon>mdi-delete</v-icon>
                                                </v-btn>
                                            </v-col>
                                        </v-row>

                                        <v-row v-for="(cond, ci) in group.conditions" :key="'fc_' + gi + '_' + ci"
                                               dense align="center">
                                            <v-col cols="12" md="3">
                                                <v-select
                                                        :items="filterFieldItems"
                                                        v-model="cond.field"
                                                        label="Field"
                                                        dense outlined hide-details
                                                ></v-select>
                                            </v-col>
                                            <v-col cols="6" md="2">
                                                <v-select
                                                        :items="operatorsForField(cond.field)"
                                                        v-model="cond.operator"
                                                        label="Operator"
                                                        dense outlined hide-details
                                                ></v-select>
                                            </v-col>
                                            <v-col cols="12" md="4" v-if="isListOperator(cond.operator)">
                                                <v-combobox
                                                        v-model="cond.valueList"
                                                        label="Values (press Enter to add)"
                                                        multiple small-chips deletable-chips
                                                        dense outlined hide-details
                                                ></v-combobox>
                                            </v-col>
                                            <v-col cols="12" md="4" v-else-if="!isExistenceOperator(cond.operator)">
                                                <v-text-field
                                                        v-model="cond.value"
                                                        :label="cond.operator === 'cidr' ? 'CIDR (e.g. 10.0.0.0/8, comma list)' : 'Value'"
                                                        dense outlined hide-details
                                                ></v-text-field>
                                            </v-col>
                                            <v-col cols="12" md="4" v-else>
                                                <span class="grey--text caption">—</span>
                                            </v-col>
                                            <v-col cols="6" md="2">
                                                <v-checkbox
                                                        v-model="cond.invert"
                                                        label="IS NOT"
                                                        dense hide-details
                                                        class="mt-0"
                                                ></v-checkbox>
                                            </v-col>
                                            <v-col cols="6" md="1" class="text-right">
                                                <v-btn icon small color="red" @click="removeCondition(gi, ci)">
                                                    <v-icon>mdi-delete</v-icon>
                                                </v-btn>
                                            </v-col>
                                        </v-row>

                                        <v-btn small text color="primary" class="mt-1" @click="addCondition(gi)">
                                            <v-icon small class="mr-1">mdi-plus</v-icon>Add condition
                                        </v-btn>
                                    </v-card-text>
                                </v-card>

                                <v-alert v-if="!filtersModel.groups.length" type="info" text dense class="mt-2">
                                    No filters — this flow matches all visitors.
                                </v-alert>
                            </v-container>
                        </v-tab-item>

                                                    item-value="id"
                                                    label="Landing page"
                                                    outlined
                                                    dense
                                            ></v-select>
                                        </v-col>
                                        <v-col cols="12">
                                            <v-select
                                                    v-model="flowForm.offer"
                                                    :items="offers"
                                                    item-text="name"
                                                    item-value="id"
                                                    label="Offer"
                                                    outlined
                                                    dense
                                            ></v-select>
                                        </v-col>
                                    </template>

                                        <v-select
                                                v-model="flowForm.landing"
                                                :items="landings"
                                                item-text="name"
                                                item-value="id"

                                                dense

        <v-dialog v-model="simulateDialog" max-width="640px">

                <v-card-text class="pb-2">
                    <div class="subtitle-2 mb-2">Visitor profile</div>
                    <v-row dense align="center">
                        <v-col cols="12" sm="6">
                            <div class="caption grey--text">Visitors: {{ simulateProfile.count }}</div>
                            <v-slider v-model="simulateProfile.count" dense min="10" max="1000"
                                      step="10" hide-details color="primary"></v-slider>
                        </v-col>
                        <v-col cols="6" sm="3">
                            <v-select v-model="simulateProfile.country" :items="simCountries"
                                      label="Country" dense hide-details></v-select>
                        </v-col>
                        <v-col cols="6" sm="3">
                            <v-select v-model="simulateProfile.device" :items="simDevices"
                                      label="Device" dense hide-details></v-select>
                        </v-col>
                        <v-col cols="6" sm="3">
                            <v-select v-model="simulateProfile.os" :items="simOS"
                                      label="OS" dense hide-details></v-select>
                        </v-col>
                        <v-col cols="6" sm="3">
                            <v-select v-model="simulateProfile.browser" :items="simBrowsers"
                                      label="Browser" dense hide-details></v-select>
                        </v-col>
                        <v-col cols="6" sm="3">
                            <v-select v-model="simulateProfile.ip_prefix" :items="simPrefixes"
                                      label="IP prefix" dense hide-details></v-select>
                        </v-col>
                        <v-col cols="6" sm="3">
                            <v-text-field v-model="simulateProfile.seed" label="Seed"
                                          placeholder="random" dense hide-details></v-text-field>

                    </v-row>
                    <div class="d-flex align-center mt-2">
                        <v-btn small color="primary" :loading="simulateLoading" @click="runSimulate">
                            <v-icon small class="mr-1">mdi-play</v-icon>Run
                        </v-btn>
                        <span class="caption grey--text ml-3">
                            Empty selects = random mix per visitor. Same seed + same profile = same result.
                        </span>
                    </div>
                </v-card-text>
                <v-card-text v-if="simulateLoading">
                    <div class="py-4 text-center grey--text">
                        <v-progress-circular indeterminate size="20" width="2"
                                             color="primary" class="mr-2"></v-progress-circular>
                        Running {{ simulateProfile.count }} simulated visitors…
                    </div>
                </v-card-text>
                <v-card-text v-else-if="simulateData.stats">
                    <div v-if="!simulateEnabledFlowCount()" class="caption orange--text mb-2">
                        This campaign has no enabled flows — every simulated visitor falls back.
                    </div>
                    <div class="caption grey--text mb-2">
                        <span v-if="simulateLastRun" class="font-weight-medium">Last run {{ simulateLastRun }} · </span>
                        {{ simulateData.count }} synthetic visitors through the routing pipeline (no side effects).
                        <span v-if="simulateData.stats.rejected_by_filters">Rejected by filters: {{ simulateData.stats.rejected_by_filters }}.</span>
                        <span v-if="simulateData.stats.fallback">Fallback URL: {{ simulateData.stats.fallback }}.</span>
                        <span v-if="simulateData.stats.capped">Capped: {{ simulateData.stats.capped }}.</span>
                    </div>
                    <div class="subtitle-2 mb-1">Flow distribution</div>
                    <div v-if="!Object.keys(simulateData.stats.flow_distribution || {}).length"
                         class="caption grey--text">No flow matched (see the fallback count above).</div>
                    <div v-for="(n, idx) in simulateData.stats.flow_distribution" :key="'f' + idx" class="sim-row">
                        <span class="sim-label">{{ simulateFlowName(idx) }}</span>
                        <div class="sim-bar-track">
                            <div class="sim-bar" :style="{width: simulateBarWidth(n), background: simColor(idx)}"></div>
                        </div>
                        <span class="sim-count">{{ n }}</span>
                    </div>
                    <div class="subtitle-2 mt-3 mb-1">Schema distribution</div>
                    <div v-if="!Object.keys(simulateData.stats.schema_distribution || {}).length"
                         class="caption grey--text">No schema was reached.</div>
                    <div v-for="(n, sch) in simulateData.stats.schema_distribution" :key="'s' + sch" class="sim-row">
                        <span class="sim-label">{{ sch }}</span>
                        <div class="sim-bar-track">
                            <div class="sim-bar sim-bar--schema" :style="{width: simulateBarWidth(n)}"></div>
                        </div>
                        <span class="sim-count">{{ n }}</span>
                    </div>
                    <div class="subtitle-2 mt-3 mb-1">Offer distribution</div>
                    <div v-if="!Object.keys(simulateData.stats.offer_distribution || {}).length"
                         class="caption grey--text">No offer was reached.</div>
                    <div v-for="(n, oid) in simulateData.stats.offer_distribution" :key="'o' + oid" class="sim-row">
                        <span class="sim-label">{{ offerMap[oid] || ('Offer #' + oid) }}</span>
                        <div class="sim-bar-track">
                            <div class="sim-bar sim-bar--offer" :style="{width: simulateBarWidth(n)}"></div>
                        </div>
                        <span class="sim-count">{{ n }}</span>
                    </div>
                </v-card-text>
                <v-card-text v-else>
                    <div class="pa-4 text-center grey--text">Press Run to simulate traffic.</div>
                </v-card-text>
                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="simulateDialog = false">Close</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>

        <v-row dense class="mt-4">
            <v-col>
                <div :key="'camp-table-' + loading" class="section-enter">
                <v-card>
                    <!-- Bulk actions bar -->
                    <div v-if="selected.length" class="d-flex align-center pa-2 pl-4 bulk-bar">

                        </v-btn>
                        <v-btn small color="warning" elevation="0" :loading="bulkLoading" @click="bulkSetStatus('paused')">
                            <v-icon small class="mr-1">mdi-pause</v-icon>Pause
                        </v-btn>

                        </v-btn>
                        <v-btn small color="secondary" elevation="0" class="mr-2" @click="openBulkOwner">

                        </v-btn>
                        <v-btn v-if="selectionHasArchived" small color="success" elevation="0" class="mr-2" :loading="bulkLoading" @click="bulkUnarchive">
                            <v-icon small class="mr-1">mdi-archive-arrow-up-outline</v-icon>Restore
                        </v-btn>
                        <v-btn small color="red" elevation="0" class="ml-2" :loading="bulkLoading" @click="bulkDelete">
                            <v-icon small class="mr-1">mdi-trash-can-outline</v-icon>Delete
                        </v-btn>
                        <v-spacer></v-spacer>
                        <v-btn small text @click="selected = []">Clear selection</v-btn>
                    </div>
                    <div class="campaigns-table-wrap">
                    <v-data-table v-col-resize:campaigns="visibleHeaders" class="campaigns-table"
                            v-model="selected"
                            :headers="visibleHeaders"
                            :items="filteredCampaigns"
                            show-select
                            item-key="id"
                            :item-class="rowClass"
                            :items-per-page="10"
                            :footer-props="{ 'items-per-page-options': [10, 25, 50] }"
                            :loading="loading"
                            dense
                    >
                        <template v-slot:item.name="{ item }">
                            <span class="clamp-2 campaign-name">{{ item.name }}</span>
                        </template>
                        <template v-slot:item.clicks="{ item }">
                            {{ (metricsMap[item.id] || {}).clicks != null ? $fmtNum(Number(metricsMap[item.id].clicks)) : '—' }}
                        </template>
                        <template v-slot:item.unique_clicks="{ item }">
                            {{ (metricsMap[item.id] || {}).unique_clicks != null ? $fmtNum(Number(metricsMap[item.id].unique_clicks)) : '—' }}
                        </template>
                        <template v-slot:item.conversions="{ item }">
                            {{ (metricsMap[item.id] || {}).conversions != null ? $fmtNum(Number(metricsMap[item.id].conversions)) : '—' }}
                        </template>
                        <template v-slot:item.leads="{ item }">
                            {{ (metricsMap[item.id] || {}).leads != null ? $fmtNum(Number(metricsMap[item.id].leads)) : '—' }}
                        </template>
                        <template v-slot:item.cr="{ item }">
                            {{ (metricsMap[item.id] || {}).cr != null ? $fmtNum(metricsMap[item.id].cr) + '%' : '—' }}
                        </template>
                        <template v-slot:item.epc="{ item }">
                            {{ (metricsMap[item.id] || {}).epc != null ? formatMoney(metricsMap[item.id].epc) : '—' }}
                        </template>
                        <template v-slot:item.cpc="{ item }">
                            {{ (metricsMap[item.id] || {}).cpc != null ? formatMoney(metricsMap[item.id].cpc) : '—' }}
                        </template>
                        <template v-slot:item.cost="{ item }">
                            <span :class="signClass(-((metricsMap[item.id] || {}).cost || 0))">{{ formatMoney((metricsMap[item.id] || {}).cost) }}</span>
                        </template>
                        <template v-slot:item.revenue="{ item }">
                            <span :class="signClass((metricsMap[item.id] || {}).revenue || 0)">{{ formatMoney((metricsMap[item.id] || {}).revenue) }}</span>
                        </template>
                        <template v-slot:item.profit="{ item }">
                            <span class="font-weight-bold" :class="signClass((metricsMap[item.id] || {}).profit || 0)">{{ formatMoney((metricsMap[item.id] || {}).profit) }}</span>
                        </template>
                        <template v-slot:item.roi="{ item }">
                            <span class="font-weight-bold" :class="signClass((metricsMap[item.id] || {}).roi || 0)">{{ formatPct((metricsMap[item.id] || {}).roi) }}</span>
                        </template>
                        <template v-slot:item.tags="{ item }">
                            <v-chip v-for="t in (item.tags || []).slice(0, 3)" :key="t"

                                    class="mr-1 tag-chip"
                                    :class="tagFilter.includes(t) ? 'tag-chip--on' : ''"

                            <v-btn icon x-small class="ml-1" @click="openTagEditor(item)">
                                <v-icon x-small>mdi-pencil-outline</v-icon>
                            </v-btn>
                        </template>
                        <template v-slot:item.source="{ item }">
                            {{ sourceMap[item.traffic_source_id] || '—' }}
                        </template>
                        <template v-slot:no-data>
                            <div class="empty-state" v-if="campaigns.length && !filteredCampaigns.length">
                                <v-icon>mdi-filter-off-outline</v-icon>
                                <div class="mt-2">No campaigns match the selected tags</div>
                                <v-btn small text color="primary" class="mt-2" @click="tagFilter = []">Clear tag filter</v-btn>

            selectionHasArchived() {
                return this.selected.some(c => this.isArchived(c));
            },
            selectionHasUnarchived() {
                return this.selected.some(c => !this.isArchived(c));
            },
            dateRangeText() {
                return this.date_range.join(' ~ ')
            },
            shieldUaRegexError() {
                const pat = (((this.form || {}).shield || {}).whitelists || {}).ua_regex || '';
                if (!pat) return '';
                try {
                    new RegExp(pat);
                    return '';
                } catch (e) {
                    return 'Regex does not compile: ' + e.message;
                }
            },
            landingMap() {
                const map = {};
                this.landings.forEach(l => (map[l.id] = l.name));

            domainsMap() {

            },
            sourceMap() {

                this.sources.forEach(o => (map[o.id] = o.name));
                return map;
            },
            visibleHeaders() {
                return this.headers.filter(h => this.colVisibility[h.value] !== false);
            },
            allTags() {
                const set = new Set();
                this.campaigns.forEach(c => (c.tags || []).forEach(t => set.add(t)));
                return [...set].sort();
            },
            filteredCampaigns() {
                let rows = this.campaigns;
                // D1b archived rows are hidden unless "Show archived" is on
                if (!this.showArchived) {
                    rows = rows.filter(c => !this.isArchived(c));
                }
                if (!this.tagFilter.length) return rows;
                return rows.filter(c => (c.tags || []).some(t => this.tagFilter.includes(t)));
            },
            metricsTotals() {
                // Blended totals across every campaign in the (filtered) table
                const t = {clicks: 0, unique_clicks: 0, leads: 0, conversions: 0, cost: 0, revenue: 0, profit: 0, cr: 0, epc: 0, cpc: 0, roi: 0};
                this.filteredCampaigns.forEach(c => {
                    const m = this.metricsMap[c.id];
                    if (!m) return;
                    t.clicks += Number(m.clicks) || 0;
                    t.unique_clicks += Number(m.unique_clicks) || 0;
                    t.leads += Number(m.leads) || 0;
                    t.conversions += Number(m.conversions) || 0;
                    t.cost += Number(m.cost) || 0;
                    t.revenue += Number(m.revenue) || 0;
                    t.profit += Number(m.profit) || 0;
                });
                t.cr = t.clicks ? t.conversions / t.clicks * 100 : 0;
                t.epc = t.clicks ? t.revenue / t.clicks : 0;
                t.cpc = t.clicks ? t.cost / t.clicks : 0;
                t.roi = t.cost ? (t.revenue - t.cost) / t.cost * 100 : 0;
                return t;
            },

                    const domain = this.domains.find(d => d.id === this.form.domain_id);

                if (!this.simulateItem) return;

                // Clear the previous result first: the results block is v-if'd on
                // stats, so without this a re-run keeps showing the stale (often
                // identical) output and looks like nothing happened.
                this.simulateData = {};
                this.simulateLastRun = '';
                const startedAt = Date.now();
                const p = this.simulateProfile;
                const profile = {};
                if (p.country) profile.country = p.country;
                if (p.os) profile.os = p.os;
                if (p.browser) profile.browser = p.browser;
                if (p.device) profile.device = p.device;
                if (p.ip_prefix) profile.ip_prefix = p.ip_prefix;
                const body = {count: Math.min(1000, Math.max(10, parseInt(p.count, 10) || 100)),

                if (p.seed !== '' && p.seed !== null && p.seed !== undefined)
                    body.seed = Number(p.seed);

                    const res = await fetch('/simulate/' + this.simulateItem.alias, {
                        method: 'POST',
                        credentials: 'include',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(body)
                    });

                    if (!res.ok) throw new Error(data.detail || 'HTTP ' + res.status);
                    // keep the running state perceptible even on a fast response
                    const elapsed = Date.now() - startedAt;
                    if (elapsed < 450)
                        await new Promise(r => setTimeout(r, 450 - elapsed));
                    this.simulateData = data;
                    this.simulateLastRun = new Date().toLocaleTimeString();

            // ─── Rule group editor (filters) ─────────────────────────
            loadFiltersModel(filters) {
                // Migrate any stored format into the editor model:
                //  - group dict {combinator, groups} → as-is
                //  - list of group dicts → with optional leading {combinator} marker
                //  - legacy flat [{key/parameter, operator, value, condition}] → one AND group
                const model = {combinator: 'and', groups: []};
                if (!filters || (Array.isArray(filters) && !filters.length)) return model;
                let rawGroups = null;
                if (Array.isArray(filters)) {
                    const looksGrouped = filters.some(f => f && typeof f === 'object' && 'conditions' in f);
                    if (looksGrouped) {
                        rawGroups = [];
                        filters.forEach(f => {
                            if (f && typeof f === 'object' && Object.keys(f).length === 1 && 'combinator' in f) {
                                model.combinator = f.combinator === 'or' ? 'or' : 'and';
                            } else if (f) {
                                rawGroups.push(f);
                            }
                        });
                    } else {
                        rawGroups = [{
                            logic: 'and',
                            conditions: filters.map(f => ({
                                field: (f && (f.key || f.parameter || f.field)) || '',
                                operator: (f && f.operator) || 'equals',
                                value: f && f.value !== undefined && f.value !== null ? String(f.value) : '',
                                invert: false
                            }))
                        }];
                    }
                } else if (typeof filters === 'object') {
                    model.combinator = filters.combinator === 'or' ? 'or' : 'and';
                    rawGroups = filters.groups || [];
                }
                model.groups = (rawGroups || []).map(g => ({
                    logic: g.logic === 'or' ? 'or' : 'and',
                    conditions: (g.conditions || []).map(c => {
                        const op = c.operator || 'equals';
                        const value = c.value !== undefined && c.value !== null ? String(c.value) : '';
                        return {
                            field: c.field || c.key || c.parameter || '',
                            operator: op,
                            value: value,
                            invert: !!c.invert,
                            valueList: (op === 'in' || op === 'not_in')
                                ? value.split(',').map(s => s.trim()).filter(Boolean)
                                : []
                        };
                    })
                }));
                return model;
            },
            saveFiltersModel(model) {
                // Serialize the editor model back to the stored group format.
                // No filters → plain [] (matches everything, same as before).
                const groups = (model.groups || [])
                    .map(g => ({
                        logic: g.logic === 'or' ? 'or' : 'and',
                        conditions: (g.conditions || [])
                            .filter(c => c.field)
                            .map(c => ({
                                field: c.field,
                                operator: c.operator || 'equals',
                                value: (c.operator === 'in' || c.operator === 'not_in')
                                    ? (c.valueList || []).join(',')
                                    : (c.value !== undefined && c.value !== null ? String(c.value) : ''),
                                invert: !!c.invert
                            }))
                    }))
                    .filter(g => g.conditions.length);
                if (!groups.length) return [];
                return {combinator: model.combinator === 'or' ? 'or' : 'and', groups};
            },
            addFilterGroup() {
                this.filtersModel.groups.push({logic: 'and', conditions: []});
                this.addCondition(this.filtersModel.groups.length - 1);
            },
            removeFilterGroup(gi) {
                this.filtersModel.groups.splice(gi, 1);
            },
            addCondition(gi) {
                const group = this.filtersModel.groups[gi];
                if (!group) return;
                group.conditions.push({field: 'country', operator: 'equals', value: '', invert: false, valueList: []});
            },
            removeCondition(gi, ci) {
                const group = this.filtersModel.groups[gi];
                if (group) group.conditions.splice(ci, 1);
            },
            operatorsForField(field) {
                let ops;
                if (field === 'ip') ops = this.allOperators.slice();
                else if (this.numericFilterFields.includes(field)) {
                    ops = this.allOperators.filter(o =>
                        ['equals', 'not_equals', 'greater', 'less', 'greater_eq', 'less_eq', 'in', 'not_in', 'exists', 'not_exists'].includes(o));
                } else {
                    ops = this.allOperators.filter(o => o !== 'cidr');
                }
                return ops.map(o => ({text: this.operatorLabels[o], value: o}));
            },
            isListOperator(op) {
                return op === 'in' || op === 'not_in';
            },
            isExistenceOperator(op) {
                return op === 'exists' || op === 'not_exists';
            },
            // ─── Schedule / caps helpers ─────────────────────────────
            parseSchedule(schedule) {
                const model = {timezone: 'UTC', days: [], hoursFrom: 0, hoursTo: 23};
                if (!schedule || typeof schedule !== 'object') return model;
                model.timezone = schedule.timezone || 'UTC';
                model.days = (schedule.days || []).map(d => String(d).toLowerCase().slice(0, 3));
                const hours = schedule.hours;
                if (Array.isArray(hours) && hours.length) {
                    model.hoursFrom = Math.min(...hours.map(Number));
                    model.hoursTo = Math.max(...hours.map(Number));
                } else if (hours && typeof hours === 'object') {
                    model.hoursFrom = hours.from !== undefined ? Number(hours.from) : 0;
                    model.hoursTo = hours.to !== undefined ? Number(hours.to) : 23;
                }
                return model;
            },
            buildSchedule(s) {
                if (!s) return null;
                const from = s.hoursFrom === '' || s.hoursFrom === null || s.hoursFrom === undefined ? 0 : Number(s.hoursFrom);
                const to = s.hoursTo === '' || s.hoursTo === null || s.hoursTo === undefined ? 23 : Number(s.hoursTo);
                const days = (s.days || []).slice();
                const hasDays = days.length > 0;
                const hasHours = !(from === 0 && to === 23);
                if (!hasDays && !hasHours) return null;
                const schedule = {};
                if (s.timezone) schedule.timezone = s.timezone;
                if (hasDays) schedule.days = days;
                if (hasHours) schedule.hours = {from, to};
                return schedule;
            },
            toggleScheduleDay(day) {
                const days = this.flowForm.schedule.days || (this.flowForm.schedule.days = []);
                const i = days.indexOf(day);
                if (i >= 0) days.splice(i, 1);
                else days.push(day);
            },
            clearSchedule() {
                this.flowForm.schedule = {timezone: 'UTC', days: [], hoursFrom: 0, hoursTo: 23};
            },
            flowScheduleSummary(schedule) {
                if (!schedule) return '';
                const parts = [];
                if (schedule.timezone) parts.push(schedule.timezone);
                if (schedule.days && schedule.days.length) parts.push(schedule.days.join(','));
                if (schedule.hours) {
                    parts.push(typeof schedule.hours === 'object' && !Array.isArray(schedule.hours)
                        ? `hours ${schedule.hours.from}-${schedule.hours.to}`
                        : `hours ${schedule.hours.join(',')}`);
                }
                return parts.join(' · ') || '—';
            },
            flowCapsSummary(caps) {
                const parts = [];
                if (caps.per_hour) parts.push(`${caps.per_hour}/hour`);
                if (caps.per_day) parts.push(`${caps.per_day}/day`);
                if (caps.total) parts.push(`${caps.total} total`);
                return parts.join(', ') || '—';
            },
            flowFiltersSummary(flow) {
                const f = flow.filters;
                if (!f || (Array.isArray(f) && !f.length)) return [];
                const lines = [];
                const describe = c => `${c.invert ? 'NOT ' : ''}${c.field || c.key || c.parameter} ${c.operator} ${c.value}`;
                if (Array.isArray(f)) {
                    const looksGrouped = f.some(x => x && typeof x === 'object' && 'conditions' in x);
                    if (!looksGrouped) {
                        // legacy flat list
                        f.forEach((c, i) => {
                            const glue = i === 0 ? '' : ((c.condition || 'and').toUpperCase() + ' ');
                            lines.push(glue + describe(c));
                        });
                        return lines;
                    }
                    f.forEach((g, gi) => {
                        if (g && g.conditions) {
                            lines.push(`Group ${gi + 1} (${g.logic || 'and'}): ` + g.conditions.map(describe).join(`, ${g.logic === 'or' ? 'or' : 'and'} `));
                        }
                    });
                    return lines;
                }
                if (typeof f === 'object') {
                    const comb = f.combinator === 'or' ? 'ANY' : 'ALL';
                    (f.groups || []).forEach((g, gi) => {
                        lines.push(`${comb} · Group ${gi + 1} (${g.logic || 'and'}): ` + (g.conditions || []).map(describe).join(`, ${g.logic === 'or' ? 'or' : 'and'} `));
                    });
                }
                return lines;
            },
            async generateTrackingScript() {
                if (this.form.integration_method === null) {
                    this.trackingScript = 'none';
                    return;
                }
                switch (this.form.integration_method.toString()) {
                    case 'js':
                        const url = this.campaignUrl || '';
                        const safeUrl = url.replace(/"/g, '\\"');

                        let raw_script_result = `
                            (async () => {
                              const TRACKING_URL = "${safeUrl}";
                              const COOKIE_EXP_DAYS = 365;

                              function setCookie(name, value, days) {
                                const date = new Date();
                                date.setTime(date.getTime() + days * 86400000);
                                document.cookie = \`\${name}=\${encodeURIComponent(value)}; expires=\${date.toUTCString()}; path=/\`;
                              }

                              function getCookie(name) {
                                const match = document.cookie.match(new RegExp("(^| )" + name + "=([^;]+)"));
                                return match ? decodeURIComponent(match[2]) : null;
                              }

                              function generateShortID() {
                                return Math.random().toString(16).slice(2, 12);
                              }

                              function getAllUrlParams() {
                                const params = {};
                                new URLSearchParams(window.location.search).forEach((value, key) => {
                                  params[key] = value;
                                });
                                return params;
                              }

                              // 1. Collect all GET parameters and store them in cookies
                              const urlParams = getAllUrlParams();
                              for (const [key, value] of Object.entries(urlParams)) {
                                if (value) setCookie(key, value, COOKIE_EXP_DAYS);
                              }

                              // 2. Collect all known parameters from the cookies
                              const allKeys = new Set([...Object.keys(urlParams), ...document.cookie.split('; ').map(c => c.split('=')[0])]);
                              const collectedParams = {};
                              allKeys.forEach(key => {
                                const val = getCookie(key);
                                if (val) collectedParams[key] = val;
                              });

                              // 3. visitor_id
                              let visitorId = getCookie('visitor_id');
                              if (!visitorId) {
                                visitorId = generateShortID();
                                setCookie('visitor_id', visitorId, COOKIE_EXP_DAYS);
                              }

                              collectedParams['visitor_id'] = visitorId;
                              collectedParams['user_agent'] = navigator.userAgent;
                              collectedParams['timestamp'] = new Date().toISOString();
                              collectedParams['referrer'] = document.referrer;
                              collectedParams['url'] = location.href;

                              // 4. Sending the visit
                              try {
                                await fetch(TRACKING_URL, {
                                  method: 'POST',
                                  headers: { 'Content-Type': 'application/json' },
                                  body: JSON.stringify(collectedParams)
                                });
                              } catch (e) {
                                console.warn('Tracking failed', e);
                              }

                              // 5. Method for conversions
                              window.trackConversion = async (eventType, cost = 0) => {
                                if (!['lead', 'sale', 'rejected', 'upsale', 'hold'].includes(eventType)) return;
                                try {
                                  await fetch(TRACKING_URL, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                      event: eventType,
                                      cost: parseFloat(cost),
                                      visitor_id,
                                      timestamp: new Date().toISOString()
                                    })
                                  });
                                } catch (e) {
                                  console.warn('Conversion tracking failed', e);
                                }
                              };
                            })();`
                        let result_script = await minifyScript(raw_script_result);
                        this.trackingScript = `<script async>` + result_script + `<\/script>`;
                        break;
                    case 'php':
                        this.trackingScript = `<?php include('https://cdn.example.com/tracking.php'); ?>`;
                        break;
                    case 'forced_php':
                        this.trackingScript = `<?php header('Location: https://example.com/redirect.php'); ?>`;
                        break;
                    case 'qr':
                        this.trackingScript = `<img src="https://api.qrserver.com/v1/create-qr-code/?data=${this.campaignUrl}" alt="QR Code">`;
                        break;
                    case 'pixel_email':
                        this.trackingScript = `<img src="${this.campaignUrl}" alt="Tracking Pixel" style="display:none;">`;
                        break;
                    default:
                        this.trackingScript = 'none';
                        break;
                }
            },

            saveFlow() {
                if (!this.flowForm.name) {
                    this.$root.$emit('show-message', {

                        text: 'Flow must have a name.'
                    });
                    return;
                }

                // serialize filters (group format), schedule and caps into the flow
                this.flowForm.filters = this.saveFiltersModel(this.filtersModel);
                this.flowForm.schedule = this.buildSchedule(this.flowForm.schedule);
                const caps = {
                    per_hour: Number(this.flowForm.caps && this.flowForm.caps.per_hour) || 0,
                    per_day: Number(this.flowForm.caps && this.flowForm.caps.per_day) || 0,
                    total: Number(this.flowForm.caps && this.flowForm.caps.total) || 0
                };
                this.flowForm.caps = (caps.per_hour || caps.per_day || caps.total) ? caps : null;

                if(this.flowForm.type == 'default') {
                    this.flowForm.filters = [];
                }

                // keep configs small: the default action and unused html are omitted
                if (this.flowForm.action === 'redirect') {
                    delete this.flowForm.action;
                }
                if (this.flowForm.action !== 'show_html') {
                    delete this.flowForm.html;
                }

                if (this.isEditingFlow && this.editedFlowIndex !== null) {
                    // Update the flow by index
                    this.form.flows.splice(this.editedFlowIndex, 1, {...this.flowForm});
                } else {
                    this.form.flows.push({...this.flowForm});
                }

                this.flowDialog = false;
                this.editedFlowIndex = null;
                this.form.flows.sort((a, b) => {
                    const getPriority = (flow) => {
                        if (flow.type === 'forced') return 0;   // above everything
                        if (flow.type === 'regular') return 1;  // by position
                        if (flow.type === 'default') return 2;  // at the end
                        return 3; // unknown type — even lower
                    };

                    const priorityA = getPriority(a);
                    const priorityB = getPriority(b);

                    if (priorityA !== priorityB) {
                        return priorityA - priorityB;
                    }

                    // if the type is the same (e.g. both regular) — sort by position
                    return (a.position || 9999) - (b.position || 9999);
                });
                this.updateFlowPositions();

            },

            loadCampaignMetrics() {
                // Live per-campaign stats from ClickHouse over the selected period
                const now = new Date();
                const iso = d => d.toISOString().split('T')[0];
                const daysAgo = n => { const d = new Date(now); d.setDate(d.getDate() - n); return d; };
                const mondayThisWeek = () => { const d = new Date(now); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); return d; };
                let from = null, to = null;

                switch (this.metricsPeriod) {
                    case 'today': from = now; to = now; break;
                    case 'yesterday': { const y = daysAgo(1); from = y; to = y; break; }
                    case 'this_week': from = mondayThisWeek(); to = now; break;
                    case 'last_week': { const prevEnd = new Date(mondayThisWeek()); prevEnd.setDate(prevEnd.getDate() - 1); const d = new Date(prevEnd); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); from = d; to = prevEnd; break; }
                    case '2d': from = daysAgo(1); to = now; break;
                    case '3d': from = daysAgo(2); to = now; break;
                    case '7d': from = daysAgo(6); to = now; break;
                    case '14d': from = daysAgo(13); to = now; break;
                    case '30d': from = daysAgo(29); to = now; break;
                    case 'this_month': from = new Date(now.getFullYear(), now.getMonth(), 1); to = now; break;
                    case 'last_month': from = new Date(now.getFullYear(), now.getMonth() - 1, 1); to = new Date(now.getFullYear(), now.getMonth(), 0); break;
                    case 'this_year': from = new Date(now.getFullYear(), 0, 1); to = now; break;
                    case 'last_year': from = new Date(now.getFullYear() - 1, 0, 1); to = new Date(now.getFullYear() - 1, 11, 31); break;
                    case 'custom': from = this.customRange[0] ? new Date(this.customRange[0]) : null; to = this.customRange[1] ? new Date(this.customRange[1]) : null; break;
                    default: from = null; to = null; // all time
                }

                const qs = [];
                if (from) qs.push('date_from=' + iso(from));
                if (to) qs.push('date_to=' + iso(to));
                fetch('/backend/api/campaigns/metrics' + (qs.length ? '?' + qs.join('&') : ''), {
                    credentials: 'include'
                })
                    .then(res => res.ok ? res.json() : Promise.reject(new Error('HTTP ' + res.status)))
                    .then(data => {
                        const map = {};
                        Object.keys(data || {}).forEach(id => { map[parseInt(id, 10)] = data[id]; });
                        this.metricsMap = map;
                        // Mirror metric values onto the rows so table sorting works
                        this.campaigns.forEach(c => {
                            const m = map[c.id] || {};
                            ['clicks', 'unique_clicks', 'conversions', 'leads', 'cost', 'revenue', 'profit', 'cr', 'epc', 'roi'].forEach(k => {
                                if (m[k] !== undefined) Vue.set(c, k, m[k]);
                            });
                        });
                    })
                    .catch(err => console.error('metrics', err));
            },
            metricsPeriodChanged() {
                if (this.metricsPeriod === 'custom') {
                    if (!this.customRange || this.customRange.length !== 2) {
                        const now = new Date();
                        const from = new Date(now); from.setDate(from.getDate() - 29);
                        this.customRange = [from.toISOString().split('T')[0], now.toISOString().split('T')[0]];
                    }
                    this.metricsCustomDialog = true;
                } else {
                    this.loadCampaignMetrics();
                }
            },
            applyCustomMetricsRange() {
                const picked = this.customRange || [];
                if (picked.length !== 2) {
                    this.$root.$emit('show-message', {type: 'error', text: 'Pick a start and an end date, then hit Apply.'});
                    return;
                }
                this.customRange = [...picked].sort();
                this.metricsCustomDialog = false;
                this.loadCampaignMetrics();
            },
            toggleCol(value, on) {
                if (value === 'name' || value === 'actions') return;
                Vue.set(this.colVisibility, value, !!on);
                this.persistCols();
            },
            persistCols() {
                try { localStorage.setItem('colv:campaigns', JSON.stringify(this.colVisibility)); } catch (e) {}
            },
            resetCols() {
                this.colVisibility = {};
                this.persistCols();
            },
            openTagEditor(item) {
                this.tagEditor = {open: true, id: item.id, name: item.name, tags: [...(item.tags || [])]};
            },
            toggleTagFilter(tag) {
                const i = this.tagFilter.indexOf(tag);
                if (i >= 0) this.tagFilter.splice(i, 1);
                else this.tagFilter.push(tag);
            },
            async saveTagEditor() {
                const tags = (this.tagEditor.tags || []).map(t => String(t).trim()).filter(Boolean);
                try {
                    const res = await fetch(`/backend/api/campaigns/${this.tagEditor.id}/tags`, {
                        method: 'PATCH',
                        credentials: 'include',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({tags})
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const updated = await res.json();
                    const i = this.campaigns.findIndex(c => c.id === updated.id);
                    if (i >= 0) Vue.set(this.campaigns, i, Object.assign({}, this.campaigns[i], {tags: updated.tags || []}));
                    this.tagEditor.open = false;
                    this.$root.$emit('show-message', {type: 'success', text: 'Tags saved'});
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error', text: 'Failed to save tags: ' + sanitizeToastMessage(err.message)});
                }
            },
            openBulkTags() {
                this.bulkTagInput = [];
                this.bulkTagMode = 'add';
                this.bulkTagDialog = true;
            },
            ownerChoices() {
                return [{text: '— Unassigned —', value: null}]
                    .concat((this.campaignUsers || []).map(u => ({text: u.username, value: u.id})));
            },
            async openBulkOwner() {
                if (!this.campaignUsers.length) {
                    try {
                        const res = await fetch('/backend/api/campaigns/users', {credentials: 'include'});
                        if (res.ok) this.campaignUsers = await res.json();
                    } catch (e) { /* picker just stays empty */ }
                }
                this.bulkOwnerId = null;
                this.bulkOwnerDialog = true;
            },
            async applyBulkOwner() {
                this.bulkLoading = true;
                try {
                    const res = await fetch('/backend/api/campaigns/bulk/owner', {
                        method: 'POST',
                        credentials: 'include',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ids: this.selected.map(c => c.id), owner_id: this.bulkOwnerId})
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    this.bulkOwnerDialog = false;
                    this.selected = [];
                    this.loadCampaigns();
                    this.$root.$emit('show-message', {type: 'success', text: 'Owner updated'});
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error', text: 'Set owner failed: ' + sanitizeToastMessage(err.message)});
                } finally {
                    this.bulkLoading = false;
                }
            },
            async applyBulkTags() {
                const tags = (this.bulkTagInput || []).map(t => String(t).trim()).filter(Boolean);
                if (!tags.length) {
                    this.$root.$emit('show-message', {type: 'error', text: 'Add at least one tag first.'});
                    return;
                }
                this.bulkLoading = true;
                try {
                    const res = await fetch('/backend/api/campaigns/bulk/tags', {
                        method: 'POST',
                        credentials: 'include',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ids: this.selected.map(c => c.id), tags, mode: this.bulkTagMode})
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    this.bulkTagDialog = false;
                    this.selected = [];
                    this.loadCampaigns();
                    this.$root.$emit('show-message', {type: 'success', text: 'Tags applied'});
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error', text: 'Bulk tagging failed: ' + sanitizeToastMessage(err.message)});
                } finally {
                    this.bulkLoading = false;
                }
            },
            totalsCell(value) {
                const t = this.metricsTotals;
                switch (value) {
                    case 'name': return 'Totals';
                    case 'clicks': return this.$fmtNum(t.clicks);
                    case 'unique_clicks': return this.$fmtNum(t.unique_clicks);
                    case 'leads': return this.$fmtNum(t.leads);
                    case 'conversions': return this.$fmtNum(t.conversions);
                    case 'cr': return this.$fmtNum(t.cr) + '%';
                    case 'epc': return this.formatMoney(t.epc);
                    case 'cpc': return this.formatMoney(t.cpc);
                    case 'cost': return this.formatMoney(t.cost);
                    case 'revenue': return this.formatMoney(t.revenue);
                    case 'profit': return this.formatMoney(t.profit);
                    case 'roi': return this.formatPct(t.roi);
                    default: return '';
                }
            },
            perfRowClass(item) {
                const m = this.metricsMap[item.id];
                if (!m) return '';
                const profit = parseFloat(m.profit) || 0;
                const cost = Math.abs(parseFloat(m.cost) || 0);
                const roi = parseFloat(m.roi) || 0;
                // ROI first; fall back to profit/cost when ROI is 0
                let score = null;
                if (roi !== 0) score = roi;
                else if (profit !== 0) score = cost ? (profit / cost) * 100 : (profit > 0 ? 100 : -100);
                if (score === null || score === 0) return '';
                if (score >= 50) return 'perf-win-3';
                if (score >= 10) return 'perf-win-2';
                if (score > 0) return 'perf-win-1';
                if (score <= -50) return 'perf-loss-3';
                if (score <= -10) return 'perf-loss-2';
                return 'perf-loss-1';
            },
            signClass(v) {
                const n = parseFloat(v) || 0;
                if (n > 0) return 'num-pos';
                if (n < 0) return 'num-neg';
                return 'num-neutral';
            },
            formatMoney(v) {
                const n = parseFloat(v) || 0;
                return '$' + this.$fmtNum(n);
            },
            formatPct(v) {
                const n = parseFloat(v) || 0;
                return (n > 0 ? '+' : '') + this.$fmtNum(n) + '%';
            },
            async deleteCampaign(item) {
                const ok = await this.$refs.confirm.open(
                    'Delete campaign',
                    `Are you sure you want to delete campaign "${item.name}"? All tracked clicks and conversions for it will be permanently deleted too. This cannot be undone.`,
                    'Delete'
                );
                if (!ok) return;

                fetch(`/backend/api/campaigns/${item.id}`, {
                    method: 'DELETE',
                    credentials: 'include'
                })
                    .then(async res => {
                        const text = await res.text();
                        if (!res.ok) {
                            let msg = text;
                            try {
                                const err = JSON.parse(text);
                                msg = err.detail || msg;
                            } catch {
                            }
                            throw new Error(msg);
                        }

                        this.$root.$emit('show-message', {
                            type: 'success',
                            text: `Campaign "${item.name}" deleted successfully`
                        });

                        this.loadCampaigns(); // Refresh the list
                    })
                    .catch(err => {
                        this.$root.$emit('show-message', {
                            type: 'error',
                            text: `Failed to delete campaign: ${sanitizeToastMessage(err.message)}`
                        });
                    });
            },
            async duplicateCampaign(item) {
                const ok = await this.$refs.confirm.open(
                    'Duplicate campaign',
                    `Create a copy of "${item.name}"?`,
                    'Duplicate'
                );
                if (!ok) return;

                const payload = {
                    name: `${item.name} (copy)`,
                    alias: this.generateAlias(),
                    type: item.type,
                    status: item.status,
                    redirect_mode: item.redirect_mode,
                    traffic_source_id: item.traffic_source_id,
                    domain_id: item.domain_id,
                    notes: item.notes,
                    config: item.config || {}
                };

                fetch('/backend/api/campaigns/', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                })
                    .then(async res => {
                        const text = await res.text();
                        if (!res.ok) {
                            let msg = text;
                            try { msg = JSON.parse(text).detail || msg; } catch {}
                            throw new Error(msg);
                        }
                        this.$root.$emit('show-message', {
                            type: 'success',
                            text: `Campaign duplicated as "${payload.name}"`
                        });
                        this.loadCampaigns();
                    })
                    .catch(err => {
                        this.$root.$emit('show-message', {
                            type: 'error',
                            text: `Failed to duplicate campaign: ${sanitizeToastMessage(err.message)}`
                        });
                    });
            },
            async bulkSetStatus(status) {
                this.bulkLoading = true;
                const targets = this.selected.slice();
                let done = 0, failed = 0;
                for (const item of targets) {
                    try {
                        const res = await fetch(`/backend/api/campaigns/${item.id}`, {
                            method: 'PUT',
                            credentials: 'include',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                name: item.name,
                                alias: item.alias,
                                type: item.type,
                                status: status,
                                redirect_mode: item.redirect_mode,
                                traffic_source_id: item.traffic_source_id,
                                domain_id: item.domain_id,
                                notes: item.notes,
                                config: item.config || {}
                            })
                        });
                        if (!res.ok) throw new Error(await res.text());
                        done++;
                    } catch (e) {
                        failed++;
                    }
                }
                this.bulkLoading = false;
                this.selected = [];
                this.loadCampaigns();
                this.$root.$emit('show-message', {
                    type: failed ? 'warning' : 'success',
                    text: `${done} campaign(s) ${status === 'active' ? 'activated' : 'paused'}` + (failed ? `, ${failed} failed` : '')
                });
            },
            async bulkDelete() {
                const n = this.selected.length;
                const ok = await this.$refs.confirm.open(
                    'Delete campaigns',
                    `Are you sure you want to delete ${n} campaign(s)? All tracked clicks and conversions for them will be permanently deleted too. This cannot be undone.`,
                    'Delete'
                );
                if (!ok) return;
                this.bulkLoading = true;
                let done = 0, failed = 0;
                for (const item of this.selected.slice()) {
                    try {
                        const res = await fetch(`/backend/api/campaigns/${item.id}`, {
                            method: 'DELETE',
                            credentials: 'include'
                        });
                        if (!res.ok) throw new Error(await res.text());
                        done++;
                    } catch (e) {
                        failed++;
                    }
                }
                this.bulkLoading = false;
                this.selected = [];
                this.loadCampaigns();
                this.$root.$emit('show-message', {
                    type: failed ? 'warning' : 'success',
                    text: `${done} campaign(s) deleted` + (failed ? `, ${failed} failed` : '')
                });
            },
            generateAlias(length = 8) {
                const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let result = '';
                for (let i = 0; i < length; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return result;
            },
            addPostback() {
                const copy = {
                    url: this.newPostback.url,
                    method: this.newPostback.method,
                    status: {...this.newPostback.status}
                };
                this.form.postbacks.push(copy);

                // reset
                this.newPostback = {
                    url: '',
                    method: 'GET',
                    status: {
                        lead: true,
                        sale: true,
                        rejected: false,
                        upsale: false,
                        hold: false
                    }
                };
            },
            addPostbackRule() {
                this.postbackRules.push({
                    enabled: true,
                    name: '',
                    conditions: [{field: 'status', operator: 'equals', value: ''}],
                    action: {type: 'set_status', value: '', mode: 'absolute'}
                });
            },
            savePostbackRules() {
                this.postbackRulesSaving = true;
                fetch('/backend/api/settings/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify({settings: {postback_rules: this.postbackRules}})
                })
                    .then(r => r.json())
                    .then(() => {
                        this.$root.$emit('show-message', {
                            type: 'success',
                            text: 'Global postback rules saved (may take up to 30s to apply)'
                        });
                    })
                    .catch(err => {
                        this.$root.$emit('show-message', {
                            type: 'error', text: sanitizeToastMessage(err.message)
                        });
                    })
                    .finally(() => {
                        this.postbackRulesSaving = false;
                    });
            },
            openPostbackEditor(i = null) {
                this.postbackEditorIndex = i;

                if (i !== null) {
                    this.postbackUrlDraft = this.form.postbacks[i]?.url || '';
                } else {
                    this.postbackUrlDraft = this.newPostback.url || '';
                }

                this.postbackEditorDialog = true;
            },
            insertMacro(macro) {
                const baseUrl = this.postbackUrlDraft.split('?')[0];
                const rawQuery = this.postbackUrlDraft.split('?')[1] || '';
                const queryParams = new URLSearchParams(rawQuery);

                const key = `${macro}`;
                const value = `{${macro}}`;

                // Remove if it already exists
                if (queryParams.has(key)) {
                    queryParams.delete(key);
                } else {
                    queryParams.append(key, value);
                }

                // Assemble back
                const queryString = queryParams.toString()
                    .replace(/%7B/g, '{')
                    .replace(/%7D/g, '}');
                this.postbackUrlDraft = queryString ? `${baseUrl}?${queryString}` : baseUrl;
            },
            isMacroInUrl(macro) {
                const query = this.postbackUrlDraft.split('?')[1] || '';
                const params = new URLSearchParams(query);
                return params.get(macro) === `{${macro}}`;
            },
            applyPostbackUrl() {
                if (this.postbackEditorIndex !== null) {
                    this.form.postbacks[this.postbackEditorIndex].url = this.postbackUrlDraft;
                } else {
                    this.newPostback.url = this.postbackUrlDraft;
                }
                this.postbackEditorDialog = false;
            },
            editNewPostback() {
                this.postbackEditorIndex = null; // means we are editing a new one
                this.postbackUrlDraft = this.newPostback.url;
                this.postbackEditorDialog = true;
            },
            resetForm() {
                this.isEdit = false;
                this.form = {
                    id: null,
                    name: '',
                    alias: this.generateAlias(),
                    type: 'campaign',
                    status: 'active',
                    redirect_mode: 'position',
                    domain_id: null,
                    traffic_source_id: null,
                    notes: '',
                    tags: [],
                    ad_platform_campaign_id: '',
                    flowScheme: 'position',
                    integration_method: null,
                    send_se_referrer: true,
                    use_title_as_keyword: true,
                    send_query_params: true,
                    bind_ttl_hours: 24,
                    stickiness: false,
                    cost_model: 'cpc',
                    traffic_loss_percent: 0,
                    cost: 0,
                    cost_currency: 'USD',
                    cost_from_cost_parameter: false,
                    paramsIdMapping: JSON.parse(JSON.stringify(this.baseParamsIdMapping)),
                    postbacks: [],
                    flows: [],
                    funnel: {enabled: false, steps: []},
                    shield: this.defaultShield()
                };
                this.platformAdsets = [];
                this.platformCampaignStatus = null;
                this.platformAdsetBusy = {};
            },

            defaultShield() {
                return {
                    enabled: false,
                    action: 'blank',
                    honeypot: false,
                    whitelists: {ips: [], referers: [], ua_regex: ''}
                };
            },


        }
    });
</script>
