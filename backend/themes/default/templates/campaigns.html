                            <v-icon small class="mr-1">mdi-play</v-icon>Activate
                        </v-btn>
                        <v-btn small color="warning" elevation="0" :loading="bulkLoading" @click="bulkSetStatus('paused')">
                            <v-icon small class="mr-1">mdi-pause</v-icon>Pause
                        </v-btn>
                        <v-btn small color="secondary" elevation="0" class="mr-2 ml-2" @click="openBulkTags">
                            <v-icon small class="mr-1">mdi-tag-multiple-outline</v-icon>Tag
                        </v-btn>
                        <v-btn small color="secondary" elevation="0" class="mr-2" :loading="bulkLoading" @click="bulkArchive">
                            <v-icon small class="mr-1">mdi-archive-arrow-down-outline</v-icon>Archive
                        </v-btn>
                        <v-btn small color="red" elevation="0" class="ml-2" :loading="bulkLoading" @click="bulkDelete">
                            <v-icon small class="mr-1">mdi-trash-can-outline</v-icon>Delete
                        </v-btn>
                        <v-spacer></v-spacer>
                        <v-btn small text @click="selected = []">Clear selection</v-btn>
                    </div>
                    <div class="campaigns-table-wrap">
                    <v-data-table v-col-resize:campaigns="visibleHeaders" class="campaigns-table"
                            v-model="selected"
                            :headers="visibleHeaders"
                            :items="filteredCampaigns"
                            show-select
                            item-key="id"
                            :item-class="rowClass"
                            :items-per-page="10"
                            :footer-props="{ 'items-per-page-options': [10, 25, 50] }"

            dateRangeText() {

            landingMap() {
                const map = {};
                this.landings.forEach(l => (map[l.id] = l.name));
                return map;

            domainsMap() {
                const map = {};
                this.domains.forEach(l => (map[l.id] = l.domain));
                return map;
            },
            offerMap() {
                const map = {};
                this.offers.forEach(o => (map[o.id] = o.name));
                return map;
            },
            sourceMap() {
                const map = {};
                this.sources.forEach(o => (map[o.id] = o.name));
                return map;
            },
            visibleHeaders() {
                return this.headers.filter(h => this.colVisibility[h.value] !== false);
            },
            allTags() {
                const set = new Set();
                this.campaigns.forEach(c => (c.tags || []).forEach(t => set.add(t)));
                return [...set].sort();
            },
            filteredCampaigns() {
                let rows = this.campaigns;
                // D1b archived rows are hidden unless "Show archived" is on
                if (!this.showArchived) {
                    rows = rows.filter(c => !this.isArchived(c));
                }
                if (!this.tagFilter.length) return rows;
                return rows.filter(c => (c.tags || []).some(t => this.tagFilter.includes(t)));
            },
            metricsTotals() {
                // Blended totals across every campaign in the (filtered) table
                const t = {clicks: 0, unique_clicks: 0, leads: 0, conversions: 0, cost: 0, revenue: 0, profit: 0, cr: 0, epc: 0, cpc: 0, roi: 0};
                this.filteredCampaigns.forEach(c => {
                    const m = this.metricsMap[c.id];
                    if (!m) return;
                    t.clicks += Number(m.clicks) || 0;
                    t.unique_clicks += Number(m.unique_clicks) || 0;
                    t.leads += Number(m.leads) || 0;
                    t.conversions += Number(m.conversions) || 0;
                    t.cost += Number(m.cost) || 0;
                    t.revenue += Number(m.revenue) || 0;
                    t.profit += Number(m.profit) || 0;
                });
                t.cr = t.clicks ? t.conversions / t.clicks * 100 : 0;
                t.epc = t.clicks ? t.revenue / t.clicks : 0;
                t.cpc = t.clicks ? t.cost / t.clicks : 0;
                t.roi = t.cost ? (t.revenue - t.cost) / t.cost * 100 : 0;
                return t;
            },

            campaignUrl() {
                if (this.form.domain_id) {
                    const domain = this.domains.find(d => d.id === this.form.domain_id);
                    return domain ? `https://${domain.domain}/${this.form.alias}` : 'domain error';
                } else {
                    if (!this.form.alias) return 'please setup alias';
                    // read server ip from browser
                    const serverIp = window.location.hostname;
                    return `https://${serverIp}/${this.form.alias}`;
                }
            },
            trackerHost() {
                if (this.form.domain_id) {
                    const domain = this.domains.find(d => d.id === this.form.domain_id);
                    if (domain) return domain.domain;
                }
                return window.location.hostname;
            },
            directTrackingScript() {
                const ref = this.form.id || this.form.alias || 'CAMPAIGN_ID';
                return `<script async src="https://${this.trackerHost}/t.js?c=${ref}"><\/script>`;
            },
            conversionPixelImg() {
                const alias = this.form.alias || 'CAMPAIGN_ALIAS';
                return `<img src="https://${this.trackerHost}/p/${alias}?status=sale&payout=XX" width="1" height="1" style="display:none" alt="">`;
            },
            conversionPixelFetch() {
                const alias = this.form.alias || 'CAMPAIGN_ALIAS';
                return `<script>fetch("https://${this.trackerHost}/p/${alias}?status=sale&payout=XX&fmt=json",{mode:"no-cors"});<\/script>`;
            },

            loadFiltersModel(filters) {
                // Migrate any stored format into the editor model:
                //  - group dict {combinator, groups} → as-is
                //  - list of group dicts → with optional leading {combinator} marker
                //  - legacy flat [{key/parameter, operator, value, condition}] → one AND group
                const model = {combinator: 'and', groups: []};
                if (!filters || (Array.isArray(filters) && !filters.length)) return model;
                let rawGroups = null;
                if (Array.isArray(filters)) {
                    const looksGrouped = filters.some(f => f && typeof f === 'object' && 'conditions' in f);
                    if (looksGrouped) {
                        rawGroups = [];
                        filters.forEach(f => {
                            if (f && typeof f === 'object' && Object.keys(f).length === 1 && 'combinator' in f) {
                                model.combinator = f.combinator === 'or' ? 'or' : 'and';
                            } else if (f) {
                                rawGroups.push(f);
                            }
                        });
                    } else {
                        rawGroups = [{
                            logic: 'and',
                            conditions: filters.map(f => ({
                                field: (f && (f.key || f.parameter || f.field)) || '',
                                operator: (f && f.operator) || 'equals',
                                value: f && f.value !== undefined && f.value !== null ? String(f.value) : '',
                                invert: false
                            }))
                        }];
                    }
                } else if (typeof filters === 'object') {
                    model.combinator = filters.combinator === 'or' ? 'or' : 'and';
                    rawGroups = filters.groups || [];
                }
                model.groups = (rawGroups || []).map(g => ({
                    logic: g.logic === 'or' ? 'or' : 'and',
                    conditions: (g.conditions || []).map(c => {
                        const op = c.operator || 'equals';
                        const value = c.value !== undefined && c.value !== null ? String(c.value) : '';
                        return {
                            field: c.field || c.key || c.parameter || '',
                            operator: op,
                            value: value,
                            invert: !!c.invert,
                            valueList: (op === 'in' || op === 'not_in')
                                ? value.split(',').map(s => s.trim()).filter(Boolean)
                                : []
                        };
                    })
                }));
                return model;
            },
            saveFiltersModel(model) {
                // Serialize the editor model back to the stored group format.
                // No filters → plain [] (matches everything, same as before).
                const groups = (model.groups || [])
                    .map(g => ({
                        logic: g.logic === 'or' ? 'or' : 'and',
                        conditions: (g.conditions || [])
                            .filter(c => c.field)
                            .map(c => ({
                                field: c.field,
                                operator: c.operator || 'equals',
                                value: (c.operator === 'in' || c.operator === 'not_in')
                                    ? (c.valueList || []).join(',')
                                    : (c.value !== undefined && c.value !== null ? String(c.value) : ''),
                                invert: !!c.invert
                            }))
                    }))
                    .filter(g => g.conditions.length);
                if (!groups.length) return [];
                return {combinator: model.combinator === 'or' ? 'or' : 'and', groups};
            },

            removeFilterGroup(gi) {

            },
            addCondition(gi) {
                const group = this.filtersModel.groups[gi];
                if (!group) return;
                group.conditions.push({field: 'country', operator: 'equals', value: '', invert: false, valueList: []});
            },
            removeCondition(gi, ci) {
                const group = this.filtersModel.groups[gi];
                if (group) group.conditions.splice(ci, 1);
            },
            operatorsForField(field) {
                if (field === 'ip') return this.allOperators.slice();
                if (this.numericFilterFields.includes(field)) {
                    return this.allOperators.filter(o =>
                        ['equals', 'not_equals', 'greater', 'less', 'greater_eq', 'less_eq', 'in', 'not_in', 'exists', 'not_exists'].includes(o));
                }
                return this.allOperators.filter(o => o !== 'cidr');
            },
            isListOperator(op) {

            isExistenceOperator(op) {

            },
            // ─── Schedule / caps helpers ─────────────────────────────
            parseSchedule(schedule) {
                const model = {timezone: 'UTC', days: [], hoursFrom: 0, hoursTo: 23};
                if (!schedule || typeof schedule !== 'object') return model;
                model.timezone = schedule.timezone || 'UTC';
                model.days = (schedule.days || []).map(d => String(d).toLowerCase().slice(0, 3));
                const hours = schedule.hours;
                if (Array.isArray(hours) && hours.length) {
                    model.hoursFrom = Math.min(...hours.map(Number));
                    model.hoursTo = Math.max(...hours.map(Number));
                } else if (hours && typeof hours === 'object') {
                    model.hoursFrom = hours.from !== undefined ? Number(hours.from) : 0;
                    model.hoursTo = hours.to !== undefined ? Number(hours.to) : 23;
                }
                return model;
            },
            buildSchedule(s) {
                if (!s) return null;
                const from = s.hoursFrom === '' || s.hoursFrom === null || s.hoursFrom === undefined ? 0 : Number(s.hoursFrom);
                const to = s.hoursTo === '' || s.hoursTo === null || s.hoursTo === undefined ? 23 : Number(s.hoursTo);
                const days = (s.days || []).slice();
                const hasDays = days.length > 0;
                const hasHours = !(from === 0 && to === 23);
                if (!hasDays && !hasHours) return null;
                const schedule = {};
                if (s.timezone) schedule.timezone = s.timezone;
                if (hasDays) schedule.days = days;
                if (hasHours) schedule.hours = {from, to};
                return schedule;
            },
            toggleScheduleDay(day) {
                const days = this.flowForm.schedule.days || (this.flowForm.schedule.days = []);
                const i = days.indexOf(day);
                if (i >= 0) days.splice(i, 1);
                else days.push(day);
            },
            clearSchedule() {
                this.flowForm.schedule = {timezone: 'UTC', days: [], hoursFrom: 0, hoursTo: 23};
            },
            flowScheduleSummary(schedule) {
                if (!schedule) return '';
                const parts = [];
                if (schedule.timezone) parts.push(schedule.timezone);
                if (schedule.days && schedule.days.length) parts.push(schedule.days.join(','));
                if (schedule.hours) {
                    parts.push(typeof schedule.hours === 'object' && !Array.isArray(schedule.hours)
                        ? `hours ${schedule.hours.from}-${schedule.hours.to}`
                        : `hours ${schedule.hours.join(',')}`);
                }
                return parts.join(' · ') || '—';
            },
            flowCapsSummary(caps) {
                const parts = [];
                if (caps.per_hour) parts.push(`${caps.per_hour}/hour`);
                if (caps.per_day) parts.push(`${caps.per_day}/day`);
                if (caps.total) parts.push(`${caps.total} total`);
                return parts.join(', ') || '—';
            },
            flowFiltersSummary(flow) {
                const f = flow.filters;
                if (!f || (Array.isArray(f) && !f.length)) return [];
                const lines = [];
                const describe = c => `${c.invert ? 'NOT ' : ''}${c.field || c.key || c.parameter} ${c.operator} ${c.value}`;
                if (Array.isArray(f)) {
                    const looksGrouped = f.some(x => x && typeof x === 'object' && 'conditions' in x);
                    if (!looksGrouped) {
                        // legacy flat list
                        f.forEach((c, i) => {
                            const glue = i === 0 ? '' : ((c.condition || 'and').toUpperCase() + ' ');
                            lines.push(glue + describe(c));
                        });
                        return lines;
                    }
                    f.forEach((g, gi) => {
                        if (g && g.conditions) {
                            lines.push(`Group ${gi + 1} (${g.logic || 'and'}): ` + g.conditions.map(describe).join(`, ${g.logic === 'or' ? 'or' : 'and'} `));
                        }
                    });
                    return lines;
                }
                if (typeof f === 'object') {
                    const comb = f.combinator === 'or' ? 'ANY' : 'ALL';
                    (f.groups || []).forEach((g, gi) => {
                        lines.push(`${comb} · Group ${gi + 1} (${g.logic || 'and'}): ` + (g.conditions || []).map(describe).join(`, ${g.logic === 'or' ? 'or' : 'and'} `));
                    });
                }
                return lines;
            },
            async generateTrackingScript() {
                if (this.form.integration_method === null) {
                    this.trackingScript = 'none';
                    return;
                }
                switch (this.form.integration_method.toString()) {
                    case 'js':
                        const url = this.campaignUrl || '';
                        const safeUrl = url.replace(/"/g, '\\"');

                        let raw_script_result = `
                            (async () => {
                              const TRACKING_URL = "${safeUrl}";
                              const COOKIE_EXP_DAYS = 365;

                              function setCookie(name, value, days) {
                                const date = new Date();
                                date.setTime(date.getTime() + days * 86400000);
                                document.cookie = \`\${name}=\${encodeURIComponent(value)}; expires=\${date.toUTCString()}; path=/\`;
                              }

                              function getCookie(name) {
                                const match = document.cookie.match(new RegExp("(^| )" + name + "=([^;]+)"));
                                return match ? decodeURIComponent(match[2]) : null;
                              }

                              function generateShortID() {
                                return Math.random().toString(16).slice(2, 12);
                              }

                              function getAllUrlParams() {
                                const params = {};
                                new URLSearchParams(window.location.search).forEach((value, key) => {
                                  params[key] = value;
                                });
                                return params;
                              }

                              // 1. Collect all GET parameters and store them in cookies
                              const urlParams = getAllUrlParams();
                              for (const [key, value] of Object.entries(urlParams)) {
                                if (value) setCookie(key, value, COOKIE_EXP_DAYS);
                              }

                              // 2. Collect all known parameters from the cookies
                              const allKeys = new Set([...Object.keys(urlParams), ...document.cookie.split('; ').map(c => c.split('=')[0])]);
                              const collectedParams = {};
                              allKeys.forEach(key => {
                                const val = getCookie(key);
                                if (val) collectedParams[key] = val;
                              });

                              // 3. visitor_id
                              let visitorId = getCookie('visitor_id');
                              if (!visitorId) {
                                visitorId = generateShortID();
                                setCookie('visitor_id', visitorId, COOKIE_EXP_DAYS);
                              }

                              collectedParams['visitor_id'] = visitorId;
                              collectedParams['user_agent'] = navigator.userAgent;
                              collectedParams['timestamp'] = new Date().toISOString();
                              collectedParams['referrer'] = document.referrer;
                              collectedParams['url'] = location.href;

                              // 4. Sending the visit
                              try {
                                await fetch(TRACKING_URL, {
                                  method: 'POST',
                                  headers: { 'Content-Type': 'application/json' },
                                  body: JSON.stringify(collectedParams)
                                });
                              } catch (e) {
                                console.warn('Tracking failed', e);
                              }

                              // 5. Method for conversions
                              window.trackConversion = async (eventType, cost = 0) => {
                                if (!['lead', 'sale', 'rejected', 'upsale', 'hold'].includes(eventType)) return;
                                try {
                                  await fetch(TRACKING_URL, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                      event: eventType,
                                      cost: parseFloat(cost),
                                      visitor_id,
                                      timestamp: new Date().toISOString()
                                    })
                                  });
                                } catch (e) {
                                  console.warn('Conversion tracking failed', e);
                                }
                              };
                            })();`
                        let result_script = await minifyScript(raw_script_result);
                        this.trackingScript = `<script async>` + result_script + `<\/script>`;
                        break;
                    case 'php':
                        this.trackingScript = `<?php include('https://cdn.example.com/tracking.php'); ?>`;
                        break;
                    case 'forced_php':
                        this.trackingScript = `<?php header('Location: https://example.com/redirect.php'); ?>`;
                        break;
                    case 'qr':
                        this.trackingScript = `<img src="https://api.qrserver.com/v1/create-qr-code/?data=${this.campaignUrl}" alt="QR Code">`;
                        break;
                    case 'pixel_email':
                        this.trackingScript = `<img src="${this.campaignUrl}" alt="Tracking Pixel" style="display:none;">`;
                        break;
                    default:
                        this.trackingScript = 'none';
                        break;
                }
            },

                }

                // serialize filters (group format), schedule and caps into the flow

                const caps = {

                    total: Number(this.flowForm.caps && this.flowForm.caps.total) || 0
                };
                this.flowForm.caps = (caps.per_hour || caps.per_day || caps.total) ? caps : null;

                if(this.flowForm.type == 'default') {
                    this.flowForm.filters = [];
                }

                if (this.isEditingFlow && this.editedFlowIndex !== null) {
                    // Update the flow by index
                    this.form.flows.splice(this.editedFlowIndex, 1, {...this.flowForm});
                } else {
                    this.form.flows.push({...this.flowForm});
                }

                this.flowDialog = false;
                this.editedFlowIndex = null;
                this.form.flows.sort((a, b) => {
                    const getPriority = (flow) => {
                        if (flow.type === 'forced') return 0;   // above everything
                        if (flow.type === 'regular') return 1;  // by position
                        if (flow.type === 'default') return 2;  // at the end
                        return 3; // unknown type — even lower
                    };

                    const priorityA = getPriority(a);
                    const priorityB = getPriority(b);

                    if (priorityA !== priorityB) {
                        return priorityA - priorityB;
                    }

                    // if the type is the same (e.g. both regular) — sort by position
                    return (a.position || 9999) - (b.position || 9999);
                });
                this.updateFlowPositions();

            },

            async confirmCancelFlow() {
                const ok = await this.$refs.confirm.open('Discard Changes', 'Discard changes to flow?', 'Discard');
                if (ok) {
                    this.flowDialog = false;
                }
            },
            copyText(text) {
                navigator.clipboard.writeText(text).then(() => {
                    this.$root.$emit('show-message', {type: 'success', text: 'Copied to clipboard'});
                });
            },
            update() {
                this.save(false);
            },
            save(closeDialog = true) {
                const payload = {
                    name: this.form.name,
                    alias: this.form.alias,
                    type: this.form.type,
                    status: this.form.status,
                    redirect_mode: this.form.flowScheme,
                    domain_id: this.form.domain_id,
                    traffic_source_id: this.form.traffic_source_id,
                    notes: this.form.notes,
                    tags: (this.form.tags || []).map(t => String(t).trim()).filter(Boolean),
                    config: {
                        integration_method: this.form.integration_method,
                        send_se_referrer: this.form.send_se_referrer,
                        use_title_as_keyword: this.form.use_title_as_keyword,
                        send_query_params: this.form.send_query_params,
                        bind_ttl_hours: this.form.bind_ttl_hours,
                        stickiness: !!this.form.stickiness,
                        cost_model: this.form.cost_model,
                        traffic_loss_percent: this.form.traffic_loss_percent,
                        cost: this.form.cost,
                        cost_currency: this.form.cost_currency,
                        cost_from_cost_parameter: this.form.cost_from_cost_parameter,
                        hide_referrer: this.form.hide_referrer,
                        fallback_url: this.form.fallback_url,
                        paramsIdMapping: this.form.paramsIdMapping,
                        postbacks: this.form.postbacks,
                        flows: this.form.flows
                    }
                };

                const url = this.isEdit
                    ? `/backend/api/campaigns/${this.form.id}`
                    : '/backend/api/campaigns/';

                const method = this.isEdit ? 'PUT' : 'POST';

                fetch(url, {
                    method,
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                })
                    .then(async res => {
                        const text = await res.text();
                        if (!res.ok) {
                            let msg = text;
                            try {
                                const err = JSON.parse(text);
                                msg = err.detail || msg;
                            } catch {
                            }
                            throw new Error(msg);
                        }

                        this.$root.$emit('show-message', {
                            type: 'success',
                            text: `Campaign ${this.isEdit ? 'updated' : 'created'} successfully!`
                        });

                        if (closeDialog) {
                            this.dialog = false;
                            this.resetForm();
                        }
                        this.loadCampaigns();
                    })
                    .catch(err => {
                        this.$root.$emit('show-message', {
                            type: 'error',
                            text: `Save failed: ${sanitizeToastMessage(err.message)}`
                        });
                    });
            },
            async confirmCancel() {
                const ok = await this.$refs.confirm.open('Discard Changes', 'Are you sure you want to discard changes?', 'Discard');
                if (ok) {
                    this.dialog = false;
                    this.resetForm();
                }
            },
            openCreate() {
                this.preloadData();
                this.dialog = true;
                this.form.alias = this.generateAlias()
            },
            async openEdit(item) {
                await this.preloadData();
                await this.loadCampaigns();
                this.dialog = true;
                this.isEdit = true;

                this.form = {
                    id: item.id,
                    name: item.name,
                    alias: item.alias,
                    type: item.type,
                    status: item.status,
                    flowScheme: item.redirect_mode,
                    domain_id: item.domain_id,
                    traffic_source_id: item.traffic_source_id,
                    notes: item.notes || '',
                    tags: [...(item.tags || [])],
                    integration_method: item.config?.integration_method || null,
                    send_se_referrer: item.config?.send_se_referrer ?? true,
                    use_title_as_keyword: item.config?.use_title_as_keyword ?? true,
                    send_query_params: item.config?.send_query_params ?? true,
                    bind_ttl_hours: item.config?.bind_ttl_hours ?? 24,
                    stickiness: item.config?.stickiness ?? false,
                    cost_model: item.config?.cost_model || 'cpc',
                    traffic_loss_percent: item.config?.traffic_loss_percent ?? 0,
                    cost: item.config?.cost ?? 0,
                    cost_currency: item.config?.cost_currency || 'USD',
                    cost_from_cost_parameter: item.config?.cost_from_cost_parameter ?? false,
                    hide_referrer: item.config?.hide_referrer ?? false,
                    fallback_url: item.config?.fallback_url || '',
                    paramsIdMapping: item.config?.paramsIdMapping || [],
                    postbacks: item.config?.postbacks || [],
                    flows: item.config?.flows || []
                };

            },
            loadCampaigns() {
                this.loading = true;
                this.preloadData();
                this.loadArchivedIds();
                fetch("/backend/api/campaigns/", {
                    credentials: "include"
                })
                    .then(res => res.json())
                    .then(data => {
                        this.campaigns = data;
                    })
                    .catch(err => {
                        console.error(err);
                        this.$root.$emit("show-message", {
                            type: "error",
                            text: sanitizeToastMessage(err.message)
                        });
                    })
                    .finally(() => {
                        this.loading = false;
                    });
                this.loadCampaignMetrics();
            },
            loadCampaignMetrics() {
                // Live per-campaign stats from ClickHouse over the selected period
                const now = new Date();
                const iso = d => d.toISOString().split('T')[0];
                const daysAgo = n => { const d = new Date(now); d.setDate(d.getDate() - n); return d; };
                const mondayThisWeek = () => { const d = new Date(now); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); return d; };
                let from = null, to = null;

                switch (this.metricsPeriod) {
                    case 'today': from = now; to = now; break;
                    case 'yesterday': { const y = daysAgo(1); from = y; to = y; break; }
                    case 'this_week': from = mondayThisWeek(); to = now; break;
                    case 'last_week': { const prevEnd = new Date(mondayThisWeek()); prevEnd.setDate(prevEnd.getDate() - 1); const d = new Date(prevEnd); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); from = d; to = prevEnd; break; }
                    case '2d': from = daysAgo(1); to = now; break;
                    case '3d': from = daysAgo(2); to = now; break;
                    case '7d': from = daysAgo(6); to = now; break;
                    case '14d': from = daysAgo(13); to = now; break;
                    case '30d': from = daysAgo(29); to = now; break;
                    case 'this_month': from = new Date(now.getFullYear(), now.getMonth(), 1); to = now; break;
                    case 'last_month': from = new Date(now.getFullYear(), now.getMonth() - 1, 1); to = new Date(now.getFullYear(), now.getMonth(), 0); break;
                    case 'this_year': from = new Date(now.getFullYear(), 0, 1); to = now; break;
                    case 'last_year': from = new Date(now.getFullYear() - 1, 0, 1); to = new Date(now.getFullYear() - 1, 11, 31); break;
                    case 'custom': from = this.customRange[0] ? new Date(this.customRange[0]) : null; to = this.customRange[1] ? new Date(this.customRange[1]) : null; break;
                    default: from = null; to = null; // all time
                }

                const qs = [];
                if (from) qs.push('date_from=' + iso(from));
                if (to) qs.push('date_to=' + iso(to));
                fetch('/backend/api/campaigns/metrics' + (qs.length ? '?' + qs.join('&') : ''), {
                    credentials: 'include'
                })
                    .then(res => res.ok ? res.json() : Promise.reject(new Error('HTTP ' + res.status)))
                    .then(data => {
                        const map = {};
                        Object.keys(data || {}).forEach(id => { map[parseInt(id, 10)] = data[id]; });
                        this.metricsMap = map;
                        // Mirror metric values onto the rows so table sorting works
                        this.campaigns.forEach(c => {
                            const m = map[c.id] || {};
                            ['clicks', 'unique_clicks', 'conversions', 'leads', 'cost', 'revenue', 'profit', 'cr', 'epc', 'roi'].forEach(k => {
                                if (m[k] !== undefined) Vue.set(c, k, m[k]);
                            });
                        });
                    })
                    .catch(err => console.error('metrics', err));
            },
            metricsPeriodChanged() {
                if (this.metricsPeriod === 'custom') {
                    if (!this.customRange || this.customRange.length !== 2) {
                        const now = new Date();
                        const from = new Date(now); from.setDate(from.getDate() - 29);
                        this.customRange = [from.toISOString().split('T')[0], now.toISOString().split('T')[0]];
                    }
                    this.metricsCustomDialog = true;
                } else {
                    this.loadCampaignMetrics();
                }
            },
            applyCustomMetricsRange() {
                const picked = this.customRange || [];
                if (picked.length !== 2) {
                    this.$root.$emit('show-message', {type: 'error', text: 'Pick a start and an end date, then hit Apply.'});
                    return;
                }
                this.customRange = [...picked].sort();
                this.metricsCustomDialog = false;
                this.loadCampaignMetrics();
            },
            toggleCol(value, on) {
                if (value === 'name' || value === 'actions') return;
                Vue.set(this.colVisibility, value, !!on);
                this.persistCols();
            },
            persistCols() {
                try { localStorage.setItem('colv:campaigns', JSON.stringify(this.colVisibility)); } catch (e) {}
            },
            resetCols() {
                this.colVisibility = {};
                this.persistCols();
            },
            openTagEditor(item) {
                this.tagEditor = {open: true, id: item.id, name: item.name, tags: [...(item.tags || [])]};
            },
            toggleTagFilter(tag) {
                const i = this.tagFilter.indexOf(tag);
                if (i >= 0) this.tagFilter.splice(i, 1);
                else this.tagFilter.push(tag);
            },
            async saveTagEditor() {
                const tags = (this.tagEditor.tags || []).map(t => String(t).trim()).filter(Boolean);
                try {
                    const res = await fetch(`/backend/api/campaigns/${this.tagEditor.id}/tags`, {
                        method: 'PATCH',
                        credentials: 'include',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({tags})
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const updated = await res.json();
                    const i = this.campaigns.findIndex(c => c.id === updated.id);
                    if (i >= 0) Vue.set(this.campaigns, i, Object.assign({}, this.campaigns[i], {tags: updated.tags || []}));
                    this.tagEditor.open = false;
                    this.$root.$emit('show-message', {type: 'success', text: 'Tags saved'});
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error', text: 'Failed to save tags: ' + sanitizeToastMessage(err.message)});
                }
            },
            openBulkTags() {
                this.bulkTagInput = [];
                this.bulkTagMode = 'add';
                this.bulkTagDialog = true;
            },
            async applyBulkTags() {
                const tags = (this.bulkTagInput || []).map(t => String(t).trim()).filter(Boolean);
                if (!tags.length) {
                    this.$root.$emit('show-message', {type: 'error', text: 'Add at least one tag first.'});
                    return;
                }
                this.bulkLoading = true;
                try {
                    const res = await fetch('/backend/api/campaigns/bulk/tags', {
                        method: 'POST',
                        credentials: 'include',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ids: this.selected.map(c => c.id), tags, mode: this.bulkTagMode})
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    this.bulkTagDialog = false;
                    this.selected = [];
                    this.loadCampaigns();
                    this.$root.$emit('show-message', {type: 'success', text: 'Tags applied'});
                } catch (err) {
                    this.$root.$emit('show-message', {type: 'error', text: 'Bulk tagging failed: ' + sanitizeToastMessage(err.message)});
                } finally {
                    this.bulkLoading = false;
                }
            },
            totalsCell(value) {
                const t = this.metricsTotals;
                switch (value) {
                    case 'name': return 'Totals';
                    case 'clicks': return t.clicks.toLocaleString();
                    case 'unique_clicks': return t.unique_clicks.toLocaleString();
                    case 'leads': return t.leads.toLocaleString();
                    case 'conversions': return t.conversions.toLocaleString();
                    case 'cr': return t.cr.toFixed(2) + '%';
                    case 'epc': return this.formatMoney(t.epc);
                    case 'cpc': return this.formatMoney(t.cpc);
                    case 'cost': return this.formatMoney(t.cost);
                    case 'revenue': return this.formatMoney(t.revenue);
                    case 'profit': return this.formatMoney(t.profit);
                    case 'roi': return this.formatPct(t.roi);
                    default: return '';
                }
            },
            perfRowClass(item) {
                const m = this.metricsMap[item.id];
                if (!m) return '';
                const profit = parseFloat(m.profit) || 0;
                const cost = Math.abs(parseFloat(m.cost) || 0);
                const roi = parseFloat(m.roi) || 0;
                // ROI first; fall back to profit/cost when ROI is 0
                let score = null;
                if (roi !== 0) score = roi;
                else if (profit !== 0) score = cost ? (profit / cost) * 100 : (profit > 0 ? 100 : -100);
                if (score === null || score === 0) return '';
                if (score >= 50) return 'perf-win-3';
                if (score >= 10) return 'perf-win-2';
                if (score > 0) return 'perf-win-1';
                if (score <= -50) return 'perf-loss-3';
                if (score <= -10) return 'perf-loss-2';
                return 'perf-loss-1';
            },
            signClass(v) {
                const n = parseFloat(v) || 0;
                if (n > 0) return 'num-pos';
                if (n < 0) return 'num-neg';
                return 'num-neutral';
            },
            formatMoney(v) {
                const n = parseFloat(v) || 0;
                return '$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            },
            formatPct(v) {
                const n = parseFloat(v) || 0;
                return (n > 0 ? '+' : '') + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '%';
            },
            async deleteCampaign(item) {
                const ok = await this.$refs.confirm.open(
                    'Delete Campaign',
                    `Are you sure you want to delete campaign "${item.name}"? All tracked clicks and conversions for it will be permanently deleted too. This cannot be undone.`,
                    'Delete'
                );
                if (!ok) return;

                fetch(`/backend/api/campaigns/${item.id}`, {
                    method: 'DELETE',
                    credentials: 'include'
                })
                    .then(async res => {
                        const text = await res.text();
                        if (!res.ok) {
                            let msg = text;
                            try {
                                const err = JSON.parse(text);
                                msg = err.detail || msg;
                            } catch {
                            }
                            throw new Error(msg);
                        }

                        this.$root.$emit('show-message', {
                            type: 'success',
                            text: `Campaign "${item.name}" deleted successfully`
                        });

                        this.loadCampaigns(); // Refresh the list
                    })
                    .catch(err => {
                        this.$root.$emit('show-message', {
                            type: 'error',
                            text: `Failed to delete campaign: ${sanitizeToastMessage(err.message)}`
                        });
                    });
            },
            async duplicateCampaign(item) {
                const ok = await this.$refs.confirm.open(
                    'Duplicate Campaign',
                    `Create a copy of "${item.name}"?`,
                    'Duplicate'
                );
                if (!ok) return;

                const payload = {
                    name: `${item.name} (copy)`,
                    alias: this.generateAlias(),
                    type: item.type,
                    status: item.status,
                    redirect_mode: item.redirect_mode,
                    traffic_source_id: item.traffic_source_id,
                    domain_id: item.domain_id,
                    notes: item.notes,
                    config: item.config || {}
                };

                fetch('/backend/api/campaigns/', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                })
                    .then(async res => {
                        const text = await res.text();
                        if (!res.ok) {
                            let msg = text;
                            try { msg = JSON.parse(text).detail || msg; } catch {}
                            throw new Error(msg);
                        }
                        this.$root.$emit('show-message', {
                            type: 'success',
                            text: `Campaign duplicated as "${payload.name}"`
                        });
                        this.loadCampaigns();
                    })
                    .catch(err => {
                        this.$root.$emit('show-message', {
                            type: 'error',
                            text: `Failed to duplicate campaign: ${sanitizeToastMessage(err.message)}`
                        });
                    });
            },
            async bulkSetStatus(status) {
                this.bulkLoading = true;
                const targets = this.selected.slice();
                let done = 0, failed = 0;
                for (const item of targets) {
                    try {
                        const res = await fetch(`/backend/api/campaigns/${item.id}`, {
                            method: 'PUT',
                            credentials: 'include',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                name: item.name,
                                alias: item.alias,
                                type: item.type,
                                status: status,
                                redirect_mode: item.redirect_mode,
                                traffic_source_id: item.traffic_source_id,
                                domain_id: item.domain_id,
                                notes: item.notes,
                                config: item.config || {}
                            })
                        });
                        if (!res.ok) throw new Error(await res.text());
                        done++;
                    } catch (e) {
                        failed++;
                    }
                }
                this.bulkLoading = false;
                this.selected = [];
                this.loadCampaigns();
                this.$root.$emit('show-message', {
                    type: failed ? 'warning' : 'success',
                    text: `${done} campaign(s) ${status === 'active' ? 'activated' : 'paused'}` + (failed ? `, ${failed} failed` : '')
                });
            },
            async bulkDelete() {
                const n = this.selected.length;
                const ok = await this.$refs.confirm.open(
                    'Delete Campaigns',
                    `Are you sure you want to delete ${n} campaign(s)? All tracked clicks and conversions for them will be permanently deleted too. This cannot be undone.`,
                    'Delete'
                );
                if (!ok) return;
                this.bulkLoading = true;
                let done = 0, failed = 0;
                for (const item of this.selected.slice()) {
                    try {
                        const res = await fetch(`/backend/api/campaigns/${item.id}`, {
                            method: 'DELETE',
                            credentials: 'include'
                        });
                        if (!res.ok) throw new Error(await res.text());
                        done++;
                    } catch (e) {
                        failed++;
                    }
                }
                this.bulkLoading = false;
                this.selected = [];
                this.loadCampaigns();
                this.$root.$emit('show-message', {
                    type: failed ? 'warning' : 'success',
                    text: `${done} campaign(s) deleted` + (failed ? `, ${failed} failed` : '')
                });
            },
            generateAlias(length = 8) {
                const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let result = '';
                for (let i = 0; i < length; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return result;
            },
            addPostback() {
                const copy = {
                    url: this.newPostback.url,
                    method: this.newPostback.method,
                    status: {...this.newPostback.status}
                };
                this.form.postbacks.push(copy);

                // reset
                this.newPostback = {
                    url: '',
                    method: 'GET',
                    status: {
                        lead: true,
                        sale: true,
                        rejected: false,
                        upsale: false,
                        hold: false
                    }
                };
            },
            openPostbackEditor(i = null) {
                this.postbackEditorIndex = i;

                if (i !== null) {
                    this.postbackUrlDraft = this.form.postbacks[i]?.url || '';
                } else {
                    this.postbackUrlDraft = this.newPostback.url || '';
                }

                this.postbackEditorDialog = true;
            },
            insertMacro(macro) {
                const baseUrl = this.postbackUrlDraft.split('?')[0];
                const rawQuery = this.postbackUrlDraft.split('?')[1] || '';
                const queryParams = new URLSearchParams(rawQuery);

                const key = `${macro}`;
                const value = `{${macro}}`;

                // Remove if it already exists
                if (queryParams.has(key)) {
                    queryParams.delete(key);
                } else {
                    queryParams.append(key, value);
                }

                // Assemble back
                const queryString = queryParams.toString()
                    .replace(/%7B/g, '{')
                    .replace(/%7D/g, '}');
                this.postbackUrlDraft = queryString ? `${baseUrl}?${queryString}` : baseUrl;
            },
            isMacroInUrl(macro) {
                const query = this.postbackUrlDraft.split('?')[1] || '';
                const params = new URLSearchParams(query);
                return params.get(macro) === `{${macro}}`;
            },
            applyPostbackUrl() {
                if (this.postbackEditorIndex !== null) {
                    this.form.postbacks[this.postbackEditorIndex].url = this.postbackUrlDraft;
                } else {
                    this.newPostback.url = this.postbackUrlDraft;
                }
                this.postbackEditorDialog = false;
            },
            editNewPostback() {
                this.postbackEditorIndex = null; // means we are editing a new one
                this.postbackUrlDraft = this.newPostback.url;
                this.postbackEditorDialog = true;
            },
            resetForm() {
                this.isEdit = false;
                this.form = {
                    id: null,
                    name: '',
                    alias: this.generateAlias(),
                    type: 'campaign',
                    status: 'active',
                    redirect_mode: 'position',
                    domain_id: null,
                    traffic_source_id: null,
                    notes: '',
                    tags: [],
                    flowScheme: 'position',
                    integration_method: null,
                    send_se_referrer: true,
                    use_title_as_keyword: true,
                    send_query_params: true,
                    bind_ttl_hours: 24,
                    stickiness: false,
                    cost_model: 'cpc',
                    traffic_loss_percent: 0,
                    cost: 0,
                    cost_currency: 'USD',
                    cost_from_cost_parameter: false,
                    paramsIdMapping: JSON.parse(JSON.stringify(this.baseParamsIdMapping)),
                    postbacks: [],
                    flows: []
                };
            },


        }
    });
</script>
