<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shared report — AAA Tracker</title>
    <style>
        /* This page is shell-less, so it carries its own @font-face rather than
           relying on the app stylesheet. Same two faces as the app and the
           marketing site. */
        @font-face {
            font-family: 'Inter';
            font-style: normal; font-weight: 400 800; font-display: swap;
            src: url(/backend/backend/css/fonts/inter-latin.woff2) format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Inter';
            font-style: normal; font-weight: 400 800; font-display: swap;
            src: url(/backend/backend/css/fonts/inter-latin-ext.woff2) format('woff2');
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        @font-face {
            font-family: 'IBM Plex Mono';
            font-style: normal; font-weight: 400; font-display: swap;
            src: url(/backend/backend/css/fonts/ibm-plex-mono-normal-400-latin.woff2) format('woff2');
        }
        @font-face {
            font-family: 'IBM Plex Mono';
            font-style: normal; font-weight: 600; font-display: swap;
            src: url(/backend/backend/css/fonts/ibm-plex-mono-normal-600-latin.woff2) format('woff2');
        }
        :root {
            --font-stack: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --mono-stack: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            --content-bg: #f5f7fb;
            --card-bg: #ffffff;
            --surface: #f5f7fb;
            --border: #e4e9f2;
            --border-soft: #eff2f8;
            --text-primary: #0a0d16;
            --text-secondary: #6b7280;
            --accent: #1f4bf0;
            --accent-soft: rgba(31, 75, 240, 0.10);
            --status-success-bg: #e9f8f0;
            --status-success-text: #0b7a45;
            --status-danger-bg: #fdeeee;
            --status-danger-text: #a92b2b;
            --status-info-bg: #eef3ff;
            --status-info-text: #1430a8;
            --status-warning-bg: #fdf3e2;
            --status-warning-text: #8a5a08;
            --status-neutral-bg: #eef2f9;
            --status-neutral-text: #6b7280;
            --radius: 12px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --content-bg: #0a0d16;
                --card-bg: #121826;
                --surface: #121826;
                --border: #232c40;
                --border-soft: #1c2436;
                --text-primary: #f4f6fb;
                --text-secondary: #9aa5bd;
                --accent: #5b7cff;
                --accent-soft: rgba(91, 124, 255, 0.18);
                --status-success-bg: #10241a;
                --status-success-text: #5cf08d;
                --status-danger-bg: #2e1614;
                --status-danger-text: #ff8a8a;
                --status-info-bg: #16203d;
                --status-info-text: #8fa6ff;
                --status-warning-bg: #2a2113;
                --status-warning-text: #e0a33a;
                --status-neutral-bg: #1c2436;
                --status-neutral-text: #9aa5bd;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--content-bg);
            color: var(--text-primary);
            font-family: var(--font-stack);
            font-size: 14px;
            line-height: 1.45;
        }
        .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 16px 64px; }
        .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand__mark { width: 34px; height: 34px; flex: none; display: block; }
        /* Same lockup as the marketing site: "AAA" heavy, "Tracker" medium. */
        .brand__name {
            display: inline-flex; align-items: baseline; gap: .3em;
            font-size: 15px; font-weight: 800; letter-spacing: -.03em;
            color: var(--text-primary);
        }
        .brand__name i { font-style: normal; font-weight: 500; color: var(--text-secondary); }
        .brand__sub { color: var(--text-secondary); font-size: 11px; margin-top: 1px; }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
            overflow: hidden;
        }
        .card__head { padding: 16px 20px; border-bottom: 1px solid var(--border-soft); }
        .card__title { font-size: 16px; font-weight: 700; }
        .card__meta { color: var(--text-secondary); font-size: 12px; margin-top: 2px; }
        .scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
        th, td { padding: 9px 14px; text-align: right; white-space: nowrap; font-size: 13px; }
        th:first-child, td:first-child { text-align: left; }
        thead th {
            background: var(--surface);
            font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase;
            color: var(--text-secondary); font-weight: 600;
            border-bottom: 1px solid var(--border-soft);
        }
        tbody td { border-bottom: 1px solid var(--border-soft); color: var(--text-primary); }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: var(--surface); }
        tfoot td {
            border-top: 1px solid var(--border);
            font-weight: 700; background: var(--surface);
        }
        .dim-sub { color: var(--text-secondary); font-size: 11px; display: block; }
        .num-pos { color: var(--status-success-text); }
        .num-neg { color: var(--status-danger-text); }
        .state { padding: 40px 20px; text-align: center; color: var(--text-secondary); }
        .state__title { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
        .foot { margin-top: 18px; text-align: center; color: var(--text-secondary); font-size: 11px; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="head">
        <div class="brand">
            <div class="brand__mark" aria-hidden="true">
                <svg viewBox="0 0 32 32" fill="none" width="34" height="34">
                    <defs><linearGradient id="bmk" x1="2" y1="0" x2="30" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#3D6DFF"/><stop offset="1" stop-color="#1230C2"/></linearGradient></defs>
                    <rect width="32" height="32" rx="8.6" fill="url(#bmk)"/>
                    <path d="M16 9 L8.2 24.6" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
                    <path d="M16 9 L23.8 24.6" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
                    <path d="M11.3 18.6 H20.7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".5"/>
                    <circle cx="16" cy="9" r="2.7" fill="#fff"/><circle cx="16" cy="9" r="1.3" fill="#1230C2"/>
                    <circle cx="8.2" cy="24.6" r="2" fill="#5BF08D"/><circle cx="23.8" cy="24.6" r="2" fill="#5BF08D"/>
                </svg>
            </div>
            <div>
                <div class="brand__name"><b>AAA</b><i>Tracker</i></div>
                <div class="brand__sub">Shared report · read-only</div>
            </div>
        </div>
    </div>
    <div class="card">
        <div class="card__head">
            <div class="card__title" id="rpt-name">Loading…</div>
            <div class="card__meta" id="rpt-meta"></div>
        </div>
        <div class="scroll">
            <table id="rpt-table" style="display:none">
                <thead><tr id="rpt-head"></tr></thead>
                <tbody id="rpt-body"></tbody>
                <tfoot><tr id="rpt-totals"></tr></tfoot>
            </table>
            <div class="state" id="rpt-state">Loading report…</div>
        </div>
    </div>
    <div class="foot">Data refreshes on page load only · generated by AAA Tracker</div>
</div>
<script>
(function () {
    var token = new URLSearchParams(location.search).get('t') || '';
    var stateEl = document.getElementById('rpt-state');
    var tableEl = document.getElementById('rpt-table');

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
        });
    }
    function fmt(v, kind) {
        var n = parseFloat(v);
        if (isNaN(n)) return '—';
        if (kind === 'money') return '$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        if (kind === 'pct') return n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '%';
        if (kind === 'epc') return '$' + n.toFixed(5);
        if (Math.abs(n % 1) > 0.000001) return n.toLocaleString('en-US', {maximumFractionDigits: 4});
        return n.toLocaleString('en-US');
    }
    var MONEY = {cost: 1, revenue: 1, profit: 1};
    var PCT = {cr: 1, roi: 1, rejected_rate: 1, click_through_rate: 1};

    function cellHtml(v, key) {
        var cls = '';
        if (key === 'profit' || key === 'roi') cls = (parseFloat(v) || 0) >= 0 ? ' class="num-pos"' : ' class="num-neg"';
        return '<td' + cls + '>' + fmt(v, MONEY[key] ? 'money' : (PCT[key] ? 'pct' : (key === 'epc' ? 'epc' : ''))) + '</td>';
    }

    function fail(msg) {
        tableEl.style.display = 'none';
        stateEl.style.display = '';
        stateEl.innerHTML = '<div class="state__title">' + esc(msg.title) + '</div>' + esc(msg.text);
    }

    if (!token) {
        fail({title: 'Missing link', text: 'This shared-report link has no token.'});
        return;
    }

    fetch('/backend/api/dashboard/public/report/' + encodeURIComponent(token), {method: 'POST'})
        .then(function (res) {
            if (res.status === 404) throw {title: 'Link revoked or expired', text: 'Ask the report owner to share it again.'};
            if (res.status === 429) throw {title: 'Too many requests', text: 'This report is being refreshed too often — wait a minute.'};
            if (!res.ok) throw {title: 'Could not load report', text: 'Server error (' + res.status + ').'};
            return res.json();
        })
        .then(function (data) {
            var dims = data.dimensions || [];
            var rows = data.rows || [];
            var totals = data.totals || {};
            document.getElementById('rpt-name').textContent = data.name || 'Shared report';
            document.getElementById('rpt-meta').textContent =
                dims.map(function (d) { return d.replace(/_/g, ' '); }).join(' → ') +
                ' · ' + rows.length + ' rows';

            var metricKeys = [];
            Object.keys(rows[0] || {}).forEach(function (k) {
                if (['level', 'dim', 'value', 'parent_key'].indexOf(k) === -1) metricKeys.push(k);
            });

            var head = '';
            dims.forEach(function (d) {
                head += '<th>' + esc(d.replace(/_/g, ' ')) + '</th>';
            });
            metricKeys.forEach(function (k) {
                head += '<th>' + esc(k.replace(/_/g, ' ')) + '</th>';
            });
            document.getElementById('rpt-head').innerHTML = head;

            var body = '';
            rows.forEach(function (r) {
                var chain = r.parent_key ? r.parent_key.split('\u001f') : [];
                chain.push(r.value);
                body += '<tr>';
                dims.forEach(function (d, i) {
                    var v = chain[i] != null && chain[i] !== '' ? chain[i] : '(empty)';
                    var sub = i === chain.length - 1 ? '' : '<span class="dim-sub">' + esc(d.replace(/_/g, ' ')) + '</span>';
                    body += '<td>' + esc(v) + sub + '</td>';
                });
                metricKeys.forEach(function (k) { body += cellHtml(r[k], k); });
                body += '</tr>';
            });
            document.getElementById('rpt-body').innerHTML = body || '<tr><td colspan="99" style="text-align:center;color:var(--text-secondary)">No data in this report\'s date range</td></tr>';

            var foot = '';
            dims.forEach(function (d, i) {
                foot += '<td>' + (i === 0 ? 'Total' : '') + '</td>';
            });
            metricKeys.forEach(function (k) { foot += cellHtml(totals[k], k); });
            document.getElementById('rpt-totals').innerHTML = foot;

            stateEl.style.display = 'none';
            tableEl.style.display = '';
        })
        .catch(function (err) {
            fail(err && err.title ? err : {title: 'Could not load report', text: 'Network error.'});
        });
})();
</script>
</body>
</html>
