{% raw %}
<!-- CodeMirror Light Theme (Base) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/php/php.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/edit/closebrackets.min.js"></script>
<style>
    .CodeMirror {
        height: 70vh;
        font-family: 'JetBrains Mono', monospace;
        font-size: var(--fs-13);
        background: var(--card-bg);
        color: var(--text-primary);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
    }

    .CodeMirror-gutters {
        background: var(--surface);
        border-right: 1px solid var(--border);
        color: var(--text-secondary);
    }

    /* Scoped overrides — must not leak into the dashboard theme */
    .editor-page .v-card-title {
        font-family: 'JetBrains Mono', monospace;
        font-size: var(--fs-14);
        background-color: var(--surface-hover);
        border-bottom: 1px solid var(--border);
    }

    .editor-page h2 {
        font-family: inherit;
    }

    .editor-page .editor-dirty {
        margin-left: 10px;
        font-size: var(--fs-12, 12px);
        color: var(--warning, #b45309);
        white-space: nowrap;
    }

    /* Stack the file tree above the editor on narrow screens */
    @media (max-width: 960px) {
        .editor-page .row {
            flex-direction: column;
        }
        .editor-page .row > .col {
            flex: 0 0 100% !important;
            max-width: 100% !important;
            padding-top: var(--space-3);
            padding-bottom: var(--space-3);
        }
    }
</style>

<script type="text/x-template" id="editor-page-template">
    <v-container fluid class="editor-page">
        <div class="editor-topbar">
            <a href="/backend/dashboard" class="editor-back">
                <v-icon small>mdi-arrow-left</v-icon> Back to dashboard
            </a>
            <span class="editor-title">Landing editor</span>
            <span v-if="landingId" class="page-subtitle">Landing #{{ landingId }}</span>
        </div>

        <v-row>
            <v-col cols="3">
                <v-btn block small color="primary" elevation="0" class="mb-2" @click="promptCreateFile">
                    <v-icon small class="mr-1">mdi-file-plus-outline</v-icon>Create file
                </v-btn>
                <v-btn block small color="secondary" elevation="0" class="mb-2" @click="triggerUpload">
                    <v-icon small class="mr-1">mdi-upload</v-icon>Upload file
                </v-btn>
                <input ref="upload" type="file" style="display: none" @change="uploadFile">

                <v-card flat class="pa-2">
                    <v-treeview
                            dense
                            :items="fileTree"
                            item-key="path"
                            item-text="name"
                            item-children="children"
                            activatable
                            @update:active="onSelectFile"
                            :open.sync="openFolders"
                    >
                        <template v-slot:prepend="{ item }">
                            <v-icon v-if="item.type === 'folder'">mdi-folder-outline</v-icon>
                            <v-icon v-else>mdi-file-code-outline</v-icon>
                        </template>
                    </v-treeview>
                </v-card>
            </v-col>

            <v-col cols="9">
                <v-card elevation="2">
                    <v-card-title>
                        {{ selectedFile || 'No file selected' }}
                    </v-card-title>
                    <v-card-text>
                        <textarea id="code-editor" v-show="selectedFile" v-model="content"></textarea>
                    </v-card-text>
                    <v-card-actions>
                        <v-menu offset-y :disabled="!selectedFile" max-height="320">
                            <template v-slot:activator="{ on, attrs }">
                                <v-btn small text color="primary" :disabled="!selectedFile"
                                       v-bind="attrs" v-on="on">
                                    <v-icon small class="mr-1">mdi-code-tags</v-icon>Insert script
                                </v-btn>
                            </template>
                            <v-list dense>
                                <v-list-item v-if="!scripts.length" disabled>
                                    <v-list-item-title class="grey--text">No scripts saved yet</v-list-item-title>
                                </v-list-item>
                                <v-list-item v-for="s in scripts" :key="s.id" @click="insertScript(s)">
                                    <v-list-item-content>
                                        <v-list-item-title>{{ s.title }}</v-list-item-title>
                                        <v-list-item-subtitle>{{ placementLabel(s.placement) }}</v-list-item-subtitle>
                                    </v-list-item-content>
                                </v-list-item>
                            </v-list>
                        </v-menu>
                        <span v-if="dirty" class="editor-dirty">Unsaved changes</span>
                        <v-spacer></v-spacer>
                        <v-btn color="primary" elevation="0" :disabled="!selectedFile" :loading="saving" @click="saveFile">Save</v-btn>
                    </v-card-actions>
                </v-card>
            </v-col>
        </v-row>
    </v-container>
</script>
{% endraw %}

<script>
    Vue.component('editor-page-component', {
        template: '#editor-page-template',
        data() {
            return {
                landingId: null,
                fileTree: [],
                openFolders: [],
                selectedFile: null,
                content: '',
                editorInstance: null,
                scripts: [],
                dirty: false,
                saving: false,
            };
        },
        methods: {
            loadTree() {
                fetch(`/landings_editor/${this.landingId}/files`)
                    .then(res => res.json())
                    .then(data => {
                        this.fileTree = data.children || [];
                    });
            },
            loadScripts() {
                fetch('/backend/api/scripts/', {credentials: 'include'})
                    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
                    .then(data => {
                        this.scripts = data.scripts || [];
                    })
                    .catch(err => this.$root.$emit('show-message', {
                        type: 'error',
                        text: 'Could not load the script library: ' + sanitizeToastMessage(err.message),
                    }));
            },
            onSelectFile(paths) {
                const path = paths[0];
                const node = this.findFileByPath(this.fileTree, path);
                if (node && node.type === 'file') {
                    this.selectFile(node.path);
                }
            },
            findFileByPath(nodes, path) {
                for (const node of nodes) {
                    if (node.path === path) return node;
                    if (node.children) {
                        const found = this.findFileByPath(node.children, path);
                        if (found) return found;
                    }
                }
                return null;
            },
            selectFile(path) {
                this.selectedFile = path;
                fetch(`/landings_editor/${this.landingId}/file?filename=${encodeURIComponent(path)}`)
                    .then((res) => res.json())
                    .then((data) => {
                        this.content = data.content;
                        setTimeout(() => {
                            const textarea = document.getElementById('code-editor');
                            if (!textarea) return;
                            if (this.editorInstance) this.editorInstance.toTextArea();
                            textarea.value = this.content;
                            this.editorInstance = CodeMirror.fromTextArea(textarea, {
                                mode: 'application/x-httpd-php',
                                lineNumbers: true,
                                theme: 'default',
                                indentUnit: 4,
                                tabSize: 4,
                                matchBrackets: true,
                                autoCloseBrackets: true
                            });
                            this.editorInstance.on('change', () => { this.dirty = true; });
                            this.dirty = false;
                        }, 100);
                    });
            },
            placementLabel(placement) {
                if (placement === 'head') return 'Before </head>';
                if (placement === 'body') return 'Before </body>';
                return 'At the cursor';
            },
            insertScript(item) {
                if (!this.editorInstance) {
                    this.$root.$emit('show-message', {type: 'error', text: 'Open a file before inserting a script'});
                    return;
                }
                const body = String((item && item.code) || '');
                if (!body.trim()) {
                    this.$root.$emit('show-message', {type: 'error', text: 'That script has no code to insert'});
                    return;
                }
                const editor = this.editorInstance;
                const value = editor.getValue();
                const placement = (item && item.placement) || 'cursor';
                const anchor = placement === 'head' ? '</head>'
                    : (placement === 'body' ? '</body>' : null);
                // The snippet is editor text, never template markup: it is spliced
                // into the buffer as a plain string and the operator saves it.
                const snippet = '\n' + body.replace(/\s+$/, '') + '\n';

                let at = null;
                let usedAnchor = false;
                if (anchor) {
                    const idx = value.toLowerCase().indexOf(anchor.toLowerCase());
                    if (idx !== -1) {
                        at = idx;
                        usedAnchor = true;
                    }
                }
                if (at === null) {
                    at = editor.indexFromPos(editor.getCursor());
                }
                at = Math.max(0, Math.min(at, value.length));
                editor.replaceRange(snippet, editor.posFromIndex(at));
                editor.focus();
                this.content = editor.getValue();
                this.dirty = true;
                this.$root.$emit('show-message', {
                    type: 'success',
                    text: 'Inserted "' + item.title + '" ' +
                        (usedAnchor ? 'before ' + anchor : 'at the cursor') + ' — review, then save',
                });
            },
            saveFile() {
                if (this.editorInstance) {
                    this.content = this.editorInstance.getValue();
                }

                const payload = new URLSearchParams();
                payload.set("filename", this.selectedFile);
                payload.set("content", this.content);

                this.saving = true;
                fetch(`/landings_editor/${this.landingId}/file-plain`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: payload.toString()
                })
                    .then((res) => res.ok ? res.json() : res.text().then(t => {
                        throw new Error(t);
                    }))
                    .then(() => {
                        this.saving = false;
                        this.dirty = false;
                        this.$root.$emit('show-message', {type: 'success', text: 'File saved!'});
                    })
                    .catch((err) => {
                        this.saving = false;
                        this.$root.$emit('show-message', {type: 'error', text: `Error: ${err.message}`});
                    });
            },

            promptCreateFile() {
                const name = prompt("Enter new file path (e.g., subdir/newfile.php):");
                if (!name) return;
                fetch(`/landings_editor/${this.landingId}/file`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({filename: name, content: ''})
                })
                    .then(res => res.json())
                    .then(() => {
                        this.loadTree();
                        this.selectFile(name);
                    })
                    .catch(err => this.$root.$emit('show-message', {type: 'error', text: `Error: ${err.message}`}));
            },
            triggerUpload() {
                this.$refs.upload.click();
            },
            uploadFile(event) {
                const file = event.target.files[0];
                if (!file) return;

                const formData = new FormData();
                formData.append("file", file);

                fetch(`/landings_editor/${this.landingId}/upload?path=${encodeURIComponent(file.name)}`, {
                    method: "POST",
                    body: formData
                })
                    .then(res => res.json())
                    .then(() => {
                        this.loadTree();
                        this.selectFile(file.name);
                    })
                    .catch(err => this.$root.$emit('show-message', {type: 'error', text: `Upload error: ${err.message}`}));
            }
        },
        mounted() {
            const params = new URLSearchParams(window.location.search);
            const id = parseInt(params.get('landing'));
            if (!id) {
                this.$root.$emit('show-message', {type: 'error', text: 'Landing ID missing'});
                return;
            }
            this.landingId = id;
            this.loadTree();
            this.loadScripts();
        },
    });
</script>
