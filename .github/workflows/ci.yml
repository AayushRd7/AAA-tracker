name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The live API suite (~1,800 checks, ~14 min) is too long for every push, so it
  # runs nightly and on demand instead of on push.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  compile:
    name: Python compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: PyYAML (the workflow files are parsed below)
        run: python -m pip install --quiet pyyaml
      - name: Compile all backend + frontend sources
        run: |
          python -m compileall -q backend/app.py backend/auth.py backend/clickHouse.py backend/db.py backend/schemas.py backend/email_reports.py backend/app_pages backend/models backend/tests backend/install frontend
      - name: YAML sanity (compose + workflow)
        run: |
          python - <<'EOF'
          import glob, sys
          try:
              import yaml
          except ImportError:
              sys.exit(0)
          for f in glob.glob('*.yml') + glob.glob('*.yaml') + glob.glob('.github/workflows/*.yml'):
              with open(f) as fh:
                  yaml.safe_load(fh)
              print(f'ok: {f}')
          EOF
      - name: Compose portability guard
        run: |
          # Recipes must invoke $(COMPOSE), never a hardcoded binary, so the
          # Makefile works with both `docker compose` and `docker-compose`.
          if grep -nE '^[[:space:]]+docker-compose[[:space:]]' Makefile; then
            echo "Makefile invokes docker-compose directly — use \$(COMPOSE)"
            exit 1
          fi
          grep -q '\$(COMPOSE)' Makefile || { echo "Makefile never uses \$(COMPOSE)"; exit 1; }
          echo "ok: Makefile is compose-flavour agnostic"

      - name: Makefile dry-run (parses, no docker needed)
        run: 'make -n install >/dev/null && echo "ok: make install parses"'

      - name: Shell syntax (installer + doctor)
        run: |
          bash -n setup.sh && echo "ok: setup.sh syntax"
          bash -n scripts/doctor.sh && echo "ok: scripts/doctor.sh syntax"
          bash -n scripts/wait-for-backend.sh && echo "ok: scripts/wait-for-backend.sh syntax"
          sh -n nginx/docker-entrypoint.d/10-selfsigned.sh && echo "ok: nginx entrypoint script syntax"

      - name: First-run config guard
        run: |
          # .env is gitignored, so the Makefile must be able to create it.
          grep -q '^env:' Makefile || { echo "Makefile has no 'env' target"; exit 1; }
          grep -qE '^install: .*check .*env .*preclean' Makefile || { echo "install must depend on check/env/preclean"; exit 1; }
          test -f .env.example || { echo ".env.example missing"; exit 1; }
          mkdir -p /tmp/firstrun && cp Makefile .env.example /tmp/firstrun/
          (cd /tmp/firstrun && make env >/dev/null && grep -q '^POSTGRES_PASSWORD=' .env)
          echo "ok: first-run .env creation works"

      - name: Install SQL idempotency guard
        run: |
          # A re-install must never need to drop tables: schema statements are
          # IF NOT EXISTS and every seed row is idempotent (ON CONFLICT DO NOTHING,
          # or WHERE NOT EXISTS). Checked statement by statement with the same
          # splitter the installer uses — counting the words across the file gets
          # it wrong, since both guards are legitimate.
          # (Python instead of grep -P so this also runs on BSD grep.)
          python3 - <<'EOF'
          import re, sys

          bad = []
          for path in ("backend/install/sql/init.sql", "backend/install/sql/clickHouse.sql"):
              for n, line in enumerate(open(path), 1):
                  if re.match(r"^CREATE (TABLE|INDEX) (?!IF NOT EXISTS)", line):
                      bad.append(f"{path}:{n}: {line.strip()}")
          if bad:
              print("non-idempotent CREATE statements:")
              print("\n".join(bad))
              sys.exit(1)

          src = open("backend/install/install.py").read()
          ns = {}
          exec(src[src.index("def split_sql_statements"):src.index("def run_clickhouse_install")], ns)
          split = ns["split_sql_statements"]

          seeds = 0
          for path in ("backend/install/sql/init.sql", "backend/install/sql/clickHouse.sql"):
              for statement in split(open(path).read()):
                  if not re.search(r"\bINSERT\s+INTO\b", statement, re.I):
                      continue
                  seeds += 1
                  upper = statement.upper()
                  if "ON CONFLICT" not in upper and "NOT EXISTS" not in upper:
                      bad.append(f"{path}: unguarded seed: {' '.join(statement.split())[:80]}")
          if bad:
              print("non-idempotent seed rows:")
              print("\n".join(bad))
              sys.exit(1)
          print(f"ok: install SQL is idempotent ({seeds} seeds, all guarded)")
          EOF
      - name: Install SQL statement split guard
        run: |
          # A ';' inside a comment used to truncate a statement and break fresh installs
          # (unbalanced parentheses in CREATE TABLE) while existing installs stayed fine.
          python3 - <<'EOF'
          import re, sys
          src = open("backend/install/install.py").read()
          ns = {}
          exec(src[src.index("def split_sql_statements"):src.index("def run_clickhouse_install")], ns)
          split = ns["split_sql_statements"]
          bad = []
          for path in ("backend/install/sql/clickHouse.sql", "backend/install/sql/init.sql"):
              raw = open(path).read()
              sts = split(raw)
              if not sts:
                  bad.append(f"{path}: no statements parsed")
              for st in sts:
                  if st.count("(") != st.count(")"):
                      bad.append(f"{path}: unbalanced statement: {' '.join(st.split())[:70]}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("ok: install SQL splits into balanced statements")
          EOF

      - name: Container-name cleanup guard
        run: |
          # Leftover containers holding our fixed names must be cleared before up,
          # otherwise 'docker compose up' fails with a name conflict.
          grep -q '^preclean:' Makefile || { echo "Makefile has no 'preclean' target"; exit 1; }
          grep -q 'container_name:' docker-compose.yml || { echo "no container_name in compose"; exit 1; }
          grep -q -- '--remove-orphans' Makefile || { echo "compose up should pass --remove-orphans"; exit 1; }
          echo "ok: leftover-container handling present"

      - name: Workflow files parse as YAML
        # A typo here stops every run from starting, and no job reports it.
        run: make check-ci

      - name: Dependency vulnerability scan (pip-audit)
        # NON-BLOCKING on purpose: the current pins already carry advisories
        # (cryptography 44.0.0, and ecdsa pulled in by python-jose), and clearing
        # them means bumping backend/requirements.txt — a separate change. Keeping
        # this informational avoids red-lining every push while still surfacing the
        # report; tighten it to blocking once the pins are raised. Image scanning
        # (trivy) is a worthwhile follow-up, but it needs a built image and a CVE DB
        # on the runner; auditing the requirement pins covers Python dependencies.
        continue-on-error: true
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r backend/requirements.txt -r backend/install/requirements.txt

  api-smoke:
    name: Live API suite (nightly)
    # Push/PR runs are covered by the compile+guard and fresh-install jobs; this
    # suite takes ~14 minutes, so it only runs on the nightly schedule and when
    # triggered by hand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android 2>/dev/null || true
          docker image prune -af >/dev/null 2>&1 || true

      - name: Install the whole stack from empty volumes
        run: make install

      - name: Host dependencies for the suite
        # api_smoke.py runs on the runner (not in a container): it needs requests
        # for HTTP and pyotp for the 2FA checks. Everything else is stdlib.
        run: python3 -m pip install --quiet requests pyotp

      - name: Live API smoke suite
        # `make install` generates the admin password (and the ClickHouse password)
        # into .env. Read them back rather than sourcing the whole file: values like
        # EMAIL_FROM_NAME="AAA Tracker" contain an unquoted space, which a literal
        # `source .env` would try to execute as a command under `bash -e`.
        run: |
          set -u
          TEST_PASS="$(grep -E '^AAA_ADMIN_PASSWORD=' .env | cut -d= -f2-)"
          TEST_CH_USER="$(grep -E '^CLICKHOUSE_USER=' .env | cut -d= -f2- || true)"
          TEST_CH_PASS="$(grep -E '^CLICKHOUSE_PASSWORD=' .env | cut -d= -f2-)"
          : "${TEST_CH_USER:=user}"
          test -n "$TEST_PASS" || { echo "AAA_ADMIN_PASSWORD missing from .env"; exit 1; }
          TEST_BASE_URL=https://localhost TEST_INSECURE=1 \
          TEST_USER=tracker_admin TEST_PASS="$TEST_PASS" \
          TEST_CH_USER="$TEST_CH_USER" TEST_CH_PASS="$TEST_CH_PASS" \
          python3 backend/tests/api_smoke.py

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans || true

  fresh-install:
    name: Fresh install end-to-end (empty volumes)
    # Skipped on the nightly schedule: the api-smoke job installs from empty
    # volumes too, so its run already covers this ground.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # Three app images plus postgres and clickhouse; the runner images carry a
        # lot of SDKs we do not need and the default disk is tight.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android 2>/dev/null || true
          docker image prune -af >/dev/null 2>&1 || true

      - name: Install the whole stack from empty volumes
        # The documented path, on purpose: this is exactly what an operator runs
        # on a new box, so a failure here is the failure they would hit.
        run: make install

      - name: Doctor
        run: make doctor

      - name: End-to-end assertions (login, campaign, databases, tracking plane)
        run: python3 scripts/ci/fresh_install_e2e.py

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans || true
