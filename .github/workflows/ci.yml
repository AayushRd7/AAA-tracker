name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    name: Python compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all backend + frontend sources
        run: |
          python -m compileall -q backend/app.py backend/auth.py backend/clickHouse.py backend/db.py backend/schemas.py backend/email_reports.py backend/app_pages backend/models backend/tests backend/install frontend
      - name: YAML sanity (compose + workflow)
        run: |
          python - <<'EOF'
          import glob, sys
          try:
              import yaml
          except ImportError:
              sys.exit(0)
          for f in glob.glob('*.yml') + glob.glob('*.yaml') + glob.glob('.github/workflows/*.yml'):
              with open(f) as fh:
                  yaml.safe_load(fh)
              print(f'ok: {f}')
          EOF
      - name: Compose portability guard
        run: |
          # Recipes must invoke $(COMPOSE), never a hardcoded binary, so the
          # Makefile works with both `docker compose` and `docker-compose`.
          if grep -nE '^[[:space:]]+docker-compose[[:space:]]' Makefile; then
            echo "Makefile invokes docker-compose directly — use \$(COMPOSE)"
            exit 1
          fi
          grep -q '\$(COMPOSE)' Makefile || { echo "Makefile never uses \$(COMPOSE)"; exit 1; }
          echo "ok: Makefile is compose-flavour agnostic"

      - name: Makefile dry-run (parses, no docker needed)
        run: make -n install >/dev/null && echo "ok: make install parses"

      - name: Shell syntax (installer + doctor)
        run: |
          bash -n setup.sh && echo "ok: setup.sh syntax"
          bash -n scripts/doctor.sh && echo "ok: scripts/doctor.sh syntax"
          bash -n scripts/wait-for-backend.sh && echo "ok: scripts/wait-for-backend.sh syntax"
          sh -n nginx/docker-entrypoint.d/10-selfsigned.sh && echo "ok: nginx entrypoint script syntax"

      - name: First-run config guard
        run: |
          # .env is gitignored, so the Makefile must be able to create it.
          grep -q '^env:' Makefile || { echo "Makefile has no 'env' target"; exit 1; }
          grep -qE '^install: .*check .*env .*preclean' Makefile || { echo "install must depend on check/env/preclean"; exit 1; }
          test -f .env.example || { echo ".env.example missing"; exit 1; }
          mkdir -p /tmp/firstrun && cp Makefile .env.example /tmp/firstrun/
          (cd /tmp/firstrun && make env >/dev/null && grep -q '^POSTGRES_PASSWORD=' .env)
          echo "ok: first-run .env creation works"

      - name: Install SQL idempotency guard
        run: |
          # A re-install must never need to drop tables: schema statements are
          # IF NOT EXISTS and every seed row is ON CONFLICT DO NOTHING.
          # (Python instead of grep -P so this also runs on BSD grep.)
          python3 - <<'EOF'
          import re, sys

          bad = []
          for path in ("backend/install/sql/init.sql", "backend/install/sql/clickHouse.sql"):
              for n, line in enumerate(open(path), 1):
                  if re.match(r"^CREATE (TABLE|INDEX) (?!IF NOT EXISTS)", line):
                      bad.append(f"{path}:{n}: {line.strip()}")
          if bad:
              print("non-idempotent CREATE statements:")
              print("\n".join(bad))
              sys.exit(1)

          init = open("backend/install/sql/init.sql").read()
          inserts, guards = init.count("INSERT INTO"), init.count("ON CONFLICT")
          if inserts != guards:
              print(f"seed rows missing ON CONFLICT: {inserts} inserts vs {guards} guards")
              sys.exit(1)
          print(f"ok: install SQL is idempotent ({inserts} guarded seeds)")
          EOF

      - name: Install SQL statement split guard
        run: |
          # A ';' inside a comment used to truncate a statement and break fresh installs
          # (unbalanced parentheses in CREATE TABLE) while existing installs stayed fine.
          python3 - <<'EOF'
          import re, sys
          src = open("backend/install/install.py").read()
          ns = {}
          exec(src[src.index("def split_sql_statements"):src.index("def run_clickhouse_install")], ns)
          split = ns["split_sql_statements"]
          bad = []
          for path in ("backend/install/sql/clickHouse.sql", "backend/install/sql/init.sql"):
              raw = open(path).read()
              sts = split(raw)
              if not sts:
                  bad.append(f"{path}: no statements parsed")
              for st in sts:
                  if st.count("(") != st.count(")"):
                      bad.append(f"{path}: unbalanced statement: {' '.join(st.split())[:70]}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("ok: install SQL splits into balanced statements")
          EOF

      - name: Container-name cleanup guard
        run: |
          # Leftover containers holding our fixed names must be cleared before up,
          # otherwise 'docker compose up' fails with a name conflict.
          grep -q '^preclean:' Makefile || { echo "Makefile has no 'preclean' target"; exit 1; }
          grep -q 'container_name:' docker-compose.yml || { echo "no container_name in compose"; exit 1; }
          grep -q -- '--remove-orphans' Makefile || { echo "compose up should pass --remove-orphans"; exit 1; }
          echo "ok: leftover-container handling present"

      # Live smoke tests need the full stack running — run them locally or
      # against your dev server:
      #   TEST_BASE_URL=https://localhost TEST_INSECURE=1 TEST_USER=... TEST_PASS=... \
      #   python backend/tests/api_smoke.py
